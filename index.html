<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
 <script>
  // 주소에 ?type= 이 없으면(= 뚝섬.kr 로 그냥 접속) 홈으로
  if (!new URLSearchParams(location.search).has('type')) location.replace('hub/?home');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>뚝섬홈 바로가기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  .header { padding: 10px 44px; text-align: center; font-size: 14px; font-weight: 700; background: #1f1f1f; border-bottom: 1px solid #333;
            letter-spacing: -0.5px; position: relative; flex: none; }
  .rotbtn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #333; color: #fff; border: 1px solid #555;
            border-radius: 8px; font-size: 13px; padding: 4px 8px; cursor: pointer; }
  .swiper { width: 100%; flex: 1; min-height: 0; }
  .swiper-slide { display: flex; align-items: center; justify-content: center; background: #121212; overflow: hidden; }
  .swiper-zoom-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .swiper-zoom-target { display: flex; align-items: center; justify-content: center; }
  .swiper-zoom-target img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .swiper-zoom-target img.rot { transform: rotate(90deg); }
  .swiper-pagination-fraction { color: #fff; font-size: 14px; bottom: 12px !important; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .hint { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 12px; color: #bbb; pointer-events: none; z-index: 5;
          text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
  <div class="header"><span id="page-title">포스터</span><button class="rotbtn" id="rotbtn" type="button">↻ 회전</button></div>
  <div class="swiper">
    <div class="swiper-wrapper" id="slide-container"></div>
    <div class="swiper-pagination"></div>
  </div>
  <div class="hint" id="hint"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
// 💡 뷰어 목록 — 서버가 깃허브 폴더(대회일정·뚝섬제작·대회사·APL제휴)를 보고 자동으로 맞춰요. 파일명 끝 _PC / _MOBILE 로 기기별 이미지를 나눠요 (이 목록은 기본값)
const LISTS = {"sched": {"title": "📅 대회일정", "names": []}, "contest": {"title": "🏆 뚝섬 제작 대회 포스터", "names": ["contest-3사비교", "contest-6TH HPT00", "contest-6TH HPT01", "contest-9th wpl", "contest-APL01", "contest-APL02", "contest-apl프라이즈율", "contest-피망", "contest-하"]}, "ofapl": {"title": "📋 공식 · APL", "names": ["ofapl-261023-261025 apl circuit1 (1)", "ofapl-261023-261025 apl circuit1 (2)"]}, "ofwpl": {"title": "📋 공식 · WPL", "names": ["ofwpl-261002-261213 9th wpl (1)", "ofwpl-261002-261213 9th wpl (2)", "ofwpl-261002-261213 9th wpl (3)", "ofwpl-261002-261213 9th wpl (4)", "ofwpl-261002-261213 9th wpl (5)", "ofwpl-261002-261213 9th wpl (6)", "ofwpl-261002-261213 9th wpl (7)", "ofwpl-261002-261213 9th wpl (8)", "ofwpl-261002-261213 9th wpl (9)"]}, "ofhg": {"title": "📋 공식 · 한게임", "names": []}, "ofpm": {"title": "📋 공식 · 피망", "names": ["ofpm-260902-261223 showdown (1)", "ofpm-260902-261223 showdown (2)"]}, "aplshop": {"title": "🤝 APL · 제휴업체", "names": ["aplshop-apl01", "aplshop-apl02", "aplshop-apl03", "aplshop-apl04", "aplshop-apl05", "aplshop-apl06", "aplshop-apl07"]}, "공식슈퍼컵": {"title": "📋 공식 · 슈퍼컵", "names": ["공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-01", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-02", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-03", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-04", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-05", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-06", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-07", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-08", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-09", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-10", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-11", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-12", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-13", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-14", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-15", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-16", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-17", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-18", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-19", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-20", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-21", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-22", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-23", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-24", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-25", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-26", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-27", "공식슈퍼컵-The7th_SuperCup_Incheon_PlayersGuide_261006-28"]}};
const VER = "10082136";
const FOLDERS = ["대회일정", "뚝섬제작", "공식APL", "공식WPL", "공식한게임", "공식피망", "APL제휴매장"];     // 사본이 없을 때 원본을 찾아볼 폴더
const EXTS = ['.jpg', '.JPG', '.png', '.PNG', '.jpeg', '.webp'];
const isPC = () => matchMedia('(min-width:760px)').matches;

const params = new URLSearchParams(location.search);
const ALIAS = { official: 'ofapl', apl: 'aplshop' };   // 예전 링크(?type=official / ?type=apl)가 깨지지 않게
const rawType = ALIAS[params.get('type')] || params.get('type');
const type = LISTS[rawType] ? rawType : 'contest';
document.getElementById('page-title').textContent = LISTS[type].title;
document.title = LISTS[type].title;
const container = document.getElementById('slide-container');

// 가로 포스터 자동 회전 (세로로 든 휴대폰에서만) · 버튼으로 켜고 끄기
let autoRot = true;
try { autoRot = localStorage.getItem('rot') !== 'off'; } catch (e) {}
const portrait = () => innerHeight > innerWidth;
const btn = document.getElementById('rotbtn');
const imgs = [];
let sw = null;

function fit(img) {
  const wide = img.naturalWidth > img.naturalHeight * 1.1;
  const box = img.closest('.swiper-slide');
  const W = box.clientWidth, H = box.clientHeight - 30;     // 아래 번호 표시 자리
  const rot = autoRot && wide && portrait();
  img.classList.toggle('rot', rot);
  if (rot) { img.style.maxWidth = H + 'px'; img.style.maxHeight = W + 'px'; }
  else { img.style.maxWidth = W + 'px'; img.style.maxHeight = H + 'px'; }
}
function fitAll() { imgs.forEach(i => i.complete && i.naturalWidth && fit(i)); updateHint(); }
function updateHint() {
  btn.textContent = autoRot ? '↻ 회전 끄기' : '↻ 회전 켜기';
  const any = imgs.some(i => i.classList.contains('rot'));
  document.getElementById('hint').textContent = any && sw && imgs[sw.activeIndex] && imgs[sw.activeIndex].classList.contains('rot')
    ? '가로 포스터예요 · 폰을 옆으로 눕혀서 보세요' : '';
}
btn.onclick = () => { autoRot = !autoRot; try { localStorage.setItem('rot', autoRot ? 'on' : 'off'); } catch (e) {} fitAll(); };

LISTS[type].names.forEach((name, idx) => {
  const slide = document.createElement('div'); slide.className = 'swiper-slide';
  const zc = document.createElement('div'); zc.className = 'swiper-zoom-container';
  const tg = document.createElement('div'); tg.className = 'swiper-zoom-target';
  const img = document.createElement('img'); img.alt = '포스터 ' + (idx + 1);
  if (idx > 1) img.loading = 'lazy';
  // PC(화면 760px 이상)는 pc/ → m/, 모바일은 m/ → pc/ 순으로 찾고, 둘 다 없으면 폴더의 원본
  const enc = encodeURIComponent(name);
  const mob = 'm/' + enc + '.jpg?v=' + VER, pcv = 'pc/' + enc + '.jpg?v=' + VER;
  const tries = isPC() ? [pcv, mob] : [mob, pcv];
  FOLDERS.forEach(f => EXTS.forEach(e => tries.push(encodeURIComponent(f) + '/' + enc + e)));
  let step = 0;
  img.src = tries[0];
  img.onerror = function () { step++; if (step < tries.length) this.src = tries[step]; else this.onerror = null; };
  img.onload = function () { fit(this); updateHint(); };
  imgs.push(img);
  tg.appendChild(img); zc.appendChild(tg); slide.appendChild(zc); container.appendChild(slide);
});

sw = new Swiper('.swiper', {
  loop: false,
  zoom: { maxRatio: 4, minRatio: 1, toggle: true },
  pagination: { el: '.swiper-pagination', type: 'fraction' },
  on: { slideChange: updateHint }
});
addEventListener('resize', () => setTimeout(fitAll, 150));
addEventListener('orientationchange', () => setTimeout(fitAll, 300));
</script>
</body>
</html>
