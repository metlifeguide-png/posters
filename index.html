<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>대회 안내 포스터 뷰어</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #121212; 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden; 
    }
    .header { 
      padding: 14px 10px; 
      text-align: center; 
      font-size: 15px; 
      font-weight: 700; 
      background: #1f1f1f; 
      border-bottom: 1px solid #333; 
      letter-spacing: -0.5px; 
    }
    .swiper { 
      width: 100%; 
      flex: 1; 
    }
    .swiper-slide { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #121212; 
    }
    .swiper-zoom-container { 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .swiper-zoom-container img { 
      max-width: 100%; 
      max-height: 100%; 
      object-fit: contain; 
    }
    .swiper-pagination-fraction { 
      color: #fff; 
      font-size: 14px; 
      bottom: 15px !important; 
      font-weight: 600; 
      text-shadow: 0 1px 4px rgba(0,0,0,0.8); 
    }
  </style>
</head>
<body>
  <div class="header" id="page-title">포스터 뷰어 (좌우로 넘겨보세요)</div>
  <div class="swiper">
    <div class="swiper-wrapper" id="slide-container"></div>
    <div class="swiper-pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type') || 'contest';
    const container = document.getElementById('slide-container');
    const title = document.getElementById('page-title');

    let baseNames = [];
    if (type === 'contest') {
      title.innerText = "🏆 뚝섬 제작 대회 포스터 (좌우 슬라이드 / 확대 가능)";
      // 00, 01, 02, 03, 03-1, 04, 05 순서로 배치
      baseNames = ['00', '01', '02', '03', '03-1', '04', '05'];
    } else if (type === 'official') {
      title.innerText = "📋 대회사 공식 포스터 (좌우 슬라이드 / 확대 가능)";
      for (let i = 6; i <= 15; i++) baseNames.push(i < 10 ? '0' + i : '' + i);
      baseNames.push('pmang01', 'pmang02');
    } else if (type === 'apl') {
      title.innerText = "🤝 APL 제휴사 안내 (좌우 슬라이드 / 확대 가능)";
      baseNames = ['apl01', 'apl02', 'apl03'];
    }

    baseNames.forEach(name => {
      const slide = document.createElement('div');
      slide.className = 'swiper-slide';

      // 두 손가락 줌 및 더블탭 확대를 위한 전용 컨테이너
      const zoomContainer = document.createElement('div');
      zoomContainer.className = 'swiper-zoom-container';
      
      const img = document.createElement('img');
      img.alt = '포스터';

      // 포스터 기본 확장자인 .jpg로 우선 요청
      img.src = name + '.jpg';
      
      // 대소문자나 png 확장자 차이로 로딩 실패 시 순서대로 교체 시도
      let step = 0;
      const extensions = ['.JPG', '.png', '.PNG', '.jpeg'];
      img.onerror = function() {
        if (step < extensions.length) {
          this.src = name + extensions[step];
          step++;
        } else {
          this.onerror = null; // 무한 반복 에러 방지
        }
      };

      zoomContainer.appendChild(img);
      slide.appendChild(zoomContainer);
      container.appendChild(slide);
    });

    // 슬라이더 및 확대 기능 초기화
    new Swiper('.swiper', {
      loop: false,
      zoom: {
        maxRatio: 3,      // 최대 3배까지 확대
        minRatio: 1,
        toggle: true      // 화면 더블탭 시 확대/원래대로 토글
      },
      pagination: { 
        el: '.swiper-pagination', 
        type: 'fraction' 
      }
    });
  </script>
</body>
</html>
