<style>
:root{
  --paper:#eef1f6; --paper2:#ffffff; --line:#e2e7ef; --ink:#1b2433; --sub:#66728a; --navy:#0d203b;
  --sh:0 1px 2px rgba(16,32,60,.05),0 6px 18px rgba(16,32,60,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:14px 16px 28px}
.h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin:2px 2px 10px}
.h h2{white-space:nowrap;font-size:19px;color:var(--navy);line-height:1.2;letter-spacing:-.4px}
.h .m{font-size:11.5px;color:var(--sub);text-align:right}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:10px;box-shadow:var(--sh)}
.t{font-weight:800}
.e{color:var(--sub);text-align:center;padding:26px 6px;font-size:13.5px}
.sch-hint{font-size:11.5px;color:#0284c7;background:#e0f2fe;text-align:center;padding:5px 6px;border-radius:8px;margin-bottom:8px;font-weight:700}
@media(min-width:760px){.sch-hint{display:none}}
.sch-box{--lw:128px;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:760px){.sch-box{--lw:210px}}
.sch-in{position:relative;padding-bottom:6px}
.sch-r{display:grid;grid-template-columns:var(--lw) 1fr;height:46px;border-bottom:1px solid #eef0f3}
.sch-l{position:sticky;left:0;z-index:5;background:#f8fafc;border-right:1px solid #cbd5e1;display:flex;align-items:center;padding:0 8px;font-size:11px;line-height:1.2;font-weight:800;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.sch-t{position:relative;height:100%}
.sch-t .bg{position:absolute;inset:0;display:grid;pointer-events:none}
.sch-t .bg div{border-right:1px dashed #e5e7eb}
.sch-r.schhd{height:32px;background:#0b4f6c;border-bottom:0}
.sch-r.schhd .sch-l{background:#0b4f6c;color:#fff;justify-content:center}
.sch-r.schhd .sch-t{display:grid;align-items:center;text-align:center;color:#fff;font-size:11.5px;font-weight:800}
.sch-r.schhd .sch-t div{border-right:1px solid #3d7a94}
.sch-sec{position:sticky;left:0;width:max-content;font-size:12px;font-weight:800;padding:3px 9px;margin:8px 0 2px 6px;border-radius:6px;background:#eef4ff;color:#1e40af}
.sch-sec.main{background:#fefce8;color:#854d0e}
.sch-b{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:800;white-space:nowrap;padding:0 4px;overflow:hidden;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sch-today{position:absolute;top:32px;bottom:0;width:0;border-left:2px solid #f43f5e;z-index:3;pointer-events:none}

['JOPT 2027 Tokyo #01','일본','도쿄','2026-12-24','2027-01-03','']
];
const rg=(s,e)=>`${s} ~ ${e}`;
if(!D||!Array.isArray(D.sch)||!D.sch.length){
  D={updated:(D&&D.updated)||'',
     sch:FALL.map(f=>({kind:'main',name:f[0],color:CC[f[1]]||'#64748b',s:f[3],e:f[4]})),
     schc:FALL.map(f=>({title:f[0],badge:f[1],color:CC[f[1]]||'#64748b',s:f[3],e:f[4],
       lines:['일정: '+rg(f[3],f[4]),'장소: '+f[1]+(f[2]?' · '+f[2]:''),'M/E Buy IN: '+(f[5]||'미정')]}))};
}

/* 📏 표 범위: 이번 달부터 마지막 일정 달까지 (최소 4개월, 최대 12개월) */
const MIN_M=4, MAX_M=12;
const md=s=>{const a=String(s).split('-');return (+a[1])+'/'+(+a[2]);};
const T0=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function span(){const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;let last=0;
  (D.sch||[]).forEach(x=>{const a=String(x.e||'').split('-').map(Number);if(a.length>=2&&!isNaN(a[0])&&!isNaN(a[1])){const i=(a[0]-y)*12+(a[1]-m);if(i>last)last=i;}});
  return {y,m,n:Math.min(MAX_M,Math.max(MIN_M,last+1))};}
function pos(str,end,sp){const a=String(str||'').split('-').map(Number);if(a.length<3||a.some(isNaN))return null;
  const i=(a[0]-sp.y)*12+(a[1]-sp.m),dim=new Date(a[0],a[1],0).getDate();return (i+(a[2]-(end?0:1))/dim)/sp.n*100;}
function rows(sp){
  const list=(D.sch||[]).slice().sort((a,b)=>String(a.s).localeCompare(String(b.s)));
  const out=[{sec:'🎯 새틀라이트 예선',rows:[]},{sec:'🏆 메인 본선',main:1,rows:[]}];
  const today0=T0();
  list.forEach(x=>{
    if(x.e&&String(x.e)<today0)return;   // /*enddate*/ 끝난 일정은 표에서 뺌
    let l=pos(x.s,0,sp),r=pos(x.e,1,sp);if(l==null||r==null||r<=0||l>=100)return;
    l=Math.max(0,l);r=Math.min(100,r);let w=Math.max(16*4/sp.n,r-l);if(l+w>100)l=100-w;
    const g=out[x.kind==='main'?1:0];let row=g.rows.find(y=>y[0]===x.name);
    if(!row){row=[x.name,x.color||'#64748b',[]];g.rows.push(row);}
    /* 막대 글자: 왼쪽에 이름이 이미 있으니 날짜를 보여줌 (관리자가 따로 적은 글자가 있으면 그것) */
    const tx=(x.t&&x.t!==x.name)?x.t:(md(x.s)+' ~ '+md(x.e));
    row[2].push([+l.toFixed(2),+w.toFixed(2),tx]);
  });
  return out.filter(g=>g.rows.length);
}
function draw(){
  const sp=span(),R=rows(sp);
  const today0=T0();
  /* 카드: 이미 끝난 대회는 숨기고, 진행 중이면 표시 */
  const C=(D.schc||[]).filter(c=>!c.e||c.e>=today0).sort((a,b)=>String(a.s||'').localeCompare(String(b.s||''))).map(c=>[c.title,c.badge||'',c.color||'#64748b',c.lines||[],c.s&&c.e&&c.s<=today0&&c.e>=today0,/^https?:\/\//.test(c.url||'')?c.url:'',c.sub||'',/^https?:\/\//.test(c.url2||'')?c.url2:'']);
  const title='🌏 해외대회일정';
  const foot=`<div class="foot">📌 자료 출처 : 각 대회 공식 홈페이지${D.auto?' ('+esc(D.auto)+' 확인)':''} · 뚝섬유원지 X ZERO${D.updated?' · '+esc(D.updated)+' 업데이트':''}</div>`;
  if(!R.length&&!C.length){document.getElementById('app').innerHTML=head(title,'')+'<div class="card e">아직 등록된 해외 대회 일정이 없어요<br>곧 올라와요 ✈️</div>'+foot;return;}
  const s=new Date(sp.y,sp.m-1,1),e=new Date(sp.y,sp.m-1+sp.n,1),p=(Date.now()-s)/(e-s);
  const cols=`grid-template-columns:repeat(${sp.n},1fr)`;
  const bg=`<div class="bg" style="${cols}">`+'<div></div>'.repeat(sp.n)+'</div>';
  const thisY=new Date().getFullYear(),mon=[];
  for(let k=0;k<sp.n;k++){const d=new Date(sp.y,sp.m-1+k,1),mm=d.getMonth()+1;mon.push((k===0||mm===1)&&d.getFullYear()!==thisY?`${d.getFullYear()%100}년 ${mm}월`:`${mm}월`);}
  const yl=d=>`${d.getFullYear()%100}년 ${d.getMonth()+1}월`,d1=new Date(sp.y,sp.m-2+sp.n,1);
  const range=s.getFullYear()===d1.getFullYear()?`${yl(s)} ~ ${d1.getMonth()+1}월`:`${yl(s)} ~ ${yl(d1)}`;
  const today=p>0&&p<1?`<div class="sch-today" style="left:calc(var(--lw) + (100% - var(--lw)) * ${p.toFixed(4)})"><i>오늘</i></div>`:'';
  const body=R.map(g=>(R.length>1?`<div class="sch-sec ${g.main?'main':''}">${g.sec}</div>`:'')+g.rows.map(([n,c,bars])=>
    `<div class="sch-r"><div class="sch-l" style="color:${esc(c)}" title="${esc(n)}">${esc(n)}</div><div class="sch-t">${bg}${bars.map(([l,w,t])=>`<div class="sch-b" style="left:${l}%;width:${w}%;background:${esc(c)}">${esc(t)}</div>`).join('')}</div></div>`).join('')).join('');
  document.getElementById('app').innerHTML=head(title,range)
   +(R.length?'<div class="sch-hint">👈 표를 좌우로 밀어서 전체 일정을 확인하세요 👉</div>'
   +`<div class="sch-box"><div class="sch-in" style="min-width:${Math.max(700,sp.n*130)}px"><div class="sch-r schhd"><div class="sch-l">대회명</div><div class="sch-t" style="${cols}">${mon.map(x=>`<div>${x}</div>`).join('')}</div></div>${today}${body}</div></div>`:'')
   +'<div style="height:12px"></div>'
   +C.map(([t,b,c,l,on,u,sub,u2])=>`<div class="card sch-c" style="--cc:${esc(c)}"><div class="t"><div>${esc(t)}${on?'<b>진행 중</b>':''}</div>${b?`<span>${esc(b)}</span>`:''}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}<ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${u?`<a class="off" href="${esc(u)}" target="_blank" rel="noopener">🔗 공식 홈페이지</a>`:''}${u2?` <a class="off" href="${esc(u2)}" target="_blank" rel="noopener">📅 일정표</a>`:''}</div>`).join('')
   +foot;
}
draw();
</script>
</body>
</html>
