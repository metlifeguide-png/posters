<!doctype html>
<html lang="ko">
<head>
<!--split-v1-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
@keyframes cfblink{50%{opacity:.35}}@keyframes pgin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}#app{animation:pgin .22s ease-out}
.lvb{display:inline-block;letter-spacing:-2px;margin-right:5px;vertical-align:-1px;white-space:nowrap}
.lvb.t3{filter:drop-shadow(0 0 3px #ffd54a)}
.lvb.t4{filter:drop-shadow(0 0 4px #4fc3f7) drop-shadow(0 0 2px #ffd54a)}
.lvb.t5{filter:drop-shadow(0 0 5px #ffb300) drop-shadow(0 0 3px #ff7043);animation:lvbs 2.4s ease-in-out infinite}
.lvb.t6{filter:drop-shadow(0 0 6px #ff4081) drop-shadow(0 0 4px #ffd54a);animation:lvbs 1.4s ease-in-out infinite}
.lvb.t7{filter:drop-shadow(0 0 7px #7c4dff) drop-shadow(0 0 4px #ff4081);animation:lvbs 1.1s ease-in-out infinite}
.lvb.t8{filter:drop-shadow(0 0 9px #00e5ff) drop-shadow(0 0 5px #7c4dff) drop-shadow(0 0 3px #ffd54a);animation:lvbs .9s ease-in-out infinite}
#icontip{position:absolute;z-index:9999;display:none;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:600}
.crn{display:inline-block;letter-spacing:-1px;margin-right:4px;white-space:nowrap}
@keyframes lvbs{50%{transform:scale(1.14);filter:brightness(1.35) drop-shadow(0 0 8px #ffd54a)}}
.lvnm5{font-weight:900;background:linear-gradient(90deg,#c98a10,#f6c344,#c98a10);-webkit-background-clip:text;background-clip:text;color:transparent}

</style>
</head>

국회의원 선거에 출마하며 벌어지는 코믹 범죄'],['해치','밀창군과 영조의 즉위 과정을 배경으로 청년 영조의 성장을 그린 대하 사극'],['복수가돌아왔다','학교 폭력 가해자로 몰려 퇴학당한 소년이 어른이 되어 복수를 위해 복귀한 학원물'],['붉은달푸른해','의문의 아이와 의문의 사고를 마주한 아동 상담사의 심리 추적 미스터리'],['남자친구','한 번도 자신이 원한 삶을 살지 못한 여자와 자유로운 청년의 운명적 사랑'],['내뒤에테리우스','전직 국정원 요원과 우연히 육아 전쟁에 휘말린 아줌마의 첩보 코미디 로맨스'],['식샤를합시다','1인 가구들의 먹방과 소소한 일상, 로맨스를 유쾌하게 그린 시리즈 물'],['식샤를합시다2','세종시로 이사 간 주인공이 초등학교 동창을 만나며 벌어지는 맛있는 로맨스'],['식샤를합시다3','서른넷의 나이에 슬럼프에 빠진 주인공이 음식과 함께 옛 추억을 치유하는 이야기'],['혼술남녀','노량진 학원가를 배경으로 저마다의 이유로 혼술을 즐기는 강사들의 공감 이야기'],['안단테','전형적인 도시 소년이 시골 학교로 전학을 오며 생명의 소중함을 깨닫는 청춘'],['병원선','배를 타고 의료 활동을 펼치는 의사들의 성장과 인간적인 교감을 그린 메디컬'],['최고의한방','과거의 스타가 현재로 시간 여행을 해 와서 겪는 좌충우돌 청춘 성장기'],['아버지가이상해','평생 가족을 위해 희생한 부모와 개성 만점 4남매의 따뜻한 가족 드라마'],['완벽한아내','평범한 주부가 예기치 못한 사건에 휘말려 잃어버렸던 여성성을 찾아가는 이야기'],['역적백성을훔친도둑','연산군 시대에 실제로 존재했던 홍길동의 삶과 민중의 영웅 서사'],['피고인','딸을 잃고 살인범 누명을 쓴 검사가 기억을 잃은 채 감옥에서 탈출하는 복수극'],['지푸라기라도잡고싶은짐승들','인생의 벼 끝에 몰린 사람들이 돈가방을 차지하기 위해 벌이는 범죄 스릴러'],['하이에나','법률가의 탈을 쓴 변호사들의 물고 물리는 피비린내 나는 생존 사투'],['영혼수선공','마음이 아픈 사람들을 치유하는 정신건강의학과 의사들의 따뜻한 휴먼 드라마'],['야식남녀','야식 심야 식당을 운영하는 셰프와 PD가 얽히는 삼각 로맨스 코미디'],['출사표','취업 대신 구의원에 출마하여 썩은 정치판을 뒤흔드는 청춘들의 오피스 코미디'],['십시일반','유산 상속을 둘러싸고 유명 화가의 저택에 모인 가족들의 숨 막히는 두뇌 싸움'],['우아한친구들','중년 부부들이 살고 있는 평화로운 마을에서 살인 사건이 벌어지며 깨지는 평화'],['기막힌유산','30억 원의 재산을 둘러싼 늙은 자산가와 엉뚱한 며느리들의 유산 전쟁'],['비밀의남자','사고로 지능을 잃은 남자가 기적처럼 눈을 뜨고 복수를 시작하는 일일 드라마'],['오삼광빌라','다양한 사연을 안고 삼광빌라에 모여든 사람들이 서로에게 정들어 가는 가족'],['너의노래를들려줘','살인사건이 있던 날의 기억을 잃은 팀파니스트가 음치 남자를 만나며 벌어지는 미스터리'],['닥터프리즈너','대형 병원에서 쫓겨난 천재 의사가 교도소 의료과장이 되어 복수를 펼치는 메디컬'],['위대한쇼','전직 국회의원 남자가 의문의 사남매를 아버지라고 맞이하며 벌어지는 코믹 휴먼'],['일억개의별','괴물이라 불린 남자와 상처를 가진 여자가 서로를 구원해 나가는 미스터리 멜로'],['배드파파','좋은 아빠가 되기 위해 나쁜 인간이 되기로 결심한 전직 복싱 챔피언의 가족 사투'],['여우각시별','인천공항을 배경으로 비밀을 품은 신입과 사수가 펼치는 가슴 따뜻한 휴먼 멜로'],['플레이어','사기꾼, 해커, 파이터, 드라이버가 모여 썩은 돈을 털어버리는 통쾌한 케이퍼물'],['제3의매력','서로의 눈에는 반짝거리는 특별함으로 비치는 두 남녀의 12년 연애 대서사시'],['미스마복수의여신','딸을 죽였다는 누명을 쓴 여자가 명탐정이 되어 사건을 해결하는 추리극'],['배드앤크레이지','유능하지만 나쁜 놈이 정의로운 인격 미스터를 만나며 벌어지는 히어로 액션'],['어사와조이','허당 은근슬쩍 암행어사와 기발한 이혼을 감행하는 여인의 유쾌한 수사 코미디'],['지금헤어지는중입니다','이별이라 쓰고 사랑이라 읽는 달고 짜고 맵고 쓴 이별 액츄얼리 멜로'],['학교2021','입시경쟁이 아닌 다른 길을 선택한 아이들의 소신과 우정을 그린 청춘 학원물'],['너의밤이되어줄게요','세계 최고 밴드 아이돌과 의사로 위장 입주한 여자의 달콤살벌한 동거'],['엉클','뮤지션 출신 백수 삼촌이 누나의 이혼으로 낙오된 조카를 맡아 키우는 유쾌한 성장기'],['꽃피면달생각하고','엄격한 금주령의 시대, 술을 빚어 인생을 역전하려는 밀조꾼 여인과 어사'],['설강화','1987년 서울을 배경으로 피투성이가 되어 여자기숙사에 뛰어든 명문대생의 비밀 사랑'],['안나라수마나라','꿈을 잃어버린 소녀 앞에 의문의 마술사가 나타나 진정한 위로를 건네는 판타지'],['스위트홈2','욕망이 괴물이 되는 세상, 그린홈을 떠나 새로운 터전에서 살아남기 위한 사투를 그린 시즌2'],['킹덤아신전','북방의 여진족 부락의 후손 아신에게 벌어진 비극과 생사역의 기원을 다룬 스페셜 에피소드'],['지옥시즌2','부활을 둘러싼 혼란 속에서 새리언교와 진경준, 민혜진이 얽히며 벌어지는 디스토피아'],['오징어게임시즌2','다시 게임에 참가해 거대한 상금을 두고 목숨 건 사투를 벌이는 참가자들의 이야기'],['더글로리파트2','문동동이가 본격적으로 학교폭력 가해자들을 향해 완벽하고 치밀한 복수를 완성하는 결말'],['슬기로운의사생활시즌2','율제병원 의대 동기 5인방의 더욱 깊어진 우정과 환자들의 따뜻한 사연'],['카지노시즌2','필리핀에서 카지노 왕으로 군림하던 차무식의 몰락과 마지막 최후를 그린 범죄물'],['경성크리처시즌2','1945년 경성을 넘어 2024년 서울에서 다시 이어지는 기이한 괴수와의 사투'],['소방서옆경찰서그리고국과수','화재를 진압하는 소방과 범인을 잡는 경찰, 그리고 국과수의 공조 수사'],['동상이몽2','다양한 커플들의 살아가는 모습을 관찰하며 공감을 나누는 리얼 예능'],['골때리는그녀들','진정성을 가지고 축구에 도전하는 여성 연예인들의 스포츠 리얼리티'],['환승연애2','지나간 연인과 새로운 사람들 사이에서 흔들리는 청춘들의 진짜 연애 리얼리티'],['하트시그널3','청춘 남녀들이 시그널 하우스에서 서로의 마음을 확인하는 연애 심리 관찰'],['스트릿댄스걸스파이터','대한민국 최고의 여고생 댄스 크루를 가리는 치열한 서바이벌'],['흑백요리사시즌2','맛의 계급을 뒤집는 요리사들의 더욱 강력해진 요리 서바이벌'],['지구오락실2','지구로 도망간 토롱이를 잡기 위해 활약하는 용사들의 유쾌한 세계 여행'],['핑계고시상식','유재석과 지인들이 모여 소소하고 유쾌하게 진행하는 웹 예능 시상식'],['출장십오야2','다양한 촬영장과 소속사를 찾아가 게임을 펼치는 나영석 PD의 예능'],['구경이','게임과 술이 인생의 전부인 전직 경찰 ○○○가 연쇄살인마를 파헤치는 코믹 추적'],['멜랑꼴리아','수학천재와 교사가 수학의 언어로 얽히며 부패한 스캔들을 파헤치는 드라마'],['키스식스센스','입술이 닿으면 미래가 보이는 여자와 오감 능력을 가진 상사의 아찔한 로맨스'],['링크먹고사랑하라죽이게','어느 날 갑자기 여자의 감정이 고스란히 공유되는 남자의 판타지 멜로'],['닥터로이어','조작된 수술로 모든 걸 빼앗기고 변호사가 된 천재 외과의사의 메디컬 복수극'],['인사이더','사법연수생이 잠입 수사 중 교도소 도박판에서 벌이는 극한의 서바이벌 액션'],['징크스의연인','손에 닿은 사람의 미래를 보는 능력을 가진 여인과 바닥을 치는 남자의 판타지'],['미남당','전직 프로파일러가 사기꾼 박수무당으로 위장해 벌이는 유쾌한 미스터리 수사'],['오늘의웹툰','유도 선수 출신 신입사원이 웹툰 편집부에서 살아남기 위한 오피스 성장기'],['굿잡','재벌 탐정과 초시력 능력을 가진 여자의 영혼 콤비 수사 로맨스 코미디'],['어게인마이라이프','억울한 죽음을 당한 검사가 능력치를 유지한 채 15년 전으로 회귀해 절대 악을 응징'],['블라인  장군이 거란의 침략군을 귀주에서 몰살시킨 전투'],['행주대첩','권율 장군과 여성들이 돌을 날리며 왜군을 물리친 임진왜란의 대첩'],['명량대첩','이순신 장군이 12척의 배로 300척이 넘는 왜선을 물리친 해전'],['정묘호란','1627년 후금의 침략으로 조선과 형제 관계를 맺게 된 전쟁'],['갑신정변','1884년 개화파가 우정총국 개국 축하연에서 일어킨 정면 쿠데타'],['동학농민운동','고부 봉기를 시작으로 반봉건, 반외세를 부르짖으며 일어난 농민 운동'],['광주학생항일운동','1929년 광주에서 시작되어 전국으로 확산된 학생 중심의 독립운동'],['실학','조선 후기 실생활에 도움이 되는 학문을 연구하고 개혁을 주장한 사조'],['근초고왕','백제의 전성기를 이끌며 랴오서, 산둥, 규슈 등 해상 무역을 장악한 왕'],['미국독립전쟁','영국의 식민 지배에 맞서 13개 주가 독립을 선언하고 승리한 전쟁'],['제1차세계대전','사라예보 사건을 도화선으로 연합국과 동맹국이 맞붙은 인류 최초의 총력전'],['제2차세계대전','나치 독일과 일본의 침략으로 전 세계가 휘말린 역사상 가장 참혹한 전쟁'],['마그나카르타','1215년 영국의 왕권 제한과 귀족의 권리를 보장한 대헌장'],['종교개혁','1517년 마르틴 루터가 면죄부 판매를 비판하며 가톨릭 교회에 반기를 든 사건'],['훈민정음해례본','세종대왕이 훈민정음의 창제 원리와 사용법을 상세히 풀이하여 발행한 해설서'],['경주첨성대','동양에서 가장 오래된 천문 관측 시설로 신라 선덕여왕 때 세워진 석조 건축물'],['발해상경성','발해의 수도였던 곳으로 당나라의 장안성을 본떠 바둑판 모양으로 설계된 성터'],['울산반구대암각화','선사시대 선조들이 고래, 사슴 등 사냥하는 모습을 바위에 새겨 넣은 유적'],['공주무령왕릉','백제 25대 왕과 왕비의 무덤으로 도굴되지 않은 채 완벽한 형태로 발굴된 고분'],['천마총','신라의 대표적인 돌무지덧널무덤으로 금관과 천마도 장니가 출토된 고분'],['농사직설','조선 세종 때 정초와 변효문 등이 우리 풍토에 맞는 농사법을 정리한 책'],['일성록','조선 후기 정조부터 고종 때까지 왕이 자신의 반성과 국정을 기록한 일기'],['흠흠신서','정약용이 재판과 형벌을 다룰 때 억울함이 없도록 백성을 보호하기 위해 쓴 책'],['신기전','조선 시대 화약을 이용해 여러 개의 화살을 동시에 발사할 수 있던 로켓형 무기'],['비격진천뢰','임진왜란 당시 불꽃을 뿜으며 폭발하여 적을 혼란에 빠뜨린 조선의 시한폭탄'],['판옥선','조선 수군의 주력 전함으로 튼튼한 목재와 높은 층 구조로 왜선과의 전투에 유리했던 배'],['위화도회군','1388년 이성계가 요동 정벌을 중단하고 군대를 돌려 개경으로 진격한 사건'],['계유정난','1453년 수양대군이 김종서 등 반대파를 제거하고 실권을 장악한 쿠데타'],['기묘사화','1519년 조광조 등 사림파 개혁 세력이 훈구파의 모함으로 대거 화를 입은 사건'],['임오군란','1882년 구식 군인들이 신식 군대와의 차별 대우에 반발하여 일으킨 군사 반란'],['을미사변','1895년 일본 자객들이 경복궁에 침입하여 명성황후를 시해한 비극적 사건'],['아관파천','1896년 고종이 신변의 위협을 느껴 러시아 공사관으로 거처를 옮긴 사건'],['대한제국','1897년 고종이 황제로 즉위하고 국호를 바꾸어 자주 독립을 대내외에 선포한 제국'],['국채보상운동','1907년 대구에서 시작되어 나라의 빚을 갚기 위해 국민들이 모금에 동참한 운동'],['대한독립군','홍범도가 이끌며 청산리 전투에서 일본군을 대파한 독립군 부대'],['북로군정서','김좌진 장군이 이끌며 청산리에서 일본군과 맞서 대승을 거둔 독립군 부대'],['청산리대첩','1920년 독립군 연합 부대가 청산리 일대에서 일본군을 상대로 거둔 위대한 승리'],['봉오동전투','1920년 홍범도가 이끄는 독립군 연합 부대가 봉오동 골짜기에서 일본군을 무찌른 전투'],['조선의열단','김원봉이 중심이 되어 일제의 주요 요인 암살과 기관 파괴를 목적으로 조직한 항일 단체'],['조선혁명군','양세봉이 이끌며 중국 의용군과 연합하여 만주 지역에서 일본군과 싸운 부대'],['한국광복군','1940년 충칭에서 창설되어 제2차 세계대전에 연합군으로 참전한 임시정부의 정식 군대'],['조선어학회','일제 강점기 우리말과 글을 지키기 위해 사전을 편찬하고 맞춤법을 통일한 학술 단체'],['광주학생운동','1929년 광주에서 한일 학생 간의 충돌을 도화선으로 전국으로 번진 항일 학생 운동'],['제헌국회','1948년 5월 10일 총선거를 통해 대한민국 최초로 구성된 민의의 국회'],['반민족행위특별조사위원회','광복 직후 친일파를 처벌하기 위해 설치되었던 특별 조사 위원회 (반민특위)'],['625전쟁','1950년 6월 25일 북한의 남침으로 시작되어 3년간 온 국토를 황폐화한 동족상잔의 전쟁'],['인천상륙작전','1950년 9월 15일 맥아더 장군의 지휘 아래 전선을 뒤집은 대담한 연합군의 작전'],['419혁명','1960년 부정選挙에 항거하여 학생들이 중심이 되어 이승만 정권을 무너뜨린 민주주의 혁명'],['516군사정변','1961년 박정희를 중심으로 한 군부 세력이 쿠데타를 일으켜 정권을 장악한 사건'],['경부고속도로','1970년 완공되어 대한민국 경제 발전과 물류 이동의 대동맥 역할을 한 고속도로'],['부마민주항쟁','1979년 부산과 마산 지역에서 유신 독재에 반대하여 일어난 대규모 민주화 운동'],['518민주화운동','1980년 5월 광주 시민들이 신군부의 퇴진과 민주화를 요구하며 흘린 피와 저항의 역사'],['6월민주항쟁','1987년 호헌철폐와 직선제 개헌을 외치며 전국민이 거리로 나와 민주화를 이뤄낸 항쟁'],['88서울올림픽','1988년 대한민국 서울에서 개최되어 전 세계에 국가적 위상을 높인 스포츠 축제'],['금융실명제','1993년 김영삼 대통령의 긴급 명령으로 금융 거래 시 실명을 사용하게 한 제도'],['남북정상회담','2000년 김대중 대통령과 김정일 국방위원장이 평양에서 최초로 만나 개최한 역사적 회담'],['IMF외환위기','1997년 말 외환 부족으로 국가 부도 위기에 처해 국제통화기금의 구제금융을 받게 된 사건'],['미국독립선언','1776년 7월 4일 영국으로부터의 독립을 선언하며 자유와 평등을 천명한 역사적 문서'],['프랑스대혁명','1789년 바스티유 감옥 습격으로 시작되어 절대왕정을 무너뜨린 시민 혁명'],['아편전쟁','19세기 영국과 청나라 사이에 아편 밀매와 무역 적자 문제로 벌어진 최초의 근대 전쟁'],['태평천국운동','1950년대 홍수전이 주도하여 청나라 말기 부패에 맞서 농민들이 일으킨 대규모 반란'],['의화단운동','19세기 말 청나라에서 외세 배척을 내걸고 일어난 무술 의사들의 민중 운동'],['러일전쟁','1904년 만루와 한반도의 지배권을 두고 러시아와 일본이 벌인 제국주의 전쟁'],['보통선거','재산이나 성별에 관계없이 모든 성인 국민에게 투표권을 부여하는 민주주의 원칙'],['바이마르공화국','제1차 세계대전 패배 후 독일에 수립된 민주주의 헌법을 가진 공화국'],['대서양헌장','1941년 루스벨트와 처칠이 만나 전쟁 후의 평화와 민주주의 원칙을 천명한 선언'],['얄타회담','제2차 세계대전을 마무리하며 미·영·소 지도자가 전후 세계 질서와 독일 처리를 논의한 회담'],['포츠담선언','1945년 연합국이 일본의 무조건 항복과 한반도의 독립을 최종적으로 요구한 선언'],['유엔창설','1945년 제2차 세계대전 이후 세계 평화와 국제 협력을 위해 창설된 국제 기구'],['마샬플랜','제2차 세계대전 이후 미국의 유럽 경제 부흥 원조 계획'],['베를린장벽','동독과 서독의 분단을 상징하며 냉전의 최전선이었던 베를린의 장벽'],['쿠바미사일위기','1962년 미국과 소련 간의 핵전쟁 직전까지 갔던 최악의 냉전 시대 갈등'],['베트남전쟁','베트남의 공산화 통일을 저지하기 위해 미국 등이 개입하여 벌인 냉전 시대의 대리전'],['철의장막','윈스턴 처칠이 동유럽의 공산화와 서방 세계의 단절을 비유하며 사용한 용어'],['냉전체제','제2차 세계대전 이후 미국 중심의 자유주의 진영과 소련 중심의 공산주의 진영의 대립 체제'],['유럽연합','유럽 국가 간의 경제적·정치적 통합을 이루기 위해 출범한 거대한 지역 공동체 (EU)'],['소련해체','1991년 고르바초프의 개혁 정책과 함께 소비에트 연방이 공식적으로 해체된 역사적 사건'],['아랍의봄','2010년 이후 중동과 북아프리카 전역에서 독재 정권 타도를 외치며 일어난 민주화 운동'],['르네상스운동','14세기 이탈리아에서 고대 그리스·로마 문화를 부흥시키며 인간 중심의 사상을 꽃피운 운동'],['대항해시대','유럽인들이 새로운 항로를 개척하여 신대륙을 발견하고 세계적 무역망을 형성한 시대'],['계몽사상','18세기 이성 중심의 사고로 구제도의 모순을 비판하고 시민 혁명의 이론적 토대를 제공한 사상'],['고조선','단군왕검이 건국한 것으로 전해지는 한반도 최초의 국가로 8조법이 존재함'],['부여','만주 송화강 일대에 자리 잡았던 국가로 순장 풍습과 영고라는 제천 행사가 있었음'],['옥저','함경도 해안가에 위치하며 가족 공동 무덤인 뼈로 되묻는 부장 풍습이 있던 소국'],['동예','강원도 일대에 자리 잡았으며 젓가락 같은 단궁과 반어피 등의 특산물이 유명했던 나라'],['삼한','마한, 진한, 변한으로 이루어져 있으며 천군이라는 제사장이 소도라는 신성 구역을 다스림'],['병부','법흥왕 때 설치되어 신라의 군사 기밀과 인사권을 장악한 중앙 행정 부서'],['화백회의','신라 시대 귀족들이 모여 국가의 중대사를 만장일치제로 결정하던 귀족 회의'],['정사암','백제 시대 나라의 최고 재상을 선출하기 위해 밀봉된 후보 이름 넣어두고 결정하던 회의 장소'],['의정부','조선 시대 행정을 총괄하는 최고 국가 최고 합의 기구'],['삼사','조선 시대 회계와 언론을 담당하던 사헌부, 사간원, 홍문관의 ○○ 제도'],['사헌부','조선 시대 관리들의 비리를 감찰하고 백관을 규탄하던 언론 삼사의 기관'],['사간원','조선 시대 국왕에게 바른 말을 고하고 잘못을 간언하던 언론 기관'],['홍문관','조선 시대 궁중의 도서를 관리하고 왕의 자문을 담당하던 옥당으로 불린 기관'],['의금부','조선 시대 국왕의 직속 사법 기관으로 주로 역적이나 중죄인을 다스리던 곳'],['춘추관','조선 시대 역사서의 편찬과 보관을 담당하던 관청'],['과거제','고려와 조선 시대 시험을 통해 관리를 선발하던 핵심 인재 등용 제도'],['음서제','고려 시대 고위 관료의 자손들이 시험 없이 무난하게 관직에 오르던 특권 제도'],['천거제','조선 시대 고위 관료의 추천을 받아 특별히 인재를 채용하던 제도'],['전민변정도감','고려 공민왕 때 권문세족이 불법으로 빼앗은 토지와 노비를 원래 주인에게 돌려준 관청'],['사심관제도','고려 시대 중앙 고위 관료를 출신 지역의 사심관으로 임명하여 향리를 통제하게 한 제도'],['기인제도','고려 시대 지방 호족의 자제를 수도인 개경에 머물게 하여 인질 겸 자문으로 삼은 제도'],['5도양계','고려 시대 지방 행정 구역으로 일반 행정 구역인 5도와 군사 행정 구역인 양계로 나뉨'],['8도제','조선 태종 때 전국의 지방을 8개의도로 나누고 관찰사를 파견한 행정 구역 제도'],['수령파견','조선 시대 모든 군현에 지방관인 수령을 파견하여 중앙 집권을 강화한 정책'],['유향소','조선 시대 지방 양반들이 수령을 보좌하고 향리를 감시하기 위해 만든 자치 기구'],['경재소','조선 시대 지방의 유향소와 중앙 정부를 연결해 주던 서울의 연락 사무소'],['호포제','조선 고종 때 흥선대원군이 양반에게도 군포를 징수하게 하여 조세 평등을 이룬 제도'],['사창제','조선 흥선대원군이 환곡의 폐단을 바로잡기 위해 마을 단위로 곡물을 대여하던 제도'],['척화비','흥선대원군이 통상수교거부 정책을 전국 각지에 세워 알리던 비석'],['병인양요','1866년 프랑스 함대가 제너럴셔먼호 사건과 신자유주의 탄압을 구실로 강화도를 침략한 사건'],['신미양요','1871년 미국의 어니 제임스 함대가 강화도를 침략하여 어재연 장군이 항전한 사건'],['강화도조약','1876년 일본과 맺은 대한민국 최초의 불평등 근대적 조약'],['조미수호통상조약','1882년 조선이 서구 열강과 맺은 최초의 조약으로 거중조정이 포함됨'],['동학농민혁명','1894년 고부 봉기를 시작으로 반봉건과 반외세를 외치며 일어난 민중 항쟁'],['을미개혁','1895년 단발령 시행과 종두법 도입 등을 단행한 개혁'],['독립협회','1896년 서재필 등이 중심이 되어 독립문 건립과 민권 의식을 고취한 단체'],['만민공동회','독립협회가 주도하여 러시아의 이권 침탈을 막고 백성이 참여한 대중 집회'],['안창호','신민회를 조직하고 흥사단을 만들어 애국계몽운동을 이끈 독립운동가'],['이상재','민립대학기성회와 조선일보 사장 등을 지내며 민족의식을 일깨운 교육가'],['주시경','한글 연구에 매진하여 국문 연구소를 설립하고 우리말을 정비한 국어학자'],['김옥균','갑신정변을 주도하였으나 삼일천하로 끝난 뒤 일본으로 망명했던 개화파 인물'],['이범석','청산리 전투에 참전하고 광복군 참모장 등을 지낸 대한민국의 초대 국방부 장관'],['김원봉','조선의열단을 창설하고 의열투쟁을 주도한 후 의용대를 이끈 독립운동가'],['정인보','오천년 조선의 역사적 혼을 강조하며 조선사연구를 쓴 민족주의 사학자'],['문익점','원나라에서 목화씨를 캡슐에 숨겨 들여와 백성의 의생활을 구제한 고려의 문신'],['정몽주','고려 말의 충신으로 선죽교에서 이방원 세력에게 피살된 유학자'],['이방원','태종이 되어 왕권을 강화하기 위해 육조직계제를 실시하고 왕자의 난을 일으킨 인물'],['신숙주','세조의 즉위를 도우며 사육신과 대립하였고 집현전 학사 출신으로 공을 세운 문신'],['사육신','단종의 복위를 도모하다 처형당한 성삼문, 박팽년 등의 충신들'],['생육신','세조의 왕위 찬탈에 반대하여 관직을 버리고 은둔했던 매월당 김시습 등의 선비들'],['송시열','조선 후기 서인 세력의 거두이자 노론의 영수로서 북벌론을 주장한 학자'],['정약전','흑산도로 유배되어 어류 도감인 자산어보를 저술한 조선 후기의 실학자'],['홍대용','지전설을 주장하고 과학과 기술의 중요성을 강조한 실학자'],['박제가','북학의를 저술하여 청나라의 선진 문물을 적극 수용할 것을 주장한 실학자'],['이규보','동명왕편을 지어 고구려의 건국 시조 주몽의 업적을 영웅 서사시로 노래한 문인'],['일연','삼국유사를 편찬하여 단군 신화를 우리 역사의 공식 기록으로 정립한 승려'],['김부식','삼국사기를 편찬하여 유교적 합리주의 사관에 입각한 삼국의 역사를 남긴 문신'],['정중부','무신정변을 일으켜 고려의 무신 정권 시대를 연 무장'],['만권당','고려 충선왕이 원나라 수도에 세워 고려와 원나라의 학자들이 교류하던 학술 기관'],['쌍기','후주 출신으로 고려 광종 때 귀화하여 과거제를 건의하고 실시하게 한 인물'],['최승로','고려 성종에게 시무 28조를 올려 유교 정치의 이념을 확립하게 한 유학자']],

하게 조린 붉은 팥소 가득 채워 넣은 국민 빵'],['슈크림빵','촉촉한 빵 속에 부드러운 커스터드 슈크림을 듬뿍 넣은 빵'],['소보로빵','빵 겉면에 고소하고 바삭한 땅콩버터 앙금을 얹어 구워낸 추억의 빵'],['식빵','모양이 네모나며 결대로 찢어 먹거나 잼을 발라 먹는 대표적인 식사용 빵'],['베이글','반죽을 데친 후 오븐에 구워내어 쫀득한 식감이 일품인 고소한 빵'],['토스트','식빵을 노릇하게 구워 계란, 햄, 양배추와 달콤한 소스를 넣어 만든 간식'],['계란빵','따뜻한 반죽 속에 계란 한 알이 통째로 들어간 달콤 고소한 겨울 길거리 간식'],['군고구마','겨울철 통에 넣어 노릇하고 달콤하게 구워내는 따뜻한 구황작물 간식'],['팥빙수','곱게 간 얼음 위에 달콤한 팥, 떡, 연유, 과일을 올린 시원한 여름 대표 디저트'],['누룽지통닭','참나무 장작불에 통닭을 노릇하게 구워내어 바닥에 고소한 누룽지를 깔아낸 야식'],['전기구이통닭','기름기를 쏙 빼고 회전하는 철판 위에서 바삭하게 구워낸 추억의 통닭'],['마늘통닭','바삭한 후라이드 치킨 위에 알싸하고 달콤한 다진 마늘 소스를 듬뿍 끼얹은 치킨'],['매운간장치킨','매운 고추와 짭조름한 간장 소스를 볶아내어 화끈한 감칠맛을 내는 치킨'],['닭껍질튀김','바삭한 식감을 극대화하기 위해 닭의 껍질 부위만 모아 튀겨낸 별미 안주'],['한치모둠회','부드럽고 쫀득한 식감을 자랑하는 한치를 얇게 썰어 초고추장에 찍어 먹는 회'],['골뱅이무침','쫄깃한 골뱅이와 아삭한 오이, 야채를 매콤새콤한 양념에 버무려 소면과 먹는 안주'],['번데기탕','고소하고 짭조름한 번데기를 고추와 파를 넣어 얼큰한 국물로 끓여낸 술안주'],['오뎅탕','각종 어묵을 듬뿍 넣고 쑥갓과 무를 띄워 시원하게 우려낸 포장마차 대표 안주'],['홍합탕','싱싱한 홍합을 껍질째 넣고 파와 마늘을 띄워 맑고 시원하게 끓여낸 국물 요리'],['조개탕','동죽이나 모시조개를 듬뿍 넣고 깔끔하고 개운하게 끓여낸 시원한 해장 안주'],['계란말이안주','대파, 치즈, 명란 등을 넣어 두툼하게 말아낸 술자리 단골 사이드 메뉴'],['김치우동','얼큰한 김치 국물에 탱글탱글한 우동 사리를 넣어 끓여낸 인기 호프집 안주'],['먹태구이','명태를 바짝 말려 결대로 찢은 뒤 바삭하게 구워 마요네즈 간장소스에 찍어 먹는 안주'],['노가리구이','작은 명태인 노가리를 석쇠에 노릇하게 구워 맥주와 함께 가볍게 즐기는 안주'],['쥐포구이','얇게 저민 쥐포를 불에 살짝 구워 달콤 짭조름한 맛을 즐기는 마른안주'],['아귀포구이','두툼한 아귀포를 구워내어 씹는 맛과 고소함을 더한 마른안주 메뉴'],['타코와사비','잘게 썬 낙지를 톡 쏘는 와사비 소스에 절여 가볍게 집어먹는 일식 안주'],['시샤모구이','머리부터 꼬리까지 알이 꽉 찬 열빙어를 고소하게 통째로 구워낸 안주'],['메로구이','기름지고 부드러운 메로 살을 달달한 데리야끼 소스로 구워낸 고급 일식 안주'],['명란구이','짭조름한 명란젓을 버터에 노릇하게 구워 오이 슬라이스와 마요네즈에 곁들이는 안주'],['닭똥집볶음','닭의 모래주머니를 마늘, 청양고추, 참기름과 함께 쫄깃하게 볶아낸 요리'],['오소리감투볶음','돼지의 특수부위인 오소리감투를 야채와 매콤하게 볶아낸 쫄깃한 안주'],['막창소금구이','돼지 막창을 잡내 없이 깔끔하게 손질해 담백하게 소금만 찍어 먹는 구이'],['양곱창구이','소의 양과 곱창을 돌판 위에 노릇하게 구워 부추무침과 함께 먹는 요리'],['돼지갈비김치찜','두툼한 돼지갈비와 묵은지를 냄비에 넣고 오랜 시간 푹 끓여낸 밥도둑 요리'],['묵은지닭볶음탕','매콤한 닭볶음탕에 푹 익은 묵은지를 통째로 넣어 깊은 맛을 낸 요리'],['등갈비김치찌개','뼈가 붙은 등갈비를 김치와 함께 얼큰하게 끓여내어 살을 발라 먹는 찌개'],['차돌된장전골','푸짐한 차돌박이와 진한 된장 육수가 어우러져 끓일수록 진해지는 전골'],['버섯불고기전골','각종 버섯과 소불고기를 맑은 육수에 담아 보글보글 끓여 먹는 전골'],['만두전골','왕만두와 채소, 버섯을 사골 육수에 끓여 든든하게 즐기는 겨울철 전골 요리'],['낙지곱창전골','낙지와 곱창, 우삼겹이 환상적인 조화를 이루는 얼큰한 보양 전골'],['해물만두전골','해산물의 시원함과 꽉 찬 만두의 담백함이 어우러진 푸짐한 전골 요리'],['소고기샤브샤브','끓는 육수에 얇은 소고기와 야채를 살짝 담갔다 건져 먹는 깔끔한 요리'],['밀푀유나베','배추, 깻잎, 소고기를 겹겹이 쌓아 냄비에 예쁘게 담아 끓여 먹는 일식 전골'],['스키야키','얇은 소고기와 야채를 달달한 간장 소스에 자작하게 졸여 날계란에 찍어 먹는 요리'],['창코나베','씨름 선수들이 체력 보충을 위해 고기와 해산물, 야채를 넣고 끓여 먹는 일식 나베'],['모츠나베','소의 대창을 넣어 기름지고 진한 국물 맛을 내는 일본 후쿠오카식 곱창전골'],['돈코츠샤브샤브','진한 돼지 사골 육수에 고기를 데쳐 먹는 이색적인 샤브샤브 요리'],['마라샤브샤브','알얼한 마라 육수에 고기와 야채를 취향껏 데쳐 먹는 중식 전골 요리'],['우육면','향신료가 들어간 진한 소고기 육수에 넓은 중면을 말아 먹는 대만식 면 요리'],['탄탄면','고소한 땅콩소스와 매콤한 고추기름이 어우러진 중국 사천식 비빔 및 국물 면'],['마라샹궈면','마라 소스에 각종 채소와 고기를 볶은 뒤 중화면을 추가해 비벼 먹는 요리'],['팟타이꿍','통통한 새우를 넣어 새콤달콤한 소스로 볶아낸 태국 대표 쌀국수 요리'],['분짜세트','숯불고기와 쌀국수를 상큼한 느억맘 소스에 푹 적혀 먹는 베트남 요리'],['반쎄오','쌀가루 반죽에 각종 채소와 해산물을 넣어 바삭하게 부쳐낸 베트남식 부침개'],['짜조','다진 고기와 야채를 라이스페이퍼에 말아 바삭하게 튀겨낸 베트남식 만두 튀김'],['모닝글로리볶음','공심채를 마늘과 피시소스에 센 불로 아삭하게 볶아낸 동남아 나물 요리'],['푸팟퐁커리덮밥','부드러운 게살 커리를 밥 위에 듬뿍 얹어 비벼 먹는 태국식 한 그릇 요리'],['똠얌꿍라면','새콤 매콤한 태국 전통 스프에 라면 면발을 넣어 이색적으로 즐기는 요리'],['케밥샌드위치','두툼한 빵 속에 회전 구이 고기와 싱싱한 야채를 가득 채운 터키 요리'],['샥슈카토스트','지중해식 토마토 계란 스튜에 바삭한 토스트를 찍어 먹는 브런치 요리'],['라자냐오븐구이','넓은 파스타 면과 라구 소스, 치즈를 듬뿍 넣어 오븐에 구워낸 양식 요리'],['뇨끼크림스프','감자로 만든 쫀득한 뇨끼를 진한 양송이 크림 스프에 적셔 먹는 요리'],['클램차우더스프','조개 살과 감자, 베이컨을 넣어 부드럽고 걸쭉하게 끓여낸 미국식 스프'],['어니언크림스프','양파를 갈색이 되도록 볶아내어 깊은 단맛을 낸 프랑스식 전통 스프'],['단호박크림스프','달달한 단호박을 곱게 갈아 생크림과 함께 부드럽게 끓여낸 스프'],['콘스프그라탕','옥수수 스프 위에 치즈를 얹어 오븐에 노릇하게 구워낸 따뜻한 요리'],['리코타치즈샐러드','신선한 야채 위에 부드러운 수제 리코타 치즈와 발사믹을 곁들인 샐러드'],['치킨텐더샐러드','바삭하게 튀겨낸 닭안심 텐더를 샐러드 야채와 함께 머스터드 소스에 먹는 요리'],['연어아보카도샐러드','신선한 생연어와 부드러운 아보카도를 함께 버무려 먹는 건강 샐러드'],['카프레제샐러드','토마토와 생모짜렐라 치즈를 번갈아 얹고 바질 페스토를 뿌린 요리'],['메밀묵무침','탱글탱글한 메밀묵을 김치, 김가루, 참기름과 함께 삼삼하게 무쳐낸 요리'],['올갱이부추전','향긋한 부추와 싱싱한 다슬기를 듬뿍 넣어 노릇하게 부쳐낸 전'],['미나리전','봄철 향긋한 미나리를 통째로 부쳐내어 새콤한 간장에 찍어 먹는 전'],['새우전','통통한 새우를 동글게 빚어 계란 옷을 입혀 고소하게 부쳐낸 명절 전'],['표고버섯전','향긋한 표고버섯 안쪽에 고기 반죽을 채워 넣어 부쳐낸 고급 부침개'],['고추전','아삭한 고추 속에 다진 고기와 두부 속을 꽉 채워 노릇하게 지져낸 전'],['호박전','도톰하게 썬 애호박에 계란 옷을 입혀 담백하게  start(){this.stopClock();this.th='';this.over=false;this.left=60;this.endAt=0;rr();},

 pick(th){this.th=th;this.begin();},
 build(){const names=this.th==='랜덤'?WTHEMES:[this.th];const mp=new Map();names.forEach(t=>(WBANK[t]||[]).forEach(x=>{if(WBLK.has(x[0]))return;if(!mp.has(x[0]))mp.set(x[0],[x[0],x[1],t]);}));const all=[...mp.values()];const seen=cseenGet();let fresh=all.filter(x=>!seen.has(x[0]));if(!fresh.length){all.forEach(x=>seen.delete(x[0]));cseenSet(seen);fresh=all;}return shuf(fresh);},
 mark(){const q=this.L&&this.L[this.i];if(!q)return;const s=cseenGet();s.add(q[0]);cseenSet(s);},
 stopClock(){if(this.clockT){clearInterval(this.clockT);this.clockT=null;}if(this.stopT){this.stopT();this.stopT=null;}},
 timeLeft(){if(this.over)return 0;return Math.max(0,Math.ceil((this.endAt-Date.now())/1000));},
 startClock(){this.stopClock();this.endAt=Date.now()+Math.max(0,this.left||60)*1000;this.syncClock();this.clockT=setInterval(()=>this.syncClock(),100);},
 syncClock(){if(this.over)return;this.left=this.timeLeft();const e=$('tleft');if(e)e.textContent=this.left+'초';if(this.left<=0){this.over=true;this.stopClock();record('chosung',this.sc);rr();}},
 penalize(){this.left=this.timeLeft();this.endAt=Math.max(Date.now(),this.endAt-1000);this.left=this.timeLeft();this.syncClock();if(this.left<=0){this.over=true;this.stopClock();record('chosung',this.sc);rr();}},
 nextQ(){this.i++;if(this.i>=this.L.length){this.L=this.build();this.i=0;}this.hs=false;this.mark();},
 /*chmiss*/addMiss(t){const q=this.L&&this.L[this.i];if(q)(this.miss=this.miss||[]).push([q[0],q[1],q[2],t]);},
 missHtml(){const ms=(this.miss||[]).slice();const q=this.L&&this.L[this.i];if(q)ms.push([q[0],q[1],q[2],'시간 끝']);if(!ms.length)return '';return `<div style="margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.04)"><div style="font-weight:700;margin-bottom:6px">😢 못 맞춘 문제 · 정답 공개 <small style="font-weight:400;opacity:.7">· 이상한 단어는 🚩 신고</small></div>`+ms.map(([w,h,tm,why])=>`<div style="padding:6px 0;border-top:1px solid rgba(0,0,0,.08);display:flex;gap:6px;align-items:center;justify-content:space-between"><span><span style="letter-spacing:3px;color:var(--blue)">${cho(w)}</span> → <b>${w}</b> <small style="opacity:.7">${CICON[tm]||''} ${tm} · ${why}</small><div style="font-size:12px;opacity:.7">💡 ${h}</div></span>${wrepBtn(w,h,tm,'chosung')}</div>`).join('')+`</div>`;},
 gotHtml(){const g=this.got||[];if(!g.length)return '';return `<details style="margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.03)"><summary style="font-weight:700;cursor:pointer">✅ 맞힌 문제 ${g.length}개 · 이상한 단어는 🚩 신고</summary>`+g.map(([w,h,tm])=>`<div style="padding:6px 0;border-top:1px solid rgba(0,0,0,.08);display:flex;gap:6px;align-items:center;justify-content:space-between"><span><b>${w}</b> <small style="opacity:.7">${CICON[tm]||''} ${tm}</small><div style="font-size:12px;opacity:.7">💡 ${h}</div></span>${wrepBtn(w,h,tm,'chosung')}</div>`).join('')+'</details>';},
 resetSeen(){cseenSet(new Set());toast('푼 문제 기록을 초기화했어요',900);},
 begin(){this.miss=[];this.got=[];this.L=this.build();this.i=0;this.sc=0;this.ps=0;this.wr=0;this.hn=0;this.hs=false;this.over=false;this.left=60;this.endAt=Date.now()+60000;this.stopClock();this.mark();this.startClock();rr();setTimeout(()=>{const e=$('cin');if(e)e.focus();},50);},

  const [w,hint,tm]=this.L[this.i];

   <input class="q" id="cin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력 후 엔터" onkeydown="if(event.key==='Enter')CUR.ans(this.value)">
   <div class="g2b"><button class="btn" onclick="CUR.ans($('cin').value)">확인</button><button class="btn b2" ${this.hn>=3||this.hs?'disabled':''} onclick="CUR.useHint()">💡 첫 글자 (${3-this.hn})</button></div>
   <button class="btn full gr" style="margin-top:8px" ${this.ps>=2?'disabled':''} onclick="CUR.pass()">패스 (${2-this.ps})</button>
   <button class="btn full b2" style="margin-top:8px" onclick="CUR.menu()">← 테마 선택으로</button>`;},
 useHint(){if(this.over||this.hs||this.hn>=3)return;this.hn++;this.hs=true;const v=($('cin')||{}).value||'';rr();setTimeout(()=>{const e=$('cin');if(e){e.value=v;e.focus();}},30);},
 pass(){if(this.over||this.ps>=2)return;this.ps++;this.addMiss('패스');this.nextQ();rr();setTimeout(()=>{const e=$('cin');if(e)e.focus();},30);},
 ans(v){if(this.over)return;v=String(v).replace(/\s/g,'').toLowerCase();if(!v)return;const w=this.L[this.i][0];if(v===w.replace(/\s/g,'').toLowerCase()||wsame(v,w)){this.sc++;(this.got=this.got||[]).push(this.L[this.i]);this.nextQ();toast('✅ '+w,600);}else{this.wr++;this.penalize();toast('❌ -1초',600);}rr();setTimeout(()=>{const e=$('cin');if(e)e.focus();},30);}});

G.push({k:'crossword',cat:'퍼즐',e:'📝',n:'가로세로 낱말퀴즈',d:'상식·음식·만화·드라마… 테마별',
 start(){this.th=null;rr();},
 pickRand(){/*thrand*/this.pickTh(WTHEMES[Math.floor(Math.random()*WTHEMES.length)],1);},
 pickTh(t,r){this.rnd=!!r;this.th=t;let ok=false;for(let k=0;k<80&&!ok;k++)ok=this.gen(WBANK[t],k>40?5:6);if(!ok){toast('다시 섞어요');for(let k=0;k<80&&!ok;k++)ok=this.gen(WBANK[t].concat(WBANK['상식']),5);}this.sel=0;this.t0=Date.now();this.done=false;this.hints=0;clock(()=>this.done?null:secs(this.t0)+this.hints*20);rr();},
 gen(src,minW){const N=11,g=Array(N*N).fill(null),pl=[];const ws=shuf(src).filter(w=>w[0].length>=2&&w[0].length<=6&&!(typeof WBLK!=='undefined'&&WBLK.has(w[0])));/*wrep*/
  const ok=(w,x,y,dx,dy)=>{const L=[...w];if(x<0||y<0||x+dx*(L.length-1)>=N||y+dy*(L.length-1)>=N)return -1;let cross=0;
   const bx=x-dx,by=y-dy,ax=x+dx*L.length,ay=y+dy*L.length;if(bx>=0&&by>=0&&g[by*N+bx])return -1;if(ax<N&&ay<N&&g[ay*N+ax])return -1;
   for(let i=0;i<L.length;i++){const X=x+dx*i,Y=y+dy*i,c=g[Y*N+X];if(c){if(c!==L[i])return -1;cross++;}else{const sx=X+dy,sy=Y+dx,tx=X-dy,ty=Y-dx;if(sx<N&&sy<N&&g[sy*N+sx])return -1;if(tx>=0&&ty>=0&&g[ty*N+tx])return -1;}}return cross;};
  const place=(w,x,y,dx,dy,clue)=>{[...w].forEach((c,i)=>g[(y+dy*i)*N+x+dx*i]=c);pl.push({w,x,y,dx,dy,clue});};
  const f=ws[0];place(f[0],Math.floor((N-f[0].length)/2),5,1,0,f[1]);
  for(const [w,clue] of ws.slice(1)){if(pl.length>=9)break;if(pl.some(p=>p.w===w))continue;let done=false;
   for(const p of shuf(pl)){if(done)break;for(let i=0;i<p.w.length&&!done;i++)for(let j=0;j<w.length&&!done;j++){if(p.w[i]!==w[j])continue;const dx=p.dy,dy=p.dx,X=p.x+p.dx*i-dx*j,Y=p.y+p.dy*i-dy*j;if(ok(w,X,Y,dx,dy)===1){place(w,X,Y,dx,dy,clue);done=true;}}}}
  if(pl.length<(minW||6))return false;
  let minx=N,miny=N,maxx=0,maxy=0;pl.forEach(p=>{minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x+p.dx*(p.w.length-1));maxy=Math.max(maxy,p.y+p.dy*(p.w.length-1));});
  pl.forEach(p=>{p.x-=minx;p.y-=miny;});this.W=maxx-minx+1;this.H=maxy-miny+1;
  const starts=[...new Set(pl.map(p=>p.y*100+p.x))].sort((a,b)=>a-b);pl.forEach(p=>{p.no=starts.indexOf(p.y*100+p.x)+1;p.got=false;});
  this.pl=pl.sort((a,b)=>b.dx-a.dx||a.no-b.no);this.rev=new Set();return true;},
 cell(x,y){for(const p of this.pl)for(let i=0;i<p.w.length;i++)if(p.x+p.dx*i===x&&p.y+p.dy*i===y)return {p,i};return null;},
 ans(v){const p=this.pl[this.sel];v=String(v).replace(/\s/g,'');if(v===p.w||wsame(v,p.w)){/*wsame*/p.got=true;toast('✅ '+p.w,700);const nx=this.pl.findIndex(q=>!q.got);if(nx<0){this.done=true;record('crossword',secs(this.t0)+this.hints*20);}else this.sel=nx;}else toast('❌ 아니에요',700);rr();setTimeout(()=>{const e=$('cwin');if(e)e.focus();},30);},
 hint(){const p=this.pl[this.sel];for(let i=0;i<p.w.length;i++){const k=(p.y+p.dy*i)*100+p.x+p.dx*i;if(!this.rev.has(k)){this.rev.add(k);this.hints++;toast('힌트 +20초',700);break;}}rr();},
 view(){if(!this.th)return `<div class="gq">테마를 골라요</div><button class="btn full" style="margin-bottom:8px" onclick="CUR.pickRand()">🎲 랜덤 테마</button><div class="grid">${WTHEMES.map(t=>`<button class="btn ${t==='홀덤'?'b2':''}" style="font-size:14px;padding:12px 4px" onclick="CUR.pickTh('${t}')">${t}</button>`).join('')}</div>`;const cs=Math.min(34,Math.floor(330/Math.max(this.W,this.H)));let h=`<div style="display:grid;grid-template-columns:repeat(${this.W},${cs}px);gap:2px;justify-content:center">`;
  for(let y=0;y<this.H;y++)for(let x=0;x<this.W;x++){const c=this.cell(x,y);if(!c){h+=`<div style="width:${cs}px;height:${cs}px"></div>`;continue;}
   const all=this.pl.filter(p=>{for(let i=0;i<p.w.length;i++)if(p.x+p.dx*i===x&&p.y+p.dy*i===y)return true;return false;});const got=all.some(p=>p.got),rv=this.rev.has(y*100+x),selp=this.pl[this.sel];
   const insel=(()=>{for(let i=0;i<selp.w.length;i++)if(selp.x+selp.dx*i===x&&selp.y+selp.dy*i===y)return true;return false;})();const num=all.find(p=>p.x===x&&p.y===y);
   h+=`<div onclick="CUR.sel=${this.pl.indexOf(all[0])};rr()" style="position:relative;width:${cs}px;height:${cs}px;background:${insel?'#d9e6f7':'#fff'};border:1.5px solid #8a8f98;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${cs*.5}px;color:${got?'var(--blue)':'#999'}">${num?`<span style="position:absolute;left:2px;top:0;font-size:9px;color:#555">${num.no}</span>`:''}${got||rv?c.p.w[c.i]:''}</div>`;}
  h+='</div>';const p=this.pl[this.sel];
  const clues=dir=>this.pl.map((q,i)=>[q,i]).filter(([q])=>dir?q.dx:q.dy).map(([q,i])=>`<div class="row" onclick="CUR.sel=${i};rr()" style="cursor:pointer;${i===this.sel?'background:#e4edf8;':''}${q.got?'opacity:.45;text-decoration:line-through;':''}"><span><b>${q.no}</b> ${esc(q.clue)}${q.got?' → <b>'+esc(q.w)+'</b>':''}</span><span class="m" style="display:flex;gap:6px;align-items:center">${q.w.length}글자${q.got?wrepBtn(q.w,q.clue,this.th,'crossword'):''}</span></div>`).join('');
  return `<div class="gst"><span>${esc(this.th)}${this.rnd?' 🎲':''} · ${this.pl.filter(q=>q.got).length}/${this.pl.length} · 힌트 ${this.hints}</span><span>⏱ <b id="clk">${fmtScore('memory',secs(this.t0)+this.hints*20)}</b></span></div>
   ${this.done?`<div class="gok">🎉 완성! ${fmtScore('memory',secs(this.t0)+this.hints*20)} <button class="btn" style="padding:4px 10px;font-size:13px" onclick="CUR.rnd?CUR.pickRand():CUR.pickTh(CUR.th)">새 퍼즐</button> <button class="btn gr" style="padding:4px 10px;font-size:13px" onclick="CUR.start()">테마</button></div>`:''}${h}
   ${this.done?'':`<div class="card" style="margin-top:10px"><div class="t">${p.no}번 ${p.dx?'가로':'세로'} · ${p.w.length}글자</div><div class="m" style="margin:4px 0 8px">${esc(p.clue)}</div>
    <div style="display:flex;gap:6px"><input class="q" id="cwin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="정답" onkeydown="if(event.key==='Enter')CUR.ans(this.value)"><button class="btn" style="flex:none" onclick="CUR.ans($('cwin').value)">확인</button><button class="btn gr" style="flex:none" onclick="CUR.hint()">힌트</button></div></div>`}
   <div class="sec">➡ 가로</div><div class="card">${clues(1)}</div><div class="sec">⬇ 세로</div><div class="card">${clues(0)}</div>`;}});

function loadDaily(){fetch(API+'/api/daily?nick='+encodeURIComponent(NICK||''),{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r.ok){DLIVE=r;if(r.mine&&!lsGet('daily_done_'+r.d,null))lsSet('daily_done_'+r.d,{score:r.mine[0],detail:r.mine[1]});if(location.hash==='#daily')show(dailyView());}}).catch(()=>{});}
// 🏆 랭킹·업적
let RTAB=lsGet('rtab','week');
// 💡 랭킹은 서버에서 바로 받아와요 (페이지에 들어 있는 랭킹은 홈 갱신 때만 바뀜)
function loadRank(cb){if(!API){cb&&cb();return;}loadCrowns(()=>{if(location.hash==='#rank')show(rankView());});fetch(API+'/api/game/rankdata',{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r&&r.ok){['boards','tbest','xtop','lv','daily'].forEach(k=>{if(r[k]!=null)GD[k]=r[k];});if(r.d)GD.d=r.d;}cb&&cb();}).catch(()=>cb&&cb());}
function rankView(){const tabs=[['week','🏆 주간'],['today','⏰ 오늘'],['level','⭐ 레벨'],['ach','🏅 업적'],['crown','👑 왕관']];
 let h=`<div class="tabs">${tabs.map(([k,n])=>`<button class="${RTAB===k?'on':''}" onclick="RTAB='${k}';lsSet('rtab',RTAB);show(rankView());if(RTAB==='ach'||RTAB==='level')loadMe(()=>show(rankView()));if(RTAB==='crown')loadCrowns(()=>show(rankView()))">${n}</button>`).join('')}</div>`;
 if(RTAB==='week'){const B=GD.boards||{};let any=false;h+='<div class="sec">이번 주 랭킹 (최근 7일)</div><div class="m" style="font-size:12px;margin:-4px 0 8px">난이도가 있는 게임은 어려움 이상(슬라이딩 퍼즐은 6×6 이상) 기록만 순위에 반영돼요</div>';
  for(const g of RANKED){const c=GCFG[g.k];const keys=c[3]?(c[4]||['쉬움','보통','어려움']).slice().reverse().map(l=>[g.k+'_'+l,l]).filter(([k])=>B[k]):(B[g.k]?[[g.k,'']]:[]);
   for(const [key,lv] of keys){any=true;h+=`<div class="card"><div class="t">${g.e} ${g.nm}${lv?' · '+lv:''}</div>${B[key].map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvIco(x[0])}${esc(x[0])}${lvTag(x[0])}</span><span class="m">${fmtScore(g.k,x[1])}</span></div>`).join('')}</div>`;}}
  if(!any)h+='<div class="card m">아직 이번 주 기록이 없어요. 첫 1위의 주인공이 되어보세요!</div>';}
 if(RTAB==='today'){const T=GD.tbest||{};const ks=Object.keys(T);h+=`<div class="sec">오늘의 최고 기록 (${GD.d||''})</div>`;
  h+=ks.length?`<div class="card">${ks.map(k=>`<div class="row"><span>${gName(k)}${T[k][2]?' · '+esc(T[k][2]):''}</span><span>${lvIco(T[k][0])}<b>${esc(T[k][0])}</b>${lvTag(T[k][0])} <span class="m">${fmtScore(k,T[k][1])}</span></span></div>`).join('')}</div>`:'<div class="card m">오늘은 아직 기록이 없어요</div>';}
 if(RTAB==='level'){const X=GD.xtop||[];h+=NICK?`<div class="card"><div class="t">내 레벨</div>${meBar()}</div>`:'';h+='<div class="sec">레벨 랭킹</div>';
  h+=X.length?`<div class="card">${X.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvBadge(x[1])}<b>${esc(x[0])}</b> <span class="m">Lv.${x[1]} ${x[2]}</span></span><span class="m">🏅${x[4]} · ${x[3].toLocaleString()}xp</span></div>`).join('')}</div>`:'<div class="card m">아직 레벨 기록이 없어요</div>';
  h+=`<div class="card" style="font-size:13.5px;line-height:2"><div class="t" style="margin-bottom:2px">🎖️ 레벨 배지 · 올릴수록 화려해져요</div>${[[1,'새싹'],[5,'루키'],[10,'단골'],[15,'고수'],[20,'달인'],[30,'전설'],[50,'신'],[70,'초월자'],[100,'불멸']].map(([l,t])=>`<div class="row"><span>${lvBadge(l)} <b>${t}</b></span><span class="m">Lv.${l}~</span></div>`).join('')}<div class="m" style="font-size:12px;margin-top:4px">게임 기록 +10xp(하루 30번까지) · 개인 최고 +25xp · 1등 +20~100xp · 오늘의 문제 +50xp · 업적 +30xp~(어려운 업적은 더 많이)</div></div>`;}
 if(RTAB==='ach'){if(!NICK)h+='<div class="card m">닉네임을 저장하면 업적이 쌓여요</div>';else if(!ME)h+='<div class="gq">불러오는 중…</div>';
  else{h+=`<div class="card"><div class="t">${esc(NICK)}</div>${meBar()}<div class="m" style="margin-top:6px">기록 남긴 게임 ${ME.played.length}/${ME.total_games}</div></div>`;
   const got=ME.ach.filter(a=>a[4]),no=ME.ach.filter(a=>!a[4]);
   h+=`<div class="sec">달성 ${got.length}/${ME.ach.length}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${[...got,...no].map(a=>`<div class="card" style="margin:0;padding:8px;${a[4]?'border-color:#e0a800;background:#fff8e1':'opacity:.5;filter:grayscale(1)'}"><div style="font-size:22px">${a[1]}</div><b style="font-size:13.5px">${a[2]}</b><div class="m" style="font-size:11.5px">${a[3]}</div>${a[4]?`<div class="m" style="font-size:10.5px">${a[4].slice(0,10)}</div>`:''}</div>`).join('')}</div>`;}}
 if(RTAB==='crown')h+=crownView();
 return h;}
// 🟢 실시간 접속 (관리자 페이지에서 지금 누가 어떤 화면을 보는지) · 15초마다 신호 · 화면을 끄거나 나가면 바로 OFF
const PSID=(()=>{try{let v=localStorage.getItem('psid');if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem('psid',v);}return v;}catch(e){return Math.random().toString(36).slice(2,10);}})();
let PPAGE='';
function pres(off){if(!API)return;let n='';try{n=localStorage.getItem('nick')||'';}catch(e){}
 const b=JSON.stringify({s:PSID,p:PPAGE,n,f:window.top!==window.self?1:0,off:off?1:0});
 try{if(off&&navigator.sendBeacon&&navigator.sendBeacon(API+'/api/presence',new Blob([b],{type:'text/plain'})))return;
  fetch(API+'/api/presence',{method:'POST',headers:{'Content-Type':'text/plain'},body:b,keepalive:true}).catch(()=>{});}catch(e){}}
function presPage(p){PPAGE=String(p||'').slice(0,40);pres();}
// 💤 30분 동안 손 안 대면 접속 신호를 멈추고 OFF (방치된 화면이 계속 ON 으로 남지 않게) · 다시 손대면 바로 ON
let PACT=Date.now(),PIDLE=false;const PIDLE_MS=30*60*1000;
['pointerdown','keydown','touchstart','wheel','scroll','mousemove'].forEach(ev=>addEventListener(ev,()=>{PACT=Date.now();if(PIDLE){PIDLE=false;if(PPAGE&&!document.hidden)pres();}},{passive:true,capture:true}));
setInterval(()=>{if(document.hidden||!PPAGE)return;if(Date.now()-PACT>PIDLE_MS){if(!PIDLE){PIDLE=true;pres(1);}return;}pres();},15000);
document.addEventListener('visibilitychange',()=>{if(PPAGE)pres(document.hidden);});
window.addEventListener('pagehide',()=>{if(PPAGE)pres(1);});
function gvisit(p){presPage(p);if(!API)return;try{fetch(API+'/api/visit',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({p,n:NICK||''})}).catch(()=>{});}catch(e){}}
function render0(){const n=G.filter(g=>!g.study).length,st=n>0&&G.every(g=>g.cat==='홀덤');setTitle((st?'🎓 홀덤학습':'🎮 뚝섬 게임')+' · '+n+'종');if(st)document.title='홀덤학습';show(listView());}
// 🔄 새 게임: 같은 난이도·옵션으로 바로 다시 시작
const NO_NEW=['live','pet','blackjack','hustudy','huview','ladder','roulette'];
function newBtnSync(){const b=$('newBtn');if(!b)return;const g=CUR;b.style.display=g&&!g.study&&!NO_NEW.includes(g.k)&&!(window.DAILY&&DAILY.k===g.k)?'':'none';}
function newGame(){const g=CUR;if(!g)return;if(g.stop)g.stop();SWH=null;clearInterval(clock.iv);
 if(g.k==='logic'&&g.mode)g.go(g.mode,g.lv);
 else if(g.k==='pushfold'&&g.mode)g.go(g.mode);
 else if((g.k==='onecard'||g.k==='hula')&&g.S)g.go();
 else if(g.pickTh&&g.th)g.pickTh(g.th);
 else if(g.go&&g.lv&&g.go.length>=1)g.go(g.lv);
 else g.start();
 scrollTo(0,0);toast('🔄 새 게임');}
function render(){const hsh=location.hash.slice(1);if(CUR&&CUR.stop)CUR.stop();SWH=null;clearInterval(clock.iv);
 const back=$('backBtn');
 if(hsh.startsWith('g=')){const key=hsh.slice(2).split('&')[0];const g=G.find(x=>x.k===key);if(g&&g.stub){location.replace(g.stub+location.search+location.hash);return;}
  if(window.DAILY&&DAILY.k!==key)dailyEnd();
  if(g&&MEM_ONLY.includes(key)&&!MEM.tok){CUR=null;setTitle(g.e+' '+g.nm);back.style.display='';newBtnSync();show(memLockView(g));memNeed(g.nm);scrollTo(0,0);return;}   // 회원 전용: 주소(#g=)는 그대로 두고 잠금 화면 → 로그인하면 바로 그 게임 (예전엔 목록으로 갔다가 다시 넘어왔음)
  else if(g){gvisit((g.study?'':'게임·')+g.nm+(window.DAILY&&DAILY.k===key?' (오늘의 문제)':''));CUR=g;const dly=window.DAILY&&DAILY.k===key;setTitle((dly?'📅 오늘의 문제 · ':'')+g.e+' '+g.nm);back.style.display=g.study?'none':'';g.start();newBtnSync();
   if(dly){if(key==='logic')g.go('오늘');else if(DAILY.lv&&g.go)g.go(DAILY.lv);}scrollTo(0,0);return;}}
 if(window.DAILY)dailyEnd();
 CUR=null;back.style.display='none';newBtnSync();
 if(hsh==='rank'){gvisit('게임·랭킹');setTitle('🏆 랭킹·업적');back.style.display='';show(rankView());loadRank(()=>{if(location.hash==='#rank')show(rankView());});if(RTAB==='ach'||RTAB==='level')loadMe(()=>{if(location.hash==='#rank')show(rankView());});return;}
 if(hsh==='daily'){gvisit('게임·오늘의 문제');setTitle('📅 오늘의 문제');back.style.display='';show(dailyView());loadDaily();return;}
 if(hsh==='event'){gvisit('게임·커피이벤트');setTitle('☕ 커피이벤트');back.style.display='';MIS_AT=0;show(eventView());return;}
 render0();if(window.top===window.self)gvisit('게임 목록');else{presPage('게임 목록');back.style.display='';}/* 홈 안에서는 목록 화면에도 '목록'(홈으로) 버튼: 휴대폰은 홈의 위·아래 줄이 숨어 있음 */if(NICK&&!ME)loadMe(()=>{if(!CUR&&!location.hash.slice(1))render0();});}
addEventListener('hashchange',render);addEventListener('hashchange',abarSync);
if(window.top!==window.self){$('homeBtn').style.display='none';}   // 홈 안에서 열렸으면 홈 버튼 숨김 (위의 ← 뒤로로 닫기)
render();abarSync();</script>
