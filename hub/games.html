<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
@keyframes cfblink{50%{opacity:.35}}@keyframes pgin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}#app{animation:pgin .22s ease-out}
.lvb{display:inline-block;letter-spacing:-2px;margin-right:5px;vertical-align:-1px;white-space:nowrap}
.lvb.t3{filter:drop-shadow(0 0 3px #ffd54a)}
.lvb.t4{filter:drop-shadow(0 0 4px #4fc3f7) drop-shadow(0 0 2px #ffd54a)}
.lvb.t5{filter:drop-shadow(0 0 5px #ffb300) drop-shadow(0 0 3px #ff7043);animation:lvbs 2.4s ease-in-out infinite}
.lvb.t6{filter:drop-shadow(0 0 6px #ff4081) drop-shadow(0 0 4px #ffd54a);animation:lvbs 1.4s ease-in-out infinite}
.lvb.t7{filter:drop-shadow(0 0 7px #7c4dff) drop-shadow(0 0 4px #ff4081);animation:lvbs 1.1s ease-in-out infinite}
.lvb.t8{filter:drop-shadow(0 0 9px #00e5ff) drop-shadow(0 0 5px #7c4dff) drop-shadow(0 0 3px #ffd54a);animation:lvbs .9s ease-in-out infinite}
#icontip{position:absolute;z-index:9999;display:none;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:600}
.crn{display:inline-block;letter-spacing:-1px;margin-right:4px;white-space:nowrap}
@keyframes lvbs{50%{transform:scale(1.14);filter:brightness(1.35) drop-shadow(0 0 8px #ffd54a)}}
.lvnm5{font-weight:900;background:linear-gradient(90deg,#c98a10,#f6c344,#c98a10);-webkit-background-clip:text;background-clip:text;color:transparent}

</style>
</head>

 if(kind==='pair'){const p=key;if(p===11||p===8)return 'P';if(p===10)return 'S';if(p===9)return (u===7||u>=10)?'S':'P';if(p===7)return u<=7?'P':'H';if(p===6)return u<=6?'P':'H';
  if(p===5)return bjChart('hard',10,u);if(p===4)return (u===5||u===6)?'P':'H';return u<=7?'P':'H';}
 if(kind==='soft'){const t=key;if(t>=20)return 'S';if(t===19)return u===6?'Ds':'S';if(t===18)return u<=6?'Ds':u<=8?'S':'H';if(t===17)return (u>=3&&u<=6)?'D':'H';
  if(t>=15)return (u>=4&&u<=6)?'D':'H';return (u>=5&&u<=6)?'D':'H';}
 const t=key;if(t>=17)return 'S';if(t===16)return u>=9?'Rh':u<=6?'S':'H';if(t===15)return u===10?'Rh':u<=6?'S':'H';if(t>=13)return u<=6?'S':'H';
 if(t===12)return (u>=4&&u<=6)?'S':'H';if(t===11)return u<=10?'D':'H';if(t===10)return u<=9?'D':'H';if(t===9)return (u>=3&&u<=6)?'D':'H';return 'H';}
// 카운트 편차 (Hi-Lo 일러스트리어스18 + 판타스틱4 서렌더 · 주요 항목)
const BJDEV=[ // [종류, 합, 딜러, 조건TC, 이상(>=)이면 할 액션, 미만이면 기본]
 ['hard',16,10,0,'S','16 vs 10은 TC 0 이상이면 스탠드'],['hard',15,10,4,'S','15 vs 10은 TC +4 이상이면 스탠드'],
 ['pair',10,5,5,'P','10·10 vs 5는 TC +5 이상이면 스플릿'],['pair',10,6,4,'P','10·10 vs 6은 TC +4 이상이면 스플릿'],
 ['hard',10,10,4,'D','10 vs 10은 TC +4 이상이면 더블'],['hard',12,3,2,'S','12 vs 3은 TC +2 이상이면 스탠드'],['hard',12,2,3,'S','12 vs 2는 TC +3 이상이면 스탠드'],
 ['hard',11,11,1,'D','11 vs A는 TC +1 이상이면 더블'],['hard',9,2,1,'D','9 vs 2는 TC +1 이상이면 더블'],['hard',10,11,4,'D','10 vs A는 TC +4 이상이면 더블'],
 ['hard',9,7,3,'D','9 vs 7은 TC +3 이상이면 더블'],['hard',16,9,5,'S','16 vs 9는 TC +5 이상이면 스탠드'],
 ['hard',14,10,3,'R','14 vs 10은 TC +3 이상이면 서렌더'],['hard',15,9,2,'R','15 vs 9는 TC +2 이상이면 서렌더'],['hard',15,11,1,'R','15 vs A는 TC +1 이상이면 서렌더']];
const BJNEG=[['hard',13,2,-1,'H','13 vs 2는 TC −1 이하면 히트'],['hard',12,4,0,'H','12 vs 4는 TC 0 미만이면 히트'],['hard',12,5,-2,'H','12 vs 5는 TC −2 이하면 히트'],['hard',12,6,-1,'H','12 vs 6은 TC −1 이하면 히트'],['hard',13,3,-2,'H','13 vs 3은 TC −2 이하면 히트']];
function bjKind(cs){const t=bjv(cs),soft=bjSoft(cs);if(cs.length===2&&cv10(cs[0])===cv10(cs[1]))return ['pair',cv10(cs[0])];return [soft?'soft':'hard',t];}
// 가능한 옵션 반영한 추천 · tc가 있으면 편차 반영
function bjRec(cs,up,can,tc){const u=upv(up);let [kind,key]=bjKind(cs);
 if(kind==='pair'&&!can.P){kind=bjSoft(cs)?'soft':'hard';key=bjv(cs);}
 let a=bjChart(kind,key,u),dev=null;
 const skip=(a==='P'&&key!==10)||(a==='Rh'&&can.R);
 if(tc!=null&&!skip){const hk=(kind==='pair'&&key===10)?['pair',10]:[bjSoft(cs)?'soft':'hard',bjv(cs)];
  for(const d of BJDEV){if(d[0]===hk[0]&&d[1]===hk[1]&&d[2]===u&&tc>=d[3]&&(d[4]==='S'||can[d[4]])){a=d[4];dev=d[5];break;}}
  if(!dev)for(const d of BJNEG){if(d[0]===hk[0]&&d[1]===hk[1]&&d[2]===u&&(d[3]===0?tc<0:tc<=d[3])){a=d[4];dev=d[5];break;}}}
 if(a==='Rh')a=can.R?'R':'H';if(a==='R'&&!can.R)a=bjv(cs)>=17?'S':'H';
 if(a==='Ds')a=can.D?'D':'S';if(a==='D'&&!can.D)a='H';if(a==='P'&&!can.P){a=bjChart(bjSoft(cs)?'soft':'hard',bjv(cs),u);if(a==='Rh')a='H';if(a==='Ds')a='S';if(a==='D')a='H';}
 return [a,dev];}
function bjWhy(cs,up,a){const t=bjv(cs),soft=bjSoft(cs),u=upv(up),us=u===11?'A':u;const pair=cs.length===2&&cv10(cs[0])===cv10(cs[1]);const hand=pair?`${cs[0].r===14?'A':cv10(cs[0])} 페어`:(soft?'소프트 ':'하드 ')+t;
 const weak=u>=2&&u<=6;
 return `${hand} vs 딜러 ${us} → `+({
  D:soft?'딜러가 약하고 소프트라 버스트 걱정 없이 한 장만 받고 베팅을 두 배로':`한 장 받아 강한 패가 될 확률이 높아서 베팅을 두 배로${weak?' (딜러도 약함)':''}`,
  S:weak?`딜러 ${us}는 버스트 확률이 높아요(약 35~42%). 내가 위험을 지지 말고 기다리기`:t>=17?'17 이상은 더 받으면 버스트 위험이 너무 커요':'스탠드가 손실이 가장 적어요',
  H:weak?'이 합은 스탠드로는 이길 수 없어서 더 받아야 해요':`딜러 ${us}는 17 이상 만들 확률이 높아서, 이 합으로는 버티면 지는 경우가 많아요`,
  P:pair&&cs[0].r===14?'A 두 장은 각각 21을 노릴 수 있는 최고의 시작이라 항상 스플릿':pair&&cv10(cs[0])===8?'16은 최악의 합이라 8 두 장으로 나눠서 다시 시작':'나눠서 각각 시작하는 게 합쳐서 치는 것보다 기대값이 높아요',
  R:'이 패는 기대 손실이 50%가 넘어서, 베팅 절반만 잃고 포기하는 게 이득이에요'}[a]||'');}
G.push({k:'blackjack',cat:'카드',e:'🂡',n:'블랙잭 트레이너',d:'스플릿·더블·서렌더 · 카운팅 · 최고 칩 랭킹',
 start(){const S=lsGet('bj3',null);Object.assign(this,{chips:1000,peak:1000,lastBet:50,good:0,total:0,miss:{},refill:0,showCnt:false,hint:false,quizOn:false,rounds:0},S||{});
  this.bet=0;this.ph='bet';this.newShoe();this.tab='play';this.fb=[];this.msg='';rr();},
 save(){lsSet('bj3',{chips:this.chips,peak:this.peak,lastBet:this.lastBet,good:this.good,total:this.total,miss:this.miss,refill:this.refill,showCnt:this.showCnt,hint:this.hint,quizOn:this.quizOn,rounds:this.rounds});},
 newShoe(){const s=[];for(let d=0;d<6;d++)for(let r=2;r<=14;r++)for(let su=0;su<4;su++)s.push({r,s:su});this.shoe=shuf(s);this.rc=0;this.cut=Math.round(312*.25);toast('🔀 새 슈 (6덱) · 카운트 0부터',1400);},

 addBet(v){if(this.ph!=='bet')return;this.bet=Math.max(0,Math.min(this.chips,this.bet+v));rr();},
 setBet(v){if(this.ph!=='bet')return;this.bet=Math.max(0,Math.min(this.chips,Math.round(v)));rr();},
 deal(){if(this.ph!=='bet'||this.bet<10){toast('최소 베팅 10');return;}if(this.quiz){toast('카운트 퀴즈부터 맞혀요');return;}
  if(this.shoe.length<this.cut)this.newShoe();this.lastBet=this.bet;this.chips-=this.bet;this.ins=0;this.fb=[];this.msg='';
  const p1=this.draw(),d1=this.draw(),p2=this.draw(),d2=this.draw(false);this.hole=d2;this.dl=[d1,d2];this.holeOpen=false;
  this.H=[{cs:[p1,p2],bet:this.bet,done:false}];this.cur=0;this.ph='play';
  if(d1.r===14&&this.chips>=this.bet/2){this.ph='ins';rr();return;}this.peek();rr();},
 insure(yes){if(this.ph!=='ins')return;const tc=this.tc();const rec=this.showCnt&&tc>=3?'I':'N';this.noteRaw(yes?'I':'N',rec,rec==='I'?'TC +3 이상이면 남은 10 카드가 많아 인슈어런스가 이득 (카운터만)':'인슈어런스는 하우스 엣지 약 7%라 기본 전략에선 안 받아요',`인슈어런스 · 딜러 A`,this.showCnt&&tc>=3?'TC +3 이상이면 받기 (일러스트리어스 1번)':null);
  if(yes){this.ins=this.bet/2;this.chips-=this.ins;}this.ph='play';this.peek();rr();},
 peek(){const u=upv(this.dl[0]);if(u>=10&&bjv(this.dl)===21){this.openHole();const pb=bjv(this.H[0].cs)===21;let g=0;if(pb){g+=this.bet;}if(this.ins)g+=this.ins*3;this.chips+=g;
   this.msg=`딜러 블랙잭${pb?' · 나도 블랙잭이라 무승부':''}${this.ins?' · 인슈어런스 2:1 지급':''}`;this.endRound(g-this.bet-this.ins);return;}
  if(this.ins)this.msg='딜러 블랙잭 아님 · 인슈어런스 잃음';
  if(bjv(this.H[0].cs)===21){const g=this.bet*2.5;this.chips+=g;this.openHole();this.msg='🎉 블랙잭! 3:2 지급 +'+(this.bet*1.5);this.endRound(g-this.bet-this.ins);return;}},
 openHole(){if(!this.holeOpen){this.holeOpen=true;this.rc+=hiLo(this.hole);}},
 can(){const h=this.H[this.cur];const two=h.cs.length===2;return {D:two&&this.chips>=h.bet&&!h.sa,P:two&&cv10(h.cs[0])===cv10(h.cs[1])&&this.H.length<4&&this.chips>=h.bet&&!h.sa,R:two&&this.H.length===1,H:!h.sa};},
 noteRaw(act,rec,why,sit,dev){this.total++;const ok=act===rec;if(ok)this.good++;else{this.miss[sit]=(this.miss[sit]||0)+1;}this.fb.push({act,rec,why,ok,dev});this.save();},
 note(act){const h=this.H[this.cur],can=this.can();const tc=this.showCnt?Math.trunc(this.tc()):null;const [rec,dev]=bjRec(h.cs,this.dl[0],can,tc);
  const [kind,key]=bjKind(h.cs);const u=upv(this.dl[0]);const sit=`${kind==='pair'?(key===11?'A':key)+'페어':(kind==='soft'?'소프트 ':'하드 ')+key} vs ${u===11?'A':u}`;
  this.noteRaw(act,rec,bjWhy(h.cs,this.dl[0],rec),sit,dev);},
 act(a){if(this.ph!=='play')return;const h=this.H[this.cur],can=this.can();if(a!=='S'&&a!=='H'&&!can[a])return;if(a==='H'&&!can.H)return;this.note(a);

  else if(a==='P'){this.chips-=h.bet;const c2=h.cs.pop();const sa=h.cs[0].r===14;const nh={cs:[c2,this.draw()],bet:h.bet,done:false,sa};h.cs.push(this.draw());h.sa=sa;

 chartHtml(){const col={H:'#e9e4d8',S:'#f6d36b',D:'#7cc68a',Ds:'#7cc68a',P:'#8fb8ef',Rh:'#ef9a9a'};const lab={H:'H',S:'S',D:'D',Ds:'Ds',P:'P',Rh:'R'};

function jMoves(b,s){const m=[];for(let i=0;i<JW*JH;i++){const p=b[i];if(!p||p.s!==s)continue;const x=i%JW,y=Math.floor(i/JW);const at=(xx,yy)=>b[yy*JW+xx];const ok=(xx,yy)=>xx>=0&&yy>=0&&xx<JW&&yy<JH;
 const add=(xx,yy)=>{if(!ok(xx,yy))return;const q=at(xx,yy);if(q&&q.s===s)return;m.push([i,yy*JW+xx]);};
 if(p.t==='K'||p.t==='A'){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(inPal(xx,yy)&&((s===1&&yy>=7)||(s===2&&yy<=2)))add(xx,yy);}palDiag(x,y).forEach(([xx,yy])=>add(xx,yy));}
 else if(p.t==='R'){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){let xx=x+dx,yy=y+dy;while(ok(xx,yy)){add(xx,yy);if(at(xx,yy))break;xx+=dx;yy+=dy;}}
  if(inPal(x,y)){for(const[nx,ny]of palDiag(x,y)){add(nx,ny);if(!at(nx,ny)&&(nx===4)){const ex=nx+(nx-x),ey=ny+(ny-y);if(inPal(ex,ey))add(ex,ey);}}}}
 else if(p.t==='C'){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){let xx=x+dx,yy=y+dy,jumped=false;while(ok(xx,yy)){const q=at(xx,yy);
   if(!jumped){if(q){if(q.t==='C')break;jumped=true;}}else{if(q){if(q.s!==s&&q.t!=='C')m.push([i,yy*JW+xx]);break;}m.push([i,yy*JW+xx]);}xx+=dx;yy+=dy;}}
  if(inPal(x,y)&&x!==4){const cy=y<=2?1:8;const mid=at(4,cy);const ex=8-x,ey=2*cy-y;if(mid&&mid.t!=='C'&&Math.abs(y-cy)===1){const q=at(ex,ey);if(!q||(q.s!==s&&q.t!=='C'))m.push([i,ey*JW+ex]);}}}
 else if(p.t==='H'){for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){const bx=x+dx,by=y+dy;if(!ok(bx,by)||at(bx,by))continue;for(const s2 of[-1,1]){const xx=bx+(dx||s2),yy=by+(dy||s2);add(xx,yy);}}}
 else if(p.t==='E'){for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){const bx=x+dx,by=y+dy;if(!ok(bx,by)||at(bx,by))continue;for(const s2 of[-1,1]){const ddx=dx||s2,ddy=dy||s2;const cx=bx+ddx,cy=by+ddy;if(!ok(cx,cy)||at(cx,cy))continue;add(cx+ddx,cy+ddy);}}}
 else if(p.t==='P'){const f=s===1?-1:1;add(x,y+f);add(x-1,y);add(x+1,y);if(inPal(x,y))palDiag(x,y).forEach(([xx,yy])=>{if(yy-y===f)add(xx,yy);});}}return m;}
const jDo=(b,mv)=>{const n=b.slice();n[mv[1]]=n[mv[0]];n[mv[0]]=null;return n;};
function jEval(b){let v=0;b.forEach(p=>{if(p)v+=(p.s===2?1:-1)*JV[p.t];});return v;}
function jAB(b,d,al,be,s){const king=c=>b.some(p=>p&&p.t==='K'&&p.s===c);if(!king(1))return 5000+d;if(!king(2))return -5000-d;if(d===0)return jEval(b);
 const ms=jMoves(b,s).sort((a,c)=>(b[c[1]]?JV[b[c[1]].t]:0)-(b[a[1]]?JV[b[a[1]].t]:0));if(!ms.length)return jEval(b);
 if(s===2){let v=-1e9;for(const mv of ms){v=Math.max(v,jAB(jDo(b,mv),d-1,al,be,1));al=Math.max(al,v);if(al>=be)break;}return v;}
 let v=1e9;for(const mv of ms){v=Math.min(v,jAB(jDo(b,mv),d-1,al,be,2));be=Math.min(be,v);if(al>=be)break;}return v;}

function render(){const hsh=location.hash.slice(1);if(CUR&&CUR.stop)CUR.stop();SWH=null;clearInterval(clock.iv);
 const back=$('backBtn');
 if(hsh.startsWith('g=')){const key=hsh.slice(2).split('&')[0];const g=G.find(x=>x.k===key);
  if(window.DAILY&&DAILY.k!==key)dailyEnd();
  if(g){gvisit((g.study?'':'게임·')+g.nm+(window.DAILY&&DAILY.k===key?' (오늘의 문제)':''));CUR=g;const dly=window.DAILY&&DAILY.k===key;setTitle((dly?'📅 오늘의 문제 · ':'')+g.e+' '+g.nm);back.style.display=g.study?'none':'';g.start();newBtnSync();
   if(dly){if(key==='logic')g.go('오늘');else if(DAILY.lv&&g.go)g.go(DAILY.lv);}scrollTo(0,0);return;}}
 if(window.DAILY)dailyEnd();
 CUR=null;back.style.display='none';newBtnSync();
 if(hsh==='rank'){gvisit('게임·랭킹');setTitle('🏆 랭킹·업적');back.style.display='';show(rankView());loadRank(()=>{if(location.hash==='#rank')show(rankView());});if(RTAB==='ach'||RTAB==='level')loadMe(()=>{if(location.hash==='#rank')show(rankView());});return;}
 if(hsh==='daily'){gvisit('게임·오늘의 문제');setTitle('📅 오늘의 문제');back.style.display='';show(dailyView());loadDaily();return;}
 if(hsh==='event'){gvisit('게임·커피이벤트');setTitle('☕ 커피이벤트');back.style.display='';MIS_AT=0;show(eventView());return;}
 render0();if(window.top===window.self)gvisit('게임 목록');else presPage('게임 목록');if(NICK&&!ME)loadMe(()=>{if(!CUR&&!location.hash.slice(1))render0();});}
addEventListener('hashchange',render);
if(window.top!==window.self){$('homeBtn').style.display='none';}   // 홈 안에서 열렸으면 홈 버튼 숨김 (위의 ← 뒤로로 닫기)
render();
