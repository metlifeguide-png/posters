<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
</style>
</head>

 tap(src){if(this.over)return;const card=src==='w'?this.waste[this.waste.length-1]:this.p[src];if(!card)return;if(src!=='w'&&(card.gone||!this.free(src)))return;

 start(){for(let t=0;t<40;t++){if(this.gen())break;}this.sel=0;this.t0=Date.now();this.done=false;this.hints=0;clock(()=>this.done?null:secs(this.t0)+this.hints*20);rr();},
 gen(){const N=11,g=Array(N*N).fill(null),pl=[];const ws=shuf(WORDS).filter(w=>w[0].length>=2&&w[0].length<=5);
  const ok=(w,x,y,dx,dy)=>{const L=[...w];if(x<0||y<0||x+dx*(L.length-1)>=N||y+dy*(L.length-1)>=N)return -1;let cross=0;
   const bx=x-dx,by=y-dy,ax=x+dx*L.length,ay=y+dy*L.length;if(bx>=0&&by>=0&&g[by*N+bx])return -1;if(ax<N&&ay<N&&g[ay*N+ax])return -1;
   for(let i=0;i<L.length;i++){const X=x+dx*i,Y=y+dy*i,c=g[Y*N+X];if(c){if(c!==L[i])return -1;cross++;}else{const sx=X+dy,sy=Y+dx,tx=X-dy,ty=Y-dx;if(sx<N&&sy<N&&g[sy*N+sx])return -1;if(tx>=0&&ty>=0&&g[ty*N+tx])return -1;}}return cross;};
  const place=(w,x,y,dx,dy,clue)=>{[...w].forEach((c,i)=>g[(y+dy*i)*N+x+dx*i]=c);pl.push({w,x,y,dx,dy,clue});};
  const f=ws[0];place(f[0],Math.floor((N-f[0].length)/2),5,1,0,f[1]);
  for(const [w,clue] of ws.slice(1)){if(pl.length>=9)break;if(pl.some(p=>p.w===w))continue;let done=false;
   for(const p of shuf(pl)){if(done)break;for(let i=0;i<p.w.length&&!done;i++)for(let j=0;j<w.length&&!done;j++){if(p.w[i]!==w[j])continue;const dx=p.dy,dy=p.dx,X=p.x+p.dx*i-dx*j,Y=p.y+p.dy*i-dy*j;if(ok(w,X,Y,dx,dy)===1){place(w,X,Y,dx,dy,clue);done=true;}}}}
  if(pl.length<6)return false;
  let minx=N,miny=N,maxx=0,maxy=0;pl.forEach(p=>{minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x+p.dx*(p.w.length-1));maxy=Math.max(maxy,p.y+p.dy*(p.w.length-1));});

 ans(v){const p=this.pl[this.sel];v=String(v).replace(/\s/g,'');if(v===p.w){p.got=true;toast('✅ '+p.w,700);const nx=this.pl.findIndex(q=>!q.got);if(nx<0){this.done=true;record('crossword',secs(this.t0)+this.hints*20);}else this.sel=nx;}else toast('❌ 아니에요',700);rr();setTimeout(()=>{const e=$('cwin');if(e)e.focus();},30);},
 hint(){const p=this.pl[this.sel];for(let i=0;i<p.w.length;i++){const k=(p.y+p.dy*i)*100+p.x+p.dx*i;if(!this.rev.has(k)){this.rev.add(k);this.hints++;toast('힌트 +20초',700);break;}}rr();},
 view(){const cs=Math.min(34,Math.floor(330/Math.max(this.W,this.H)));let h=`<div style="display:grid;grid-template-columns:repeat(${this.W},${cs}px);gap:2px;justify-content:center">`;
  for(let y=0;y<this.H;y++)for(let x=0;x<this.W;x++){const c=this.cell(x,y);if(!c){h+=`<div style="width:${cs}px;height:${cs}px"></div>`;continue;}
   const all=this.pl.filter(p=>{for(let i=0;i<p.w.length;i++)if(p.x+p.dx*i===x&&p.y+p.dy*i===y)return true;return false;});const got=all.some(p=>p.got),rv=this.rev.has(y*100+x),selp=this.pl[this.sel];
   const insel=(()=>{for(let i=0;i<selp.w.length;i++)if(selp.x+selp.dx*i===x&&selp.y+selp.dy*i===y)return true;return false;})();const num=all.find(p=>p.x===x&&p.y===y);
   h+=`<div onclick="CUR.sel=${this.pl.indexOf(all[0])};rr()" style="position:relative;width:${cs}px;height:${cs}px;background:${insel?'#d9e6f7':'#fff'};border:1.5px solid #8a8f98;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${cs*.5}px;color:${got?'var(--blue)':'#999'}">${num?`<span style="position:absolute;left:2px;top:0;font-size:9px;color:#555">${num.no}</span>`:''}${got||rv?c.p.w[c.i]:''}</div>`;}
  h+='</div>';const p=this.pl[this.sel];
  const clues=dir=>this.pl.map((q,i)=>[q,i]).filter(([q])=>dir?q.dx:q.dy).map(([q,i])=>`<div class="row" onclick="CUR.sel=${i};rr()" style="cursor:pointer;${i===this.sel?'background:#e4edf8;':''}${q.got?'opacity:.45;text-decoration:line-through;':''}"><span><b>${q.no}</b> ${esc(q.clue)}</span><span class="m">${q.w.length}글자</span></div>`).join('');
  return `<div class="gst"><span>${this.pl.filter(q=>q.got).length}/${this.pl.length} · 힌트 ${this.hints}</span><span>⏱ <b id="clk">${fmtScore('memory',secs(this.t0)+this.hints*20)}</b></span></div>
   ${this.done?`<div class="gok">🎉 완성! ${fmtScore('memory',secs(this.t0)+this.hints*20)} <button class="btn" style="padding:4px 10px;font-size:13px" onclick="CUR.start()">새 퍼즐</button></div>`:''}${h}
   ${this.done?'':`<div class="card" style="margin-top:10px"><div class="t">${p.no}번 ${p.dx?'가로':'세로'} · ${p.w.length}글자</div><div class="m" style="margin:4px 0 8px">${esc(p.clue)}</div>
    <div style="display:flex;gap:6px"><input class="q" id="cwin" autocomplete="off" placeholder="정답" onkeydown="if(event.key==='Enter')CUR.ans(this.value)"><button class="btn" style="flex:none" onclick="CUR.ans($('cwin').value)">확인</button><button class="btn gr" style="flex:none" onclick="CUR.hint()">힌트</button></div></div>`}
   <div class="sec">➡ 가로</div><div class="card">${clues(1)}</div><div class="sec">⬇ 세로</div><div class="card">${clues(0)}</div>`;}});

function cvSetup(game,w,h,extra){show(`<div class="gst"><span>점수 <b id="csc">0</b></span><span>내 최고 ${(myBest(game.k)||0).toLocaleString()}</span></div><canvas id="cv" class="cv" width="${w}" height="${h}"></canvas>${extra||''}<div id="cmsg" class="m" style="text-align:center;margin-top:8px"></div>`);

 const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [(p.clientX-r.left)*w/r.width,(p.clientY-r.top)*h/r.height];};return pos;}

 start(){this.r=[];this.st='ready';this.t=0;this.show_();},
