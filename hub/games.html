<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
@keyframes pgin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}#app{animation:pgin .22s ease-out}
</style>

 ['hard',11,11,1,'D','11 vs A는 TC +1 이상이면 더블'],['hard',9,2,1,'D','9 vs 2는 TC +1 이상이면 더블'],['hard',10,11,4,'D','10 vs A는 TC +4 이상이면 더블'],
 ['hard',9,7,3,'D','9 vs 7은 TC +3 이상이면 더블'],['hard',16,9,5,'S','16 vs 9는 TC +5 이상이면 스탠드'],

const BJNEG=[['hard',13,2,-1,'H','13 vs 2는 TC −1 이하면 히트'],['hard',12,4,0,'H','12 vs 4는 TC 0 미만이면 히트'],['hard',12,5,-2,'H','12 vs 5는 TC −2 이하면 히트'],['hard',12,6,-1,'H','12 vs 6은 TC −1 이하면 히트'],['hard',13,3,-2,'H','13 vs 3은 TC −2 이하면 히트']];
function bjKind(cs){const t=bjv(cs),soft=bjSoft(cs);if(cs.length===2&&cv10(cs[0])===cv10(cs[1]))return ['pair',cv10(cs[0])];return [soft?'soft':'hard',t];}

function bjRec(cs,up,can,tc){const u=upv(up);let [kind,key]=bjKind(cs);
 if(kind==='pair'&&!can.P){kind=bjSoft(cs)?'soft':'hard';key=bjv(cs);}
 let a=bjChart(kind,key,u),dev=null;
 const skip=(a==='P'&&key!==10)||(a==='Rh'&&can.R);
 if(tc!=null&&!skip){const hk=(kind==='pair'&&key===10)?['pair',10]:[bjSoft(cs)?'soft':'hard',bjv(cs)];
  for(const d of BJDEV){if(d[0]===hk[0]&&d[1]===hk[1]&&d[2]===u&&tc>=d[3]&&(d[4]==='S'||can[d[4]])){a=d[4];dev=d[5];break;}}
  if(!dev)for(const d of BJNEG){if(d[0]===hk[0]&&d[1]===hk[1]&&d[2]===u&&(d[3]===0?tc<0:tc<=d[3])){a=d[4];dev=d[5];break;}}}
 if(a==='Rh')a=can.R?'R':'H';if(a==='R'&&!can.R)a=bjv(cs)>=17?'S':'H';
 if(a==='Ds')a=can.D?'D':'S';if(a==='D'&&!can.D)a='H';if(a==='P'&&!can.P){a=bjChart(bjSoft(cs)?'soft':'hard',bjv(cs),u);if(a==='Rh')a='H';if(a==='Ds')a='S';if(a==='D')a='H';}

 return `${hand} vs 딜러 ${us} → `+({
  D:soft?'딜러가 약하고 소프트라 버스트 걱정 없이 한 장만 받고 베팅을 두 배로':`한 장 받아 강한 패가 될 확률이 높아서 베팅을 두 배로${weak?' (딜러도 약함)':''}`,
  S:weak?`딜러 ${us}는 버스트 확률이 높아요(약 35~42%). 내가 위험을 지지 말고 기다리기`:t>=17?'17 이상은 더 받으면 버스트 위험이 너무 커요':'스탠드가 손실이 가장 적어요',

  P:pair&&cs[0].r===14?'A 두 장은 각각 21을 노릴 수 있는 최고의 시작이라 항상 스플릿':pair&&cv10(cs[0])===8?'16은 최악의 합이라 8 두 장으로 나눠서 다시 시작':'나눠서 각각 시작하는 게 합쳐서 치는 것보다 기대값이 높아요',
  R:'이 패는 기대 손실이 50%가 넘어서, 베팅 절반만 잃고 포기하는 게 이득이에요'}[a]||'');}

 bad(i){const P=this.P,v=this.cur[i];if(!v)return false;return [P.runs[P.H[i]],P.runs[P.V[i]]].some(r=>r.cells.some(k=>k!==i&&this.cur[k]===v)||(r.cells.every(k=>this.cur[k])&&r.cells.reduce((a,k)=>a+this.cur[k],0)!==r.sum));},
 view(){if(!this.lv)return `<div class="card m" style="line-height:1.6">검은 칸의 숫자 = 그 오른쪽(▶) 또는 아래(▼) 흰 칸들의 합이에요.<br>한 줄 안에서는 1~9를 <b>한 번씩만</b> 써요.</div>`+lvPick('CUR.go');
  const P=this.P,n=P.n,cs=Math.min(44,Math.floor((Math.min(innerWidth,420)-28-2*n)/n));const heads={};P.runs.forEach(r=>{heads[r.head]=heads[r.head]||{};heads[r.head][r.dir]=r.sum;});
  let g=`<div style="display:grid;grid-template-columns:repeat(${n},${cs}px);gap:2px;justify-content:center;margin:0 auto">`;
  for(let i=0;i<n*n;i++){if(!P.W[i]){const h=heads[i];g+=`<div style="width:${cs}px;height:${cs}px;background:#3b3f47;border-radius:4px;position:relative;${h?'background:linear-gradient(to top right,#3b3f47 49%,#777 50%,#3b3f47 51%)':''}">${h&&h.dn?`<b style="position:absolute;left:3px;bottom:2px;color:#ffd666;font-size:${cs>36?12:10}px">${h.dn}</b>`:''}${h&&h.rt?`<b style="position:absolute;right:3px;top:2px;color:#9fd1ff;font-size:${cs>36?12:10}px">${h.rt}</b>`:''}</div>`;}
   else{const v=this.cur[i];g+=`<div onclick="CUR.sel=${i};rr()" style="width:${cs}px;height:${cs}px;background:${i===this.sel?'#ffe9a8':'#fff'};border:1.5px solid ${i===this.sel?'#e0a800':'#ccc'};border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:${cs*.5}px;font-weight:900;color:${this.bad(i)?'#c62828':'var(--ink)'}">${v||''}</div>`;}}
  g+='</div>';
  let hint='';if(this.sel>=0&&!this.done){const rh=P.runs[P.H[this.sel]],rv=P.runs[P.V[this.sel]];const f=r=>{const c=kkCombos(r.cells.length,r.sum);return `${r.cells.length}칸 합 ${r.sum}: ${c.length>4?c.slice(0,4).join(', ')+' …':c.join(', ')}`;};hint=`<div class="card m" style="font-size:12.5px;line-height:1.6">💡 ▶ ${f(rh)}<br>💡 ▼ ${f(rv)}</div>`;}
  return `<div class="gst"><span>${this.lv} ${n}×${n}</span><span>⏱ <b id="clk">${fmtScore('memory',secs(this.t0))}</b></span></div>${this.done?`<div class="gok">🎉 완성! ${fmtScore('memory',secs(this.t0))}</div>`:''}${g}
   ${hint}<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px">${[1,2,3,4,5,6,7,8,9].map(d=>`<button class="btn b2" style="padding:12px 0" onclick="CUR.put(${d})">${d}</button>`).join('')}<button class="btn gr" style="padding:12px 0" onclick="CUR.put(0)">⌫</button></div>
   <button class="btn full gr" style="margin-top:8px" onclick="CUR.lv=null;rr()">난이도</button>`;}});
// ===== 🕹️ 아케이드 =====
function cvSetup(game,w,h,extra){show(`<div class="gst"><span>점수 <b id="csc">0</b></span><span>내 최고 ${(myBest(game.k)||0).toLocaleString()}</span></div><canvas id="cv" class="cv" width="${w}" height="${h}"></canvas>${extra||''}<div id="cmsg" class="m" style="text-align:center;margin-top:8px"></div>`);
 const c=$('cv');game.cv=c;game.cx=c.getContext('2d');game.alive=true;const loop=t=>{if(!game.alive||CUR!==game)return;game.tick(t);requestAnimationFrame(loop);};requestAnimationFrame(loop);
 const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [(p.clientX-r.left)*w/r.width,(p.clientY-r.top)*h/r.height];};return pos;}
const setSc=v=>{const e=$('csc');if(e)e.textContent=v.toLocaleString();};
const cmsg=t=>{const e=$('cmsg');if(e)e.innerHTML=t;};
function arcadeOver(g,sc){g.dead=true;record(g.k,sc);cmsg(`<b>게임 끝! ${sc.toLocaleString()}점</b> · <button class="btn" style="padding:5px 12px;font-size:13px" onclick="CUR.start()">다시</button>`);}
// 뱀
// 벽돌 깨기
// 플래피 칩
// 스택 쌓기
// 반응속도
G.push({k:'reaction',cat:'대전·도구',e:'⚡',n:'반응속도',d:'초록불에 터치 · 5번 평균',
 start(){this.r=[];this.st='ready';this.t=0;this.show_();},
 stop(){clearTimeout(this.to);},
 show_(){const s=this.st,bg={ready:'#3b4656',wait:'#c0392b',go:'#27ae60',done:'#2f80ed',early:'#8e44ad'}[s];
  const txt={ready:'눌러서 시작',wait:'기다려요… (초록이 되면 터치)',go:'지금!',early:'너무 빨라요! 눌러서 다시',done:''}[s];
  const avg=this.r.length?Math.round(this.r.reduce((a,b)=>a+b,0)/this.r.length):0;
  show(`<div class="gst"><span>${this.r.length}/5</span><span>내 최고 ${myBest('reaction')?myBest('reaction')+'ms':'-'}</span></div><div onpointerdown="CUR.hit()" style="height:340px;border-radius:16px;background:${bg};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;user-select:none;text-align:center">${s==='done'?`평균 ${avg}ms<div style="font-size:14px;margin-top:8px">${this.r.join(' · ')} ms</div>`:txt}${this.r.length&&s!=='done'?`<div style="font-size:14px;margin-top:8px">${this.r.join(' · ')} ms</div>`:''}</div>${s==='done'?'<button class="btn full" style="margin-top:10px" onclick="CUR.start()">다시 하기</button>':''}`);},
 hit(){const s=this.st;if(s==='ready'||s==='early'){this.st='wait';this.show_();this.to=setTimeout(()=>{this.st='go';this.t=performance.now();this.show_();},1200+R(2800));}
  else if(s==='wait'){clearTimeout(this.to);this.st='early';this.show_();}
  else if(s==='go'){this.r.push(Math.round(performance.now()-this.t));if(this.r.length>=5){this.st='done';record('reaction',Math.round(this.r.reduce((a,b)=>a+b,0)/5));}else this.st='ready';this.show_();}}});
// 두더지 잡기
// ===== 목록 · 랭킹 · 오늘의 문제 · 화면 전환 =====
G.forEach(g=>g.nm=g.n);   // 게임 안에서 this.n 을 숫자로 쓰는 경우가 있어 이름은 따로 보관
const CATS=['전체','홀덤','카드','퍼즐','대전·도구'];let CATSEL=lsGet('gcat','전체');
const RANKED=G.filter(g=>GCFG[g.k]);
const gName=k=>{const g=G.find(x=>x.k===k);return g?g.e+' '+g.nm:k;};
const lvTag=n=>{const l=(GD.lv||{})[n];return l?`<span style="font-size:11px;background:var(--blue2);color:var(--blue);border-radius:999px;padding:1px 6px;margin-left:4px;font-weight:800">Lv.${l}</span>`:'';};
let ME=null;
function loadMe(cb){if(!NICK){ME=null;cb&&cb();return;}fetch(API+'/api/game/me?nick='+encodeURIComponent(NICK),{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{ME=r.ok?r:null;if(ME)lsSet('mylv',ME.level);cb&&cb();}).catch(()=>cb&&cb());}
function meBar(){if(!NICK)return '';if(!ME)return `<div class="m" style="margin-top:6px">레벨 불러오는 중…</div>`;const p=Math.round((ME.xp-ME.prev)/Math.max(1,ME.next-ME.prev)*100);
 return `<div style="margin-top:8px"><div class="row"><b>Lv.${ME.level} ${ME.title}</b><span class="m">${ME.xp.toLocaleString()} xp · 업적 ${ME.ach.filter(a=>a[4]).length}/${ME.ach.length}</span></div>
  <div style="height:8px;background:#e6e1d4;border-radius:99px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${p}%;background:linear-gradient(90deg,#2f80ed,#6fcf97)"></div></div><div class="m" style="font-size:11px;margin-top:2px">다음 레벨까지 ${(ME.next-ME.xp).toLocaleString()} xp · 게임 기록 +10 · 최고 기록 +25 · 오늘의 문제 +50 · 업적 +30</div></div>`;}
function tileBest(g){const c=GCFG[g.k];if(!c)return '';if(c[3]){const b=myBest(g.k,'어려움')??myBest(g.k,'보통')??myBest(g.k,'쉬움');return b==null?'':'내 기록 '+fmtScore(g.k,b);}const b=myBest(g.k);return b==null?'':'내 최고 '+fmtScore(g.k,b);}
function dailyTile(){const d=kstDay(),[k]=dailyType(d);const done=lsGet('daily_done_'+d,null);
 return `<div class="card" style="cursor:pointer;border-color:var(--blue);background:var(--blue2)" onclick="location.hash='daily'"><div class="row"><b style="font-size:16px">📅 오늘의 문제 · ${gName(k)}</b><span class="m">${done?'✅ 제출함':'하루 1번'}</span></div><div class="m">모두 같은 문제 · 오늘 순위 · +50xp</div></div>`;}
function listView(){const L=G.filter(g=>!g.study&&(CATSEL==='전체'||g.cat===CATSEL));
 return `<div class="card"><div class="t" style="margin-bottom:6px">카톡 닉네임 <span class="m">(랭킹·레벨·업적·카톡방 자랑)</span></div><div style="display:flex;gap:6px"><input class="q" id="nk" value="${esc(NICK)}" placeholder="예: 구우"><button class="btn" onclick="setNick($('nk').value);loadMe(rr2)">저장</button></div>${meBar()}</div>
  ${dailyTile()}
  <div class="tabs">${CATS.map(c=>`<button class="${c===CATSEL?'on':''}" onclick="CATSEL='${c}';lsSet('gcat',CATSEL);render()">${c}</button>`).join('')}<button onclick="location.hash='rank'">🏆 랭킹·업적</button></div>
  <div class="grid">${L.map(g=>`<div class="tile" onclick="location.hash='g='+'${g.k}'"><div class="e">${g.e}</div><div class="n">${g.nm}</div><div class="b">${tileBest(g)}</div></div>`).join('')}</div>
  <div class="m" style="text-align:center;margin-top:14px">대단한 기록·희귀 업적은 봇이 카톡방에 자랑해요 🎉</div>`;}
function rr2(){if(!CUR)render0();}
// 📅 오늘의 문제
let DLIVE=null;
function dailyView(){const d=kstDay(),[k,lv]=dailyType(d);const g=G.find(x=>x.k===k);const done=lsGet('daily_done_'+d,null),started=lsGet('daily_start_'+d,0);
 const D=DLIVE&&DLIVE.d===d?DLIVE:(GD.daily&&GD.daily.d===d?GD.daily:null);const B=D?D.board:[];
 const fmt=x=>D&&D.unit==='logic'?esc(x[2]):(x[2]&&x[2]==='실패'?'실패':fmtScore(k,x[1]));
 const rule={sudoku:'스도쿠 보통 · 빨리 풀수록 높은 순위',logic:'논리 퍼즐 5문제 · 많이 맞히고 빨리 풀수록',speed50:'1 to 50 · 빠를수록',kakuro:'카쿠로 보통 · 빠를수록',codebreak:'코드 브레이커 · 적은 시도로',nutadv:'넛 우위 10문제 · 많이 맞힐수록',nerdle:'수식 맞히기 · 적은 시도로',nonogram:'노노그램 보통 · 빠를수록'}[k]||'';
 return `<div class="card" style="text-align:center"><div class="m">${d} · 모두 같은 문제 · 하루 1번</div><div style="font-size:26px;margin:6px 0">${g?g.e:''}</div><div class="t" style="font-size:19px">${g?g.nm:k}</div><div class="m">${rule}</div></div>
  ${!NICK?`<div class="card"><div class="t">닉네임을 먼저 저장해요</div><div style="display:flex;gap:6px;margin-top:6px"><input class="q" id="nk" placeholder="예: 구우"><button class="btn" onclick="setNick($('nk').value);render()">저장</button></div></div>`:''}
  ${done?`<div class="gok">✅ 오늘 제출 완료 · 내 기록 <b>${esc(done.detail||'')}</b></div>`:started?`<div class="card m">오늘 문제는 이미 시작했어요. 하루 1번이라 다시 할 수 없어요.</div>`:NICK?`<button class="btn full g" style="font-size:18px;padding:14px" onclick="dailyBegin()">도전하기 (한 번뿐이에요!)</button>`:''}
  <div class="sec">🏆 오늘 순위 ${B.length?`(${B.length}명)`:''}</div><div class="card">${B.length?B.map((x,i)=>`<div class="row"${x[0]===NICK?' style="background:var(--blue2);border-radius:8px"':''}><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(x[0])}${lvTag(x[0])}</span><span class="m">${fmt(x)}</span></div>`).join(''):'<span class="m">아직 아무도 안 풀었어요. 첫 1등이 되어보세요!</span>'}</div>
  ${DLIVE&&DLIVE.y&&DLIVE.y.board.length?`<div class="sec">어제의 TOP 3 · ${gName(DLIVE.y.game)}</div><div class="card">${DLIVE.y.board.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]} ${esc(x[0])}</span><span class="m">${esc(x[2]||String(x[1]))}</span></div>`).join('')}</div>`:''}
  <div class="m" style="text-align:center">7일 연속 참여하면 📆 개근상 업적</div>`;}
function loadDaily(){fetch(API+'/api/daily?nick='+encodeURIComponent(NICK||''),{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r.ok){DLIVE=r;if(r.mine&&!lsGet('daily_done_'+r.d,null))lsSet('daily_done_'+r.d,{score:r.mine[0],detail:r.mine[1]});if(location.hash==='#daily')show(dailyView());}}).catch(()=>{});}
// 🏆 랭킹·업적
let RTAB=lsGet('rtab','week');
function rankView(){const tabs=[['week','🏆 주간'],['today','⏰ 오늘'],['level','⭐ 레벨'],['ach','🏅 업적']];
 let h=`<div class="tabs">${tabs.map(([k,n])=>`<button class="${RTAB===k?'on':''}" onclick="RTAB='${k}';lsSet('rtab',RTAB);show(rankView());if(RTAB==='ach'||RTAB==='level')loadMe(()=>show(rankView()))">${n}</button>`).join('')}<button onclick="location.hash='daily'">📅 오늘의 문제</button></div>`;
 if(RTAB==='week'){const B=GD.boards||{};let any=false;h+='<div class="sec">이번 주 랭킹 (최근 7일)</div>';
  for(const g of RANKED){const c=GCFG[g.k];const keys=c[3]?['어려움','보통','쉬움'].map(l=>[g.k+'_'+l,l]).filter(([k])=>B[k]):(B[g.k]?[[g.k,'']]:[]);
   for(const [key,lv] of keys){any=true;h+=`<div class="card"><div class="t">${g.e} ${g.nm}${lv?' · '+lv:''}</div>${B[key].map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(x[0])}${lvTag(x[0])}</span><span class="m">${fmtScore(g.k,x[1])}</span></div>`).join('')}</div>`;}}
  if(!any)h+='<div class="card m">아직 이번 주 기록이 없어요. 첫 1위의 주인공이 되어보세요!</div>';}
 if(RTAB==='today'){const T=GD.tbest||{};const ks=Object.keys(T);h+=`<div class="sec">오늘의 최고 기록 (${GD.d||''})</div>`;
  h+=ks.length?`<div class="card">${ks.map(k=>`<div class="row"><span>${gName(k)}${T[k][2]?' · '+esc(T[k][2]):''}</span><span><b>${esc(T[k][0])}</b>${lvTag(T[k][0])} <span class="m">${fmtScore(k,T[k][1])}</span></span></div>`).join('')}</div>`:'<div class="card m">오늘은 아직 기록이 없어요</div>';}
 if(RTAB==='level'){const X=GD.xtop||[];h+=NICK?`<div class="card"><div class="t">내 레벨</div>${meBar()}</div>`:'';h+='<div class="sec">레벨 랭킹</div>';
  h+=X.length?`<div class="card">${X.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} <b>${esc(x[0])}</b> <span class="m">Lv.${x[1]} ${x[2]}</span></span><span class="m">🏅${x[4]} · ${x[3].toLocaleString()}xp</span></div>`).join('')}</div>`:'<div class="card m">아직 레벨 기록이 없어요</div>';
  h+='<div class="card m" style="font-size:12.5px;line-height:1.6">레벨 칭호: Lv.1 새싹 · 5 루키 · 10 단골 · 15 고수 · 20 달인 · 30 전설 · 50 신</div>';}
 if(RTAB==='ach'){if(!NICK)h+='<div class="card m">닉네임을 저장하면 업적이 쌓여요</div>';else if(!ME)h+='<div class="gq">불러오는 중…</div>';
  else{h+=`<div class="card"><div class="t">${esc(NICK)}</div>${meBar()}<div class="m" style="margin-top:6px">기록 남긴 게임 ${ME.played.length}/${ME.total_games}</div></div>`;
   const got=ME.ach.filter(a=>a[4]),no=ME.ach.filter(a=>!a[4]);
   h+=`<div class="sec">달성 ${got.length}/${ME.ach.length}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${[...got,...no].map(a=>`<div class="card" style="margin:0;padding:8px;${a[4]?'border-color:#e0a800;background:#fff8e1':'opacity:.5;filter:grayscale(1)'}"><div style="font-size:22px">${a[1]}</div><b style="font-size:13.5px">${a[2]}</b><div class="m" style="font-size:11.5px">${a[3]}</div>${a[4]?`<div class="m" style="font-size:10.5px">${a[4].slice(0,10)}</div>`:''}</div>`).join('')}</div>`;}}
 return h+'<div class="m" style="text-align:center;margin-top:8px">주간·오늘·레벨 랭킹은 홈이 갱신될 때(10분 안) 반영돼요</div>';}
function render0(){setTitle('🎮 뚝섬 게임 · '+G.filter(g=>!g.study).length+'종');show(listView());}
function render(){const hsh=location.hash.slice(1);if(CUR&&CUR.stop)CUR.stop();SWH=null;clearInterval(clock.iv);
 const back=$('backBtn');
 if(hsh.startsWith('g=')){const key=hsh.slice(2).split('&')[0];const g=G.find(x=>x.k===key);
  if(window.DAILY&&DAILY.k!==key)dailyEnd();
  if(g){CUR=g;const dly=window.DAILY&&DAILY.k===key;setTitle((dly?'📅 오늘의 문제 · ':'')+g.e+' '+g.nm);back.style.display=g.study?'none':'';g.start();
   if(dly){if(key==='logic')g.go('오늘');else if(DAILY.lv&&g.go)g.go(DAILY.lv);}scrollTo(0,0);return;}}
 if(window.DAILY)dailyEnd();
 CUR=null;back.style.display='none';
 if(hsh==='rank'){setTitle('🏆 랭킹·업적');back.style.display='';show(rankView());if(RTAB==='ach'||RTAB==='level')loadMe(()=>{if(location.hash==='#rank')show(rankView());});return;}
 if(hsh==='daily'){setTitle('📅 오늘의 문제');back.style.display='';show(dailyView());loadDaily();return;}
 render0();if(NICK&&!ME)loadMe(()=>{if(!CUR&&!location.hash.slice(1))render0();});}
addEventListener('hashchange',render);
if(window.top!==window.self){$('homeBtn').style.display='none';}   // 홈 안에서 열렸으면 홈 버튼 숨김 (위의 ← 뒤로로 닫기)
render();
