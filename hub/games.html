<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
</style>
</head>
<body>
<div class="top"><a id="homeBtn" href="https://metlifeguide-png.github.io/posters/hub/">← 홈</a><span class="tt" id="tt">🎮 뚝섬 게임</span><button id="backBtn" style="display:none" onclick="history.back()">목록</button></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const GD={},API="https://majority-rebuild-take.ngrok-free.dev";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),ms||1700);}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const R=n=>Math.floor(Math.random()*n),pick=a=>a[R(a.length)],shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('복사했어요')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('복사했어요');}catch(e){}a.remove();});}
let NICK=lsGet('nick2','')||(()=>{try{return localStorage.getItem('nick')||'';}catch(e){return '';}})();
function setNick(v){NICK=String(v||'').trim().slice(0,20);lsSet('nick2',NICK);try{localStorage.setItem('nick',NICK);}catch(e){}toast(NICK?'저장했어요':'닉네임을 지웠어요');}
const GCFG=(GD.games||{});
const lowerBetter=k=>!!(GCFG[k]&&GCFG[k][1]);
function fmtScore(k,v,lv){const u=(GCFG[k]||[])[2]||'pt';v=Math.round(v);
  return ({x5:v+'/5',x10:v+'/10',streak:v+'연속',pt:v.toLocaleString()+'점',chip:v.toLocaleString()+'칩',sec:Math.floor(v/60)+'분 '+String(v%60).padStart(2,'0')+'초',moves:v+'수',tries:v+'번',ms:v+'ms',win:v+'연승'})[u]||String(v);}
function myBest(k,lv){return lsGet('best_'+k+(lv?'_'+lv:''),null);}
// 기록: 이 폰 최고 기록 + (닉네임 있으면) 서버 랭킹
function record(k,score,lv){const key='best_'+k+(lv?'_'+lv:'');const b=lsGet(key,null);const better=b==null||(lowerBetter(k)?score<b:score>b);if(better)lsSet(key,score);
  if(!NICK){toast((better?'🏆 내 최고 기록! ':'')+'닉네임을 넣으면 주간 랭킹에 올라가요',2400);return;}
  fetch(API+'/api/game/record',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({nick:NICK,game:k,score,detail:lv||''})})
   .then(r=>r.json()).then(r=>{if(r&&r.ok)toast(r.best?('🏆 개인 최고 기록!'+(r.rank?` 주간 ${r.rank}위`:'')):'기록했어요');}).catch(()=>{if(better)toast('🏆 내 최고 기록! (서버 연결 안 돼서 랭킹엔 못 올렸어요)',2400);});}
// ---------- 카드 · 족보 ----------
const RK='23456789TJQKA',SU='♠♥♦♣';
const deck=()=>{const d=[];for(let r=2;r<=14;r++)for(let s=0;s<4;s++)d.push({r,s});return shuf(d);};
const rkCh=r=>r===10?'10':RK[r-2];
function cardHtml(c,sm,extra){if(!c)return `<div class="pc back${sm?' sm':''}"></div>`;const red=c.s===1||c.s===2;return `<div class="pc${sm?' sm':''}${red?' red':''}${extra?' '+extra:''}"><b>${rkCh(c.r)}</b><i>${SU[c.s]}</i></div>`;}
const cardsHtml=(cs,sm)=>`<div class="pcs">${cs.map(c=>cardHtml(c,sm)).join('')}</div>`;
const CAT=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];
function ev5(cs){const rs=cs.map(c=>c.r).sort((a,b)=>b-a);const fl=cs.every(c=>c.s===cs[0].s);const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.entries(cnt).map(([r,n])=>[n,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);const u=[...new Set(rs)];let st=0;
  if(u.length===5){if(u[0]-u[4]===4)st=u[0];else if(u[0]===14&&u[1]===5)st=5;}
  if(st&&fl)return [8,st];if(g[0][0]===4)return [7,g[0][1],g[1][1]];if(g[0][0]===3&&g[1][0]===2)return [6,g[0][1],g[1][1]];
  if(fl)return [5,...rs];if(st)return [4,st];if(g[0][0]===3)return [3,g[0][1],...g.slice(1).map(x=>x[1])];
  if(g[0][0]===2&&g[1][0]===2)return [2,g[0][1],g[1][1],g[2][1]];if(g[0][0]===2)return [1,g[0][1],...g.slice(1).map(x=>x[1])];return [0,...rs];}
const cmpH=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d;}return 0;};
function best(cs){if(cs.length<=5)return ev5(cs);let bst=null;const n=cs.length;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){const f=cs.filter((_,i)=>i!==a&&i!==b);if(n===6){}const h=n===7?ev5(f):null;if(h&&(!bst||cmpH(h,bst)>0))bst=h;}
  if(n===6){for(let a=0;a<6;a++){const h=ev5(cs.filter((_,i)=>i!==a));if(!bst||cmpH(h,bst)>0)bst=h;}}return bst;}
const catName=h=>h[0]===8&&h[1]===14?'로열 플러시':CAT[h[0]];
// ---------- 화면 전환 ----------
let CUR=null,ST=null;
function stage(){return $('app');}
function setTitle(t){$('tt').textContent=t;}
function show(h){stage().innerHTML=h;}
function rr(){if(CUR&&CUR.view)show(CUR.view());}
const POS9=["UTG","UTG+1","MP","LJ","HJ","CO","BTN","SB","BB"];
function clsCards(cl,seed){let h=seed==null?R(1e9):seed;const s1=h%4;let s2=s1;if(!cl.endsWith('s')){const o=[0,1,2,3].filter(x=>x!==s1);s2=o[Math.floor(h/4)%3];}
  const rv=ch=>RK.indexOf(ch)+2;return [{r:rv(cl[0]),s:s1},{r:rv(cl[1]),s:s2}];}
function lvPick(fn,extra){return `<div class="gq">난이도</div><div style="display:grid;gap:8px">${['쉬움','보통','어려움'].map(l=>`<button class="btn ${l==='어려움'?'':'b2'}" onclick="${fn}('${l}')">${l}</button>`).join('')}${extra||''}</div>`;}
function overHtml(big,sub,again){return `<div class="gbig">${big}</div><div class="card m" style="text-align:center">${sub}</div><button class="btn full" onclick="${again||'CUR.start()'}">다시 하기</button>`;}
function timer(sec,onEnd){const t0=Date.now();const iv=setInterval(()=>{const left=Math.max(0,sec-(Date.now()-t0)/1000);const e=$('tleft');if(e)e.textContent=Math.ceil(left)+'초';if(left<=0){clearInterval(iv);onEnd();}},200);return ()=>clearInterval(iv);}
const G=[];
// ===== 🃏 홀덤 =====
// 1) 오늘의 챌린지
G.push({k:'challenge',cat:'홀덤',e:'🃏',n:'오늘의 챌린지',d:'하루 5문제 · 모두 같은 문제',
 start(){const Q=GD.challenge||[];if(!Q.length){show('<div class="card">오늘 문제를 불러오지 못했어요</div>');return;}this.s=lsGet('ch_'+GD.d,{i:0,res:[]});rr();},
 view(){const Q=GD.challenge,s=this.s;
  if(s.i>=Q.length){const sc=s.res.filter(x=>x).length,grid=s.res.map(x=>x?'🟩':'🟥').join('');const share=`🃏 뚝섬 챌린지 ${+GD.d.slice(5,7)}/${+GD.d.slice(8,10)} ${sc}/5 ${grid}`;
   const T=(GD.today||[]);return `<div class="gbig">${sc}/5</div><div style="text-align:center;font-size:26px;letter-spacing:2px;margin-bottom:10px">${grid}</div>
    <button class="btn full" onclick="copy('${share}')">결과 복사 → 카톡에 붙여넣기</button><div class="sec">오늘 푼 사람</div><div class="card">${T.length?T.map((x,i)=>`<div class="row"><span>${i+1}. ${esc(x[0])}</span><span class="m">${x[1]}/5</span></div>`).join(''):'<div class="m">아직 없어요</div>'}</div>`;}
  const q=Q[s.i];const top=`<div class="gst"><span>${s.i+1} / ${Q.length}</span><span>${s.res.map(x=>x?'🟩':'🟥').join('')}</span></div>`;
  if(q.t==='pf'){const cs=q.cards.map(x=>({r:RK.indexOf(x[0])+2,s:SU.indexOf(x[1])}));
   return top+`<div class="gq">9인 토너먼트 · 앤티 있음<br>내 스택 <b>${q.bb}BB</b> · 위치 <b>${q.pos}</b> · 앞은 모두 폴드</div>${cardsHtml(cs)}<div class="g2b"><button class="btn" onclick="CUR.ans('올인')">올인</button><button class="btn b2" onclick="CUR.ans('폴드')">폴드</button></div>`;}
  return top+`<div class="gq">프리플랍 올인! 누가 더 유리할까?</div><div class="vs"><div>${cardsHtml(clsCards(q.a,7))}<b>${q.a}</b></div><span>VS</span><div>${cardsHtml(clsCards(q.b,11))}<b>${q.b}</b></div></div>
   <div class="g2b"><button class="btn" onclick="CUR.ans('a')">${q.a}</button><button class="btn b2" onclick="CUR.ans('b')">${q.b}</button></div>`;},
 ans(a){const q=GD.challenge[this.s.i];let ok,msg;if(q.t==='pf'){ok=a===q.ans;msg=`정답 ${q.ans} · ${q.pos} ${q.bb}BB는 약 ${q.pct}%로 올인`;}else{const fav=q.eq>=50?'a':'b';ok=a===fav;msg=`${q.a} ${q.eq}% vs ${q.b} ${100-q.eq}%`;}
  this.s.res.push(ok);this.s.i++;lsSet('ch_'+GD.d,this.s);toast((ok?'✅ ':'❌ ')+msg,2200);if(this.s.i>=GD.challenge.length)record('challenge',this.s.res.filter(x=>x).length);rr();}});
// 2) 푸시/폴드 무한
const ORD=(GD.order||'').split(' ');
G.push({k:'pushfold',cat:'홀덤',e:'🔥',n:'푸시/폴드',d:'틀릴 때까지 · 연속 정답',
 nq(){const bb=pick([6,8,10,12,15]),o=2+R(6),rg=(GD.ranges||{})[bb+'_'+o]||'';const cut=[...rg].filter(c=>c==='1').length;const lo=Math.max(0,cut-14),hi=Math.min(ORD.length-1,cut+13);const idx=lo+R(hi-lo+1);const cl=ORD[idx];
  return {bb,o,cl,cards:clsCards(cl),ans:rg[idx]==='1'?'올인':'폴드',pct:Math.round(cut/169*100)};},
 start(){if(!GD.ranges){show('<div class="card">범위표를 불러오지 못했어요</div>');return;}this.n=0;this.over=false;this.msg='';this.q=this.nq();rr();},
 view(){const q=this.q;const hd=`<div class="gst"><span>연속 <b>${this.n}</b></span><span>내 최고 ${myBest('pushfold')||0}</span></div>`;
  if(this.over)return hd+overHtml(this.n+'연속',esc(this.msg));
  return hd+(this.msg?`<div class="gok">${esc(this.msg)}</div>`:'')+`<div class="gq">9인 · 앤티 있음 · 앞은 모두 폴드<br>내 스택 <b>${q.bb}BB</b> · 위치 <b>${POS9[q.o]}</b></div>${cardsHtml(q.cards)}
   <div class="g2b"><button class="btn" onclick="CUR.ans('올인')">올인</button><button class="btn b2" onclick="CUR.ans('폴드')">폴드</button></div>`;},
 ans(a){const q=this.q,why=`${POS9[q.o]} ${q.bb}BB 올인 범위 약 ${q.pct}% · ${q.cl} → ${q.ans}`;if(a===q.ans){this.n++;this.msg='✅ '+why;this.q=this.nq();}else{this.over=true;this.msg='❌ '+why;if(this.n>0)record('pushfold',this.n);}rr();}});
// 3) 승률 맞히기
G.push({k:'equity',cat:'홀덤',e:'🎯',n:'승률 맞히기',d:'AKo vs 77 몇 %? · 10판',
 start(){const L=GD.eqs||[];if(!L.length){show('<div class="card">문제를 불러오지 못했어요</div>');return;}this.L=shuf(L).slice(0,10);this.i=0;this.pts=0;this.g=50;this.last='';rr();},
 view(){if(this.i>=10)return overHtml(this.pts+'점','10판 만점 100점 · 내 최고 '+(myBest('equity')||this.pts)+'점');const [a,b]=this.L[this.i];
  return `<div class="gst"><span>${this.i+1} / 10</span><span>점수 <b>${this.pts}</b></span></div>${this.last?`<div class="gok">${this.last}</div>`:''}
   <div class="gq">프리플랍 올인! <b>${a}</b>가 이길 확률은?</div><div class="vs"><div>${cardsHtml(clsCards(a,3))}<b>${a}</b></div><span>VS</span><div>${cardsHtml(clsCards(b,5))}<b>${b}</b></div></div>
   <div class="gbig" id="eqv" style="font-size:34px">${this.g}%</div><input type="range" min="0" max="100" value="${this.g}" style="width:100%" oninput="CUR.g=+this.value;$('eqv').textContent=this.value+'%'">
   <button class="btn full" style="margin-top:10px" onclick="CUR.ans()">확인</button>`;},
 ans(){const [a,b,e]=this.L[this.i];const err=Math.abs(this.g-e),p=Math.max(0,10-Math.round(err/2));this.pts+=p;this.last=`${a} 실제 ${e}% (내 답 ${this.g}%) → +${p}점`;this.i++;this.g=50;if(this.i>=10)record('equity',this.pts);rr();}});
// 4) 족보 맞히기 (60초)
G.push({k:'handrank',cat:'홀덤',e:'🏅',n:'족보 맞히기',d:'7장 중 최고 족보 · 60초',
 start(){this.sc=0;this.over=false;this.nq();if(this.stopT)this.stopT();this.stopT=timer(60,()=>{this.over=true;record('handrank',this.sc);rr();});rr();},
 stop(){if(this.stopT)this.stopT();},
 nq(){const d=deck();this.h=d.slice(0,2);this.b=d.slice(2,7);const hv=best([...this.h,...this.b]);this.a=catName(hv);
  const pool=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'].filter(x=>x!==this.a);const ci=CAT.indexOf(this.a);

G.push({k:'flappy',cat:'아케이드',e:'🪙',n:'플래피 칩',d:'톡톡 눌러서 칩 띄우기',
 start(){cvSetup(this,320,460);this.y=200;this.v=0;this.p=[];this.sc=0;this.dead=false;this.f=0;this.go=false;const tap=e=>{e.preventDefault();if(this.dead)return;this.go=true;this.v=-6.2;};
  this.cv.addEventListener('touchstart',tap,{passive:false});this.cv.addEventListener('mousedown',tap);cmsg('화면을 눌러서 시작');},
 stop(){this.alive=false;},
 tick(){const x=this.cx;if(this.go&&!this.dead){this.v+=.38;this.y+=this.v;this.f++;if(this.f%90===0){const gap=135,top=60+R(220);this.p.push({x:330,t:top,g:gap,s:0});}
   this.p.forEach(p=>{p.x-=2.4;if(!p.s&&p.x<60){p.s=1;this.sc++;setSc(this.sc);}});this.p=this.p.filter(p=>p.x>-60);
   if(this.y>445||this.y<0||this.p.some(p=>p.x<88&&p.x+52>52&&(this.y-14<p.t||this.y+14>p.t+p.g)))return arcadeOver(this,this.sc);}
  x.fillStyle='#14324f';x.fillRect(0,0,320,460);x.fillStyle='#3a9d3f';this.p.forEach(p=>{x.fillRect(p.x,0,52,p.t);x.fillRect(p.x,p.t+p.g,52,460);});
  x.fillStyle='#e8a33d';x.beginPath();x.arc(70,this.y,14,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.setLineDash([4,4]);x.beginPath();x.arc(70,this.y,9,0,7);x.stroke();x.setLineDash([]);}});
// 스택 쌓기
G.push({k:'stack',cat:'아케이드',e:'🏗️',n:'스택 쌓기',d:'타이밍 맞춰 블록 쌓기',
 start(){cvSetup(this,320,460);this.st=[{x:80,w:160}];this.cur={x:0,w:160,d:1};this.sp=2.2;this.sc=0;this.dead=false;const tap=e=>{e.preventDefault();this.drop();};this.cv.addEventListener('touchstart',tap,{passive:false});this.cv.addEventListener('mousedown',tap);cmsg('눌러서 블록 내려놓기');},
 stop(){this.alive=false;},
 drop(){if(this.dead)return;const top=this.st[this.st.length-1],c=this.cur;const l=Math.max(top.x,c.x),r=Math.min(top.x+top.w,c.x+c.w);if(r<=l)return arcadeOver(this,this.sc);
  this.st.push({x:l,w:r-l});this.sc++;setSc(this.sc);this.cur={x:this.sc%2?320-(r-l):0,w:r-l,d:this.sc%2?-1:1};this.sp=Math.min(6,this.sp+.15);},
 tick(){const x=this.cx;if(!this.dead){this.cur.x+=this.cur.d*this.sp;if(this.cur.x<0||this.cur.x+this.cur.w>320)this.cur.d*=-1;}
  x.fillStyle='#14324f';x.fillRect(0,0,320,460);const base=Math.max(0,this.st.length-14);const H=24;
  this.st.slice(base).forEach((b,i)=>{x.fillStyle=`hsl(${(base+i)*18},65%,58%)`;x.fillRect(b.x,440-i*H,b.w,H-2);});
  if(!this.dead){const i=this.st.length-base;x.fillStyle=`hsl(${this.st.length*18},65%,58%)`;x.fillRect(this.cur.x,440-i*H,this.cur.w,H-2);}}});
// 반응속도
G.push({k:'reaction',cat:'아케이드',e:'⚡',n:'반응속도',d:'초록불에 터치 · 5번 평균',
 start(){this.r=[];this.st='ready';this.t=0;this.show_();},
 stop(){clearTimeout(this.to);},
 show_(){const s=this.st,bg={ready:'#3b4656',wait:'#c0392b',go:'#27ae60',done:'#2f80ed',early:'#8e44ad'}[s];
  const txt={ready:'눌러서 시작',wait:'기다려요… (초록이 되면 터치)',go:'지금!',early:'너무 빨라요! 눌러서 다시',done:''}[s];
  const avg=this.r.length?Math.round(this.r.reduce((a,b)=>a+b,0)/this.r.length):0;
  show(`<div class="gst"><span>${this.r.length}/5</span><span>내 최고 ${myBest('reaction')?myBest('reaction')+'ms':'-'}</span></div><div onpointerdown="CUR.hit()" style="height:340px;border-radius:16px;background:${bg};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;user-select:none;text-align:center">${s==='done'?`평균 ${avg}ms<div style="font-size:14px;margin-top:8px">${this.r.join(' · ')} ms</div>`:txt}${this.r.length&&s!=='done'?`<div style="font-size:14px;margin-top:8px">${this.r.join(' · ')} ms</div>`:''}</div>${s==='done'?'<button class="btn full" style="margin-top:10px" onclick="CUR.start()">다시 하기</button>':''}`);},
 hit(){const s=this.st;if(s==='ready'||s==='early'){this.st='wait';this.show_();this.to=setTimeout(()=>{this.st='go';this.t=performance.now();this.show_();},1200+R(2800));}
  else if(s==='wait'){clearTimeout(this.to);this.st='early';this.show_();}
  else if(s==='go'){this.r.push(Math.round(performance.now()-this.t));if(this.r.length>=5){this.st='done';record('reaction',Math.round(this.r.reduce((a,b)=>a+b,0)/5));}else this.st='ready';this.show_();}}});
// 두더지 잡기
G.push({k:'mole',cat:'아케이드',e:'🐹',n:'두더지 잡기',d:'30초 동안 최대한 많이',
 start(){this.sc=0;this.on=-1;this.bomb=-1;this.over=false;this.go=false;this.v();},
 stop(){clearInterval(this.iv);if(this.stopT)this.stopT();},
 begin(){this.go=true;this.stopT=timer(30,()=>{this.over=true;clearInterval(this.iv);record('mole',this.sc);this.v();});this.iv=setInterval(()=>{this.on=R(9);this.bomb=Math.random()<.18?(this.on+1+R(8))%9:-1;this.v();},Math.max(450,800));this.v();},
 hit(i){if(!this.go||this.over)return;if(i===this.on){this.sc+=10;this.on=-1;}else if(i===this.bomb){this.sc=Math.max(0,this.sc-20);this.bomb=-1;toast('💣 -20',500);}this.v();},
 v(){if(this.over){show(overHtml(this.sc+'점','30초 결과 · 내 최고 '+(myBest('mole')||this.sc)+'점'));return;}
  show(`<div class="gst"><span>⏱ <b id="tleft">30초</b></span><span>점수 <b>${this.sc}</b></span></div><div class="board" style="grid-template-columns:repeat(3,1fr);max-width:320px">${[...Array(9).keys()].map(i=>`<div onpointerdown="CUR.hit(${i})" style="aspect-ratio:1;border-radius:50%;background:#7a5230;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:inset 0 8px 0 rgba(0,0,0,.3)">${i===this.on?'🐹':i===this.bomb?'💣':''}</div>`).join('')}</div>
   ${this.go?'<div class="m" style="text-align:center;margin-top:8px">🐹 +10 · 💣 -20</div>':'<button class="btn full" style="margin-top:12px" onclick="CUR.begin()">시작!</button>'}`);}});
// ===== 목록 · 랭킹 · 화면 전환 =====
const CATS=['전체','홀덤','카드','퍼즐','아케이드','대전'];let CATSEL=lsGet('gcat','전체');
const RANKED=G.filter(g=>GCFG[g.k]);
function tileBest(g){const c=GCFG[g.k];if(!c)return '';if(c[3]){const b=myBest(g.k,'어려움')??myBest(g.k,'보통')??myBest(g.k,'쉬움');return b==null?'':'내 기록 '+fmtScore(g.k,b);}const b=myBest(g.k);return b==null?'':'내 최고 '+fmtScore(g.k,b);}
function listView(){const L=G.filter(g=>CATSEL==='전체'||g.cat===CATSEL);
 return `<div class="card"><div class="t" style="margin-bottom:6px">카톡 닉네임 <span class="m">(주간 랭킹·카톡방 자랑용)</span></div><div style="display:flex;gap:6px"><input class="q" id="nk" value="${esc(NICK)}" placeholder="예: 구우"><button class="btn" onclick="setNick($('nk').value)">저장</button></div></div>
  <div class="tabs">${CATS.map(c=>`<button class="${c===CATSEL?'on':''}" onclick="CATSEL='${c}';lsSet('gcat',CATSEL);render()">${c}</button>`).join('')}<button onclick="location.hash='rank'">🏆 랭킹</button></div>
  <div class="grid">${L.map(g=>`<div class="tile" onclick="location.hash='g='+'${g.k}'"><div class="e">${g.e}</div><div class="n">${g.n}</div><div class="b">${tileBest(g)}</div></div>`).join('')}</div>
  <div class="m" style="text-align:center;margin-top:14px">대단한 기록(챌린지 만점·주간 1위 등)은 봇이 카톡방에 자랑해요 🎉</div>`;}
function rankView(){const B=GD.boards||{};let h='<div class="sec">🏆 이번 주 랭킹 (최근 7일)</div>';let any=false;
 for(const g of RANKED){const c=GCFG[g.k];const keys=c[3]?['어려움','보통','쉬움'].map(l=>[g.k+'_'+l,l]).filter(([k])=>B[k]):(B[g.k]?[[g.k,'']]:[]);
  for(const [key,lv] of keys){any=true;h+=`<div class="card"><div class="t">${g.e} ${g.n}${lv?' · '+lv:''}</div>${B[key].map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(x[0])}</span><span class="m">${fmtScore(g.k,x[1])}</span></div>`).join('')}</div>`;}}
 if(!any)h+='<div class="card m">아직 이번 주 기록이 없어요. 첫 1위의 주인공이 되어보세요!</div>';
 return h+'<div class="m" style="text-align:center">랭킹은 홈이 갱신될 때(10분 안) 반영돼요</div>';}
function render(){const hsh=location.hash.slice(1);if(CUR&&CUR.stop)CUR.stop();SWH=null;clearInterval(clock.iv);
 const back=$('backBtn');
 if(hsh.startsWith('g=')){const g=G.find(x=>x.k===hsh.slice(2));if(g){CUR=g;setTitle(g.e+' '+g.n);back.style.display='';g.start();scrollTo(0,0);return;}}
 CUR=null;back.style.display='none';
 if(hsh==='rank'){setTitle('🏆 게임 랭킹');back.style.display='';show(rankView());return;}
 setTitle('🎮 뚝섬 게임 · '+G.length+'종');show(listView());}
addEventListener('hashchange',render);
if(window.top!==window.self){$('homeBtn').style.display='none';}   // 홈 안에서 열렸으면 홈 버튼 숨김 (위의 ← 뒤로로 닫기)
render();
</script>
