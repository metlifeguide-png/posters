<!doctype html>
<html lang="ko">
<head>
<!--split-v1-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
/* 🖥 [10/16] PC(마우스) 게임 화면 확대: 게임 칸 1.35배 · 윗줄 1.2배 (모바일·터치 기기는 그대로 · 되돌리려면 이 두 줄만 지우기) */
@media(min-width:820px) and (pointer:fine){.wrap{zoom:1.35}.top{zoom:1.2}}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
@keyframes cfblink{50%{opacity:.35}}@keyframes pgin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}#app{animation:pgin .22s ease-out}
.lvb{display:inline-block;letter-spacing:-2px;margin-right:5px;vertical-align:-1px;white-space:nowrap}
.lvb.t3{filter:drop-shadow(0 0 3px #ffd54a)}
.lvb.t4{filter:drop-shadow(0 0 4px #4fc3f7) drop-shadow(0 0 2px #ffd54a)}
.lvb.t5{filter:drop-shadow(0 0 5px #ffb300) drop-shadow(0 0 3px #ff7043);animation:lvbs 2.4s ease-in-out infinite}
.lvb.t6{filter:drop-shadow(0 0 6px #ff4081) drop-shadow(0 0 4px #ffd54a);animation:lvbs 1.4s ease-in-out infinite}
.lvb.t7{filter:drop-shadow(0 0 7px #7c4dff) drop-shadow(0 0 4px #ff4081);animation:lvbs 1.1s ease-in-out infinite}
.lvb.t8{filter:drop-shadow(0 0 9px #00e5ff) drop-shadow(0 0 5px #7c4dff) drop-shadow(0 0 3px #ffd54a);animation:lvbs .9s ease-in-out infinite}
#icontip{position:absolute;z-index:9999;display:none;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:600}
.crn{display:inline-block;letter-spacing:-1px;margin-right:4px;white-space:nowrap}
@keyframes lvbs{50%{transform:scale(1.14);filter:brightness(1.35) drop-shadow(0 0 8px #ffd54a)}}
.lvnm5{font-weight:900;background:linear-gradient(90deg,#c98a10,#f6c344,#c98a10);-webkit-background-clip:text;background-clip:text;color:transparent}

</style>
</head>

    const m=mask(shape,w,h);let cells=[];m.forEach((v,i)=>{if(v)cells.push(i);});
    if(cells.length%2){ // 홀수면 가운데에서 가장 먼 칸 하나 빼기
      const cx=(w-1)/2,cy=(h-1)/2;let far=0,fd=-1;cells.forEach((p,k)=>{const d=Math.abs(p%w-cx)+Math.abs((p/w|0)-cy);if(d>fd){fd=d;far=k;}});cells.splice(far,1);}
    const pairs=cells.length/2,kinds=Math.min(SYM.length,Math.max(4,Math.ceil(pairs/2))),order=shuf2([...SYM.keys()]).slice(0,kinds);
    const vals=[];for(let i=0;i<pairs;i++){const v=order[i%kinds];vals.push(v,v);}
    const B=Array(w*h).fill(null),sv=shuf2(vals);cells.forEach((p,i)=>B[p]={v:sv[i]});
    const st={w,h,B,shape};
    for(let tries=0;tries<30&&!pairsOf(st).length;tries++)reshuffle(st);
    if(bomb){ // 폭탄은 같은 그림 한 쌍에 붙임 (짝이 깨지지 않게)
      const used=new Set();for(let k=0;k<bomb;k++){const v=shuf2([...new Set(cells.map(p=>B[p].v))]).find(x=>!used.has(x));if(v==null)break;used.add(v);
        cells.filter(p=>B[p].v===v).slice(0,2).forEach(p=>B[p].bomb=1);}}

  function reshuffle(st){

  // ---------- 길 찾기 (꺾기 2번 이하, 판 바깥 한 칸 허용) ----------
  function findPath(st,a,b){
    const {w,h,B}=st;if(a===b||!B[a]||!B[b])return null;
    const ax=a%w,ay=a/w|0,bx=b%w,by=b/w|0;
    const free=(x,y)=>{if(x<-1||y<-1||x>w||y>h)return false;if(x<0||y<0||x>=w||y>=h)return true;const p=y*w+x;return p===b||!B[p];};
    const nodes=[{x:ax,y:ay,p:-1}],best=new Map([[ay*(w+2)+ax,-1]]);let fr=[0];
    for(let t=0;t<=2;t++){const nx=[];
      for(const ni of fr){const n=nodes[ni];
        for(const [dx,dy] of D4){let x=n.x+dx,y=n.y+dy;
          while(free(x,y)){
            if(x===bx&&y===by){const pts=[[x,y]];let c=ni;while(c>=0){pts.push([nodes[c].x,nodes[c].y]);c=nodes[c].p;}return pts.reverse();}
            const k=(y+1)*(w+2)+(x+1);if(!best.has(k)||best.get(k)>t){best.set(k,t);nodes.push({x,y,p:ni});nx.push(nodes.length-1);}
            x+=dx;y+=dy;}}}
      fr=nx;}
    return null;
  }
  function pairsOf(st){

    const out=[];for(const k in by){const a=by[k];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(findPath(st,a[i],a[j]))out.push([a[i],a[j]]);}
    return out;
  }

@keyframes schint{50%{transform:scale(1.15);box-shadow:0 0 0 3px #2f80ed}}`;
    document.head.appendChild(s);
  }
  const stars=()=>lsGet('sc_star',{});
  const opened=()=>Math.max(1,lsGet('sc_open',1));

  G.push({k:'sichuan',cat:'퍼즐',e:'🀄',n:'사천성',d:'같은 그림을 2번 이하로 꺾어 연결 · 클래식·타임어택·12스테이지',
    start(){addStyle();this.stop();this.mode=lsGet('sc_mode','클래식');this.lv=null;this.stg=null;this.over=0;rr();},

    // 판 시작: 클래식/타임어택은 go(난이도), 스테이지는 goStage(n)
    go(lv){const C=LVC[lv];const shape=pick(C.shapes);const ta=this.mode==='타임어택';
      this.begin(build(shape,C.w,C.h,0,ta?(lv==='쉬움'?1:2):0),{lv,limit:ta?TA_TIME[lv]:0,hint:ta?3:99,shuf:ta?2:99,title:`${lv} · ${SHAPE_NAME[shape]}`});},
    goStage(n){if(n>opened())return;const S=STAGES[n-1];const st=build(S.s,S.w,S.h,S.lock||0,S.bomb||0);

    begin(st,o){this.stop();Object.assign(this,{st,lv:o.lv||null,stg:o.stg||null,limit:o.limit,hint:o.hint,shuf:o.shuf,title:o.title,

    tap(i){if(this.over)return;const t=this.st.B[i];if(!t)return;
      if(t.lock){this.msg='🔒 잠긴 패 · 옆 패를 먼저 없애면 풀려요';rr();return;}
      if(this.sel<0||this.sel===i){this.sel=this.sel===i?-1:i;rr();return;}

      const p=findPath(this.st,a,i);

    hit(a,b,p){const B=this.st.B,bomb=B[a].bomb;B[a]=null;B[b]=null;this.sel=-1;this.hl=null;
      const t=nowS();this.combo=t-this.lastHit<3000?this.combo+1:1;this.lastHit=t;this.bestCombo=Math.max(this.bestCombo,this.combo);

        this.score+=200;if(this.limit)this.pTot+=5000;this.msg='💣 폭탄! 한 쌍 더 제거'+(this.limit?' · +5초':'');}
      this.showLine(p);

    unlockNear(p){const {w,h,B}=this.st,x=p%w,y=p/w|0;
      for(const [dx,dy] of D4){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<w&&Y<h&&B[Y*w+X]&&B[Y*w+X].lock){delete B[Y*w+X].lock;this.msg+=' 🔓';}}},
    // 더 이을 수 있는 짝이 없으면: 잠금을 풀고, 그래도 없으면 무료 자동 셔플

 const g=abarGap(),side=Math.min(g.l,g.r),rw=Math.min(200,Math.floor(side-28));
 const useRail=ok&&!ABAR.inF&&!ABAR.sclosed&&ABAR.S.length&&rw>=150;
 // ── PC 좌우 세로 배너
 for(const k of ['l','r']){const id='abrail'+k;let el=document.getElementById(id);
  if(!useRail||(k==='l'&&ABAR.S.length<2)){if(el)el.style.display='none';continue;}   // 광고가 1개면 오른쪽에만
  if(!ABAR.s)ABAR.s=[abarPick(ABAR.S)];if(ABAR.S.length>1&&!ABAR.s[1])ABAR.s[1]=abarPick(ABAR.S,ABAR.s[0]);
  const a=k==='r'?ABAR.s[0]:ABAR.s[1];if(!a){if(el)el.style.display='none';continue;}

function dailyView(){const d=kstDay(),[k,lv]=dailyType(d);const g=G.find(x=>x.k===k);const done=lsGet('daily_done_'+d,null),started=lsGet('daily_start_'+d,0);
 const D=DLIVE&&DLIVE.d===d?DLIVE:(GD.daily&&GD.daily.d===d?GD.daily:null);const B=D?D.board:[];
 const fmt=x=>D&&D.unit==='logic'?esc(x[2]):(x[2]&&x[2]==='실패'?'실패':fmtScore(k,x[1]));
 const rule={sudoku:'스도쿠 보통 · 빨리 풀수록 높은 순위',logic:'논리 퍼즐 5문제 · 많이 맞히고 빨리 풀수록',speed50:'1 to 50 · 빠를수록',kakuro:'카쿠로 보통 · 빠를수록',codebreak:'코드 브레이커 · 적은 시도로',nutadv:'넛 우위 · 틀릴 때까지 연속 정답',nerdle:'수식 맞히기 · 적은 시도로',nonogram:'노노그램 보통 · 빠를수록'}[k]||'';
 return `<div class="card" style="text-align:center"><div class="m">${d} · 모두 같은 문제 · 하루 1번</div><div style="font-size:26px;margin:6px 0">${g?g.e:''}</div><div class="t" style="font-size:19px">${g?g.nm:k}</div><div class="m">${rule}</div></div>
  ${!NICK?`<div class="card"><div class="t">닉네임을 먼저 저장해요</div><div style="display:flex;gap:6px;margin-top:6px"><input class="q" id="nk" placeholder="예: 구우"><button class="btn" onclick="setNick($('nk').value);render()">저장</button></div></div>`:''}
  ${done?`<div class="gok">✅ 오늘 제출 완료 · 내 기록 <b>${esc(done.detail||'')}</b></div>`:started?`<div class="card m">오늘 문제는 이미 시작했어요. 하루 1번이라 다시 할 수 없어요.</div>`:NICK?`<button class="btn full g" style="font-size:18px;padding:14px" onclick="dailyBegin()">도전하기 (한 번뿐이에요!)</button>`:''}
  <div class="sec">🏆 오늘 순위 ${B.length?`(${B.length}명)`:''}</div><div class="card">${B.length?B.map((x,i)=>`<div class="row"${x[0]===NICK?' style="background:var(--blue2);border-radius:8px"':''}><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvIco(x[0])}${esc(x[0])}${lvTag(x[0])}</span><span class="m">${fmt(x)}</span></div>`).join(''):'<span class="m">아직 아무도 안 풀었어요. 첫 1등이 되어보세요!</span>'}</div>
  ${DLIVE&&DLIVE.y&&DLIVE.y.board.length?`<div class="sec">어제의 TOP 3 · ${gName(DLIVE.y.game)}</div><div class="card">${DLIVE.y.board.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]} ${esc(x[0])}</span><span class="m">${esc(x[2]||String(x[1]))}</span></div>`).join('')}</div>`:''}
  <div class="m" style="text-align:center">7일 연속 참여하면 📆 개근상 업적</div>`;}
function loadDaily(){fetch(API+'/api/daily?nick='+encodeURIComponent(NICK||''),{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r.ok){DLIVE=r;if(r.mine&&!lsGet('daily_done_'+r.d,null))lsSet('daily_done_'+r.d,{score:r.mine[0],detail:r.mine[1]});if(location.hash==='#daily')show(dailyView());}}).catch(()=>{});}
// 🏆 랭킹·업적
let RTAB=lsGet('rtab','week');
// 💡 랭킹은 서버에서 바로 받아와요 (페이지에 들어 있는 랭킹은 홈 갱신 때만 바뀜)
function loadRank(cb){if(!API){cb&&cb();return;}loadCrowns(()=>{if(location.hash==='#rank')show(rankView());});fetch(API+'/api/game/rankdata',{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r&&r.ok){['boards','tbest','xtop','lv','daily'].forEach(k=>{if(r[k]!=null)GD[k]=r[k];});if(r.d)GD.d=r.d;}cb&&cb();}).catch(()=>cb&&cb());}
function rankView(){const tabs=[['week','🏆 주간'],['today','⏰ 오늘'],['level','⭐ 레벨'],['ach','🏅 업적'],['crown','👑 왕관']];
 let h=`<div class="tabs">${tabs.map(([k,n])=>`<button class="${RTAB===k?'on':''}" onclick="RTAB='${k}';lsSet('rtab',RTAB);show(rankView());if(RTAB==='ach'||RTAB==='level')loadMe(()=>show(rankView()));if(RTAB==='crown')loadCrowns(()=>show(rankView()))">${n}</button>`).join('')}</div>`;
 if(RTAB==='week'){const B=GD.boards||{};let any=false;h+='<div class="sec">이번 주 랭킹 (최근 7일)</div><div class="m" style="font-size:12px;margin:-4px 0 8px">난이도가 있는 게임은 어려움 이상(슬라이딩 퍼즐은 6×6 이상) 기록만 순위에 반영돼요</div>';
  for(const g of RANKED){const c=GCFG[g.k];const keys=c[3]?(c[4]||['쉬움','보통','어려움']).slice().reverse().map(l=>[g.k+'_'+l,l]).filter(([k])=>B[k]):(B[g.k]?[[g.k,'']]:[]);
   for(const [key,lv] of keys){any=true;h+=`<div class="card"><div class="t">${g.e} ${g.nm}${lv?' · '+lv:''}</div>${B[key].map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvIco(x[0])}${esc(x[0])}${lvTag(x[0])}</span><span class="m">${fmtScore(g.k,x[1])}</span></div>`).join('')}</div>`;}}
  if(!any)h+='<div class="card m">아직 이번 주 기록이 없어요. 첫 1위의 주인공이 되어보세요!</div>';}
 if(RTAB==='today'){const T=GD.tbest||{};const ks=Object.keys(T);h+=`<div class="sec">오늘의 최고 기록 (${GD.d||''})</div>`;
  h+=ks.length?`<div class="card">${ks.map(k=>`<div class="row"><span>${gName(k)}${T[k][2]?' · '+esc(T[k][2]):''}</span><span>${lvIco(T[k][0])}<b>${esc(T[k][0])}</b>${lvTag(T[k][0])} <span class="m">${fmtScore(k,T[k][1])}</span></span></div>`).join('')}</div>`:'<div class="card m">오늘은 아직 기록이 없어요</div>';}
 if(RTAB==='level'){const X=GD.xtop||[];h+=NICK?`<div class="card"><div class="t">내 레벨</div>${meBar()}</div>`:'';h+='<div class="sec">레벨 랭킹</div>';
  h+=X.length?`<div class="card">${X.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvBadge(x[1])}<b>${esc(x[0])}</b> <span class="m">Lv.${x[1]} ${x[2]}</span></span><span class="m">🏅${x[4]} · ${x[3].toLocaleString()}xp</span></div>`).join('')}</div>`:'<div class="card m">아직 레벨 기록이 없어요</div>';
  h+=`<div class="card" style="font-size:13.5px;line-height:2"><div class="t" style="margin-bottom:2px">🎖️ 레벨 배지 · 올릴수록 화려해져요</div>${[[1,'새싹'],[5,'루키'],[10,'단골'],[15,'고수'],[20,'달인'],[30,'전설'],[50,'신'],[70,'초월자'],[100,'불멸']].map(([l,t])=>`<div class="row"><span>${lvBadge(l)} <b>${t}</b></span><span class="m">Lv.${l}~</span></div>`).join('')}<div class="m" style="font-size:12px;margin-top:4px">게임 기록 +10xp(하루 30번까지) · 개인 최고 +25xp · 1등 +20~100xp · 오늘의 문제 +50xp · 업적 +30xp~(어려운 업적은 더 많이)</div></div>`;}
 if(RTAB==='ach'){if(!NICK)h+='<div class="card m">닉네임을 저장하면 업적이 쌓여요</div>';else if(!ME)h+='<div class="gq">불러오는 중…</div>';
  else{h+=`<div class="card"><div class="t">${esc(NICK)}</div>${meBar()}<div class="m" style="margin-top:6px">기록 남긴 게임 ${ME.played.length}/${ME.total_games}</div></div>`;
   const got=ME.ach.filter(a=>a[4]),no=ME.ach.filter(a=>!a[4]);
   h+=`<div class="sec">달성 ${got.length}/${ME.ach.length}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${[...got,...no].map(a=>`<div class="card" style="margin:0;padding:8px;${a[4]?'border-color:#e0a800;background:#fff8e1':'opacity:.5;filter:grayscale(1)'}"><div style="font-size:22px">${a[1]}</div><b style="font-size:13.5px">${a[2]}</b><div class="m" style="font-size:11.5px">${a[3]}</div>${a[4]?`<div class="m" style="font-size:10.5px">${a[4].slice(0,10)}</div>`:''}</div>`).join('')}</div>`;}}
 if(RTAB==='crown')h+=crownView();
 return h;}
// 🟢 실시간 접속 (관리자 페이지에서 지금 누가 어떤 화면을 보는지) · 15초마다 신호 · 화면을 끄거나 나가면 바로 OFF
const PSID=(()=>{try{let v=localStorage.getItem('psid');if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem('psid',v);}return v;}catch(e){return Math.random().toString(36).slice(2,10);}})();
let PPAGE='';
function pres(off){if(!API)return;let n='';try{n=localStorage.getItem('nick')||'';}catch(e){}
 const b=JSON.stringify({s:PSID,p:PPAGE,n,f:window.top!==window.self?1:0,off:off?1:0});
 try{if(off&&navigator.sendBeacon&&navigator.sendBeacon(API+'/api/presence',new Blob([b],{type:'text/plain'})))return;
  fetch(API+'/api/presence',{method:'POST',headers:{'Content-Type':'text/plain'},body:b,keepalive:true}).catch(()=>{});}catch(e){}}
function presPage(p){PPAGE=String(p||'').slice(0,40);pres();}
// 💤 30분 동안 손 안 대면 접속 신호를 멈추고 OFF (방치된 화면이 계속 ON 으로 남지 않게) · 다시 손대면 바로 ON
let PACT=Date.now(),PIDLE=false;const PIDLE_MS=30*60*1000;
['pointerdown','keydown','touchstart','wheel','scroll','mousemove'].forEach(ev=>addEventListener(ev,()=>{PACT=Date.now();if(PIDLE){PIDLE=false;if(PPAGE&&!document.hidden)pres();}},{passive:true,capture:true}));
setInterval(()=>{if(document.hidden||!PPAGE)return;if(Date.now()-PACT>PIDLE_MS){if(!PIDLE){PIDLE=true;pres(1);}return;}pres();},15000);
document.addEventListener('visibilitychange',()=>{if(PPAGE)pres(document.hidden);});
window.addEventListener('pagehide',()=>{if(PPAGE)pres(1);});
function gvisit(p){presPage(p);if(!API)return;try{fetch(API+'/api/visit',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({p,n:NICK||''})}).catch(()=>{});}catch(e){}}
// ===== 🚩 학습 문제 신고 (룰 퀴즈·리버 트레이너·멀티웨이 플랍, 10/17) /*qrep*/ — 관리자가 '제외'한 문제는 출제에서 빠짐 =====
let QBLK={};try{const c=JSON.parse(localStorage.getItem('qblk')||'{}');if(c&&typeof c==='object')QBLK=c;}catch(e){}
function qblkHas(g,id){const a=QBLK[g];return !!(a&&a.indexOf(id)>=0);}
function qblkLoad(){try{if(typeof API==='undefined'||!API)return;fetch(API+'/api/quiz/blocked',{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r&&r.ok&&r.items&&typeof r.items==='object'){QBLK=r.items;try{localStorage.setItem('qblk',JSON.stringify(r.items));}catch(e){}}}).catch(()=>{});}catch(e){}}
setTimeout(qblkLoad,300);
const QREP=[],QREPD=new Set(),QREPR=['정답이 틀림','해설이 틀림','문제가 이상함','기타'];
function qrepBtn(g,id,sum){const w='<div style="margin-top:4px;text-align:right;font-weight:400">';if(QREPD.has(g+'/'+id))return w+'<small style="opacity:.5">🚩 신고함</small></div>';const i=QREP.push([g,id,sum||''])-1;return w+`<button class="btn gr" style="padding:2px 8px;font-size:12px;width:auto" onclick="event.stopPropagation();qrepOpen(this,${i})">🚩 문제 신고</button></div>`;}
function qrepOpen(el,i){const d=document.createElement('span');d.style.cssText='display:inline-flex;flex-wrap:wrap;gap:3px;justify-content:flex-end';d.innerHTML=QREPR.map((r,k)=>`<button class="btn b2" style="padding:2px 6px;font-size:12px;width:auto" onclick="event.stopPropagation();qrepSend(this,${i},${k})">${r}</button>`).join('');el.replaceWith(d);}
function qrepSend(el,i,k){const [g,id,sum]=QREP[i];let cid='';try{cid=localStorage.getItem('wcid')||'';if(!cid){cid=Math.random().toString(36).slice(2,12);localStorage.setItem('wcid',cid);}}catch(e){}
 const box=el.parentNode,done=m=>{box.innerHTML=`<small style="opacity:.6">🚩 ${m}</small>`;};box.innerHTML='<small>보내는 중…</small>';
 try{fetch(API+'/api/quiz/report',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({game:g,qid:id,summary:sum,reason:QREPR[k],mtok:(typeof MEM!=='undefined'&&MEM&&MEM.tok)||'',cid})}).then(r=>r.json()).then(x=>{if(x&&x.ok)QREPD.add(g+'/'+id);done((x&&x.msg)||'신고했어요');}).catch(()=>done('보내지 못했어요. 잠시 뒤 다시 눌러 주세요'));}catch(e){done('보내지 못했어요');}}
// 📒 오답노트 모아 보기 (학습 첫 화면) - 게임별 오답(wn_<게임키>, 이 기기 저장)을 한 칸에. 누르면 그 게임 오답노트 바로 시작
const WN_GAMES=['potodds','geom','rulequiz','aofprac','riverq'];var WN_AUTO=null;
function wnBox(){const R=WN_GAMES.map(k=>{const g=G.find(x=>x.k===k),n=lsGet('wn_'+k,[]).length;return g&&n?{g,n}:null;}).filter(Boolean);
 if(!R.length)return '';const tot=R.reduce((a,r)=>a+r.n,0);
 return `<div class="card" style="margin-bottom:10px"><div class="t">📒 내 오답노트 · ${tot}개</div><div class="m" style="margin-top:4px">틀린 문제를 게임별로 모았어요 · 맞히면 목록에서 빠져요 (이 기기 저장)</div><div style="display:grid;gap:6px;margin-top:8px">${R.map(r=>`<button class="btn full g" style="text-align:left" onclick="wnGo('${r.g.k}')">${r.g.e} ${r.g.nm||r.g.n} · ${r.n}개 풀기</button>`).join('')}</div></div>`;}
function wnGo(k){WN_AUTO=k;location.hash='g='+k;}
function render0(){const n=G.filter(g=>!g.study).length,st=n>0&&G.every(g=>g.cat==='홀덤');setTitle((st?'🎓 홀덤학습':'🎮 뚝섬 게임')+' · '+n+'종');if(st)document.title='홀덤학습';show((st?wnBox():'')+listView());}
// 🔄 새 게임: 같은 난이도·옵션으로 바로 다시 시작
const NO_NEW=['live','pet','blackjack','hustudy','huview','ladder','roulette'];
function newBtnSync(){const b=$('newBtn');if(!b)return;const g=CUR;b.style.display=g&&!g.study&&!NO_NEW.includes(g.k)&&!(window.DAILY&&DAILY.k===g.k)?'':'none';}
function newGame(){const g=CUR;if(!g)return;if(g.stop)g.stop();SWH=null;clearInterval(clock.iv);
 if(g.k==='logic'&&g.mode)g.go(g.mode,g.lv);
 else if(g.k==='pushfold'&&g.mode)g.go(g.mode);
 else if((g.k==='onecard'||g.k==='hula')&&g.S)g.go();
 else if(g.pickTh&&g.th)g.pickTh(g.th);
 else if(g.go&&g.lv&&g.go.length>=1)g.go(g.lv);
 else g.start();
 scrollTo(0,0);toast('🔄 새 게임');}
function render(){const hsh=location.hash.slice(1);if(CUR&&CUR.stop)CUR.stop();SWH=null;clearInterval(clock.iv);
 const back=$('backBtn');
 if(hsh.startsWith('g=')){const key=hsh.slice(2).split('&')[0];const g=G.find(x=>x.k===key);if(g&&g.stub){location.replace(g.stub+location.search+location.hash);return;}
  if(window.DAILY&&DAILY.k!==key)dailyEnd();
  if(g&&MEM_ONLY.includes(key)&&!MEM.tok){CUR=null;setTitle(g.e+' '+g.nm);back.style.display=key==='pet'?'none':'';newBtnSync();show(memLockView(g));memNeed(g.nm);scrollTo(0,0);return;}   // 회원 전용: 주소(#g=)는 그대로 두고 잠금 화면 → 로그인하면 바로 그 게임 (예전엔 목록으로 갔다가 다시 넘어왔음)
  else if(g){gvisit((g.study?'':'게임·')+g.nm+(window.DAILY&&DAILY.k===key?' (오늘의 문제)':''));CUR=g;const dly=window.DAILY&&DAILY.k===key;setTitle((dly?'📅 오늘의 문제 · ':'')+g.e+' '+g.nm);back.style.display=(g.study||key==='pet')?'none':'';g.start();if(WN_AUTO===key||/&w=1/.test(hsh)){WN_AUTO=null;if(g.go)g.go('W');}   /* 10/16: 뚝섬펫은 '목록' 버튼 숨김 (펫 화면 안에 자체 메뉴가 있음) */newBtnSync();
   if(dly){if(key==='logic')g.go('오늘');else if(DAILY.lv&&g.go)g.go(DAILY.lv);}scrollTo(0,0);return;}}
 if(window.DAILY)dailyEnd();
 CUR=null;back.style.display='none';newBtnSync();
 if(hsh==='rank'){gvisit('게임·랭킹');setTitle('🏆 랭킹·업적');back.style.display='';show(rankView());loadRank(()=>{if(location.hash==='#rank')show(rankView());});if(RTAB==='ach'||RTAB==='level')loadMe(()=>{if(location.hash==='#rank')show(rankView());});return;}
 if(hsh==='daily'){gvisit('게임·오늘의 문제');setTitle('📅 오늘의 문제');back.style.display='';show(dailyView());loadDaily();return;}
 if(hsh==='event'){gvisit('게임·커피이벤트');setTitle('☕ 커피이벤트');back.style.display='';MIS_AT=0;show(eventView());return;}
 render0();if(window.top===window.self)gvisit('게임 목록');else{presPage('게임 목록');back.style.display='';}/* 홈 안에서는 목록 화면에도 '목록'(홈으로) 버튼: 휴대폰은 홈의 위·아래 줄이 숨어 있음 */if(NICK&&!ME)loadMe(()=>{if(!CUR&&!location.hash.slice(1))render0();});}
addEventListener('hashchange',render);addEventListener('hashchange',abarSync);
if(window.top!==window.self){$('homeBtn').style.display='none';}   // 홈 안에서 열렸으면 홈 버튼 숨김 (위의 ← 뒤로로 닫기)
render();abarSync();</script>
