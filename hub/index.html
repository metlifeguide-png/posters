<button id="wcbBtn" type="button" aria-label="뚝섬 상담원">✨</button>
<div id="wcbBox">
  <div id="wcbHd"><span style="display:flex;align-items:center"><i class="wcbav"></i><span class="wcbnm"><span><b id="wcbNm" style="font-weight:700">상담원 김채원</b></span><small id="wcbLeft"></small></span></span><span style="display:flex;align-items:center"><button id="wcbClr" type="button" aria-label="대화 지우기">🗑 대화 지우기</button><button id="wcbX" type="button" aria-label="닫기">✕</button></span></div>

  <div id="wcbQk"></div>
  <div id="wcbRow">
    <input id="wcbIn" type="text" maxlength="300" placeholder="궁금하신 점을 남겨 주세요" autocomplete="off">
    <button id="wcbSend" type="button">보내기</button>
  </div>
  <div id="wcbNote">상담원이 먼저 답변드리고, 확인이 필요한 문의는 담당자가 직접 답변드려요.</div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var busy=false, greeted=false;

  function add(cls,txt){
    var d=document.createElement('div'); d.className='wcbm '+cls; d.textContent=(CUR&&/bot/.test(cls))?String(txt).replace(/김채원/g,CUR.n):txt;
    $('wcbLog').appendChild(d); $('wcbLog').scrollTop=1e9; return d;
  }
  function loginBtn(el){
    var b=document.createElement('button'); b.className='wcbl'; b.type='button'; b.textContent='로그인';
    b.onclick=function(){ close(); memOpen('login'); };
    el.appendChild(document.createElement('br')); el.appendChild(b);
  }
  function setLeft(n){ var e=$('wcbLeft'); var s=wcbConn?['● 연결 중','#f59e0b']:wcbEnded?(wcbBlocked?['● 이용 제한','#dc2626']:['● 상담 종료','#98a2b3']):['● 상담 가능','#16a34a']; e.style.setProperty('color',s[1],'important'); e.textContent=s[0]; }

  /*wcbroute*/
  var WCB_POST_OK=['/api/part/','/api/itm/'];   // 확인 버튼이 부를 수 있는 주소 (참가·리더보드 등록만)
  window.WCB_CALC=window.WCB_CALC||{};          // 화면 계산 함수 등록 자리 (B단계: 에퀴티·새새틀)
  function goMenu(k){
    close();
    var m=(typeof MENU!=='undefined'&&MENU.find)?MENU.find(function(x){return x.k===k;}):null;
    if(m&&m.u&&typeof openIn==='function'&&typeof B!=='undefined'){ try{ openIn(B+m.u,m.t,m.k,false); return; }catch(e){} }
    if(location.hash==='#'+k){ try{ window.dispatchEvent(new HashChangeEvent('hashchange')); }catch(e){} }
    else location.hash='#'+k;
  }
  /*wcbcalc*/
  function wcbCard(s){ var r=EQXR.indexOf(s[0]), u=EQXS.indexOf(s[1]); return (r<0||u<0)?-1:r*4+u; }
  WCB_CALC.eq=function(a){
    if(typeof eqxRun!=='function'||typeof EQXR==='undefined'||typeof EQXS==='undefined') return '';
    var cv=function(L){ return (L||[]).map(wcbCard); };
    var me=cv(a.h), bd=cv(a.b), op=(a.o||[]).map(cv), all=me.concat(bd);
    op.forEach(function(x){ all=all.concat(x); });
    if(all.some(function(c){return c<0;})) return '카드를 읽지 못했어요. 에퀴티 계산기에서 골라 주세요.';
    if(new Set(all).size!==all.length) return '같은 카드가 두 번 들어갔어요.';
    var hands=[me]; op.forEach(function(x){ hands.push(x); });
    var n=Math.max(1,Math.min(5,a.n||1)); while(hands.length<n+1) hands.push(null);
    var q=eqxRun(hands,bd), pc=function(x){return (x*100).toFixed(1)+'%';};
    var s='🎯 내 승률 '+pc(q.eq[0]);
    for(var i=1;i<hands.length;i++) s+='\n상대'+i+(hands[i]?' ('+a.o[i-1].join(' ')+')':' (랜덤 핸드)')+' '+pc(q.eq[i]);
    return s+'\n'+(q.exact?'정확 계산':'3만 번 근사')+' · 비기면 나눠서 셈';
  };
  WCB_CALC.hgb=function(a){
    if(typeof hgbCalc!=='function') return '';
    var R=hgbCalc(a.ent,1,a.per||11,a.cost||0,a.val||0);
    if(R.msg) return R.msg;
    var c=R.cur, g=hgbGrade(c.idx);
    var s='🎟 내가 들어가면 '+R.M+'명 → 티켓 '+c.k+'장\n바인 지수 '+hgbF(c.idx)+' ('+g[0]+')';
    s+=c.need?('\n'+c.need+'명 더 들어오면 티켓 1장 추가'):'\n티켓이 딱 맞게 찬 인원이에요';
    if(isFinite(c.per)) s+='\n바인당 기대 환급 '+hgbF(c.per)+(isFinite(c.rate)?' (환급율 '+hgbF(c.rate*100)+'%)':'');
    return s+'\n지금 마감된다고 보고 계산 (뒤에 들어올 바인 제외)';
  };
  function mkBtn(el,t,fn){ var b=document.createElement('button'); b.className='wcbl'; b.type='button'; b.textContent=t; b.onclick=fn; el.appendChild(b); return b; }
  function extra(w,r){
    if(r.imgs&&r.imgs.length){
      var g=document.createElement('div'); g.className='wcbimg';
      r.imgs.slice(0,6).forEach(function(m){ if(!m||!m.src) return; var i=document.createElement('img'); i.src=m.src; i.alt=m.t||''; i.loading='lazy'; if(m.t) i.title=m.t; /*wcbphoto*/if(m.id!=null&&typeof phOpen==='function'){ i.style.cursor='pointer'; i.onclick=function(){ close(); phOpen(m.id); }; } g.appendChild(i); });
      w.appendChild(g);
    }
    if(r.calc&&WCB_CALC[r.calc.k]){ try{ var s=WCB_CALC[r.calc.k](r.calc.a||{}); if(s) w.appendChild(document.createTextNode('\n'+s)); }catch(e){} }
    var row=null; function rw(){ if(!row){ row=document.createElement('div'); row.className='wcbbr'; w.appendChild(row); } return row; }
    (r.btns||[]).slice(0,4).forEach(function(b){ if(b&&b.go) mkBtn(rw(),b.t||'열기',function(){ goMenu(b.go); }); });
    /*wcbconfirm*/
    var cl=(Array.isArray(r.confirm)?r.confirm:(r.confirm?[r.confirm]:[])).filter(cfOk).slice(0,4);
    if(cl.length){ var cr=document.createElement('div'); cr.className='wcbbr'; w.appendChild(cr); cl.forEach(function(c){ cfBtn(cr,c); }); }
  }
  function cfOk(c){ return !!(c&&c.api&&WCB_POST_OK.some(function(p){return c.api.indexOf(p)===0;})); }
  function cfBtn(el,c){
    if(!cfOk(c)) return;
    var cb=mkBtn(el,c.btn||'등록',function(){
      if(cb.disabled) return;
      if(!MEM.tok){ var d=add('bot','로그인하면 등록할 수 있어요.'); loginBtn(d); return; }
      el.querySelectorAll('button').forEach(function(b){ b.disabled=true; });
      cb.textContent='처리 중…';
      memPost(c.api,Object.assign({},c.body||{},{token:MEM.tok})).then(function(x){
        x=x||{}; var bad=(x.ok===false||!!x.bad);
        cb.textContent=bad?'실패':'완료';
        var m=add(bad?'bot err':'bot', x.msg||x.answer||(bad?'처리하지 못했어요.':'처리했어요.'));
        if(x.bad){ memSave(null); loginBtn(m); }
        if(x.pick&&x.pick.length){
          var pr=document.createElement('div'); pr.className='wcbbr'; m.appendChild(pr);
          x.pick.slice(0,6).forEach(function(p){ cfBtn(pr,{api:c.api,btn:(p.l||p.k)+(p.d?' ('+p.d+')':''),body:Object.assign({},c.body||{},{ek:p.k||'',el:p.l||''})}); });
        }
        $('wcbLog').scrollTop=1e9;
      }).catch(function(){ cb.textContent='실패'; add('bot err','서버에 연결하지 못했어요.'); });
    });
  }

  function loadLeft(){
    if(!MEM.tok||!API) return;
    fetch(API+'/api/chat/left?token='+encodeURIComponent(MEM.tok),{headers:{'ngrok-skip-browser-warning':'1'}})
      .then(function(r){return r.json();})
      .then(function(r){ if(r&&r.ok) setLeft(r.left); else if(r&&r.bad) setLeft(null); })
      .catch(function(){});
  }

  function setFace(a){ var bx=$('wcbBox'); if(a) bx.style.setProperty('--wcbface','url('+a.img+')'); else bx.style.removeProperty('--wcbface'); }
  function connect(){
    if(wcbBlocked){ $('wcbBox').classList.add('on'); return; }
    clearTimeout(idleT); clearTimeout(connT); clearInterval(dotT);
    wcbEnded=false; wcbConn=true; greeted=true; CUR=null;
    $('wcbLog').innerHTML=''; $('wcbBox').classList.add('on');
    $('wcbIn').disabled=true; $('wcbSend').disabled=true; $('wcbIn').placeholder='상담원과 연결 중입니다…';
    $('wcbNm').textContent='상담원 연결 중'; setFace(null); setLeft();
    var d=add('sys','상담원과 연결 중입니다'), k=0;
    dotT=setInterval(function(){ k=(k+1)%4; d.textContent='상담원과 연결 중입니다'+['','.','..','...'][k]; },400);
    connT=setTimeout(function(){
      clearInterval(dotT); CUR=AG[Math.floor(Math.random()*AG.length)];
      setFace(CUR); $('wcbNm').textContent='상담원 '+CUR.n;
      wcbConn=false; d.textContent='상담원 '+CUR.n+'님과 연결되었습니다.';
      $('wcbIn').disabled=false; $('wcbSend').disabled=false; $('wcbIn').placeholder='궁금하신 점을 남겨 주세요';
      setLeft(); greeted=false; open();
    },4000+Math.floor(Math.random()*1500));
  }
  /*wcbend*/ var wcbEnded=false, wcbBlocked=false, idleT=null;
  function idleArm(){
    clearTimeout(idleT); if(wcbEnded) return;
    idleT=setTimeout(function(){
      if(busy){ idleArm(); return; }
      add('bot','고객님, 더 궁금하신 점 없으십니까?\n별다른 문의가 없으셔서 상담을 먼저 종료하겠습니다.\n이용해 주셔서 감사합니다 😊');
      endChat(false);
    },5*60*1000);
  }
  function endChat(blocked){
    wcbEnded=true; if(blocked) wcbBlocked=true; clearTimeout(idleT);
    $('wcbIn').disabled=true; $('wcbSend').disabled=true;
    $('wcbIn').placeholder=wcbBlocked?'상담 이용이 제한되었습니다':'상담이 종료되었습니다';
    setLeft();
    if(!wcbBlocked){ var d=add('bot','새 상담을 원하시면 아래 버튼을 눌러 주세요.'); d.appendChild(document.createElement('br')); mkBtn(d,'새 상담 시작',restart); }
  }
  function restart(){
    if(wcbBlocked) return;
    wcbEnded=false; $('wcbIn').disabled=false; $('wcbSend').disabled=false; $('wcbIn').placeholder='궁금하신 점을 남겨 주세요';
    connect();
  }
  function chkStatus(){
    if(!MEM.tok||!API||wcbBlocked) return;
    fetch(API+'/api/chat/status?token='+encodeURIComponent(MEM.tok),{headers:{'ngrok-skip-browser-warning':'1'}})
      .then(function(r){return r.json();})

      .catch(function(){});

  /*wcbagent*/ function inbox(peek){

          add('bot','상담원 '+(r.agent||'김채원')+'입니다.\n고객님께서 문의하신 \u201c'+it.q+'\u201d 건에 대해 안내드립니다.\n\n'+it.a+'\n\n기다려 주셔서 감사합니다 😊');
        });
      }).catch(function(){});
  }
  function open(){
    $('wcbBox').classList.add('on');
    if(!greeted){
      greeted=true;
      var g=add('bot','안녕하세요! 상담원 김채원입니다.\n궁금하신 게 있으시면 최대한 도와드리겠습니다 😊');
      if(!MEM.tok){ g.appendChild(document.createTextNode('\n상담은 로그인 후 이용하실 수 있어요.')); loginBtn(g); }
    }
    loadLeft(); inbox(false); chkStatus();
    setTimeout(function(){ $('wcbIn').focus(); },50);

  function close(){ clearTimeout(connT); clearInterval(dotT); $('wcbBox').classList.remove('on'); }

  /*wcbhuman*/ var WCB_OUT=['더 궁금하신 점 있으시면 편하게 물어봐 주세요 😊','혹시 더 필요하신 게 있으시면 말씀해 주세요!','도움이 되셨으면 좋겠어요 😊 다른 문의도 언제든 남겨 주세요.'];
  function wcbPick(a){ return a[Math.floor(Math.random()*a.length)]; }
  /*wcbhuman2*/ function wcbIntro(t,r){
    var m=t.match(/🏆\s*(.+?)\s*대회 상금 TOP\s*5/);
    if(m){ var L=m[1].trim();
      if(/^주말\s*/.test(L)) L='이번 주말('+L.replace(/^주말\s*/,'')+')';
      return L+' 상금이 가장 큰 TOP5 대회 알려드릴게요~'; }
    if(/상금 랭킹/.test(t)) return '이번 달 상금 랭킹 TOP5 알려드릴게요~';
    if(/근처/.test(t)) return '가까운 곳 위주로 대회 찾아봤어요~';
    if(/명예의 전당/.test(t)) return '명예의 전당 현황 알려드릴게요~';
    if(/일정/.test(t)) return '문의하신 일정 정리해 드릴게요~';
    if(r.calc) return '네 고객님, 바로 계산해 봤어요~';
    if(r.imgs&&r.imgs.length) return '사진 찾아봤어요~';
    return wcbPick(['네 고객님, 확인해 봤어요~','확인해 드렸어요, 고객님 😊']);
  }
  function wcbHuman(w,r){
    r=r||{}; if(r.bad) return r;
    var t=String(r.answer||r.msg||''), data=(t.split('\n').length>=3)||!!r.calc||!!(r.imgs&&r.imgs.length);
    if(data&&/^(server|feature|faq)$/.test(r.src||'')&&!/^(안녕하세요|고객님|죄송|문의해|상담원|별말씀|무엇을|저는|네 )/.test(t))
      r.answer=wcbIntro(t,r)+'\n\n'+t+(r.calc?'':'\n\n'+wcbPick(WCB_OUT));
    var who=CUR?(CUR.n+'님이 입력 중'):'상담원이 입력 중';
    w.innerHTML='<span class="wcbtyp">'+who+'<span class="wcbdots"><i></i><i></i><i></i></span></span>';
    $('wcbLog').scrollTop=1e9;
    var d=r.end?1200:(data?2600+Math.random()*900:1500+Math.random()*900);
    return new Promise(function(res){ setTimeout(function(){ res(r); },d); });
  }
  function send(){
    if(busy||wcbEnded||wcbConn) return;
    var q=$('wcbIn').value.trim(); if(!q) return;
    if(!MEM.tok){ var d=add('bot','로그인하면 질문할 수 있어요.'); loginBtn(d); return; }
    busy=true; $('wcbSend').disabled=true; $('wcbIn').value='';
    add('me',q);
    var w=add('bot','상담원이 답변을 작성하고 있어요…');
    memPost('/api/chat',{token:MEM.tok,q:q}).then(function(r){ return wcbHuman(w,r); }).then(function(r){
      r=r||{};
      if(r.bad){ memSave(null); w.textContent='로그인이 풀렸어요. 다시 로그인해 주세요.'; loginBtn(w); return; }
      var t=r.answer||r.msg||'답을 가져오지 못했어요. 잠시 뒤 다시 해 주세요.';
      if(CUR) t=String(t).replace(/김채원/g,CUR.n);
      w.textContent=t; extra(w,r);
      if(r.end) endChat(!!r.blocked); else idleArm();
      if(r.ok===false){ w.classList.add('err'); if(/로그인/.test(t)) loginBtn(w); }
      if(typeof r.left==='number') setLeft(r.left);
    }).catch(function(){
      w.textContent='서버에 연결하지 못했어요. 잠시 뒤 다시 해 주세요.'; w.classList.add('err');
    }).then(function(){
      busy=false; $('wcbSend').disabled=wcbEnded; $('wcbLog').scrollTop=1e9;
    });
  }

  $('wcbBtn').onclick=function(){ $('wcbBox').classList.contains('on')?close():connect(); };
  /*wcbtop*/ (function(){
    var kk=$('kk'); if(!kk||!kk.parentNode) return;
    var b=document.createElement('button'); b.type='button'; b.id='wcbTop'; b.className='wcbtop'; b.setAttribute('aria-label','뚝섬 상담원');
    b.innerHTML='<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">'
      +'<path d="M10 2.5l1.9 5.1 5.1 1.9-5.1 1.9L10 16.5l-1.9-5.1L3 9.5l5.1-1.9z"/><path d="M18.5 13l.95 2.55 2.55.95-2.55.95-.95 2.55-.95-2.55L15 16.5l2.55-.95z"/></svg>'
      +'<b class="wt">뚝섬 상담원</b>';
    b.onclick=function(){ $('wcbBox').classList.contains('on')?close():connect(); };
    kk.parentNode.insertBefore(b,kk.nextSibling);
    /*wcbhint*/ var h=document.createElement('span'); h.className='wcbhint'; h.innerHTML='<i>←</i> 궁금한 건 지금 뚝섬 상담원!';
    h.onclick=b.onclick; b.parentNode.insertBefore(h,b.nextSibling);
    setTimeout(function(){ inbox(true); },1500);   /*wcbagent*/
    document.body.classList.add('wcbtopon');
  })();
  $('wcbX').onclick=close;
  /*wcbdrag*/ (function(){
    var hd=$('wcbHd'), bx=$('wcbBox'), st=null;
    hd.title='끌어서 옮기기 · 두 번 누르면 제자리';
    hd.addEventListener('pointerdown',function(e){
      if(e.target.closest&&e.target.closest('button')) return;
      var r=bx.getBoundingClientRect(), W=bx.offsetWidth, H=bx.offsetHeight, z=(r.width/W)||1; /*wcbdrag2*/
      bx.style.transition='none'; bx.style.maxWidth='none'; bx.style.boxSizing='border-box';
      bx.style.width=W+'px'; bx.style.height=H+'px';
      bx.style.left=(r.left/z)+'px'; bx.style.top=(r.top/z)+'px'; bx.style.right='auto'; bx.style.bottom='auto'; bx.style.margin='0';
      st={x:(e.clientX-r.left)/z,y:(e.clientY-r.top)/z,z:z};
      try{ hd.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault();
    });
    hd.addEventListener('pointermove',function(e){
      if(!st) return;
      if(!e.buttons){ st=null; return; }
      var w=bx.offsetWidth, z=st.z, vw=innerWidth/z, vh=innerHeight/z;
      var x=Math.min(Math.max(e.clientX/z-st.x,60-w),vw-60);
      var y=Math.min(Math.max(e.clientY/z-st.y,0),vh-50);
      bx.style.left=x+'px'; bx.style.top=y+'px';
    });
    function end(){ st=null; }
    hd.addEventListener('pointerup',end); hd.addEventListener('pointercancel',end); window.addEventListener('pointerup',end);
    hd.addEventListener('dblclick',function(e){
      if(e.target.closest&&e.target.closest('button')) return;
      ['left','top','width','height','right','bottom','margin','transition','maxWidth','boxSizing'].forEach(function(k){ bx.style[k]=''; });
    });
  })();
  /*wcbclr*/ $('wcbClr').onclick=function(){ if(busy||wcbBlocked) return; restart(); };
  $('wcbSend').onclick=send;
  /*wcbqk*/ [['🏆 이번 주말 대회','이번 주말 뭐 있어?'],['💰 오늘 상금 큰 대회','오늘 상금 큰 대회 알려줘'],['📊 이번달 랭킹','이번달 랭킹'],['🎖 명예의 전당 내 순위','명예의 전당 내 순위'],['✋ 참가 등록 방법','참가 신청 어떻게 해?'],['📝 입상 기록 올리기','리더보드에 기록 올리는 법'],['🎯 AKs vs QQ 승률','AKs vs QQ 승률'],['🎟 새새틀 언제 들어가?','새새틀 몇 명일 때 들어가야 이득이야?']].forEach(function(x){
    var c=document.createElement('button'); c.type='button'; c.className='wcbqk'; c.textContent=x[0];
    c.onclick=function(){ if(busy||wcbEnded||wcbConn) return; $('wcbIn').value=x[1]; send(); };
    $('wcbQk').appendChild(c);
  });
  /*wcbqk2*/ (function(){
    var q=$('wcbQk'), w=document.createElement('div'); w.id='wcbQkW'; q.parentNode.insertBefore(w,q); w.appendChild(q);
    function ar(c,t,d){ var b=document.createElement('button'); b.type='button'; b.className='wcbqa '+c; b.textContent=t; b.setAttribute('aria-label',c==='l'?'이전 질문':'다음 질문');
      b.onclick=function(){ q.scrollBy({left:d,behavior:'smooth'}); }; w.appendChild(b); return b; }
    var L=ar('l','‹',-220), R=ar('r','›',220);
    function upd(){ L.style.display=q.scrollLeft>2?'':'none'; R.style.display=(q.scrollLeft+q.clientWidth<q.scrollWidth-2)?'':'none'; }
    q.addEventListener('scroll',upd); window.addEventListener('resize',upd);
    if(window.ResizeObserver) new ResizeObserver(upd).observe(q); setTimeout(upd,0);
    q.addEventListener('wheel',function(e){ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&q.scrollWidth>q.clientWidth){ q.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
    var dx=null, sl=0, moved=false;
    q.addEventListener('pointerdown',function(e){ if(e.pointerType!=='mouse') return; dx=e.clientX; sl=q.scrollLeft; moved=false; });
    window.addEventListener('pointermove',function(e){ if(dx===null) return; if(!e.buttons){ dx=null; return; } var m=e.clientX-dx; if(Math.abs(m)>5) moved=true; q.scrollLeft=sl-m; });
    window.addEventListener('pointerup',function(){ dx=null; });
    q.addEventListener('click',function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; } },true);
  })();
  $('wcbIn').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); send(); } });
})();
