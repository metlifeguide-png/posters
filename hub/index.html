  const cost=sb+bb+an*n,m=st/cost,z=MZ.find(x=>m>=x[0])||MZ[4];
  return `<div class="out" style="background:${z[1]};color:${z[2]}"><div class="v">M = ${m.toFixed(2)}</div><div class="z">${z[4]} · ${z[5]}</div>

 {k:"po",n:"공식 포스터",d:"피망·WPL 등",f:()=>head('📋 대회사 공식 포스터','누르면 크게')+thumbs('official')},
 {k:"pa",n:"APL 제휴",d:"제휴 매장 혜택",f:()=>head('🤝 APL 제휴업체','누르면 크게')+thumbs('apl')},

 {k:"learn",n:"학습",d:"봇이 아는 정보",f:()=>{const l=D.learned.filter(x=>!Q||(x.k+' '+x.c).toLowerCase().includes(Q));
   return head('📚 학습',`${D.learned.length}개`)+search('키워드로 찾기')+(l.length?l.map(x=>`<div class="card"><div class="t">${esc(x.k)}</div><div class="lc">${esc(x.c)}</div></div>`).join(''):'<div class="e">학습된 정보가 없어요</div>');}},
 {k:"part",n:"참가",d:"누가 어디 가나",f:()=>{const g=D.parts.filter(x=>!Q||(x.label+x.people.map(p=>p.n+p.m).join(' ')).toLowerCase().includes(Q));
   const suggestCmd=x=>{const c=x.cmd||(x.event&&x.label.match(/정모/)?'정모':'');if(c)return`!@참가 ${c}`;

 {k:"rank",n:"입상·순위",d:"뚝섬리더보드",f:()=>{const pod=a=>{const o=[a[1],a[0],a[2]];return `<div class="podium">${o.map((x,i)=>x?`<div class="pd ${i===1?'p1':''}"><div class="md">${['🥈','🥇','🥉'][i]}</div><div class="nk">${esc(x.n)}</div><div class="pt">${x.pt}pt</div></div>`:'<div></div>').join('')}</div>`;};
   const list=(a,from)=>a.slice(from).map((x,i)=>`<div class="row"><span>${i+from+1}. ${esc(x.n)}</span><span class="m">${x.pt}pt · 우승 ${x.win} · 입상 ${x.itm}</span></div>`).join('');

   +'<div class="sec">대회별 입상</div>'+search('닉네임 · 대회로 찾기')
   +(t.length?t.map(x=>`<div class="card"><div class="t">${esc(x.label)}</div><div class="m">${md(x.date)} · ${x.rows.length}명</div><div class="ppl">${x.rows.map(r=>esc(r.n)+' '+esc(r.r)+(r.p?` <span class="m">(${esc(r.p)})</span>`:'')).join(', ')}</div></div>`).join(''):'<div class="e">입상 기록이 없어요</div>');}},
 {g:"도구"},

   return head('✍️ 핸드리뷰',`공개 ${D.reviews.length}개`)+`<div style="margin-bottom:10px"><a class="btn g" data-nav="1" href="${B}/review/">✍️ 내 핸드 질문하기</a></div>`+search('닉네임 · 패 · 질문으로 찾기')+(r.length?r.map(x=>`<a class="card" href="${B}/r/${x.id}.html"><div class="t">#${x.id} ${esc(x.head)}${x.own?'<span class="tag">✅ 방장 답변</span>':''}</div><div class="m">${esc(x.hero)}</div><div>❓ ${esc(x.q||'(질문 없음)')}</div><div class="m">${esc(x.nick)} · ${md(x.date)}</div></a>`).join('')
   :'<div class="e">공개된 리뷰가 없어요</div>');}},
 {k:"mr",n:"M-ratio",d:"생존 지수 계산",f:mrPage},
 {k:"aof",n:"올인차트",d:"새틀 계산기",u:"/aof/",t:"♠ 올인차트"},

// 처음 들어오면 뚝섬유원지 정모부터. 단, #part 링크로 들어오면 참가 탭부터
let cur='meet', Q='';
if(location.hash==='#part')cur='part';
else if(location.hash)history.replaceState(null,'',location.pathname+location.search);
function draw(){
  document.getElementById('side').innerHTML=MENU.map(m=>m.g?`<div class="grp">${m.g}</div>`:`<button class="${m.k===cur?'on':''}" data-k="${m.k}"><span class="nm">${m.n}</span><span class="ds">${m.d}</span></button>`).join('');
  const m=MENU.find(x=>x.k===cur);
  document.getElementById('main').innerHTML=m.f()+`<div class="foot">업데이트 ${D.updated} · 누구나 볼 수 있어요 · 관리는 방장만</div>`;
  document.querySelectorAll('#main img[data-pic]').forEach(im=>picLoad(im,im.dataset.pic,thumbDead));
  const q=document.getElementById('q'); if(q){q.oninput=()=>{Q=q.value.trim().toLowerCase();const p=q.selectionStart;draw();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};}
}
// 캘린더·올인차트·리뷰쓰기·포스터 등은 페이지를 떠나지 않고 이 안에서 전체화면으로 열기
const ov=document.getElementById('ov');let ovf=null;
function openOv(url,title,push){if(ovf)ovf.remove();ovf=document.createElement('iframe');ovf.title='내용';ovf.setAttribute('allow','clipboard-write');ovf.src=url;ov.appendChild(ovf);document.getElementById('ovt').textContent=title||'';document.getElementById('ovn').href=url;
  ov.classList.add('on');document.body.classList.add('lock');if(push!==false)history.pushState({ov:1},'');}
function closeOv(){ov.classList.remove('on');document.body.classList.remove('lock');if(ovf){ovf.remove();ovf=null;}}
document.getElementById('ovx').onclick=()=>{closeOv();if(history.state&&history.state.ov)history.back();};
addEventListener('popstate',()=>{if(pv.classList.contains('on')){closePv();return;}if(ov.classList.contains('on'))closeOv();});
// 포스터 슬라이드 뷰어: 누른 이미지부터 시작
const PV_NAME={sched:'대회일정',contest:'제작 포스터',official:'공식 포스터',apl:'APL 제휴'};
const pv=document.getElementById('pv'),pvs=document.getElementById('pvs');let pvType='',pvIdx=0,pvN=0,pvList=[];
function pvLoad(i){const im=pvs.children[i]&&pvs.children[i].firstChild;if(!im||im.src)return;picLoad(im,pvList[i]);}
function pvShow(i){pvIdx=i;for(let k=i-1;k<=i+1;k++)pvLoad(k);document.getElementById('pvt').textContent=`${PV_NAME[pvType]} ${i+1} / ${pvN}`;document.getElementById('pvo').href=`${B}/${pvList[i]}.jpg`;}
function openPv(type,i,push){pvType=type;pvList=PL(type);pvN=pvList.length;pvs.innerHTML=pvList.map(()=>'<div><img alt=""></div>').join('');
  pv.classList.add('on');document.body.classList.add('lock');pvs.style.scrollSnapType='none';pvs.scrollLeft=i*pvs.clientWidth;pvShow(i);
  requestAnimationFrame(()=>{pvs.scrollLeft=i*pvs.clientWidth;pvs.style.scrollSnapType='';});if(push!==false)history.pushState({pv:1},'');}
function closePv(){pv.classList.remove('on');pvs.innerHTML='';if(!ov.classList.contains('on'))document.body.classList.remove('lock');}
function pvGo(d){const i=Math.max(0,Math.min(pvN-1,pvIdx+d));pvs.scrollTo({left:i*pvs.clientWidth,behavior:'smooth'});}
pvs.addEventListener('scroll',()=>{const i=Math.round(pvs.scrollLeft/(pvs.clientWidth||1));if(i!==pvIdx&&i>=0&&i<pvN)pvShow(i);},{passive:true});
document.getElementById('pvx').onclick=()=>{closePv();if(history.state&&history.state.pv)history.back();};
document.getElementById('pvl').onclick=()=>pvGo(-1);document.getElementById('pvr').onclick=()=>pvGo(1);
addEventListener('keydown',e=>{if(!pv.classList.contains('on'))return;if(e.key==='ArrowLeft')pvGo(-1);else if(e.key==='ArrowRight')pvGo(1);else if(e.key==='Escape')document.getElementById('pvx').click();});
document.getElementById('main').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.mr;if(!k)return;MR[k]=e.target.value;const o=document.getElementById('mr-out');if(o)o.innerHTML=mrOut();});
document.getElementById('main').addEventListener('click',e=>{const t=e.target.closest('.thumbs a[data-pt]');if(t){e.preventDefault();openPv(t.dataset.pt,+t.dataset.pi);return;}
  const a=e.target.closest('a[href]');if(!a||a.dataset.nav||!a.href.startsWith(B+'/'))return;
  e.preventDefault();const c=a.closest('.card');openOv(a.href,a.dataset.t||(c&&c.querySelector('.t')?c.querySelector('.t').textContent:'')||document.querySelector('.h h2')?.textContent||'');});
document.getElementById('side').onclick=e=>{const b=e.target.closest('button');if(!b)return;const it=MENU.find(m=>m.k===b.dataset.k);
  if(it&&it.u){openOv(B+it.u,it.t);return;}cur=b.dataset.k;Q='';history.replaceState(null,'','#'+cur);draw();window.scrollTo({top:document.querySelector('.wrap').offsetTop,behavior:'smooth'});};
addEventListener('hashchange',()=>{const k=location.hash.slice(1),it=MENU.find(m=>m.k===k);if(!it)return;if(it.u){openOv(B+it.u,it.t,false);return;}cur=k;draw();});
mq.addEventListener('change',()=>{document.querySelectorAll('#main img[data-pic]').forEach(im=>picLoad(im,im.dataset.pic,thumbDead));
  if(pv.classList.contains('on'))[...pvs.children].forEach((d,i)=>{if(d.firstChild.src)picLoad(d.firstChild,pvList[i]);});});
// 🎵 배경음악: 이 페이지와 같은 폴더(hub/)에 bgm.mp3 를 올리면 자동으로 켜져요 (파일이 없으면 버튼도 안 보여요)
// 브라우저는 소리 자동재생을 막는 경우가 많아서, 막히면 화면을 처음 터치하는 순간 시작해요. 끄면 다음 방문에도 꺼진 상태로 기억해요.
// 🔊 버튼을 누르면 위로 볼륨 막대가 나와요 (위로 올리면 커지고 맨 아래로 내리면 꺼져요 · 고른 볼륨은 기억해요). 아이폰은 기기 볼륨 버튼으로 조절해요.
(function(){
  const SRC='bgm.mp3', VOL=0.25, LOOP=true, FADE_MS=2500;   // 기본 볼륨(0~1) · 반복 여부(false면 한 번만) · 시작할 때 서서히 커지는 시간(0이면 바로)
  const H=136, PAD=14, SPAN=H-2*PAD;                        // 볼륨 막대 높이·여백 (CSS .bgv 와 같아야 해요)
  const wrap=document.getElementById('bgmw'), btn=document.getElementById('bgm'), bgv=document.getElementById('bgv'),
        bgf=document.getElementById('bgf'), bgk=document.getElementById('bgk');
  if(!wrap||!btn) return;
  const a=new Audio(SRC); a.loop=LOOP; a.preload='auto';
  a.volume=0.5; const canVol=Math.abs(a.volume-0.5)<0.01;   // 아이폰은 코드로 볼륨을 못 바꿔서 막대를 숨겨요
  let vol=VOL; try{const s=parseFloat(localStorage.getItem('bgmv')); if(s>0.03&&s<=1) vol=s;}catch(e){}
  let want=true, armed=false, fadeT=null, hideT=null, lastRaw=1; try{want=localStorage.getItem('bgm')!=='off';}catch(e){}
  a.volume=vol;
  const save=()=>{try{localStorage.setItem('bgm',want?'on':'off');}catch(e){}};
  const saveVol=()=>{try{localStorage.setItem('bgmv',String(vol));}catch(e){}};
  const sync=()=>{const on=!a.paused;btn.textContent=on?'🔊':'🔇';btn.title=on?'배경음악 끄기':'배경음악 켜기';btn.setAttribute('aria-pressed',on?'true':'false');};
  function drawVol(){ const v=Math.max(0,Math.min(1,vol)); bgf.style.height=(v*SPAN)+'px'; bgk.style.bottom=(PAD+v*SPAN-9)+'px'; bgv.setAttribute('aria-valuenow',String(Math.round(v*100))); }
  function openPanel(){ if(!canVol) return; wrap.classList.add('open'); clearTimeout(hideT); hideT=setTimeout(()=>wrap.classList.remove('open'),3500); }
  function fadeIn(){ clearInterval(fadeT); if(!canVol||FADE_MS<=0){a.volume=vol;return;} a.volume=0; const t0=Date.now();
    fadeT=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/FADE_MS); a.volume=vol*k; if(k>=1) clearInterval(fadeT);},100); }
  const play=fade=>a.play().then(()=>{ if(fade!==false) fadeIn(); sync(); },()=>{arm();sync();});
  const EV=['pointerup','touchend','keydown','click'];
  function arm(){ if(armed) return; armed=true;
    const go=e=>{ if(e&&e.target&&wrap.contains(e.target)) return;
      EV.forEach(t=>removeEventListener(t,go,true)); armed=false;
      if(want&&a.paused) play(); };
    EV.forEach(t=>addEventListener(t,go,true)); }
  a.addEventListener('canplay',()=>{wrap.classList.add('on'); drawVol(); sync(); if(want&&a.paused) play();},{once:true});
  a.addEventListener('error',()=>wrap.classList.remove('on'));
  a.addEventListener('play',sync); a.addEventListener('pause',sync); a.addEventListener('ended',sync);
  btn.onclick=()=>{
    if(a.paused){ want=true; save(); if(vol<0.03){vol=VOL;saveVol();drawVol();} a.volume=vol; play(); }
    else { want=false; save(); clearInterval(fadeT); a.pause(); sync(); }
    openPanel(); };
  // 볼륨 막대: 누르거나 위아래로 끌면 바로 적용 (맨 아래로 내리면 꺼짐)
  function setFromY(y){ const r=bgv.getBoundingClientRect(); lastRaw=Math.max(0,Math.min(1,(r.bottom-PAD-y)/(r.height-2*PAD))); clearInterval(fadeT);
    if(lastRaw>=0.03){ vol=Math.round(lastRaw*100)/100; a.volume=vol; drawVol(); if(a.paused){want=true;save();play(false);} }
    else { a.volume=0; bgf.style.height='0px'; bgk.style.bottom=(PAD-9)+'px'; }
    openPanel(); }
  let preVol=vol;   // 드래그를 시작하기 전 볼륨 (맨 아래로 내려 끄면 다음에 이 볼륨으로 켜져요)
  function endDrag(){ if(lastRaw<0.03){ vol=preVol; want=false; save(); a.pause(); a.volume=vol; drawVol(); sync(); } else saveVol(); }
  let drag=false;
  bgv.addEventListener('pointerdown',e=>{ drag=true; preVol=vol; try{bgv.setPointerCapture(e.pointerId);}catch(x){} setFromY(e.clientY); e.preventDefault(); });
  bgv.addEventListener('pointermove',e=>{ if(drag) setFromY(e.clientY); });
  const up=()=>{ if(!drag) return; drag=false; endDrag(); };
  bgv.addEventListener('pointerup',up); bgv.addEventListener('pointercancel',up);
  bgv.addEventListener('keydown',e=>{ const d=(e.key==='ArrowUp'||e.key==='ArrowRight')?0.05:(e.key==='ArrowDown'||e.key==='ArrowLeft')?-0.05:0; if(!d) return; e.preventDefault();
    vol=Math.max(0.05,Math.min(1,Math.round((vol+d)*100)/100)); a.volume=vol; drawVol(); saveVol(); if(a.paused){want=true;save();play(false);} openPanel(); });
  wrap.addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') openPanel(); });
  document.addEventListener('pointerdown',e=>{ if(!wrap.contains(e.target)) wrap.classList.remove('open'); },true);
  if(!canVol) bgv.style.display='none';
  drawVol();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ if(!a.paused) a.pause(); }
    else if(want&&wrap.classList.contains('on')&&a.paused&&!a.ended) play(); });
})();
draw();
</script>
