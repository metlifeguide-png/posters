/* ── ☰ 전체 메뉴 서랍 */
.drw{position:fixed;inset:0;z-index:80;background:rgba(8,18,34,.48);opacity:0;pointer-events:none;transition:opacity .2s}

.drwh .dn{font-size:18px;font-weight:900;letter-spacing:-.4px}.drwh .dm{font-size:12.5px;opacity:.75;margin-top:2px}

.logo .a2pill{font-style:normal;font-size:11px;font-weight:900;color:#2b1d00;background:var(--sun);border-radius:999px;padding:3px 7px;margin-left:2px;letter-spacing:0;white-space:nowrap}

.dg{margin:16px 16px 7px;font-size:12px;font-weight:900;color:var(--sub);letter-spacing:.2px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px}
.dl button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 10px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);text-align:left;cursor:pointer;min-width:0}
.dl button i{font-style:normal;font-size:18px;flex:none}.dl button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl button.on{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
/* ── 같은 탭 안 화면 고르기 (휴대폰) */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 12px;padding:2px 12px 2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgba(16,32,60,.04)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* ── 본문 자리 */
.wrap{max-width:1320px;margin:0 auto;min-height:calc(100vh / var(--z,1) - var(--tbh))}
.side{display:none}
.rad{display:none}
.side .grp{font-size:11px;color:var(--sub);font-weight:900;margin:12px 8px 4px;letter-spacing:.2px;white-space:nowrap}
.side .grp:first-child{margin-top:4px}
.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:8px 9px;margin-bottom:1px;cursor:pointer;color:var(--ink);font:inherit;font-size:14px;font-weight:700}
.side button i{font-style:normal;font-size:16px;width:20px;text-align:center;flex:none}
.side button:hover{background:var(--paper)}
.side button.on{background:var(--navy);color:#fff}
/* ── PC (760px 이상): 위 메뉴 + 왼쪽 메뉴 + 본문 · 1180px 이상이면 오른쪽 300×600 광고 칸 */
@media(min-width:760px){
  :root{--z:.9}   /* PC 화면 배율 (90%) · 100vh 를 쓰는 높이는 / var(--z,1) 로 보정 */
  html{zoom:var(--z)}
  body{padding-bottom:0}
  .bt,.tbm,.chips{display:none}
  .tbi{padding:0 18px;gap:10px}
  .logo{font-size:19px}
  .tnav{display:none}   /* PC: 위 탭 메뉴는 숨김 (왼쪽 메뉴에 다 있음) · 휴대폰 아래 탭은 그대로 */
  .kk{margin-left:14px;font-size:13.5px;padding:8px 14px}
  .kk .kt2{display:inline}
  .tnav button{border:0;background:none;color:rgba(255,255,255,.72);font-family:inherit;font-weight:800;font-size:15px;padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .tnav button:hover{color:#fff;background:rgba(255,255,255,.07)}
  .tnav button.on{background:rgba(255,255,255,.15);color:#fff}
  .tb .mem .mi{display:inline-block;background:none;color:rgba(255,255,255,.85)}   /* PC: 닉네임 왼쪽 '내 정보' */
  .tb .vis{display:block;margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.62);white-space:nowrap}
  .tb .vis:empty{display:none}
  .tb .mem{margin-left:12px}
  .tb .vis:empty+.mem{margin-left:auto}
  .tb .mem .lo{display:inline-block}
  .wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;padding:0 18px}
  .side{display:block;position:sticky;top:calc(var(--tbh) + 16px);align-self:start;max-height:calc(100vh / var(--z,1) - var(--tbh) - 32px);overflow-y:auto;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:10px 8px 12px;margin-top:16px;box-shadow:var(--sh)}
}
@media(min-width:1180px){
  .wrap.hasr{grid-template-columns:200px minmax(0,1fr) 300px}
  .wrap.hasr .rad{display:block;position:sticky;top:calc(var(--tbh) + 16px);align-self:start;margin-top:16px}
}

.rad .pic img{display:block;width:100%;height:auto;max-height:calc(100vh / var(--z,1) - var(--tbh) - 60px);object-fit:contain}
.rad .x{position:absolute;right:0;top:0;width:32px;height:32px;border:0;border-radius:0 16px 0 12px;background:rgba(0,0,0,.4);color:#fff;font-size:13px;cursor:pointer}
.rad .cap{font-size:12px;font-weight:800;color:var(--sub);text-align:center;margin-top:7px;line-height:1.35}
/*radtab*/@media(min-width:900px) and (max-width:1179px) and (max-height:900px){.wrap.hasr{grid-template-columns:200px minmax(0,1fr) 220px}.wrap.hasr .rad{display:block;position:sticky;top:calc(var(--tbh) + 8px);align-self:start;margin-top:8px}.rad .pic{width:fit-content;max-width:220px;margin:0 auto}.rad .pic img{width:auto;max-width:220px}/*radfit*/}
.abtg{font-size:9.5px;font-weight:800;background:#e8c46a;color:#3a2c06;border-radius:4px;padding:0 4px;margin-right:5px;vertical-align:1px}
/* ── 📣 홈이 아닌 화면의 맨 위 배너: 같은 배너를 줄여서(전체가 보이게) 맨 위 줄 바로 아래에 고정 (.hero.cp · 홈은 원래 크기 그대로) */
.hero.cp{position:sticky;top:var(--tbh);z-index:25;height:64px!important;min-height:0!important;aspect-ratio:auto!important;margin:0 0 8px!important;padding:0!important;border:0!important;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(16,32,60,.14);background:#0d203b}
.hero.cp .hs,.hero.cp .hsl{height:100%!important;min-height:0!important;aspect-ratio:auto!important}
.hero.cp .hsl img{width:100%;height:100%!important;object-fit:contain!important}
.hero.cp .hsl.cv img{object-fit:cover!important}
.hero.cp .ht{padding:0 14px!important;gap:1px!important;justify-content:center}
.hero.cp .h1{font-size:14px!important;line-height:1.25!important}.hero.cp .h2{font-size:11.5px!important;line-height:1.25!important}
.hero.cp .hc,.hero.cp .hd,.hero.cp .sh{display:none!important}
.hero.cp .hnav{transform:scale(.7)}
@media(min-width:760px){.hero.cp{height:84px!important}.hero.cp .h1{font-size:16px!important}.hero.cp .h2{font-size:13px!important}}
.hero.cp .hsl.cpt{background:linear-gradient(120deg,#173762,#0d203b)!important;display:flex!important;align-items:center;text-align:left}
.hero.cp .hsl.cpt .ht{position:static!important;background:none!important;color:#fff;padding:0 16px!important;display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero.cp .hsl.cpt .h2{color:#f1d38a!important}
.hero.cp .hsl.cpt .hk{align-self:flex-start}
/* 🩹 [10/16] 안쪽 화면(핸드복기·게임·AOF차트 등)에서도 광고 그림 배너는 3:1로 꽉 차게 (얇은 띠에 줄여 넣어 양옆이 비던 문제) · 위에 고정하지 않고 같이 스크롤 · PC·휴대폰 모두 (처음엔 휴대폰만 고쳐서 PC에서 다시 생겼음) */
.hero.cp.cpa{position:relative!important;top:auto!important;height:auto!important;aspect-ratio:3.83/1!important}
.hero.cp.cpa .hsl.adi img{object-fit:cover!important}
@media(min-width:760px){.hero.cp.cpa{aspect-ratio:1800/300!important}}
/* 🩹 [10/20] 태블릿·갤럭시 노트 가로(낮은) 화면에서 안쪽 화면 광고 배너가 화면을 다 가림 → 배너 높이를 화면 높이의 16% 이하(최소 56px)로 제한. 그림 비율은 그대로이고 줄어들면 가운데 정렬. 휴대폰 세로처럼 원래 16%보다 낮은 화면은 그대로. (숫자 16 = 화면 높이 %, 56px = 최소 높이) */
.hero.cp.cpa{--cph:max(56px,calc(16vh / var(--z,1)));width:min(100%,calc(var(--cph) * 3.83))!important;margin-left:auto!important;margin-right:auto!important}
@media(min-width:760px){.hero.cp.cpa{width:min(100%,calc(var(--cph) * 6))!important}}
/* ── 홈: 메인 배너(좌우로 밀기) · 바로가기 8칸 · 다가오는 대회 · 바로 한 판 */
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 26px rgba(13,32,59,.18);background:var(--navy)}
.hs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hsl{flex:none;width:100%;aspect-ratio:2.6/1;min-height:150px;scroll-snap-align:center;scroll-snap-stop:always;position:relative;border:0;padding:0;margin:0;cursor:pointer;text-align:left;color:#fff;font-family:inherit;display:block;overflow:hidden}
.hsl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.hsl.cv>img{object-fit:cover;object-position:center 40%}
.hsl.adi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}picture{display:contents}   /* 🩹 10/16: 광고 그림은 칸에 꽉 차게 (휴대폰에서 위아래 배경색 띠 생기던 문제 · 3:1 그림이면 양옆 8%쯤 잘림) */
.hsl .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,20,40,.82) 0,rgba(8,20,40,.55) 48%,rgba(8,20,40,.05) 100%)}
.hsl .ht{position:absolute;left:0;top:0;bottom:0;right:0;padding:16px 18px 26px;display:flex;flex-direction:column;justify-content:center;gap:4px;max-width:78%}
.hsl .hk{align-self:flex-start;font-size:10.5px;font-weight:900;background:var(--sun);color:#2b1d00;border-radius:6px;padding:1px 7px;letter-spacing:.2px}
.hsl .h1{font-size:20px;font-weight:900;line-height:1.25;letter-spacing:-.5px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.hsl .h2{font-size:13px;font-weight:700;opacity:.92;line-height:1.35}
.hsl .hc{align-self:flex-start;margin-top:6px;font-size:13px;font-weight:900;background:#fff;color:var(--navy);border-radius:999px;padding:6px 13px}
.hd{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.hd i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:width .2s}

Object.assign(ST_NAME,{'싱글레이즈':'넛 우위: 싱글레이즈 팟','3벳팟':'넛 우위: 3벳 팟','4벳팟':'넛 우위: 4벳 팟'});   // 🧭 nutadv 유형(10/18)
let SM=null,SMT=0;
function stLocal(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.slice(0,3)==='st_'){const v=lsGet(k,null);
  if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).every(t=>Array.isArray(v[t])&&v[t].length===2))o[k.slice(3)]=v;}}}catch(e){}return o;}
function stLoad(){if(!API||!NICK||Date.now()-SMT<60000)return;SMT=Date.now();
  fetch(API+'/api/study/me?nick='+encodeURIComponent(NICK),{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r&&r.ok){SM=r;draw();}}).catch(()=>{});}
function stWeak(){const T=(SM&&SM.tags&&Object.keys(SM.tags).length)?SM.tags:stLocal(),a=[];
  Object.keys(T).forEach(g=>Object.keys(T[g]||{}).forEach(t=>{const v=T[g][t];if(Array.isArray(v)&&v[1]>=5)a.push({g,t,ok:v[0],n:v[1],p:v[0]/v[1]});}));
  return a.sort((x,y)=>x.p-y.p||y.n-x.n).slice(0,3);}
function stPf(){let s={};try{s=lsGet('pf_stat',{})||{};}catch(e){}return Object.keys(s).filter(k=>Array.isArray(s[k])&&s[k][1]>=5).map(k=>({t:k,ok:s[k][0],n:s[k][1],p:s[k][0]/s[k][1]})).sort((x,y)=>x.p-y.p||y.n-x.n).slice(0,3);}
function stCard(){stLoad();const w=stWeak(),pf=stPf();
  if(!w.length&&!pf.length&&!(SM&&SM.days)&&!stAll().length)return '<div class="note" style="margin-bottom:10px">💰 팟 오즈를 풀면 여기에 약점과 연속 학습일이 쌓여요</div>';
  const bar=x=>{const p=Math.round(x.p*100);return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${esc(ST_NAME[x.t]||x.t)}</span><span><b>${p}%</b> <span style="color:var(--sub)">(${x.ok}/${x.n})</span></span></div><div style="height:6px;border-radius:3px;background:var(--line);overflow:hidden"><div style="height:100%;width:${p}%;background:${p<40?'#d33b3b':p<70?'var(--gold)':'var(--green)'}"></div></div></div>`;};
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>📊 내 학습 현황</b><span class="m">${NICK?esc(NICK):'이 기기 기록'}</span></div>`
   +(SM&&SM.days?`<div style="margin:6px 0 2px;font-size:14.5px">🔥 연속 <b>${SM.streak}</b>일 · 오늘 <b>${SM.today}</b>문제</div>`:'')
   +(w.length?`<div class="sec" style="margin:8px 0 2px">약한 유형</div>${w.map(bar).join('')}`:'<div class="m" style="text-align:left;margin-top:6px">유형당 5문제 이상 풀면 약한 유형을 알려줘요</div>')
   +(pf.length?`<div class="sec" style="margin:10px 0 2px">푸시/폴드 약한 자리</div>${pf.map(bar).join('')}`:'')
   +(()=>{const A=stAll();if(!A.length)return '';/*stx 10/18 약점 상세*/
    return `<button type="button" class="btn full gr" style="margin-top:10px;padding:8px;font-size:14px" onclick="STX=!STX;draw()">${STX?'접기 ▴':'📋 유형별 전체 보기 ▾'}</button>`
     +(STX?A.map(o=>`<div class="sec" style="margin:12px 0 2px;display:flex;justify-content:space-between"><span>${o.gm.e} ${esc(o.gm.n)}</span><a data-nav="1" data-go="1" href="${B}/hub/study.html${GV()}#g=${o.gm.k}" style="color:var(--blue);font-weight:700">연습 ›</a></div>`+o.rows.map(x=>bar(x)+(x.n<5?'<div class="m" style="text-align:right;font-size:11.5px;margin-top:-4px">5문제 미만 — 더 풀어 보세요</div>':'')).join('')).join(''):'');})()
   +'</div>';}
let STX=false;   // 📋 유형별 전체 보기 펼침
function stAll(){const T=(SM&&SM.tags&&Object.keys(SM.tags).length)?SM.tags:stLocal(),L=uq(D.gl);   // 게임별 모든 유형(정답률 낮은 순)
 return Object.keys(T).map(g=>{const gm=L.find(x=>x.k===g);const rows=Object.keys(T[g]||{}).map(t=>{const v=T[g][t];return Array.isArray(v)&&v[1]>0?{g,t,ok:v[0],n:v[1],p:v[0]/v[1]}:null;}).filter(Boolean).sort((x,y)=>x.p-y.p||y.n-x.n);return gm&&rows.length?{gm,rows}:null;}).filter(Boolean);}
// 🧭 트랙: 게임 키를 입문 → 중급 → 토너로 묶음. 여기 없는 게임은 '기타'에 자동으로 나와요 (트랙을 바꾸려면 이 한 줄만 고치면 됨)
const TRACKS=[{n:'🌱 입문',d:'룰과 팟 계산부터',k:['rulequiz','potodds']},{n:'🌿 중급',d:'지오메트리 · 넛 우위 · 리버 · 레인지',k:['geom','nutadv','riverq','huview']},{n:'🏆 토너',d:'숏스택 · 헤즈업 실전',k:['pushfold','aofprac','hustudy']}];
function stGame(k){const T=(SM&&SM.tags&&Object.keys(SM.tags).length)?SM.tags:stLocal();const o=T[k]||{};let ok=0,n=0;
  Object.keys(o).forEach(t=>{const v=o[t];if(Array.isArray(v)){ok+=v[0]|0;n+=v[1]|0;}});return {ok,n};}
function gProgHtml(k){const s=stGame(k);if(s.n>0)return '<span class="gb">정답률 '+Math.round(s.ok/s.n*100)+'% · '+s.n+'문제</span>';return gBest(k)?'<span class="gb">내 기록 있음</span>':'';}
// 📒 내 오답노트: 학습 게임에서 틀린 문제(이 기기 wn_<게임키>)를 게임별로 → 누르면 그 게임 오답노트 바로 시작(study.html #g=키&w=1, p7.js render)
const WN_KEYS=['potodds','geom','nutadv','rulequiz','aofprac','riverq'];
function wnCard(){const L=uq(D.gl),R=[];WN_KEYS.forEach(k=>{const g=L.find(x=>x.k===k);let n=0;try{n=(lsGet('wn_'+k,[])||[]).length;}catch(e){}if(g&&n)R.push({g,n});});
 if(!R.length)return '';const tot=R.reduce((a,r)=>a+r.n,0);
 return `<div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>📒 내 오답노트</b><span class="m">${tot}개 · 이 기기</span></div><div class="ggrid" style="margin-top:8px">${R.map(r=>`<a class="gtile" data-nav="1" data-go="1" href="${B}/hub/study.html${GV()}#g=${r.g.k}&w=1"><span class="ge">${r.g.e}</span><span class="gn">${esc(r.g.n)}</span><span class="gd">틀린 문제 ${r.n}개 다시 풀기</span></a>`).join('')}</div></div>`;}
function holdemPage(){const L=uq(D.gl).filter(x=>x.c==='홀덤');const by={},used=new Set();L.forEach(x=>{by[x.k]=x;});
 const sec=(t,g)=>{if(!g.length)return '';const done=g.filter(x=>stGame(x.k).n>0||gBest(x.k)).length;
  return `<div class="sec">${t.n}${t.d?' <span class="m" style="font-weight:500">'+esc(t.d)+'</span>':''} <span class="m" style="font-weight:500">· ${done}/${g.length} 시작</span></div><div class="ggrid">${g.map(gTile).join('')}</div>`;};
 const parts=TRACKS.map(t=>sec(t,t.k.map(k=>{used.add(k);return by[k];}).filter(Boolean)));
 const rest=L.filter(x=>!used.has(x.k));
 return head('🎓 홀덤학습',`${L.length}종`)
  +stCard()+wnCard()
  +`<button type="button" class="gtile grank" data-k="fame" onclick="FT='study';lsSet('ft',FT)" style="width:100%;font:inherit;text-align:left;cursor:pointer"><span class="ge">👑</span><span><span class="gn">명예의 전당 · 랭킹</span><br><span class="gd">홀덤학습 TOP · 내 순위 · 업적</span></span></button>`
  +(L.length?parts.join('')+sec({n:'🧩 기타',d:''},rest):'<div class="e">준비 중이에요</div>')
  +'<div class="note" style="text-align:center;margin-top:10px">게임 화면의 목록 버튼을 누르면 이 목록으로 돌아와요</div>';}
function gamesPage(){const L=uq(D.gl);const CT=['카드','퍼즐','대전·도구'];const tile=gTile;
 return head('🎮 뚝섬 게임',`${L.filter(x=>CT.includes(x.c)).length}종`)
  +coffeeCard()
  +`<button type="button" class="gtile grank" data-k="fame" onclick="FT='game';lsSet('ft',FT)" style="width:100%;font:inherit;text-align:left;cursor:pointer"><span class="ge">👑</span><span><span class="gn">명예의 전당 · 랭킹</span><br><span class="gd">게임 TOP · 내 순위 · 업적</span></span></button>`
  +CT.map(c=>{const g=L.filter(x=>x.c===c);return g.length?`<div class="sec">${c}</div><div class="ggrid">${g.map(tile).join('')}</div>`:'';}).join('')
  +'<div class="note" style="text-align:center;margin-top:10px">게임 화면의 ← 홈 을 누르면 이 목록으로 돌아와요</div>';}
// 포스터: 공식 = APL / WPL / 한게임 / 피망 / (새 공식○○ 폴더) · APL 안에서 공식·제휴업체 선택 · 고를 게 없는 곳은 이미지가 바로 보임
// 🌏 해외 공식 = 깃허브 '해외공식' 폴더(intl) + 새 '해외공식○○' 폴더(예: 해외공식WSOP → WSOP 버튼) · 폴더가 하나뿐이면 버튼 없이 이미지가 바로 보임
const PSUBS={po:{t:'📋 대회사 공식 포스터',pre:'공식',s:[['ofapl','APL',[['ofapl','공식'],['aplshop','제휴업체']]],['ofwpl','WPL'],['ofhg','한게임'],['ofpm','피망']]},
  poi:{t:'🌏 해외 공식 포스터',pre:'해외공식',hide0:1,s:[['intl','기타']]}};   // hide0: 포스터가 없는 버튼은 숨김
const PSEL={};
// 🔗 카톡 링크(…/hub/?home&sub=ofapl#po · &sub=ofapl/aplshop#po)로 열면 그 주최사 버튼이 바로 선택됨
(function(){try{const v=new URLSearchParams(location.search).get('sub'),t=location.hash.slice(1);if(!v||!PSUBS[t])return;const a=v.split('/');PSEL[t]=a[0];if(a[1])PSEL[t+':'+a[0]]=a[1];}catch(e){}})();
const pname=(n,t)=>(n.startsWith(t+'-')?n.slice(t.length+1):n).replace(/_/g,' ');
function pTab(tab){const c=PSUBS[tab],pre=c.pre||'공식';
  const auto={};Object.keys(POSTERS).filter(k=>k.startsWith(pre)&&k.length>pre.length).forEach(k=>{const i=k.indexOf('·'),p=i<0?k:k.slice(0,i);(auto[p]=auto[p]||[]).push(i<0?[k,'기본']:[k,k.slice(i+1)]);});   // '해외공식TMTC·일자별일정' 처럼 · 가 붙은 키 = 하위 폴더 → 부모(해외공식TMTC) 밑 2단 탭
  c.s=c.s.filter(x=>!x[3]).concat(Object.keys(auto).map(p=>{const a=auto[p];
    if(!a.some(y=>y[0]!==p))return [p,p.slice(pre.length),null,1];   // 하위 폴더 없음: 버튼 하나(이미지 바로 보임)
    return [p,p.slice(pre.length),a.filter(y=>y[0]!==p||PL(p).length),1];}));   // 하위 폴더 있음: 부모 버튼 + 2단 탭 (부모 폴더 바로 아래 이미지가 있으면 '기본' 탭으로)   // 새 '공식○○' / '해외공식○○' 폴더는 자동으로 버튼이 됨
  const cnt=x=>x[2]?x[2].reduce((a,y)=>a+PL(y[0]).length,0):PL(x[0]).length;
  let S=c.s;if(c.hide0){const f=S.filter(x=>cnt(x)>0);S=f.length?f:S.slice(0,1);}   // 🌏 해외: 포스터 없는 버튼은 숨김
  const sel=PSEL[tab]||S[0][0],cur=S.find(x=>x[0]===sel)||S[0];
  const chips=S.length<2?'':`<div class="psub">${S.map(x=>`<button type="button" class="${x[0]===cur[0]?'on':''}" onclick="PSEL['${tab}']='${x[0]}';draw()">${x[1]} <span class="m">${cnt(x)}</span></button>`).join('')}</div>`;
  if(!cur[2])return head(c.t,'누르면 크게')+chips+thumbs(cur[0]);   // 고를 게 없으면 이미지가 바로 보임
  const k2=PSEL[tab+':'+cur[0]]||cur[2][0][0];
  const chips2=`<div class="psub sm">${cur[2].map(([k,l])=>`<button type="button" class="${k===k2?'on':''}" onclick="PSEL['${tab}:${cur[0]}']='${k}';draw()">${l} <span class="m">${PL(k).length}</span></button>`).join('')}</div>`;
  return head(c.t,'누르면 크게')+chips+chips2+thumbs(k2);}   // APL 안(공식·제휴업체)도 다른 탭처럼 이미지가 바로 보임
// 🏆 리더보드 '내 성적 입력' (서버 itm.py /api/itm/add · mine · delete = 카톡 !@입상 · !@입상취소와 같은 표) · 로그인 닉네임으로만 등록
function itmBtn(){return MEM.tok?`<button type="button" class="btn brfull" style="margin-top:10px" onclick="itmAdd()">🏆 내 성적 등록 · 수정 · 삭제</button>`
  :`<button type="button" class="btn brfull brgh" style="margin-top:10px" onclick="memOpen('login')">로그인하면 여기서 바로 입상 등록할 수 있어요</button>`;}
function itmAdd(){brSheet(`<div class="brst" id="itHd">🏆 내 성적 · 등록 · 수정 · 삭제</div>
   <div class="pubguide"><b>📌 이렇게 올라가요</b><div class="m" id="itPrev" style="font-weight:800;color:var(--ink)">-</div><span>등록 · 수정 · 삭제를 전부 이 창에서 해요 · 아래 '내가 등록한 입상'에서 ✏️수정 · 🗑️삭제</span></div>
   <div class="brf"><label for="itT">대회 이름 <span class="m">(참가했던 대회면 알아서 맞춰져요)</span></label><input id="itT" maxlength="40" autocomplete="off" placeholder="예: 피망 메인 · 뉴스톤 데일리"></div>
   <div class="brf2"><div class="brf"><label for="itD">날짜</label><input id="itD" type="date" max="${brDay(0)}" value="${brDay(0)}"></div><div class="brf"><label for="itR">등수</label><input id="itR" type="number" inputmode="numeric" min="1" max="999" placeholder="예: 3"></div></div>
   <div class="brf2"><div class="brf"><label for="itK">상금 종류</label><select id="itK"><option value="money">💵 상금 (만원)</option><option value="ticket">🎟️ 티켓</option><option value="seat">🪑 시트</option><option value="invite">✉️ 초대권</option><option value="voucher">🏪 매장이용권(포인트)</option><option value="none">없음</option></select></div><div class="brf" id="itAw"><label for="itA" id="itAl">상금 (만원)</label><input id="itA" type="number" inputmode="numeric" min="1" placeholder="예: 25"></div></div>
   <div id="itPick"></div>
   <div id="brMsg" class="brmsg" role="alert"></div><button type="submit" class="btn brfull" id="itGo">🏆 입상 등록</button><button type="button" class="btn brfull brgh" id="itEc" style="display:none;margin-top:6px">✕ 수정 그만두기 (새로 등록)</button>
   <div class="sec" style="margin-top:14px">내가 등록한 입상</div><div id="itMine"><div class="e">불러오는 중…</div></div>`,(w,close)=>{
    const $=s=>w.querySelector(s),v=id=>$(id).value.trim();
    const KL={money:['상금 (만원)','예: 25'],ticket:['장수','예: 1'],seat:['장수','예: 1'],invite:['장수','예: 1']};
    const prev=()=>{const k=$('#itK').value,a=v('#itA');const pz=k==='money'?(a?a+'만':'상금'):k==='none'?'상금 없음':$('#itK').selectedOptions[0].textContent.replace(/^\S+\s/,'')+(k==='voucher'?'':(a||1)+'장');
      $('#itPrev').textContent=[v('#itT')||'대회 이름',$('#itD').value?brMd($('#itD').value):'날짜',(v('#itR')||'?')+'등',pz].join(' · ');};
    const kind=()=>{const k=$('#itK').value,L=KL[k];$('#itAw').style.display=L?'':'none';if(L){$('#itAl').textContent=L[0];$('#itA').placeholder=L[1];}prev();};
    w.addEventListener('input',prev);w.addEventListener('change',e=>{if(e.target.id==='itK')kind();else prev();});kind();
    let eid=0;

const BR_PERS=[['7','7일'],['30','30일'],['90','3개월'],['180','6개월'],['365','1년'],['all','전체']];
function brPost(p,b){return memPost(p,Object.assign({token:MEM.tok},b||{}));}
function wm(v,sign){v=Math.round((+v||0)*10)/10;const a=Math.abs(v);if(!a)return '0';
  const s=a>=10000?Math.floor(a/10000)+'억'+(a%10000?' '+(Math.round(a%10000*10)/10).toLocaleString()+'만':''):a.toLocaleString()+'만';
  return (v<0?'−':(sign?'+':''))+s;}
const brCls=v=>v>0?'brp':v<0?'brm':'';
function brDay(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function brMd(d){if(!d||d.length<10)return '날짜 모름';const x=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));return (x.getMonth()+1)+'/'+x.getDate()+'('+WD[x.getDay()]+')';}
function brN(){return BR?(BR.wait||[]).length+(BR.itm||[]).length:0;}
function brLoad(force){if(!MEM.tok||!API)return;if(!force&&Date.now()-BR_T<15000)return;BR_T=Date.now();
  brPost('/api/br/state',{per:BR_PER}).then(r=>{if(r&&r.need_login){memLost(r);return;}if(!r||!r.ok)return;BR=r;BR_ALL=null;
    try{drawTabs();}catch(e){}
    if(inlOn)return;if(cur==='bank')draw();else if(cur==='home'){const s=document.getElementById('brslot');if(s)s.innerHTML=brHomeHtml();}});}
// 저장·지우기 뒤 아래에 '되돌리기' (4초)
function brToast(msg,undo){let t=document.getElementById('brT');if(t)t.remove();t=document.createElement('div');t.id='brT';t.className='brt';
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button">되돌리기</button>':''}`;document.body.appendChild(t);
  if(undo)t.querySelector('button').onclick=()=>{t.remove();brPost('/api/br/undo',{log:undo}).then(r=>{if(r&&r.ok){toast('되돌렸어요');brLoad(true);}else toast((r&&r.msg)||'되돌리지 못했어요');});};
  setTimeout(()=>{if(t.parentNode)t.remove();},4500);}
// 아래에서 올라오는 입력 창
function brSheet(html,onBind){let w=document.getElementById('brS');if(w)w.remove();w=document.createElement('div');w.id='brS';w.className='brsh';
  w.innerHTML=`<form class="brsb" novalidate><div class="brshd"><div class="brgrab"></div><button type="button" class="brxx" data-x="1" aria-label="닫기">✕</button></div><div class="brsc">${html}</div></form>`;
  document.body.appendChild(w);document.body.classList.add('lock');
  const close=()=>{w.remove();if(!ov.classList.contains('on')&&!pv.classList.contains('on'))document.body.classList.remove('lock');};
  w.addEventListener('click',e=>{if(e.target===w||e.target.closest('[data-x]'))close();});
  w.querySelector('form').addEventListener('submit',e=>e.preventDefault());
  w.addEventListener('click',e=>{const b=e.target.closest('[data-sd]');if(!b)return;const i=w.querySelector('#'+b.dataset.for);if(!i)return;i.value=Math.max(1,Math.min(999,brInt(b.dataset.for)+(+b.dataset.sd)));i.dispatchEvent(new Event('input',{bubbles:true}));});
  w.querySelectorAll('input').forEach(el=>el.addEventListener('focus',()=>setTimeout(()=>{try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}},350)));
  if(onBind)onBind(w,close);return w;}
const brSeg=(name,opts,val)=>`<div class="brseg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===val?'on':''}">${l}</button>`).join('')}</div>`;
const brMan=(id,val,ph)=>`<span class="brman"><input id="${id}" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" value="${val===''||val==null?'':val}" placeholder="${ph||'0'}"><i>만</i></span>`;
// − 숫자칸 ＋ : 숫자를 직접 쳐도 되고 버튼으로도 · data-sd 는 brSheet 가 처리
const brStepI=(id,val,lab)=>`<span class="brstep"><button type="button" data-sd="-1" data-for="${id}" aria-label="${lab} 빼기">−</button><input id="${id}" class="brsn" inputmode="numeric" autocomplete="off" value="${val}" aria-label="${lab}"><button type="button" data-sd="1" data-for="${id}" aria-label="${lab} 더하기">＋</button></span>`;
const brInt=(id,d)=>{const e=document.getElementById(id);const v=parseInt(String(e?e.value:'').replace(/[^0-9]/g,''),10);return isFinite(v)&&v>0?Math.min(v,999):(d||1);};
const brNum=id=>{const e=document.getElementById(id);if(!e)return 0;const v=parseFloat(String(e.value).replace(/[^0-9.]/g,''));return isFinite(v)?Math.round(v*10)/10:0;};

    ${I.map((x,i)=>`<div class="brr brrow"><span><span>${esc(x.title)}</span><br><span class="m brw">입상 기록이 있어요 · ${esc(x.rank)}${x.prize?' · '+wm(x.prize):''}</span></span><button type="button" class="btn brsmb brwb" onclick="brItm(${i})">확인</button></div>`).join('')}</div>`:'';
  const note=`<div class="m brnote">카톡 <b>!@참가</b> · 홈 참가 등록 · 여기서 <b>일정 추가</b>한 대회는 시작하면 '참가 중', 끝나면 '결과 입력 대기'로 자동으로 떠요</div>`;

function brPer(k){BR_PER=k;lsSet('brper',k);brLoad(true);}
function brRowHtml(x){const tag=x.kind==='s'?'<span class="brtag tk">새틀</span>':x.kind==='c'?'<span class="brtag">캐시</span>':'';

    :`${x.pay==='ticket'?`시드권 ${x.tk_n}장(${wm(x.tk_n*x.tk_val)})${x.paid?' + '+wm(x.paid):''}`:'낸 돈 '+wm(x.paid)+(x.entries>1?` (${x.entries}엔트리)`:'')}${x.ptk_n?` → 시드권 ${x.ptk_n}장(${wm(x.ptk_n*x.ptk_val)})`:x.prize?' → 상금 '+wm(x.prize):''}`;
  return `<button type="button" class="britem" onclick="brResult(${x.id})"><span><span>${esc(x.title)}</span>${tag}${pay}${x.edited?'<span class="brtag">수정됨</span>':''}<br><span class="m">${brMd(x.date)} · ${sub}</span></span><b class="${brCls(x.net)}">${wm(x.net,1)}</b></button>`;}
function brGraph(P,lbl){if(!P||P.length<2)return `<div class="card"><div class="brr"><b>누적 현금 손익</b><span class="m">${lbl}</span></div><div class="e" style="padding:14px">기록이 2개 이상 쌓이면 그래프가 그려져요</div></div>`;
  const W=320,H=90,pad=6,vs=P.map(p=>p[1]).concat([0]),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const X=i=>pad+(W-2*pad)*i/(P.length-1),Y=v=>pad+(H-2*pad)*(1-(v-mn)/rg);
  const pts=P.map((p,i)=>X(i).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' '),last=P[P.length-1];
  return `<div class="card"><div class="brr"><b>누적 현금 손익</b><span class="m">${lbl} · <b class="${brCls(last[1])}">${wm(last[1],1)}</b></span></div>
   <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="누적 손익 그래프"><line x1="0" y1="${Y(0).toFixed(1)}" x2="${W}" y2="${Y(0).toFixed(1)}" stroke="#cfd6e2" stroke-dasharray="3 4"/>
   <polygon points="${X(0).toFixed(1)},${Y(0).toFixed(1)} ${pts} ${X(P.length-1).toFixed(1)},${Y(0).toFixed(1)}" fill="rgba(31,95,174,.10)"/>
   <polyline points="${pts}" fill="none" stroke="#1f5fae" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(P.length-1).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="#1f5fae"/></svg>
   <div class="brr m"><span>${brMd(P[0][0])}</span><span>${brMd(last[0])}</span></div></div>`;}
// 홈 맨 위: 참가 중 · 결과 입력 대기 (로그인 회원만, 남한테는 안 보임)

  return L.map(x=>x.kind==='s'?`<div class="brhome live"><span><i></i><b>새틀 중</b> ${esc(x.title)}</span><span class="brstep sm"><button type="button" aria-label="1회 썼어요" onclick="brPack(${x.id},'use')">−</button><b>${Math.max(0,x.entries-(x.used||0))}회</b><button type="button" aria-label="1회 되돌리기" onclick="brPack(${x.id},'unuse')">＋</button><button type="button" class="end" onclick="go('bank')">마감</button></span></div>`
   :`<div class="brhome live"><span><i></i><b>참가 중</b> ${esc(x.title)}</span><span class="brstep sm"><button type="button" aria-label="엔트리 빼기" onclick="brEntry(${x.id},-1)">−</button><b>${x.entries}</b><button type="button" aria-label="엔트리 더하기" onclick="brEntry(${x.id},1)">＋</button><button type="button" class="end" onclick="brResult(${x.id})">종료</button></span></div>`).join('')
   +(n?`<button type="button" class="brhome" onclick="go('bank')"><span>💰 <b>결과 입력 대기 ${n}건</b> · 상금만 넣으면 끝</span><span>›</span></button>`:'');}

// ---------- 새틀 성적: 온라인 · 오프라인 합계 + 새틀라이트별 (쓴 돈 → 딴 시드권 종류·장수·가치) ----------
function brSatHtml(Q){if(!Q||!(Q.by||[]).length)return '';
  const pc=v=>v==null?'-':(v>0?'+':'')+v+'%';
  const sum=(l,x,sub)=>x.n?`<div class="brsat0"><span class="brsatl">${l}${sub?'<br><span class="m">'+sub+'</span>':''}</span><span class="brsatv">${wm(x.cost)} → ${wm(x.val)}</span><b class="${brCls(x.roi)}">${pc(x.roi)}</b></div>`:'';
  return `<div class="card brsat"><div class="brr"><b>🎫 새틀 성적</b><span class="m">쓴 돈 → 딴 시드권 가치</span></div>
   ${sum('온라인',Q.on,'')}${sum('오프라인',Q.off,'토너 ROI에도 포함')}
   <div class="brsatby">${Q.by.map(g=>`<div class="brsatr"><span><span>${esc(g.name)} <i class="brsattag${g.on?'':' off'}">${g.on?'온라인':'오프라인'}</i></span><br><span class="m">${g.on?'결제':'참가'} ${g.n}번${g.live?' · 진행 중':''} · 쓴 돈 ${wm(g.cost)} → ${g.tk.length?g.tk.map(t=>esc(t[0])+' '+t[1]+'장').join(', ')+' = '+wm(g.val):(g.val?wm(g.val):'못 땄어요')}</span></span><b class="${brCls(g.roi)}">${pc(g.roi)}</b></div>`).join('')}</div>
   <div class="m brsatn">이름이 같은 새틀끼리 묶어요 · 오프라인은 토너 기록 중 이름에 '새틀'이 있거나 시드권을 받은 것</div></div>`;}
// ---------- 온라인 새틀권 묶음 (예: 5회 새틀권 35만 · 게임머니는 새틀 할 수 있는 횟수) ----------
function brPackCard(x){const left=Math.max(0,x.entries-(x.used||0));
  return `<div class="brlive"><div class="brlt"><i></i>온라인 새틀 진행 중 · ${brMd(x.date)}부터</div>
    <div><b>${esc(x.title)}</b><div class="m">산 값 ${wm(x.paid)} (손익에 바로 들어가 있어요) · ${x.entries}회 중 ${x.used||0}회 씀</div></div>
    <div class="brr"><span class="brl">남은 새틀</span><span class="brstep"><button type="button" aria-label="1회 썼어요" onclick="brPack(${x.id},'use')">−</button><b>${left}회</b><button type="button" class="pl" aria-label="잘못 뺐어요 (1회 되돌리기)" onclick="brPack(${x.id},'unuse')">＋</button></span></div>
    <div class="brr"><span class="brl">딴 시드권</span><span class="brstep"><button type="button" aria-label="딴 시드권 빼기" onclick="brPack(${x.id},'unwin')">−</button><b>${x.ptk_n||0}장</b><button type="button" class="pl" aria-label="딴 시드권 더하기" onclick="brPack(${x.id},'win')">＋</button></span></div>
    <div class="brbtn2"><button type="button" class="btn brgh" onclick="brPackBuy(${x.id})">＋ 추가 결제</button><button type="button" class="btn" onclick="brResult(${x.id})">마감 · 시드권 입력</button></div>
    <button type="button" class="brlink" onclick="brSkip(${x.id})">잘못 넣었어요 (지우기)</button></div>`;}
function brPack(id,act,amt,d){return brPost('/api/br/pack',{id,act,amt:amt||0,d:d||0}).then(r=>{if(!r||!r.ok){toast((r&&r.msg)||'잘 안 됐어요');return r;}
    const x=(BR.live||[]).find(z=>z.id===id);if(x){x.entries=r.entries;x.used=r.used;x.paid=r.paid;x.ptk_n=r.won;}
    if(act==='use'||act==='unuse')toast(`남은 새틀 ${Math.max(0,r.entries-r.used)}회`);else if(act==='win')toast(`시드권 ${r.won}장 땄어요 🎉`);
    if(cur==='bank'&&!inlOn)draw();else{const s=document.getElementById('brslot');if(s)s.innerHTML=brHomeHtml();}brLoad(true);return r;});}
function brPackBuy(id){brSheet(`<div class="brst">추가 결제</div><div class="m">새틀권을 더 샀거나 게임머니를 충전했을 때 넣어요</div>
   <div class="brr"><label for="brKb">결제한 금액</label>${brMan('brKb','','0')}</div>
   <div class="brr"><span><b>새틀 할 수 있는 횟수</b><br><span class="m">새틀권 장수 · 게임머니면 할 수 있는 횟수</span></span>${brStepI('brKn',5,'새틀 횟수')}</div>
   <div id="brMsg" class="brmsg" role="alert"></div><button type="submit" class="btn brfull" id="brKs">추가</button>`,(w,close)=>{
    w.querySelector('#brKs').onclick=()=>{const a=brNum('brKb');if(!a){w.querySelector('#brMsg').textContent='결제한 금액을 넣어주세요';return;}brPack(id,'buy',a,brInt('brKn',5)).then(r=>{if(r&&r.ok)close();});};});}

// ---------- 동작 ----------
function brEntry(id,d){brPost('/api/br/entry',{id,d}).then(r=>{if(r&&r.ok){const x=(BR.live||[]).find(z=>z.id===id);if(x){x.entries=r.entries;x.paid=r.paid;}
  if(cur==='bank')draw();else{const s=document.getElementById('brslot');if(s)s.innerHTML=brHomeHtml();}toast(`엔트리 ${r.entries}`);}else toast((r&&r.msg)||'잘 안 됐어요');});}
function brSkip(id){brPost('/api/br/del',{id}).then(r=>{if(r&&r.ok){brToast('참가 안 함으로 했어요',r.undo);brLoad(true);}else toast((r&&r.msg)||'잘 안 됐어요');});}
function brMdSet(id,on){brPost('/api/br/md',{id,d:on}).then(r=>{if(r&&r.ok){toast(on?'멀티데이 진행 중으로 뒀어요':'참가 중으로 되돌렸어요');brLoad(true);}else toast((r&&r.msg)||'잘 안 됐어요');});}
function brStartId(id){brPost('/api/br/start',{id}).then(r=>{if(r&&r.ok){toast('참가 중으로 바꿨어요');brLoad(true);}});}
function brStartEv(e){brPost('/api/br/start',{ev:e}).then(r=>{if(r&&r.ok){toast('지금 참가 중 · 엔트리는 맨 위에서 체크');const s=document.getElementById('brS');if(s)s.remove();document.body.classList.remove('lock');BRV='main';if(cur!=='bank')go('bank');brLoad(true);}else toast((r&&r.msg)||'잘 안 됐어요');});}
function brFind(id){const all=[].concat(BR?BR.live||[]:[],BR?BR.md||[]:[],BR?BR.wait||[]:[],BR?BR.upcoming||[]:[],BR?BR.recent||[]:[],BR_ALL?BR_ALL.items||[]:[]);return all.find(x=>x.id===id);}
function brItm(i){const c=(BR.itm||[])[i];if(!c)return;
  brSheet(`<div class="brst">입상 기록을 찾았어요</div><div class="m">같은 닉네임으로 등록된 입상 기록이에요. 본인 기록이 맞을 때만 넣어 주세요.</div>
   <div class="brwbox"><div class="brr"><b>${esc(c.title)}</b><span class="m">${brMd(c.date)}</span></div><div class="brr"><span>순위 <b>${esc(c.rank)||'-'}</b></span><span>상금 <b>${c.prize?wm(c.prize):esc(c.ptxt)||'-'}</b></span></div></div>
   <div class="m">맞으면 결과 입력 창이 열려요. 바인만 확인하고 저장하면 돼요. 확인 전에는 아무것도 저장되지 않아요.</div>
   <div class="brbtn2"><button type="button" class="btn brgh" id="brNo">제 기록 아니에요</button><button type="button" class="btn" id="brYes">맞아요, 넣기</button></div>`,(w,close)=>{
    w.querySelector('#brNo').onclick=()=>{brPost('/api/br/hide',{ev:{ref:c.ref}});BR.itm.splice(i,1);close();draw();};
    w.querySelector('#brYes').onclick=()=>{close();const same=(BR.wait||[]).find(x=>x.date===c.date);
      if(same)brResult(same.id,{prize:c.prize,ref:c.ref});else brResult(0,{title:c.title,date:c.date,prize:c.prize,ref:c.ref,src:'itm'});};});}

// ---------- 결과 입력 · 기록 추가 · 고치기 (한 창) ----------
// x: 기존 기록(예정·참가 중·기록됨) 또는 새 기록 기본값
function brResult(id,pre){pre=pre||{};const old=id?brFind(id):null;if(id&&!old){toast('기록을 찾지 못했어요');return;}
  const x=Object.assign({kind:'t',pay:'cash',date:brDay(0),time:'',title:'',venue:'',entries:1,buyin:0,paid:0,prize:0,tk_id:0,tk_n:0,ptk_n:0,ptk_val:0,hours:0,memo:''},old||{},pre);
  if(old&&old.status!=='done'&&!old.paid)x.paid=(x.buyin||0)*(x.entries||1);
  const tks=(BR&&BR.tickets||[]).filter(t=>t.n>0||t.id===x.tk_id);
  const myTk=(BR&&BR.tickets||[]).map(t=>`<option value="${esc(t.name)}">`).join('');
  let ptkName='';if(x.ptk_n&&old){const t=(BR.tickets||[]).find(t=>t.id===old.ptk_id);ptkName=t?t.name:'';}
  const isNew=!old,isPlan=old&&old.status!=='done',head0=isPlan?`<div class="m">${x.kind==='s'?'진행 중인 온라인 새틀':x.md?'멀티데이 진행 중 · 마지막 결과 입력':old.src==='part'?'카톡 !@참가로 등록한 대회':old.src==='sched'?'일정 추가한 대회':'참가 중인 대회'}</div><div class="brst">${esc(x.title)}</div><div class="m">${brMd(x.date)}${x.time?' '+esc(x.time):''}${x.kind==='s'?` · ${x.entries}회 · 산 값 ${wm(x.paid)}`:x.buyin?' · 바인 '+wm(x.buyin):''}</div>`
    :`<div class="brst">${isNew?'기록 추가':'기록 고치기'}</div>`;
  const canMd=!x.md&&(!isPlan||x.kind==='t'),mdDone=!!(old&&old.status==='done');
  const prizeWay=pre.pw||(x.ptk_n?'tk':x.prize?'cash':(x.kind==='s'&&!old?'tk':'none'));
  brSheet(`${head0}
   ${isPlan?'':`<div class="brf"><label for="brTi">대회 이름</label><input id="brTi" maxlength="40" autocomplete="off" value="${esc(x.title)}" placeholder="예: 평택 HIT GTD"></div>
   <div class="brf2"><div class="brf"><span class="brlab"><label for="brDa">날짜</label> <label class="brnd"><input type="checkbox" id="brNdC" ${x.date?'':'checked'}> 날짜 모름</label></span><input id="brDa" type="date" value="${esc(x.date)}" ${x.date?'':'disabled'}></div><div class="brf"><label for="brVe">매장 <span class="m">(선택)</span></label><input id="brVe" maxlength="30" autocomplete="off" value="${esc(x.venue||'')}"></div></div>`}
   ${isPlan?'':`<div class="brf"><label>종류</label>${brSeg('kind',[['t','토너먼트'],['s','새틀라이트'],['c','캐시게임']],x.kind)}</div>`}
   ${canMd?`<div class="brf" id="brDyW"><label>게임</label>${brSeg('dy',[['one','원데이'],['md','멀티데이 진행 중']],'one')}<div class="m" id="brDyH" hidden>데이2·파이널이 남았으면 이걸로 두고, 마지막 날 끝나면 종료 · 상금 입력${mdDone?' · 넣어 둔 상금은 지워져요':''}</div></div>`:''}
   <div id="brTS">
    <div class="brf" id="brPayW"><label>바인 낸 방법</label>${brSeg('pay',[['cash','현금'],['ticket','시드권'],['stake','스테이킹']],x.pay)}</div>
    <div class="brbox" id="brPC">${x.kind==='s'&&isPlan?`<div class="m brpk">${x.entries}회 중 ${x.used||0}회 씀${x.entries>(x.used||0)?` · 남은 ${x.entries-(x.used||0)}회가 있어요 (더 쓸 거면 닫고 계속 쓰세요)`:''}</div>`:''}
     <div class="brr" id="brEnR"><span><b id="brEnL">엔트리</b><br><span class="m" id="brEnS">리엔트리 포함</span></span><span class="brstep"><button type="button" data-en="-1" aria-label="엔트리 빼기">−</button><b id="brEn">${x.entries||1}</b><button type="button" data-en="1" aria-label="엔트리 더하기">＋</button></span></div>
     <div class="brr" id="brBuR"><label for="brBu" id="brBuL">바인 (1엔트리)</label>${brMan('brBu',x.buyin||'')}</div>
     <div class="brr"><label for="brPa" id="brPaL">실제 낸 금액</label>${brMan('brPa',x.paid||'')}</div>
     <div class="brr"><span class="m" id="brPaH">얼리 할인 등은 ±로 맞춰요</span><span class="brstep"><button type="button" data-pa="-1">−1만</button><button type="button" data-pa="1">＋1만</button></span></div></div>
    <div class="brbox" id="brPT" hidden>
     ${tks.length?`<div class="m">내 시드권에서 골라요</div><div class="brchips" id="brTk">${tks.map(t=>`<button type="button" data-tk="${t.id}" class="${t.id===x.tk_id||(!x.tk_id&&t===tks[0])?'on':''}">${esc(t.name)} (${t.n}장${t.val?' · '+wm(t.val):''})</button>`).join('')}</div>
      <div class="brr"><span>쓴 장수</span><span class="brstep"><button type="button" data-tn="-1">−</button><b id="brTn">${x.tk_n||1}</b><button type="button" data-tn="1">＋</button></span></div>
      <div class="brr"><label for="brPa2">현금으로 더 낸 돈 <span class="m">(리엔트리 등)</span></label>${brMan('brPa2',x.pay==='ticket'?(x.paid||''):'')}</div>
      <div class="m">시드권 가치가 바인으로 계산돼요</div>`
     :`<div class="m">등록된 시드권이 없어요. <button type="button" class="brlink" onclick="BRV='tk';document.getElementById('brS').remove();document.body.classList.remove('lock');go('bank');">내 시드권에서 먼저 넣기 ›</button></div>`}</div>
    <div class="brf" id="brPW"><label>상금</label>${brSeg('pw',[['none','못 받음'],['cash','현금'],['tk','시드권']],prizeWay)}</div>
    <div id="brPZc" hidden>${brMan('brPz',x.prize||'','상금')}</div>
    <div id="brPZt" hidden><div class="brf"><label for="brPn">받은 시드권 이름</label><input id="brPn" list="brTkL" maxlength="30" autocomplete="off" value="${esc(ptkName)}" placeholder="예: APL 시드권"><datalist id="brTkL">${myTk}</datalist></div>
     <div class="brr"><span>장수</span>${brStepI('brPnn',x.ptk_n||1,'장수')}</div>
     <div class="brr"><label for="brPv">장당 가치 <span class="m">(본선 바인)</span></label>${brMan('brPv',x.ptk_val||'')}</div>
     </div>
   </div>
   <div id="brCS" hidden>
    <div class="brr"><label for="brCi">바인 (총 투입)</label>${brMan('brCi',x.kind==='c'?x.paid||'':'')}</div>
    <div class="brr"><label for="brCo">캐시아웃</label>${brMan('brCo',x.kind==='c'?x.prize||'':'')}</div>
    <div class="brr"><label for="brHr">플레이 시간 <span class="m">(선택)</span></label><span class="brman"><input id="brHr" inputmode="decimal" autocomplete="off" value="${x.hours||''}" placeholder="0"><i>시간</i></span></div></div>
   <div class="brbox brr" id="brNB"><span class="m">이번 경기 손익</span><b id="brNet" class="brnet">0</b></div>
   <div id="brMsg" class="brmsg" role="alert"></div>
   <div class="brbtn2">${isPlan?'<button type="button" class="btn brgh" id="brSk">참가 안 함</button>':old?'<button type="button" class="btn brgh" id="brDel">지우기</button>':''}<button type="submit" class="btn" id="brSv">저장</button></div>`,(w,close)=>{
    const $=s=>w.querySelector(s),segv=n=>{const b=w.querySelector(`[data-seg="${n}"] .on`);return b?b.dataset.v:'';};
    let dy='one',kind=x.kind,pay=x.pay,pw=prizeWay,en=x.entries||1,tn=x.tk_n||1,tkSel=x.tk_id||(tks[0]&&tks[0].id)||0;
    const tkVal=()=>{const t=(BR.tickets||[]).find(t=>t.id===tkSel);return x.tk_id===tkSel&&x.tk_val?x.tk_val:t?t.val||0:0;};
    function vis(){const sat=kind==='s';if(sat&&pay!=='cash'){pay='cash';w.querySelectorAll('[data-seg="pay"] button').forEach(z=>z.classList.toggle('on',z.dataset.v==='cash'));}
      $('#brPayW').hidden=sat;$('#brEnR').hidden=sat;$('#brBuR').hidden=sat;$('#brEnL').textContent=sat?'결제 횟수':'엔트리';$('#brEnS').textContent=sat?'같은 금액을 몇 번 결제했는지':'리엔트리 포함';$('#brBuL').textContent=sat?'1회 결제 금액':'바인 (1엔트리)';
      $('#brTS').hidden=kind==='c';$('#brCS').hidden=kind!=='c';$('#brPC').hidden=pay==='ticket';$('#brPT').hidden=pay!=='ticket';
      const dw=$('#brDyW');if(dw){dw.hidden=kind!=='t';if(kind!=='t'&&dy==='md'){dy='one';dw.querySelectorAll('[data-seg="dy"] button').forEach(z=>z.classList.toggle('on',z.dataset.v==='one'));}}
      const mdOn=dy==='md';$('#brPW').hidden=mdOn;$('#brNB').hidden=mdOn;$('#brPZc').hidden=mdOn||pw!=='cash';$('#brPZt').hidden=mdOn||pw!=='tk';
      const dh=$('#brDyH');if(dh)dh.hidden=!mdOn;const sk0=$('#brSk');if(sk0)sk0.hidden=mdOn;$('#brSv').textContent=mdOn?'멀티데이 진행 중으로 두기':'저장';
      $('#brPaL').textContent=sat?'새틀에 쓴 돈 (산 값 합계)':pay==='stake'?'내가 낸 돈':'실제 낸 금액';$('#brPaH').textContent=sat?'결제 금액이 달랐으면 ±로 맞춰요':pay==='stake'?'스테이커가 다 냈으면 0':'얼리 할인 등은 ±로 맞춰요';
      const pl=w.querySelector('[data-seg="pw"] [data-v="cash"]');if(pl)pl.textContent=pay==='stake'?'내 몫 현금':'현금';calc();}
    function calc(){let cost=0,prize=0;
      if(kind==='c'){cost=brNum('brCi');prize=brNum('brCo');}
      else{cost=pay==='ticket'?tn*tkVal()+brNum('brPa2'):brNum('brPa');
        prize=pw==='cash'?brNum('brPz'):pw==='tk'?brInt('brPnn')*brNum('brPv'):0;}
      const v=Math.round((prize-cost)*10)/10,n=$('#brNet');n.textContent=wm(v,1);n.className='brnet '+brCls(v);}

  brSheet(`<div class="brst">지금 하는 대회</div><div class="m">끝나면 '종료 · 상금 입력'을 눌러 결과를 넣어요</div>
   <div class="brf"><label for="brLt">대회 이름</label><input id="brLt" maxlength="40" autocomplete="off" placeholder="예: 건대 야자수 데일리"></div>
   <div class="brf2"><div class="brf"><label for="brLv">매장 <span class="m">(선택)</span></label><input id="brLv" maxlength="30" autocomplete="off"></div><div class="brf"><label for="brLh">시작 시각</label><input id="brLh" type="time" value="${hm}"></div></div>
   <div class="brr"><label for="brLb">바인 (1엔트리)</label>${brMan('brLb','','0')}</div>
   <div id="brMsg" class="brmsg" role="alert"></div><button type="submit" class="btn brfull" id="brLs">참가 시작</button>`,(w,close)=>{
    w.querySelector('#brLs').onclick=()=>{const t=w.querySelector('#brLt').value.trim();if(!t){w.querySelector('#brMsg').textContent='대회 이름을 적어주세요';w.querySelector('#brLt').focus();return;}
      brStartEv({d:brDay(0),t:w.querySelector('#brLh').value||hm,title:t,venue:w.querySelector('#brLv').value.trim(),buyin:brNum('brLb')});};});}

// ---------- 잔고 설정 ----------
function brMoney(){brSheet(`<div class="brst">잔고 설정</div>
   <div class="brpriv"><b>정해진 뱅크롤이 없어도 돼요</b><span>있는 돈으로 바인하는 분이 대부분이에요. 그럴 땐 <b>0으로 두세요</b> · 손익만 쌓여요</span></div>
   ${brSeg('mk',[['start','시작 잔고'],['io','넣음·뺌'],['adjust','잔고 맞추기']],'start')}
   <div id="brM0"><div class="brr"><label for="brM0i">지금 가진 홀덤 자금</label>${brMan('brM0i','','0')}</div><div class="m">다시 넣으면 그때부터 새로 계산해요. 시드권은 '내 시드권'에서 따로 넣어요.</div></div>
   <div id="brM1" hidden>${brSeg('io',[['in','넣었어요'],['out','뺐어요']],'in')}<div class="brr"><label for="brM1i">금액</label>${brMan('brM1i','','0')}</div><div class="m">넣고 뺀 돈은 잔고만 바꾸고 손익·ROI에는 안 들어가요.</div></div>
   <div id="brM2" hidden><div class="brr"><label for="brM2i">실제 잔고</label>${brMan('brM2i',BR&&BR.has_start?BR.cash:'','0')}</div><div class="m">기록을 빠뜨려서 숫자가 안 맞을 때 실제 금액으로 맞춰요. 차이는 '잔고 조정'으로 남아요.</div></div>
   <div id="brMsg" class="brmsg" role="alert"></div><button type="submit" class="btn brfull" id="brMs">저장</button>`,(w,close)=>{
    let mk='start',io='in';const $=s=>w.querySelector(s);
    w.querySelector('[data-seg="mk"]').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;mk=b.dataset.v;w.querySelectorAll('[data-seg="mk"] button').forEach(z=>z.classList.toggle('on',z===b));$('#brM0').hidden=mk!=='start';$('#brM1').hidden=mk!=='io';$('#brM2').hidden=mk!=='adjust';});
    w.querySelector('[data-seg="io"]').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;io=b.dataset.v;w.querySelectorAll('[data-seg="io"] button').forEach(z=>z.classList.toggle('on',z===b));});
    $('#brMs').onclick=()=>{const kind=mk==='io'?io:mk,amt=brNum(mk==='start'?'brM0i':mk==='io'?'brM1i':'brM2i');
      if(mk==='io'&&!amt){$('#brMsg').textContent='금액을 적어주세요';return;}
      brPost('/api/br/money',{kind,amt}).then(r=>{if(r&&r.ok){close();brToast(r.msg||'저장했어요',r.undo);brLoad(true);}else $('#brMsg').textContent=(r&&r.msg)||'잘 안 됐어요';});};});}

// ---------- 일정 추가 (휴대폰 캘린더 알림) ----------
function brPlan(e){const A=[[1440,'하루 전'],[180,'3시간 전'],[60,'1시간 전'],[30,'30분 전']];let a=60;
  const save=cb=>{if(e.saved){if(cb)cb();return;}e.saved=1;brPost('/api/br/plan',{ev:e}).then(r=>{if(r&&r.ok){brLoad(true);if(cb)cb();}else{e.saved=0;toast((r&&r.msg)||'잘 안 됐어요');}});};
  const gUrl=()=>{const s=(e.d+'T'+(e.t||'12:00')).replace(/[-:]/g,'')+'00',st=new Date(+e.d.slice(0,4),+e.d.slice(5,7)-1,+e.d.slice(8,10),+(e.t||'12:00').slice(0,2),+(e.t||'12:00').slice(3,5)),en=new Date(st.getTime()+4*3600e3);
    const f=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+s+'/'+f(en)+'&ctz=Asia/Seoul&location='+encodeURIComponent(e.venue||'')+'&details='+encodeURIComponent('뚝섬유원지에서 추가한 대회 일정'+(e.buyin?' · 바인 '+wm(e.buyin):''));};
  const iUrl=()=>API+'/api/br/ics?t='+encodeURIComponent(e.title)+'&d='+e.d+'&tm='+encodeURIComponent(e.t||'')+'&a='+a+'&loc='+encodeURIComponent(e.venue||'');
  brSheet(`<div class="m">${e.ref?'대회 일정 · 포스터에서 가져옴':'참가 예정'}</div><div class="brst">${esc(e.title)}</div><div class="m">${brMd(e.d)}${e.t?' '+esc(e.t):''}${e.buyin?' · 바인 '+wm(e.buyin):''}</div>
   ${e.saved?`<div class="brbox m" style="color:#1f7a3d">✅ 참가 예정에 들어가 있어요</div>`:`<button type="button" class="btn brfull" id="brSv0">📅 참가 예정에 넣기</button>`}
   <div class="brf"><label>휴대폰 알림 <span class="m">(선택)</span></label><div class="brchips" id="brAl">${A.map(([v,l])=>`<button type="button" data-a="${v}" class="${v===a?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="brbox m">알림은 휴대폰 캘린더가 보내요. 아래 버튼을 누르면 캘린더 앱에 일정이 들어가요.</div>
   <a class="btn brfull brgh" id="brGc" target="_blank" rel="noopener" href="#">구글 캘린더에 추가</a><div class="m" style="text-align:center">구글 캘린더는 내 기본 알림 시간으로 들어가요</div>
   <a class="btn brfull brgh" id="brIc" href="#">아이폰·삼성 캘린더에 추가</a>
   <div class="m">추가한 대회는 '참가 예정'으로 저장돼서, 시작하면 '지금 참가 중', 끝나면 '결과 입력 대기'로 떠요.</div>`,(w)=>{
    const g=w.querySelector('#brGc'),ic=w.querySelector('#brIc'),upd=()=>{g.href=gUrl();ic.href=iUrl();};upd();
    w.querySelector('#brAl').addEventListener('click',ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;a=+b.dataset.a;w.querySelectorAll('#brAl button').forEach(z=>z.classList.toggle('on',z===b));upd();});
    g.addEventListener('click',()=>save());ic.addEventListener('click',()=>save());
    const s0=w.querySelector('#brSv0');if(s0)s0.onclick=()=>save(()=>{s0.outerHTML='<div class="brbox m" style="color:#1f7a3d">✅ 참가 예정에 넣었어요 · 알림이 필요하면 아래 캘린더 버튼</div>';toast('참가 예정에 넣었어요');});});}

// ---------- 전체 기록 ----------
function brAllLoad(){brPost('/api/br/items',{}).then(r=>{if(r&&r.ok){BR_ALL=r;if(cur==='bank'&&(BRV==='all'||BRV==='sum')&&!inlOn)draw();}});}
function brAllHtml(){if(!BR_ALL){brAllLoad();return brBack('전체 기록')+'<div class="card e">불러오는 중…</div>';}
  const F=[['all','전체'],['t','토너'],['s','새틀'],['c','캐시']],L=BR_ALL.items.filter(x=>BR_AF==='all'||x.kind===BR_AF);
  const by={};L.forEach(x=>{const k=(x.date||'').slice(0,7);(by[k]=by[k]||[]).push(x);});
  const mv=(BR_ALL.moves||[]).filter(m=>m.kind!=='start'||true);
  const MK={start:'시작 잔고',in:'입금',out:'출금',adjust:'잔고 조정',tkloss:'시드권 만료·삭제'};
  return brBack('전체 기록')+`<div class="brper">${F.map(([k,l])=>`<button type="button" class="${k===BR_AF?'on':''}" onclick="BR_AF='${k}';draw()">${l}</button>`).join('')}</div>`
   +(Object.keys(by).length?Object.keys(by).sort().reverse().map(k=>{const s=by[k].reduce((a,x)=>a+x.net,0);
     return `<div class="brmh"><span>${k?(+k.slice(0,4))+'년 '+(+k.slice(5,7))+'월':'날짜 모름'}</span><span><b class="${brCls(s)}">${wm(s,1)}</b> · ${by[k].length}개</span></div><div class="card brlist">${by[k].map(brRowHtml).join('')}</div>`;}).join(''):'<div class="card e">기록이 없어요</div>')
   +(mv.length&&BR_AF==='all'?`<div class="brmh"><span>잔고·시드권 이동</span><span class="m">손익에는 시드권 만료만 들어가요</span></div><div class="card brlist">${mv.map(m=>`<div class="britem"><span><span>${MK[m.kind]||m.kind}</span>${m.memo?'<br><span class="m">'+esc(m.memo)+'</span>':''}<br><span class="m">${brMd(m.date)}</span></span><b class="${m.kind==='tkloss'?'brm':''}">${m.kind==='start'||m.kind==='adjust'?wm(m.amt,m.kind==='adjust'):wm(m.amt,1)}</b></div>`).join('')}</div>`:'')
   +'<div class="m brnote">기록을 누르면 고치거나 지울 수 있어요. 고친 기록은 \'수정됨\'으로 표시되고 바꾸기 전 값도 남아요.</div>';}
// ---------- 큰 숫자 내역 · 고치기 (파란 카드를 누르면) ----------
function brSumGo(){BRV='sum';draw();try{window.scrollTo(0,0);}catch(e){}}
function brSumHtml(){const T='숫자 내역 · 고치기';if(!BR)return brBack(T)+'<div class="card e">불러오는 중…</div>';
  if(!BR_ALL){brAllLoad();return brBack(T)+'<div class="card e">불러오는 중…</div>';}
  const r1=v=>Math.round((+v||0)*10)/10,cn=x=>r1((x.prize||0)-(x.paid||0));
  const L=BR_ALL.items||[],M=(BR_ALL.moves||[]).slice().sort((a,b)=>a.id-b.id),P=(BR.live||[]).filter(x=>x.kind==='s');
  const pk=r1(P.reduce((a,x)=>a+(x.paid||0),0));
  const st=BR.has_start?M.filter(m=>m.kind==='start').pop()||null:null;
  const inS=x=>!st||x.created==null||x.created>=(st.created||0);   // 잔고를 넣은 뒤 기록만 잔고에 더해짐 (서버 _cash 와 같음)
  const G=L.filter(inS),OLD=L.filter(x=>!inS(x));
  const gin=r1(G.reduce((a,x)=>a+(x.prize||0),0)),gout=r1(G.reduce((a,x)=>a+(x.paid||0),0));
  const mv=st?M.filter(m=>['in','out','adjust'].includes(m.kind)&&m.id>st.id):[];
  const mvs=r1(mv.reduce((a,m)=>a+(m.amt||0),0));
  const total=st?r1((st.amt||0)+mvs+gin-gout-pk):r1(gin-gout-pk);
  const shown=BR.has_start?BR.cash:(BR.all_cnet==null?BR.all_net:BR.all_cnet);
  const ln=(l,v,sub)=>`<div class="brsl"><span>${l}${sub?`<br><span class="m">${sub}</span>`:''}</span><b class="${brCls(v)}">${wm(v,1)}</b></div>`;
  const f=`<div class="card brsum"><div class="brh3">${BR.has_start?'현금 잔고':'현금 손익'}은 이렇게 계산돼요</div>`
   +(st?`<div class="brsl"><span>시작 잔고<br><span class="m">${brMd(st.date)}에 넣음</span></span><b>${wm(st.amt)}</b></div>`+(mv.length?ln('넣고 뺀 돈 · 잔고 맞추기',mvs,mv.length+'번'):''):'')
   +ln('받은 현금 (상금)',gin,'경기 기록 '+G.length+'개 합계')
   +ln('낸 현금 (바인)',-gout,'시드권으로 낸 바인은 현금이 아니라서 빠져요')
   +(P.length?ln('진행 중 온라인 새틀권 산 값',-pk,P.length+'개 · 산 날 바로 빠져요'):'')
   +`<div class="brsl tot"><span>= ${BR.has_start?'지금 현금 잔고':'현금 손익'}</span><b class="${BR.has_start?'':brCls(shown)}">${BR.has_start?wm(shown):wm(shown,1)}</b></div>`
   +(Math.abs(total-shown)>0.05?`<div class="m">※ 위 합계와 ${wm(r1(shown-total),1)} 차이가 있어요. 새로고침해 보세요</div>`:'')
   +`<button type="button" class="btn brfull brgh" onclick="brMoney()">💵 ${BR.has_start?'잔고 설정 · 실제 잔고로 맞추기':'잔고 넣기'}</button></div>`;
  const row=x=>{const c=cn(x),tk=x.pay==='ticket'?` · 시드권 ${x.tk_n}장 바인(현금 아님)`:'',pt=x.ptk_n?` · 시드권 ${x.ptk_n}장 받음(현금 아님)`:'';
    const tag=x.kind==='s'?'<span class="brtag tk">새틀</span>':x.kind==='c'?'<span class="brtag">캐시</span>':'';
    return `<button type="button" class="britem" onclick="brResult(${x.id})"><span><span>${esc(x.title)}</span>${tag}${x.edited?'<span class="brtag">수정됨</span>':''}<br><span class="m">${brMd(x.date)} · 낸 현금 ${wm(x.paid||0)} → 받은 현금 ${wm(x.prize||0)}${tk}${pt}</span></span><b class="${brCls(c)}">${wm(c,1)}</b></button>`;};
  const pks=P.length?`<div class="brmh"><span>진행 중 온라인 새틀</span><span><b class="brm">${wm(-pk,1)}</b></span></div>`+P.map(brPackCard).join(''):'';
  const recs=`<div class="brmh"><span>경기 기록 ${G.length}개</span><span><b class="${brCls(r1(gin-gout))}">${wm(r1(gin-gout),1)}</b></span></div>`
   +`<div class="card brlist">${G.length?G.map(row).join(''):'<div class="e">아직 끝난 경기 기록이 없어요</div>'}</div>`;
  const old=OLD.length?`<div class="brmh"><span>잔고 넣기 전 기록 ${OLD.length}개</span><span class="m">시작 잔고에 이미 들어 있어요</span></div><div class="card brlist brold">${OLD.map(row).join('')}</div>`:'';
  const tks=(BR.tickets||[]).filter(t=>t.n>0);
  const have=tks.length?`<div class="brmh"><span>가진 시드권 · 큰 숫자엔 안 들어가요</span><span class="m">${BR.tk_value?'가치 '+wm(BR.tk_value):''}</span></div><div class="card brlist">${tks.map(t=>`<button type="button" class="britem" onclick="BRV='tk';draw()"><span><span>${esc(t.name)}</span><br><span class="m">장당 ${t.val?wm(t.val):'가치 없음'} · 누르면 장수·가치 고치기</span></span><b>${t.n}장</b></button>`).join('')}</div>`:'';
  return brBack(T)+f+pks+recs+old+have
   +`<div class="m brnote">줄을 누르면 고치거나 지울 수 있어요. 저장하면 아래에 4초 동안 <b>되돌리기</b>가 떠요. 기간별로 보려면 <button type="button" class="brlink" onclick="BRV='all';draw()">전체 기록 ›</button></div>`;}
function brBack(t){return `<div class="brback"><button type="button" onclick="BRV='main';draw()">‹ 내 뱅크롤</button><b>${t}</b></div>`;}

// ---------- 내 시드권 ----------
function brTkHtml(){if(!BR)return brBack('내 시드권')+'<div class="card e">불러오는 중…</div>';const L=BR.tickets||[];
  return brBack('내 시드권')+`<div class="card brlist">${L.length?L.map(t=>`<div class="brtkr"><div class="brr"><span><b>${esc(t.name)}</b> <span class="m">장당 ${t.val?wm(t.val):'가치 없음'}</span>${t.last?`<br><span class="m">최근: ${esc(t.last)}</span>`:''}</span>
     <span class="brstep"><button type="button" aria-label="한 장 빼기" onclick="brTk('n',${t.id},-1)">−</button><b>${t.n}</b><button type="button" aria-label="한 장 더하기" onclick="brTk('n',${t.id},1)">＋</button></span></div>
     <div class="brtka"><button type="button" onclick="brTkVal(${t.id})">가치 고치기</button><button type="button" onclick="brTk('expire',${t.id})">만료</button><button type="button" onclick="brTk('del',${t.id})">삭제</button></div></div>`).join(''):'<div class="e">등록된 시드권이 없어요</div>'}</div>
   <div class="card"><div class="brh3">새 시드권 추가</div>
    <div class="brf"><label for="brTkN">이름 <span class="m">(내가 알아보기 쉽게)</span></label><input id="brTkN" maxlength="30" autocomplete="off" placeholder="예: APL 시드권 · HPT 메인"></div>
    <div class="brr"><span>장수</span><span class="brstep"><button type="button" onclick="brTkAddN(-1)">−</button><b id="brTkC">1</b><button type="button" onclick="brTkAddN(1)">＋</button></span></div>
    <div class="brr"><label for="brTkV">장당 가치 <span class="m">(본선 바인)</span></label>${brMan('brTkV','','0')}</div>
    <button type="button" class="btn brfull" onclick="brTkAdd()">추가</button></div>
   <div class="m brnote">대회에서 시드권으로 바인을 내거나 상금으로 받으면 자동으로 줄고 늘어요. ±로 바꾼 것도 기록에 남아요.<br><b>만료</b>: 기간이 지나 못 쓰게 된 시드권 (WPL 등) · <b>삭제</b>: 의미 없는 시드권 (게임머니 등). 둘 다 남은 가치만큼 손실로 들어가요. 연장되는 시드권(HPT 등)은 그대로 두면 돼요.</div>`;}
let BR_TKN=1;function brTkAddN(d){BR_TKN=Math.max(1,Math.min(99,BR_TKN+d));const e=document.getElementById('brTkC');if(e)e.textContent=BR_TKN;}
function brTkAdd(){const n=(document.getElementById('brTkN').value||'').trim();if(!n){toast('시드권 이름을 적어주세요');return;}
  brPost('/api/br/ticket',{act:'add',tk:{name:n,n:BR_TKN,val:brNum('brTkV')}}).then(r=>{if(r&&r.ok){BR_TKN=1;brToast('추가했어요',r.undo);brLoad(true);}else toast((r&&r.msg)||'잘 안 됐어요');});}
function brTk(act,id,d){const t=(BR.tickets||[]).find(x=>x.id===id);if(!t)return;
  if((act==='expire'||act==='del')&&!confirm(`${t.name} ${t.n}장을 ${act==='expire'?'만료':'삭제'}할까요?`+(t.n*t.val?`\n남은 가치 ${wm(t.n*t.val)}가 손실로 들어가요.`:'')))return;

    <div class="pubguide"><b>📌 포스터 이름은 이 순서로 붙어요</b>
     <div class="pubbox"><div><small>날짜</small><b id="pubP1">-</b></div><div><small>시간</small><b id="pubP2">-</b></div><div><small>매장명</small><b id="pubP3">-</b></div><div><small>대회 이름</small><b id="pubP4">-</b></div></div>
     <span>아래 칸만 채우면 이 순서대로 자동으로 만들어져요. 캘린더와 봇이 이 이름으로 날짜·시간·매장을 알아봐요.</span>
     <ul><li><b>매장명</b>은 지역까지 같이, 띄어서 → <code>건대 야자수</code> · <code>평택 HIT</code></li><li><b>대회 이름</b>은 짧게 → <code>GTD 300만</code> · <code>데일리</code></li></ul>
     <div class="pubprev">파일 이름 <code id="pubPrev">-</code></div></div>
    <div class="brf"><label for="pubV">매장명 <span class="m">(지역까지 같이, 띄어서)</span></label><input id="pubV" maxlength="30" autocomplete="off" placeholder="예: 건대 야자수" value="${pubVal('pubV','')}" oninput="pubSave(this)"></div>
    <div class="brf"><label for="pubT">대회 이름</label><input id="pubT" maxlength="40" autocomplete="off" placeholder="예: GTD 300만" value="${pubVal('pubT','')}" oninput="pubSave(this)"></div>
    <div class="brf"><label>언제 열려요?</label><div class="brseg" id="pubK"><button type="button" data-v="date" class="${PUB_K==='date'?'on':''}" onclick="pubKind('date')">하루 (날짜)</button><button type="button" data-v="week" class="${PUB_K==='week'?'on':''}" onclick="pubKind('week')">매주 (요일)</button></div></div>
    <div class="brf2"><div class="brf" id="pubDW" ${PUB_K==='week'?'hidden':''}><label for="pubD">날짜</label><input id="pubD" type="date" min="${today}" value="${pubVal('pubD',today)}" onchange="pubSave(this)"></div>
     <div class="brf" id="pubWW" ${PUB_K==='week'?'':'hidden'}><label>요일</label><div class="brchips" id="pubW">${PUB_DAYS.map(d=>`<button type="button" class="${PUB_W.includes(d)?'on':''}" onclick="pubDay('${d}',this)">${d}</button>`).join('')}</div></div>
     <div class="brf"><label for="pubH">시작 시각</label><input id="pubH" type="time" value="${pubVal('pubH','19:00')}" onchange="pubSave(this)"></div></div>
    <div class="brf"><label for="pubN">메모 <span class="m">(선택 · 바인 · GTD · 주소 등)</span></label><textarea id="pubN" maxlength="200" rows="2" class="pubta" placeholder="예: 바인 6만, GTD 300만, 리엔트리 2회" oninput="pubSave(this)">${pubVal('pubN','')}</textarea></div>
    <div class="brf"><label for="pubF">포스터 이미지 <span class="m">(한 대회 포스터가 여러 장이면 같이 · 최대 ${PUB_MAXN}장)</span></label><input id="pubF" type="file" accept="image/*" multiple onchange="pubPick(this)"><div id="pubP" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${pubThumbs()}</div></div>
    <div id="pubMsg" class="brmsg" role="alert"></div>
    <button type="button" class="btn brfull" id="pubGo" onclick="pubSend()">📮 올리기</button></div>
   <div class="brmh"><span>내가 올린 포스터</span><span class="m">승인되면 10~20분 뒤 캘린더에 보여요</span></div>
   <div class="card brlist" id="pubList">${pubListHtml()}</div>`;}
// 승인 때 쓸 파일명 미리보기 (서버 pubpost.pub_suggest_name 과 같은 규칙)
function pubPrevUp(){const el=document.getElementById('pubPrev');if(!el)return;const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const sf=t=>t.replace(/[\\/:*?"<>|.,#%&{}$!'@`=+]+/g,' ').replace(/\s+/g,' ').trim();
  const codes={월:'mon',화:'tue',수:'wed',목:'thu',금:'fri',토:'sat',일:'sun'},wk=PUB_DAYS.filter(d=>PUB_W.includes(d));
  const d6=v('pubD').replace(/-/g,'').slice(2),hm=v('pubH').replace(':',''),ven=sf(v('pubV')),tt=sf(v('pubT')),bad=ven&&ven.split(' ').length<2;
  const head=PUB_K==='week'?wk.map(d=>codes[d]).join(''):d6;
  const set=(id,t,ok)=>{const e=document.getElementById(id);if(e){e.textContent=t;e.className=ok?'':'no';}};
  set('pubP1',PUB_K==='week'?(wk.length?'매주 '+wk.join('·'):'요일 고르기'):(d6||'날짜 고르기'),PUB_K==='week'?wk.length:d6);
  set('pubP2',hm||'시간',hm);set('pubP3',ven||'예: 건대 야자수',ven&&!bad);set('pubP4',tt||'예: GTD 300만',tt);
  el.textContent=[head||'날짜',hm||'시간',ven||'매장명',tt||'대회이름'].join(' ');
  el.className=bad?'bad':'';const m=document.getElementById('pubMsg');if(m)m.textContent=bad?"매장명은 지역까지 같이 띄어 써 주세요 (예: 건대 야자수)":'';}
function pubKind(k){PUB_K=k;document.querySelectorAll('#pubK button').forEach(b=>b.classList.toggle('on',b.dataset.v===k));const a=document.getElementById('pubDW'),b=document.getElementById('pubWW');if(a)a.hidden=k==='week';if(b)b.hidden=k!=='week';pubPrevUp();}
function pubDay(d,el){const i=PUB_W.indexOf(d);if(i<0)PUB_W.push(d);else PUB_W.splice(i,1);el.classList.toggle('on',i<0);pubPrevUp();}
// 큰 사진은 휴대폰에서 줄여서 보냄 (긴 변 2000px · JPEG) · 🖼 여러 장 고르기 / 더 고르면 뒤에 붙음 / ✕ 로 한 장 빼기
function pubThumbs(){return PUB_IMG.map((u,i)=>`<div style="position:relative;width:96px"><img src="${u}" alt="포스터 ${i+1}" style="width:96px;height:128px;object-fit:contain;background:#f5f7fa;border-radius:10px;display:block"><span style="position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:0 5px">${i+1}</span><button type="button" aria-label="${i+1}번째 사진 빼기" onclick="pubDrop(${i})" style="position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:24px;padding:0">✕</button></div>`).join('');}
function pubThumbsUp(){const P=document.getElementById('pubP');if(P)P.innerHTML=pubThumbs();}
function pubDrop(i){PUB_IMG.splice(i,1);pubThumbsUp();}
function pubShrink(f){return new Promise(ok=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const M=2000,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.88));};
    im.onerror=()=>ok('');im.src=rd.result;};rd.onerror=()=>ok('');rd.readAsDataURL(f);});}
async function pubPick(inp){const F=[...(inp.files||[])];inp.value='';if(!F.length)return;const M=document.getElementById('pubMsg');if(M)M.textContent='';
  const room=PUB_MAXN-PUB_IMG.length;if(room<=0){if(M)M.textContent=`한 번에 ${PUB_MAXN}장까지예요. 다른 대회 포스터는 따로 올려 주세요`;return;}
  let bad=0,over=0;for(const f of F){if(PUB_IMG.length>=PUB_MAXN){over++;continue;}const u=await pubShrink(f);if(!u){bad++;continue;}if(!PUB_IMG.includes(u))PUB_IMG.push(u);}   // 같은 사진을 또 고르면 한 번만
  pubThumbsUp();
  if(M)M.textContent=(over?`${PUB_MAXN}장까지만 넣었어요 (${over}장 뺌). `:'')+(bad?`${bad}장은 열 수 없어요 (jpg·png로 다시)`:'');}
function pubSend(){const M=document.getElementById('pubMsg'),v=id=>(document.getElementById(id)||{}).value||'';M.textContent='';
  const b={token:MEM.tok,venue:v('pubV').trim(),title:v('pubT').trim(),kind:PUB_K,date:v('pubD'),days:PUB_W.slice(),time:v('pubH'),note:v('pubN').trim(),datas:PUB_IMG.slice()};
  if(b.venue.split(/\s+/).length<2){M.textContent="매장명은 지역까지 같이 띄어 써 주세요 (예: 건대 야자수)";document.getElementById('pubV').focus();return;}
  if(!b.title){M.textContent='대회 이름을 적어주세요';return;}
  if(PUB_K==='week'&&!b.days.length){M.textContent='요일을 하나 이상 골라주세요';return;}
  if(!PUB_IMG.length){M.textContent='포스터 이미지를 골라주세요';return;}
  const G=document.getElementById('pubGo');G.disabled=true;G.textContent='올리는 중…';
  memPost('/api/pub/submit',b).then(r=>{G.disabled=false;G.textContent='📮 올리기';
    if(r&&r.ok){toast(r.msg||'올렸어요 · 관리자 확인 뒤 캘린더에 들어가요');PUB_IMG=[];PUB_W=[];delete PUB_FORM.pubT;delete PUB_FORM.pubN;['pubT','pubN','pubF'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});pubThumbsUp();pubLoad(true);}
    else if(r&&r.need_login)memLost(r);else M.textContent=(r&&r.msg)||'잘 안 됐어요. 다시 해주세요';});}

// ===================== 📨 건의 · 문의 (회원 → 운영자만 봐요 · 서버 pubpost.py /api/ask/*) =====================
// 👤 내 정보 → '건의 · 문의' (#ask). 내가 쓴 글과 운영자 답변만 보이고 다른 회원 글은 안 보여요
let ASK_MINE=null,ASK_T=0,ASK_K='idea',ASK_FORM={},ASK_NEW=0,ASK_PEEK=0;
const ASK_KINDS=[['idea','💡 건의'],['ask','❓ 문의'],['bug','🐞 오류 신고'],['etc','💬 기타']];
function askSave(el){ASK_FORM[el.id]=el.value;}
function askLoad(force){if(!MEM.tok||!API)return;if(!force&&Date.now()-ASK_T<15000)return;ASK_T=Date.now();
  memPost('/api/ask/mine',{token:MEM.tok}).then(r=>{if(r&&r.need_login){memLost(r);return;}if(r&&r.ok){ASK_MINE=r.items;ASK_NEW=0;const el=document.getElementById('askList');if(el)el.innerHTML=askListHtml();}});}
// 내 정보 화면의 '새 답변' 표시 (1분에 한 번만 물어봄 · 읽음 처리는 안 함)
function askPeek(){if(!MEM.tok||!API||Date.now()-ASK_PEEK<60000)return;ASK_PEEK=Date.now();
  memPost('/api/ask/mine',{token:MEM.tok,page:'peek'}).then(r=>{if(r&&r.ok&&r.unread!==ASK_NEW){ASK_NEW=r.unread||0;if(cur==='me')draw();}});}
function askListHtml(){if(!ASK_MINE)return '<div class="e">불러오는 중…</div>';if(!ASK_MINE.length)return '<div class="e">아직 남긴 글이 없어요</div>';
  const KN=Object.fromEntries(ASK_KINDS);
  return ASK_MINE.map(x=>{const st=x.answer?['답변 왔어요','#1f7a3d','#e3f4e8']:x.status==='done'?['확인했어요','#1f5fae','#e4edf8']:['확인 기다리는 중','#b45309','#fef3c7'];
    const dt=new Date((x.created||0)*1000),d=(dt.getMonth()+1)+'/'+dt.getDate();
    return `<div class="britem" style="cursor:default;display:block"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><span><b>${esc(KN[x.kind]||'💬 기타')} · ${esc(x.title)}</b>${x.seen===0?' <b style="color:#d33b3b;font-size:12px">NEW</b>':''}<br><span class="m">${d}</span></span><b style="font-size:12px;color:${st[1]};background:${st[2]};border-radius:8px;padding:3px 8px;white-space:nowrap">${st[0]}</b></div>
     <div style="white-space:pre-wrap;font-size:13.5px;margin-top:6px;color:var(--sub)">${esc(x.body)}</div>
     ${x.answer?`<div style="white-space:pre-wrap;font-size:13.5px;margin-top:8px;background:#eef6ee;border-radius:10px;padding:8px 10px"><b>🙋 운영자 답변</b><br>${esc(x.answer)}</div>`:''}</div>`;}).join('');}
function askPage(){
  if(!MEM.tok)return head('📨 문의하기','')+`<div class="card brlock"><div class="brli">📨</div><b>운영자에게 바로 전해요</b><p>건의 · 문의 · 오류 신고를 남기면<br>운영자만 보고 여기로 답변해 드려요.<br>회원만 남길 수 있어요.</p>
    <div style="background:#ecfdf3;border:2px solid #3a9d3f;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:center;line-height:1.55"><div style="font-size:16px;font-weight:900;color:#1f6b3a">✨ 가입 10초! 정말 쉬워요</div><div style="font-size:14px;color:#1f4d2e;margin-top:3px"><b>아이디 + 숫자 6자리 + 카톡 닉네임</b>만 적으면 끝<br>카톡 채팅방 닉네임으로 연동돼요 · 모든 기능 무료</div></div><div class="brlb"><button type="button" class="btn" onclick="memOpen('reg')">10초 회원가입</button><button type="button" class="btn brgh" onclick="memOpen('login')">로그인</button></div></div>`;
  askLoad();
  const v=(id)=>esc(ASK_FORM[id]||'');
  return head('📨 문의하기','건의 · 질문 · 오류 신고 · 운영자만 봐요')
   +`<div class="card"><div class="m" style="margin-bottom:10px">남긴 글은 <b>운영자만</b> 볼 수 있어요. 답변은 이 화면 아래 '내가 남긴 글'에 와요.</div>
    <div class="brf"><label>종류</label><div class="brseg" id="askK">${ASK_KINDS.map(([k,n])=>`<button type="button" data-v="${k}" class="${ASK_K===k?'on':''}" onclick="askKind('${k}')">${n}</button>`).join('')}</div></div>
    <div class="brf"><label for="askT">제목</label><input id="askT" maxlength="60" autocomplete="off" placeholder="예: 게임 랭킹이 안 올라가요" value="${v('askT')}" oninput="askSave(this)"></div>
    <div class="brf"><label for="askB">내용</label><textarea id="askB" maxlength="2000" rows="6" class="pubta" placeholder="자세히 적어 주실수록 빨리 확인할 수 있어요 (오류는 어느 화면에서 무엇을 눌렀는지)" oninput="askSave(this)">${v('askB')}</textarea></div>
    <div id="askMsg" class="brmsg" role="alert"></div>
    <button type="button" class="btn brfull" id="askGo" onclick="askSend()">📨 운영자에게 보내기</button></div>
   <div class="sec">내가 남긴 글</div>
   <div class="card brlist" id="askList">${askListHtml()}</div>`;}
function askKind(k){ASK_K=k;document.querySelectorAll('#askK button').forEach(b=>b.classList.toggle('on',b.dataset.v===k));}
function askSend(){const M=document.getElementById('askMsg'),v=id=>((document.getElementById(id)||{}).value||'').trim();M.textContent='';
  const b={token:MEM.tok,kind:ASK_K,title:v('askT'),body:v('askB'),page:(navigator.userAgent||'').slice(0,60)};
  if(b.title.length<2){M.textContent='제목을 2자 이상 적어 주세요';document.getElementById('askT').focus();return;}
  if(b.body.length<5){M.textContent='내용을 5자 이상 적어 주세요';document.getElementById('askB').focus();return;}
  const G=document.getElementById('askGo');G.disabled=true;G.textContent='보내는 중…';
  memPost('/api/ask/submit',b).then(r=>{G.disabled=false;G.textContent='📨 운영자에게 보내기';
    if(r&&r.ok){toast('보냈어요 · 운영자가 확인하고 답변해 드려요',2600);ASK_FORM={};['askT','askB'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});askLoad(true);}
    else if(r&&r.need_login)memLost(r);else M.textContent=(r&&r.msg)||'잘 안 됐어요. 다시 해주세요';});}

// ===================== 🙋 참가 현황: 회원이 직접 참가 등록 · 취소 (서버 participation.py /api/part/add · cancel) =====================
function partAddBar(){return MEM.tok?`<div class="partbar"><button type="button" class="btn brfull" onclick="partAdd()">＋ 내가 참가하는 대회 추가</button><button type="button" class="btn brfull brgh" style="margin-top:6px" onclick="bungaeAdd()">⚡ 벙개 만들기 (모임·정모)</button><div class="m">카톡 <b>!@참가</b>와 같은 명단에 들어가요 · 대회 당일 오전 9시 알림 · 뱅크롤 '참가 예정'에도 자동으로 떠요</div></div>`
  :`<div class="partbar"><button type="button" class="btn brfull brgh" onclick="memOpen('login')">로그인하면 여기서 바로 참가 등록할 수 있어요</button></div>`;}
function partMine(x){if(!MEM.tok||!x.k||!x.people.some(p=>p.n===MEM.nick))return '';
  return `<div class="partme"><span>🙋 내가 참가해요</span><button type="button" onclick="partCancel('${esc(x.k)}')">참가 취소</button></div>`;}
// 🙋 카드 위 '참가하기' 버튼 (이미 목록에 있는 대회·벙개에 내 이름 추가 · 서버 /api/part/join) — 로그인 안 했거나 이미 참가면 만들지 않음
function partJoinBtn(x){if(!MEM.tok||!x.k||x.closed||x.people.some(p=>p.n===MEM.nick))return '';
  return `<div class="partme"><span>🙋 나도 참가할래요</span><button type="button" onclick="partJoin('${esc(x.k)}')">참가하기</button></div>`;}
function partJoin(k){memPost('/api/part/join',{token:MEM.tok,key:k}).then(r=>{
  if(r&&r.need_login){memLost(r);return;}
  if(!r||!r.ok){toast((r&&(r.msg||r.detail))||'등록하지 못했어요');return;}
  const g=D.parts.find(x=>x.k===k);if(g&&!g.people.some(p=>p.n===MEM.nick))g.people.push({n:MEM.nick,m:''});
  toast(r.msg||'참가 등록했어요');BR_T=0;if(!inlOn)draw();partLive(true);});}
// ⚡ 내가 연 벙개: 마감 · 다시 열기 · 취소 버튼 (서버가 만든 사람·방장인지 다시 확인 · /api/bungae/act)
function bungaeHost(x){if(!MEM.tok||!x.k||!/^custom:/.test(x.k)||!x.host||x.host!==MEM.nick)return '';
  const k=esc(x.k);
  return `<div class="partme"><span>⚡ 내가 연 벙개</span>${x.closed?`<button type="button" onclick="bungaeAct('${k}','open')">🔓 다시 열기</button>`:`<button type="button" onclick="bungaeAct('${k}','close')">🔒 마감</button>`}<button type="button" onclick="bungaeAct('${k}','cancel')">🗑️ 취소</button></div>`;}
function bungaeAct(k,act){const g=D.parts.find(x=>x.k===k);
  if(act==='cancel'&&!confirm(`${g?g.label:'이 벙개'} 벙개를 취소할까요?\n참가자 명단도 같이 없어져요`))return;
  memPost('/api/bungae/act',{token:MEM.tok,key:k,act}).then(r=>{
    if(r&&r.need_login){memLost(r);return;}
    if(!r||!r.ok){toast((r&&(r.msg||r.detail))||'처리하지 못했어요');return;}
    if(g){if(act==='cancel')D.parts.splice(D.parts.indexOf(g),1);else g.closed=(act==='close');}
    toast(r.msg||'처리했어요');BR_T=0;if(!inlOn)draw();partLive(true);});}
// 대회 고르기: 위 검색창(오늘 이후 전체) 또는 날짜 칩 → 카드를 누르면 바로 등록 · 목록에 없으면 정해진 양식으로 직접
function partAdd(){let day=brDay(0);
  brSheet(`<div class="brst">참가하는 대회 추가</div>
   <input type="search" id="ptQ" class="brq" placeholder="🔍 매장 · 대회 이름 (예: 뉴스톤, apl) · 오늘 이후 전체 검색" autocomplete="off" aria-label="대회 검색">
   <div id="ptBar"><div class="brchips" id="ptDays"><button type="button" data-d="0" class="on">오늘</button><button type="button" data-d="1">내일</button><button type="button" data-d="2">모레</button><input type="date" id="ptDp" aria-label="날짜 고르기" min="${brDay(0)}" value="${day}"></div></div>
   <button type="button" class="btn brfull brgh" id="ptMan">✏️ 목록에 없어요 · 직접 입력</button>
   <div id="ptEv"><div class="e">불러오는 중…</div></div>`,(w,close)=>{
    const $=s=>w.querySelector(s);
    let DAYL=[],SR=[],qTimer=0,qSeq=0;
    const keyOf=e=>'VENUE:'+e.d+':'+(/^\d\d:\d\d$/.test(e.t||'')?e.t:'')+':'+String(e.venue||'').replace(/ /g,'');
    const joined=e=>!!MEM.nick&&D.parts.some(g=>g.k===keyOf(e)&&g.people.some(p=>p.n===MEM.nick));
    const card=(e,i,at)=>`<div class="brev"><button type="button" data-${at}="${i}"><span class="ptt">${e.t?esc(e.t):'미정'}</span><span class="ptm"><span>${esc(e.title)}</span>${e.gtd?`<br><span class="m">GTD ${esc(e.gtd)}</span>`:''}</span><b${joined(e)?' class="ptj"':''}>${joined(e)?'✓ 등록됨':(e.buyin?wm(e.buyin):esc(e.buyin_txt)||'')}</b></button></div>`;
    // 🏆 메인 일정(type 'main')이 항상 맨 위 · 각 묶음 안의 순서(날짜·시간)는 서버가 준 그대로. 둘 다 있을 때만 구역 제목을 붙임
    const isMain=e=>e.type==='main';
    const mainFirst=L=>L.filter(isMain).concat(L.filter(e=>!isMain(e)));
    const paint=(L,at,withDate)=>{let last='',sec='';const two=L.some(isMain)&&L.some(e=>!isMain(e));
      return L.map((e,i)=>{let h='';
        if(two&&sec!==(isMain(e)?'m':'v')){sec=isMain(e)?'m':'v';last='';h=`<div class="ptdh"${sec==='m'?' style="background:#fff8e1;color:#8a5a00"':''}>${sec==='m'?'🏆 메인 일정':'🍺 매장 대회'}</div>`;}
        if(withDate&&e.d!==last){last=e.d;h+=`<div class="ptdh">${esc(brMd(e.d))}</div>`;}
        return h+card(e,i,at);}).join('');};
    const bind=(box,arr,at)=>box.querySelectorAll('[data-'+at+']').forEach(b=>b.onclick=()=>{const e=arr[+b.dataset[at]];partSend({d:e.d,t:e.t,venue:e.venue,title:e.title,ref:e.ref},close);});
    function load(){const box=$('#ptEv');box.innerHTML='<div class="e">불러오는 중…</div>';
      brPost('/api/br/events',{date:day}).then(r=>{if($('#ptQ').value.trim())return;
        if(r&&r.need_login){close();memLost(r);return;}if(!r||!r.ok){box.innerHTML='<div class="e">대회 목록을 못 불러왔어요</div>';return;}
        DAYL=mainFirst(r.events.filter(e=>e.type!=='sat'));
        box.innerHTML=`<div class="m">${esc(brMd(day))} 대회 (포스터·종합캘린더 기준) · 누르면 바로 참가 등록돼요</div><div class="brevl">${paint(DAYL,'pi',false)||'<div class="e">이날 대회 정보가 없어요 · 위 직접 입력을 써 주세요</div>'}</div>`;
        bind(box,DAYL,'pi');});}
    function search(){const raw=$('#ptQ').value.trim(),box=$('#ptEv');$('#ptBar').hidden=!!raw;
      if(!raw){load();return;}
      const my=++qSeq;box.innerHTML='<div class="e">찾는 중…</div>';
      brPost('/api/br/events',{date:brDay(0),q:raw,days:60}).then(r=>{if(my!==qSeq)return;
        if(r&&r.need_login){close();memLost(r);return;}if(!r||!r.ok){box.innerHTML='<div class="e">검색하지 못했어요</div>';return;}
        SR=mainFirst(r.events.filter(e=>e.type!=='sat'));
        box.innerHTML=SR.length?`<div class="m">'${esc(raw)}' 오늘 이후 일정 ${SR.length}개${r.more?' (앞의 일부만)':''} · 누르면 바로 참가 등록돼요</div><div class="brevl">${paint(SR,'si',true)}</div>`:`<div class="e">'${esc(raw)}' 일정이 없어요 · 이름을 줄여 보거나 직접 입력을 써 주세요</div>`;
        bind(box,SR,'si');});}
    $('#ptQ').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(search,250);});
    $('#ptMan').onclick=()=>{close();partManual(day);};
    const setDay=d=>{day=d;$('#ptDp').value=day;w.querySelectorAll('#ptDays button').forEach(z=>z.classList.toggle('on',brDay(+z.dataset.d)===day));load();};
    $('#ptDays').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(b)setDay(brDay(+b.dataset.d));});
    $('#ptDp').addEventListener('change',e=>{if(e.target.value)setDay(e.target.value);});
    load();});}
// 직접 입력: 날짜 · 시간 · 매장명(지역까지) · 대회 이름 — 이 순서로 대회 이름이 만들어짐
function partManual(day){brSheet(`<div class="brst">참가하는 대회 직접 입력</div>
   <div class="pubguide"><b>📌 이 순서로 대회 이름이 만들어져요</b><div class="m" id="ptPrev" style="font-weight:800;color:var(--ink)">-</div><span>매장명은 지역까지 같이 띄어서 (예: <code>건대 야자수</code>) · 대회 이름은 짧게 (예: <code>GTD 300만</code>)</span></div>
   <div class="brf2"><div class="brf"><label for="ptD">날짜</label><input id="ptD" type="date" min="${brDay(0)}" value="${day||brDay(0)}"></div><div class="brf"><label for="ptH">시작 시각</label><input id="ptH" type="time" value="19:00"></div></div>
   <div class="brf"><label for="ptV">매장명 <span class="m">(지역까지 같이, 띄어서)</span></label><input id="ptV" maxlength="30" autocomplete="off" placeholder="예: 건대 야자수"></div>
   <div class="brf"><label for="ptT">대회 이름</label><input id="ptT" maxlength="30" autocomplete="off" placeholder="예: GTD 300만 · 데일리"></div>
   <div class="brf"><label for="ptM">메모 <span class="m">(선택 · 카풀 등)</span></label><input id="ptM" maxlength="30" autocomplete="off" placeholder="예: 카풀 가능"></div>
   <div id="brMsg" class="brmsg" role="alert"></div><button type="submit" class="btn brfull" id="ptGo">🙋 참가 등록</button>`,(w,close)=>{
    const $=s=>w.querySelector(s),v=id=>$(id).value.trim();
    const prev=()=>{const d=v('#ptD');$('#ptPrev').textContent=[d?brMd(d):'날짜',v('#ptH')||'시간',v('#ptV')||'매장명',v('#ptT')||'대회 이름'].join(' ');};
    w.addEventListener('input',prev);w.addEventListener('change',prev);prev();
    $('#ptGo').onclick=()=>{const M=$('#brMsg');M.textContent='';
      if(!v('#ptD')){M.textContent='날짜를 골라주세요';return;}if(!v('#ptH')){M.textContent='시작 시각을 골라주세요';return;}
      if(v('#ptV').split(/\s+/).length<2){M.textContent='매장명은 지역까지 같이 띄어 써 주세요 (예: 건대 야자수)';$('#ptV').focus();return;}
      if(!v('#ptT')){M.textContent='대회 이름을 적어주세요';$('#ptT').focus();return;}
      partSend({d:v('#ptD'),t:v('#ptH'),venue:v('#ptV'),title:v('#ptT'),memo:v('#ptM')},close,M);};});}
// ⚡ 벙개 만들기: 제목 · 날짜 · 시각 · 장소 · 내용 (서버 participation.py /api/bungae/create = 카톡 !@벙개와 같은 처리)
function bungaeAdd(){brSheet(`<div class="brst">⚡ 벙개 만들기</div>
   <div class="pubguide"><b>📌 이렇게 올라가요</b><div class="m" id="bgPrev" style="font-weight:800;color:var(--ink)">-</div><span>만든 사람은 자동으로 참가돼요 · 마감·다시열기·취소는 참가 카드의 버튼으로 (카톡 <code>!@벙개 제목 마감</code>도 돼요)</span></div>
   <div class="brf"><label for="bgT">벙개 제목</label><input id="bgT" maxlength="20" autocomplete="off" placeholder="예: 강남번개 · 점심홀덤"></div>
   <div class="brf2"><div class="brf"><label for="bgD">날짜</label><input id="bgD" type="date" min="${brDay(0)}" value="${brDay(0)}"></div><div class="brf"><label for="bgH">시작 시각 <span class="m">(비우면 미정)</span></label><input id="bgH" type="time" value="19:00"></div></div>
   <div class="brf"><label for="bgP">장소 <span class="m">(선택)</span></label><input id="bgP" maxlength="30" autocomplete="off" placeholder="예: 강남 뉴스톤"></div>
   <div class="brf"><label for="bgW">내용 <span class="m">(선택)</span></label><input id="bgW" maxlength="40" autocomplete="off" placeholder="예: 토너먼트 한판 · 캐시게임"></div>

function visitVid(){try{let v=localStorage.getItem('vid');if(!v){v=Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem('vid',v);}return v;}catch(e){return '';}}
function visit(p){ presPage(p); if(!API) return; let n=''; try{ n=localStorage.getItem('nick')||''; }catch(e){}
  const mn=(MEM&&MEM.tok&&MEM.nick)||'';
  fetch(API+'/api/visit',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({p:p||'',n,mn,v:visitVid()})})
