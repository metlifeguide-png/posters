const cq=c=>esc(c).replace(/'/g,"&#39;");
function cmdCard([c,x,ex]){return `<div class="card cmd"><div style="min-width:0"><code onclick="copy(this.textContent)">${esc(c)}</code>${x?`<div class="m" style="margin-top:3px">${esc(x)}</div>`:''}${ex?`<div class="exs"><span class="m">예)</span>${ex.map(e=>`<code onclick="copy(this.textContent)">${esc(e)}</code>`).join('')}</div>`:''}</div></div>`;}
function cmdPage(){return head('📖 명령어','파란 글씨를 누르면 복사돼요')+'<div class="card m">명령어는 모두 앞에 <b>!@</b> · 명령어가 아닌 문장은 일반 질문으로 답해요</div>'
  +CMDS.map(([h,items,note])=>`<div class="sec">${h}</div>`+(h.includes('물어봐요')?`<div class="card"><div class="exs">${items.map(([c])=>`<code onclick="copy(this.textContent)">${esc(c)}</code>`).join('')}</div></div>`:items.map(cmdCard).join('')+(note&&!note.startsWith('💬')?`<div class="m" style="margin:2px 4px 6px">${esc(note)}</div>`:''))).join('');}
function meetPage(){

   +`<div class="card"><div class="t">뚝섬 300명예 GTD 토너먼트</div><div class="m">*60엔트리 기준 프라이즈업 · 듀레이션 15분에 느껴보는 빅재미</div>
   <div class="row"><span>일시</span><span class="m">26년 10월10일(토) 오후 3시</span></div>
   <div class="row"><span>BUY IN</span><span class="m">0.5T (함바치킨제공)</span></div>

   +`<div class="card cmd"><div style="min-width:0"><code onclick="copy(this.textContent)">!@참가 정모</code><div class="m" style="margin-top:3px">참석하시려면 채팅창에 이 명령어를 입력해주세요</div></div></div>`;
}

 {k:"pc",n:"제작 포스터",d:"뚝섬 제작 대회",f:()=>head('🏆 뚝섬 제작 포스터','누르면 크게')+thumbs('contest')},

 {g:"우리 방"},
 {k:"learn",n:"학습",d:"봇이 아는 정보",f:()=>{const l=D.learned.filter(x=>!Q||(x.k+' '+x.c).toLowerCase().includes(Q));
   return head('📚 학습',`${D.learned.length}개`)+search('키워드로 찾기')+(l.length?l.map(x=>`<div class="card"><div class="t">${esc(x.k)}</div><div class="lc">${esc(x.c)}</div></div>`).join(''):'<div class="e">학습된 정보가 없어요</div>');}},

   const suggestCmd=x=>{const c=x.cmd||(x.event&&x.label.match(/정모/)?'정모':'');if(c)return`!@참가 ${c}`;
     const mmdd=x.date&&x.date.length>=10?`${+x.date.slice(5,7)}/${+x.date.slice(8,10)}`:'';
     const core=x.label.split('·')[0].replace(/\d{1,2}\/\d{1,2}(\([가-힣]\))?/g,'').replace(/\d{1,2}:\d{2}/g,'').replace(/\s+/g,' ').trim();
     return `!@참가 ${(mmdd?mmdd+' ':'')}${core}`.trim();};
   const joinCmd=x=>`<div class="m" style="margin-top:6px">🙋 나도 참석? <code onclick="copy(this.textContent)">${esc(suggestCmd(x))}</code> (누르면 복사 · 대회명·날짜 일부만 써도 인식돼요)</div>`;
   return head('🙋 참가 현황',`${D.parts.length}개 대회`)+search('닉네임 · 대회로 찾기')+(g.length?g.map(x=>`<div class="card"><div class="t">${esc(x.label)}${x.event?'<span class="tag">행사</span>':''}</div><div class="m">${x.people.length}명</div><div class="ppl">${x.people.map(p=>esc(p.n)+(p.m?` <span class="m">(${esc(p.m)})</span>`:'')).join(', ')}</div>${joinCmd(x)}</div>`).join('')
   :'<div class="e">예정된 참가 신청이 없어요<br>카톡에서 !@참가 피망 1b</div>')+'<div class="m" style="margin-top:4px">⏰ 대회 당일 오전 9시에 참가자를 태그해서 시작 시각·주소·주차를 알려드려요 · 🎉 정모 등 행사는 위 카드에 나온 명령어로 참석 등록하세요</div>';}},
 {k:"rank",n:"입상·순위",d:"뚝섬리더보드",f:()=>{const pod=a=>{const o=[a[1],a[0],a[2]];return `<div class="podium">${o.map((x,i)=>x?`<div class="pd ${i===1?'p1':''}"><div class="md">${['🥈','🥇','🥉'][i]}</div><div class="nk">${esc(x.n)}</div><div class="pt">${x.pt}pt</div></div>`:'<div></div>').join('')}</div>`;};
   const list=(a,from)=>a.slice(from).map((x,i)=>`<div class="row"><span>${i+from+1}. ${esc(x.n)}</span><span class="m">${x.pt}pt · 우승 ${x.win} · 입상 ${x.itm}</span></div>`).join('');
   const t=D.tours.filter(x=>!Q||(x.label+x.rows.map(r=>r.n).join(' ')).toLowerCase().includes(Q));
   return head('🏆 입상·순위',D.month.replace('-','년 ')+'월')
   +'<div class="card m">💰 상금 100만 원 이상 입상은 모두 등록할 수 있어요 · 카톡: !@입상 대회명 등수 상금</div>'
   +(Q?'':'<div class="sec">🏆 이번 달 뚝섬리더보드</div>'+(D.board_month.length?pod(D.board_month)+(D.board_month.length>3?`<div class="card">${list(D.board_month,3)}</div>`:''):'<div class="card e">이번 달 기록이 아직 없어요</div>')
     +'<div class="sec">누적 뚝섬리더보드 TOP 10</div>'+(D.board_all.length?`<div class="card">${list(D.board_all,0)}</div>`:'<div class="card e">기록 없음</div>'))
   +'<div class="sec">대회별 입상</div>'+search('닉네임 · 대회로 찾기')
   +(t.length?t.map(x=>`<div class="card"><div class="t">${esc(x.label)}</div><div class="m">${md(x.date)} · ${x.rows.length}명</div><div class="ppl">${x.rows.map(r=>esc(r.n)+' '+esc(r.r)+(r.p?` <span class="m">(${esc(r.p)})</span>`:'')).join(', ')}</div></div>`).join(''):'<div class="e">입상 기록이 없어요</div>');}},
 {g:"도구"},
 {k:"rev",n:"핸드리뷰",d:"리뷰 보기·쓰기",f:()=>{const r=D.reviews.filter(x=>!Q||(x.id+' '+x.nick+x.head+x.hero+x.q).toLowerCase().includes(Q));
   return head('✍️ 핸드리뷰',`공개 ${D.reviews.length}개`)+`<div style="margin-bottom:10px"><a class="btn g" data-nav="1" href="${B}/review/">✍️ 내 핸드 질문하기</a></div>`+search('닉네임 · 패 · 질문으로 찾기')+(r.length?r.map(x=>`<a class="card" href="${B}/r/${x.id}.html"><div class="t">#${x.id} ${esc(x.head)}${x.own?'<span class="tag">✅ 방장 답변</span>':''}</div><div class="m">${esc(x.hero)}</div><div>❓ ${esc(x.q||'(질문 없음)')}</div><div class="m">${esc(x.nick)} · ${md(x.date)}</div></a>`).join('')

let cur='meet', Q='';
if(location.hash==='#part')cur='part';
else if(location.hash)history.replaceState(null,'',location.pathname+location.search);
function draw(){
  document.getElementById('side').innerHTML=MENU.map(m=>m.g?`<div class="grp">${m.g}</div>`:`<button class="${m.k===cur?'on':''}" data-k="${m.k}"><span class="nm">${m.n}</span><span class="ds">${m.d}</span></button>`).join('');
  const m=MENU.find(x=>x.k===cur);
  document.getElementById('main').innerHTML=m.f()+`<div class="foot">업데이트 ${D.updated} · 누구나 볼 수 있어요 · 관리는 방장만</div>`;
  document.querySelectorAll('#main img[data-pic]').forEach(im=>picLoad(im,im.dataset.pic));
  const q=document.getElementById('q'); if(q){q.oninput=()=>{Q=q.value.trim().toLowerCase();const p=q.selectionStart;draw();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};}
}
// 캘린더·올인차트·리뷰쓰기·포스터 등은 페이지를 떠나지 않고 이 안에서 전체화면으로 열기
const ov=document.getElementById('ov');let ovf=null;
function openOv(url,title,push){if(ovf)ovf.remove();ovf=document.createElement('iframe');ovf.title='내용';ovf.setAttribute('allow','clipboard-write');ovf.src=url;ov.appendChild(ovf);document.getElementById('ovt').textContent=title||'';document.getElementById('ovn').href=url;
  ov.classList.add('on');document.body.classList.add('lock');if(push!==false)history.pushState({ov:1},'');}
function closeOv(){ov.classList.remove('on');document.body.classList.remove('lock');if(ovf){ovf.remove();ovf=null;}}
document.getElementById('ovx').onclick=()=>{closeOv();if(history.state&&history.state.ov)history.back();};
addEventListener('popstate',()=>{if(pv.classList.contains('on')){closePv();return;}if(ov.classList.contains('on')){try{if(ovf&&ovf.contentWindow&&ovf.contentWindow.__qrBack&&ovf.contentWindow.__qrBack()){history.pushState({ov:1},'');return;}}catch(e){}closeOv();}});
// 포스터 슬라이드 뷰어: 누른 이미지부터 시작
const PV_NAME={contest:'제작 포스터',official:'공식 포스터',apl:'APL 제휴'};
const pv=document.getElementById('pv'),pvs=document.getElementById('pvs');let pvType='',pvIdx=0,pvN=0;
function pvLoad(i){const im=pvs.children[i]&&pvs.children[i].firstChild;if(!im||im.src)return;picLoad(im,POSTERS[pvType][i]);}
function pvShow(i){pvIdx=i;for(let k=i-1;k<=i+1;k++)pvLoad(k);document.getElementById('pvt').textContent=`${PV_NAME[pvType]} ${i+1} / ${pvN}`;document.getElementById('pvo').href=`${B}/${POSTERS[pvType][i]}.jpg`;}
function openPv(type,i,push){pvType=type;pvN=POSTERS[type].length;pvs.innerHTML=POSTERS[type].map(()=>'<div><img alt=""></div>').join('');
  pv.classList.add('on');document.body.classList.add('lock');pvs.style.scrollSnapType='none';pvs.scrollLeft=i*pvs.clientWidth;pvShow(i);
  requestAnimationFrame(()=>{pvs.scrollLeft=i*pvs.clientWidth;pvs.style.scrollSnapType='';});if(push!==false)history.pushState({pv:1},'');}
function closePv(){pv.classList.remove('on');pvs.innerHTML='';if(!ov.classList.contains('on'))document.body.classList.remove('lock');}
function pvGo(d){const i=Math.max(0,Math.min(pvN-1,pvIdx+d));pvs.scrollTo({left:i*pvs.clientWidth,behavior:'smooth'});}
pvs.addEventListener('scroll',()=>{const i=Math.round(pvs.scrollLeft/(pvs.clientWidth||1));if(i!==pvIdx&&i>=0&&i<pvN)pvShow(i);},{passive:true});
document.getElementById('pvx').onclick=()=>{closePv();if(history.state&&history.state.pv)history.back();};
document.getElementById('pvl').onclick=()=>pvGo(-1);document.getElementById('pvr').onclick=()=>pvGo(1);
addEventListener('keydown',e=>{if(!pv.classList.contains('on'))return;if(e.key==='ArrowLeft')pvGo(-1);else if(e.key==='ArrowRight')pvGo(1);else if(e.key==='Escape')document.getElementById('pvx').click();});
document.getElementById('main').addEventListener('click',e=>{const t=e.target.closest('.thumbs a[data-pt]');if(t){e.preventDefault();openPv(t.dataset.pt,+t.dataset.pi);return;}
  const a=e.target.closest('a[href]');if(!a||a.dataset.nav||!a.href.startsWith(B+'/'))return;
  e.preventDefault();const c=a.closest('.card');openOv(a.href,a.dataset.t||(c&&c.querySelector('.t')?c.querySelector('.t').textContent:'')||document.querySelector('.h h2')?.textContent||'');});
document.getElementById('side').onclick=e=>{const b=e.target.closest('button');if(!b)return;const it=MENU.find(m=>m.k===b.dataset.k);
  if(it&&it.u){openOv(B+it.u,it.t);return;}cur=b.dataset.k;Q='';history.replaceState(null,'','#'+cur);draw();window.scrollTo({top:document.querySelector('.wrap').offsetTop,behavior:'smooth'});};
addEventListener('hashchange',()=>{const k=location.hash.slice(1),it=MENU.find(m=>m.k===k);if(!it)return;if(it.u){openOv(B+it.u,it.t,false);return;}cur=k;draw();});
mq.addEventListener('change',()=>{document.querySelectorAll('#main img[data-pic]').forEach(im=>picLoad(im,im.dataset.pic));
  if(pv.classList.contains('on'))[...pvs.children].forEach((d,i)=>{if(d.firstChild.src)picLoad(d.firstChild,POSTERS[pvType][i]);});});
draw();
