(function(){

  var doneFlag=function(){try{return localStorage.getItem('a2done')==='1';}catch(e){return false;}};
  if(framed||standalone()||doneFlag()||snoozed())hide();
  $('a2x').onclick=function(e){e.stopPropagation();hide();try{localStorage.setItem('a2x',Date.now());}catch(x){}};
  function doneSet(){try{localStorage.setItem('a2done','1');}catch(e){}hide();close();var p=$('a2pill');if(p)p.hidden=true;say('좋아요! 이제 홈화면 추가 버튼을 숨길게요 👍');try{if(typeof draw==='function')draw();}catch(e){}}
  var dn=$('a2d0');if(dn)dn.onclick=function(e){e.stopPropagation();doneSet();};

  // 📲 설치 정보는 진짜 파일(manifest.webmanifest·icon-192/512.png·apple-touch-icon.png·sw.js, 서버가 hub/ 에 올림 · publish.py _publish_hub_app)

  //    ⚠ 앱 설치(크롬·삼성 인터넷 설치창)는 Play 프로텍트가 '안전하지 않은 앱'으로 막고 앱 서랍에만 들어가서 안 씀 → 브라우저 메뉴의 '홈 화면에 추가' 바로가기로 안내

  mod.onclick=function(e){if(e.target===mod)close();};

  function extUrl(){

function wm(v,sign){v=Math.round((+v||0)*10)/10;const a=Math.abs(v);if(!a)return '0';

  return (v<0?'−':(sign?'+':''))+s;}

  const reco=(BR.reco||[]).length?`<div class="card"><div class="brr"><b>내게 맞는 다가오는 대회</b><span class="m">내 기록 기준</span></div>${BR.reco.map(x=>`<div class="brr brrow"><span><span>${esc(x.title)}</span><br><span class="m">${brMd(x.d)}${x.t?' '+esc(x.t):''}${x.buyin?' · 바인 '+wm(x.buyin):''}</span><br>${x.why.map(w=>`<span class="brwhy">${esc(w)}</span>`).join('')}</span><button type="button" class="btn brsmb brgh" onclick='brPlan(${JSON.stringify(x).replace(/'/g,"&#39;")})'>일정 추가</button></span></div>`).join('')}</div>`:'';
  return head('💰 내 뱅크롤',esc(BR.nick)+'님만 보여요')+live+hero+wait+note+up+per+tiles+brGraph(S.graph,perN)+recent+reco
   +`<button type="button" class="btn brfull brnavy" onclick="brAdd()">＋ 기록 직접 추가</button>`
   +`<div class="brlinks"><button type="button" onclick="BRV='tk';draw()">🎟 내 시드권</button><button type="button" onclick="brMoney()">💵 잔고 설정</button><button type="button" onclick="BRV='brag';draw()">📣 자랑하기</button></div>`;}
function brPer(k){BR_PER=k;lsSet('brper',k);brLoad(true);}
function brRowHtml(x){const tag=x.kind==='s'?'<span class="brtag tk">새틀</span>':x.kind==='c'?'<span class="brtag">캐시</span>':'';
  const pay=x.pay==='ticket'?'<span class="brtag tk">시드권 바인</span>':x.pay==='stake'?'<span class="brtag tk">스테이킹</span>':'';
  const sub=x.kind==='c'?`${x.hours?x.hours+'시간 · ':''}바인 ${wm(x.paid)} → ${wm(x.prize)}`
    :`${x.pay==='ticket'?`시드권 ${x.tk_n}장(${wm(x.tk_n*x.tk_val)})${x.paid?' + '+wm(x.paid):''}`:'낸 돈 '+wm(x.paid)+(x.entries>1?` (${x.entries}엔트리)`:'')}${x.ptk_n?` → 시드권 ${x.ptk_n}장(${wm(x.ptk_n*x.ptk_val)})`:x.prize?' → 상금 '+wm(x.prize):''}`;
  return `<button type="button" class="britem" onclick="brResult(${x.id})"><span><span>${esc(x.title)}</span>${tag}${pay}${x.edited?'<span class="brtag">수정됨</span>':''}<br><span class="m">${brMd(x.date)} · ${sub}</span></span><b class="${brCls(x.net)}">${wm(x.net,1)}</b></button>`;}
function brGraph(P,lbl){if(!P||P.length<2)return `<div class="card"><div class="brr"><b>누적 손익</b><span class="m">${lbl}</span></div><div class="e" style="padding:14px">기록이 2개 이상 쌓이면 그래프가 그려져요</div></div>`;
  const W=320,H=90,pad=6,vs=P.map(p=>p[1]).concat([0]),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const X=i=>pad+(W-2*pad)*i/(P.length-1),Y=v=>pad+(H-2*pad)*(1-(v-mn)/rg);
  const pts=P.map((p,i)=>X(i).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' '),last=P[P.length-1];
  return `<div class="card"><div class="brr"><b>누적 손익</b><span class="m">${lbl} · <b class="${brCls(last[1])}">${wm(last[1],1)}</b></span></div>
   <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="누적 손익 그래프"><line x1="0" y1="${Y(0).toFixed(1)}" x2="${W}" y2="${Y(0).toFixed(1)}" stroke="#cfd6e2" stroke-dasharray="3 4"/>
   <polygon points="${X(0).toFixed(1)},${Y(0).toFixed(1)} ${pts} ${X(P.length-1).toFixed(1)},${Y(0).toFixed(1)}" fill="rgba(31,95,174,.10)"/>
   <polyline points="${pts}" fill="none" stroke="#1f5fae" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(P.length-1).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="#1f5fae"/></svg>
   <div class="brr m"><span>${brMd(P[0][0])}</span><span>${brMd(last[0])}</span></div></div>`;}
// 홈 맨 위: 참가 중 · 결과 입력 대기 (로그인 회원만, 남한테는 안 보임)
function brHomeHtml(){if(!MEM.tok||!BR)return '';const L=BR.live||[],n=brN();if(!L.length&&!n)return '';

   +(n?`<button type="button" class="brhome" onclick="go('bank')"><span>💰 <b>결과 입력 대기 ${n}건</b> · 상금만 넣으면 끝</span><span>›</span></button>`:'');}

  if(cur==='bank')draw();else{const s=document.getElementById('brslot');if(s)s.innerHTML=brHomeHtml();}toast(`엔트리 ${r.entries}`);}else toast((r&&r.msg)||'잘 안 됐어요');});}
function brSkip(id){brPost('/api/br/del',{id}).then(r=>{if(r&&r.ok){brToast('참가 안 함으로 했어요',r.undo);brLoad(true);}else toast((r&&r.msg)||'잘 안 됐어요');});}

function brFind(id){const all=[].concat(BR?BR.live||[]:[],BR?BR.wait||[]:[],BR?BR.upcoming||[]:[],BR?BR.recent||[]:[],BR_ALL?BR_ALL.items||[]:[]);return all.find(x=>x.id===id);}

   <div class="brwbox"><div class="brr"><b>${esc(c.title)}</b><span class="m">${brMd(c.date)}</span></div><div class="brr"><span>순위 <b>${esc(c.rank)||'-'}</b></span><span>상금 <b>${c.prize?wm(c.prize):esc(c.ptxt)||'-'}</b></span></div></div>
   <div class="m">맞으면 결과 입력 창이 열려요. 바인만 확인하고 저장하면 돼요. 확인 전에는 아무것도 저장되지 않아요.</div>
   <div class="brbtn2"><button type="button" class="btn brgh" id="brNo">제 기록 아니에요</button><button type="button" class="btn" id="brYes">맞아요, 넣기</button></div>`,(w,close)=>{

// ---------- 결과 입력 · 기록 추가 · 고치기 (한 창) ----------
// x: 기존 기록(예정·참가 중·기록됨) 또는 새 기록 기본값
function brResult(id,pre){pre=pre||{};const old=id?brFind(id):null;if(id&&!old){toast('기록을 찾지 못했어요');return;}
  const x=Object.assign({kind:'t',pay:'cash',date:brDay(0),time:'',title:'',venue:'',entries:1,buyin:0,paid:0,prize:0,tk_id:0,tk_n:0,ptk_n:0,ptk_val:0,hours:0,memo:''},old||{},pre);
  if(old&&old.status!=='done'&&!old.paid)x.paid=(x.buyin||0)*(x.entries||1);
  const tks=(BR&&BR.tickets||[]).filter(t=>t.n>0||t.id===x.tk_id);
  const myTk=(BR&&BR.tickets||[]).map(t=>`<option value="${esc(t.name)}">`).join('');
  let ptkName='';if(x.ptk_n&&old){const t=(BR.tickets||[]).find(t=>t.id===old.ptk_id);ptkName=t?t.name:'';}
  const isNew=!old,isPlan=old&&old.status!=='done',head0=isPlan?`<div class="m">${old.src==='part'?'카톡 !@참가로 등록한 대회':old.src==='sched'?'일정 추가한 대회':'참가 중인 대회'}</div><div class="brst">${esc(x.title)}</div><div class="m">${brMd(x.date)}${x.time?' '+esc(x.time):''}${x.buyin?' · 바인 '+wm(x.buyin):''}</div>`
    :`<div class="brst">${isNew?'기록 추가':'기록 고치기'}</div>`;
  const prizeWay=pre.pw||(x.ptk_n?'tk':x.prize?'cash':'none');
  brSheet(`${head0}
   ${isPlan?'':`<div class="brf"><label for="brTi">대회 이름</label><input id="brTi" maxlength="40" autocomplete="off" value="${esc(x.title)}" placeholder="예: 평택 HIT GTD"></div>
   <div class="brf2"><div class="brf"><label for="brDa">날짜</label><input id="brDa" type="date" value="${esc(x.date)}"></div><div class="brf"><label for="brVe">매장 <span class="m">(선택)</span></label><input id="brVe" maxlength="30" autocomplete="off" value="${esc(x.venue||'')}"></div></div>`}
   ${isPlan?'':`<div class="brf"><label>종류</label>${brSeg('kind',[['t','토너먼트'],['s','새틀라이트'],['c','캐시게임']],x.kind)}</div>`}
   <div id="brTS">
    <div class="brf"><label>바인 낸 방법</label>${brSeg('pay',[['cash','현금'],['ticket','시드권'],['stake','스테이킹']],x.pay)}</div>
    <div class="brbox" id="brPC">
     <div class="brr"><span><b>엔트리</b><br><span class="m">리엔트리 포함</span></span><span class="brstep"><button type="button" data-en="-1" aria-label="엔트리 빼기">−</button><b id="brEn">${x.entries||1}</b><button type="button" data-en="1" aria-label="엔트리 더하기">＋</button></span></div>
     <div class="brr"><label for="brBu">바인 (1엔트리)</label>${brMan('brBu',x.buyin||'')}</div>
     <div class="brr"><label for="brPa" id="brPaL">실제 낸 금액</label>${brMan('brPa',x.paid||'')}</div>
     <div class="brr"><span class="m" id="brPaH">얼리 할인 등은 ±로 맞춰요</span><span class="brstep"><button type="button" data-pa="-1">−1만</button><button type="button" data-pa="1">＋1만</button></span></div></div>
    <div class="brbox" id="brPT" hidden>
     ${tks.length?`<div class="m">내 시드권에서 골라요</div><div class="brchips" id="brTk">${tks.map(t=>`<button type="button" data-tk="${t.id}" class="${t.id===x.tk_id||(!x.tk_id&&t===tks[0])?'on':''}">${esc(t.name)} (${t.n}장${t.val?' · '+wm(t.val):''})</button>`).join('')}</div>
      <div class="brr"><span>쓴 장수</span><span class="brstep"><button type="button" data-tn="-1">−</button><b id="brTn">${x.tk_n||1}</b><button type="button" data-tn="1">＋</button></span></div>
      <div class="brr"><label for="brPa2">현금으로 더 낸 돈 <span class="m">(리엔트리 등)</span></label>${brMan('brPa2',x.pay==='ticket'?(x.paid||''):'')}</div>
      <div class="m">시드권 가치가 바인으로 계산돼요</div>`
     :`<div class="m">등록된 시드권이 없어요. <button type="button" class="brlink" onclick="BRV='tk';document.getElementById('brS').remove();document.body.classList.remove('lock');go('bank');">내 시드권에서 먼저 넣기 ›</button></div>`}</div>
    <div class="brf"><label>상금</label>${brSeg('pw',[['none','못 받음'],['cash','현금'],['tk','시드권']],prizeWay)}</div>
    <div id="brPZc" hidden>${brMan('brPz',x.prize||'','상금')}</div>
    <div id="brPZt" hidden><div class="brf"><label for="brPn">받은 시드권 이름</label><input id="brPn" list="brTkL" maxlength="30" autocomplete="off" value="${esc(ptkName)}" placeholder="예: APL 시드권"><datalist id="brTkL">${myTk}</datalist></div>
     <div class="brr"><span>장수</span><span class="brstep"><button type="button" data-pn="-1">−</button><b id="brPnn">${x.ptk_n||1}</b><button type="button" data-pn="1">＋</button></span></div>
     <div class="brr"><label for="brPv">장당 가치 <span class="m">(본선 바인)</span></label>${brMan('brPv',x.ptk_val||'')}</div>
     </div>
   </div>
   <div id="brCS" hidden>
    <div class="brr"><label for="brCi">바인 (총 투입)</label>${brMan('brCi',x.kind==='c'?x.paid||'':'')}</div>
    <div class="brr"><label for="brCo">캐시아웃</label>${brMan('brCo',x.kind==='c'?x.prize||'':'')}</div>
    <div class="brr"><label for="brHr">플레이 시간 <span class="m">(선택)</span></label><span class="brman"><input id="brHr" inputmode="decimal" autocomplete="off" value="${x.hours||''}" placeholder="0"><i>시간</i></span></div></div>
   <div class="brbox brr"><span class="m">이번 경기 손익</span><b id="brNet" class="brnet">0</b></div>
   <div id="brMsg" class="brmsg" role="alert"></div>
   <div class="brbtn2">${isPlan?'<button type="button" class="btn brgh" id="brSk">참가 안 함</button>':old?'<button type="button" class="btn brgh" id="brDel">지우기</button>':''}<button type="submit" class="btn" id="brSv">저장</button></div>`,(w,close)=>{
    const $=s=>w.querySelector(s),segv=n=>{const b=w.querySelector(`[data-seg="${n}"] .on`);return b?b.dataset.v:'';};
    let kind=x.kind,pay=x.pay,pw=prizeWay,en=x.entries||1,tn=x.tk_n||1,pn=x.ptk_n||1,tkSel=x.tk_id||(tks[0]&&tks[0].id)||0;
    const tkVal=()=>{const t=(BR.tickets||[]).find(t=>t.id===tkSel);return x.tk_id===tkSel&&x.tk_val?x.tk_val:t?t.val||0:0;};
    function vis(){$('#brTS').hidden=kind==='c';$('#brCS').hidden=kind!=='c';$('#brPC').hidden=pay==='ticket';$('#brPT').hidden=pay!=='ticket';
      $('#brPZc').hidden=pw!=='cash';$('#brPZt').hidden=pw!=='tk';
      $('#brPaL').textContent=pay==='stake'?'내가 낸 돈':'실제 낸 금액';$('#brPaH').textContent=pay==='stake'?'스테이커가 다 냈으면 0':'얼리 할인 등은 ±로 맞춰요';
      const pl=w.querySelector('[data-seg="pw"] [data-v="cash"]');if(pl)pl.textContent=pay==='stake'?'내 몫 현금':'현금';calc();}
    function calc(){let cost=0,prize=0;
      if(kind==='c'){cost=brNum('brCi');prize=brNum('brCo');}
      else{cost=pay==='ticket'?tn*tkVal()+brNum('brPa2'):brNum('brPa');
        prize=pw==='cash'?brNum('brPz'):pw==='tk'?pn*brNum('brPv'):0;}
      const v=Math.round((prize-cost)*10)/10,n=$('#brNet');n.textContent=wm(v,1);n.className='brnet '+brCls(v);}
    const setPaid=()=>{const b=brNum('brBu');if(b)$('#brPa').value=Math.round(b*en*10)/10;calc();};
    w.querySelectorAll('[data-seg]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;g.querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b));
      const v=b.dataset.v,n=g.dataset.seg;if(n==='kind')kind=v;else if(n==='pay'){pay=v;if(v==='stake'){$('#brPa').value='0';}else if(v==='cash')setPaid();else if(v==='ticket'&&!brNum('brPa2')&&en>1&&brNum('brBu'))$('#brPa2').value=Math.round(brNum('brBu')*(en-1)*10)/10;}else if(n==='pw'){pw=v;if(v==='tk'&&!brNum('brPv')){const t=(BR.tickets||[]).find(t=>t.name===$('#brPn').value);if(t&&t.val)$('#brPv').value=t.val;}}vis();}));
    w.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.en){en=Math.max(1,Math.min(30,en+(+b.dataset.en)));$('#brEn').textContent=en;if(pay==='cash')setPaid();}
      else if(b.dataset.pa){$('#brPa').value=Math.max(0,Math.round((brNum('brPa')+(+b.dataset.pa))*10)/10);calc();}
      else if(b.dataset.tn){tn=Math.max(1,Math.min(10,tn+(+b.dataset.tn)));$('#brTn').textContent=tn;calc();}
      else if(b.dataset.pn){pn=Math.max(1,Math.min(50,pn+(+b.dataset.pn)));$('#brPnn').textContent=pn;calc();}
      else if(b.dataset.tk){tkSel=+b.dataset.tk;w.querySelectorAll('[data-tk]').forEach(z=>z.classList.toggle('on',z===b));calc();}});
    w.addEventListener('input',e=>{if(e.target.id==='brBu'&&pay==='cash')setPaid();else if(e.target.id==='brPn'){const t=(BR.tickets||[]).find(t=>t.name===e.target.value);if(t&&t.val&&!brNum('brPv'))$('#brPv').value=t.val;calc();}else calc();});
    vis();
    const sk=$('#brSk');if(sk)sk.onclick=()=>{close();brSkip(old.id);};
    const dl=$('#brDel');if(dl)dl.onclick=()=>{if(!confirm('이 기록을 지울까요? (바로 되돌릴 수 있어요)'))return;brPost('/api/br/del',{id:old.id}).then(r=>{if(r&&r.ok){close();brToast('지웠어요',r.undo);brLoad(true);if(BRV==='all')brAllLoad();}else $('#brMsg').textContent=(r&&r.msg)||'잘 안 됐어요';});};
    let force=0;
    $('#brSv').onclick=()=>{const M=$('#brMsg');M.textContent='';
      const it={id:old?old.id:0,kind,pay:kind==='c'?'cash':pay,entries:en,buyin:brNum('brBu'),ref:x.ref||'',src:x.src||'manual',
        title:isPlan?x.title:($('#brTi').value.trim()),date:isPlan?x.date:($('#brDa').value||brDay(0)),venue:isPlan?x.venue:$('#brVe').value.trim(),time:x.time||''};
      if(!isPlan&&!it.title){M.textContent='대회 이름을 적어주세요';$('#brTi').focus();return;}
      if(kind==='c'){it.paid=brNum('brCi');it.prize=brNum('brCo');it.hours=brNum('brHr');}
      else{if(pay==='ticket'){if(!tkSel){M.textContent='쓸 시드권을 골라 주세요';return;}it.tk_id=tkSel;it.tk_n=tn;it.paid=brNum('brPa2');}else it.paid=brNum('brPa');
        if(pw==='cash')it.prize=brNum('brPz');
        if(pw==='tk'){it.ptk_n=pn;it.ptk_val=brNum('brPv');it.ptk_name=$('#brPn').value.trim();if(!it.ptk_name){M.textContent='받은 시드권 이름을 적어주세요';$('#brPn').focus();return;}}}

  return brBack('내 기록 자랑하기')+`<div class="brper">${BR_PERS.map(([k,l])=>`<button type="button" class="${k===BR.per?'on':''}" onclick="brPer('${k}')">${l}</button>`).join('')}</div>
   <div class="brbrag"><div class="brr"><b>뚝섬유원지 · ${esc(MEM.nick)}</b><span>${perN}</span></div><div class="brbg">${it.map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join('')||'<div><span>보여줄 항목을 골라주세요</span></div>'}</div><div class="brbs">잔고·금액은 공개 안 함</div></div>
   <div class="card"><div class="brh3">보여줄 항목</div>${sw('roi','토너 ROI')}${sw('itm','입상률')}${sw('n','참가 횟수')}${sw('abi','평균 바인')}${sw('sat','새틀 성공')}</div>
   <button type="button" class="btn brfull" onclick='brShare(${JSON.stringify(it).replace(/'/g,"&#39;")},"${perN}")'>카톡으로 자랑하기</button>
   <div class="card"><label class="brsw"><span><b>명예의 전당 ROI 순위에 올리기</b><br><span class="m">토너 기록 20개 이상부터 · 닉네임·ROI·입상률·참가 수·평균 바인만 · 언제든 끌 수 있어요</span></span><input type="checkbox" ${P.pub?'checked':''} onchange="brPrefSet('pub',this.checked)"><i></i></label></div>
   <div class="brmh"><span>👑 ROI 순위 (공개한 회원만)</span><span class="m">토너 20개 이상</span></div>
   <div class="card brlist">${BR_RANK.length?BR_RANK.map((x,i)=>`<div class="britem${i===me?' me':''}"><span><b>${i+1}. ${esc(x.nick)}</b><br><span class="m">${x.n}회 · 입상률 ${x.itm}% · 평균 바인 ${wm(x.abi)}</span></span><b class="${brCls(x.roi)}">${x.roi>0?'+':''}${x.roi}%</b></div>`).join(''):'<div class="e">아직 공개한 회원이 없어요</div>'}</div>`;}
function brPrefSet(k,v){const P=Object.assign({pub:0,show:{roi:1,itm:1,n:1,abi:1,sat:0}},BR.pref||{});P.show=Object.assign({},P.show);if(k==='pub')P.pub=v?1:0;else P.show[k]=v?1:0;BR.pref=P;
  brPost('/api/br/pref',{pref:P}).then(r=>{if(r&&r.ok){BR.pref=r.pref;if(k==='pub'){BR_RANK=null;toast(v?'ROI 순위에 올렸어요 (토너 20개 이상부터 보여요)':'ROI 순위에서 내렸어요');}draw();}});}
function brShare(it,per){const t=`🏝 뚝섬유원지 · ${MEM.nick}님 ${per} 홀덤 기록\n`+it.map(([l,v])=>`${l} ${v}`).join(' · ')+`\n${location.origin}${location.pathname}`;
  if(navigator.share){navigator.share({text:t}).catch(()=>{});}else copy(t);}

let VIS_TXT='';
function draw(){
  try{const f=document.querySelector('#main iframe.inf');if(f&&f.contentWindow&&f.contentWindow.__qrFlush)f.contentWindow.__qrFlush();}catch(e){}
  if(!pgF(cur))cur=LASTF||START_K;   // 캘린더·펫 같은 바깥 화면(u)에서 뒤로 오면 그 전 화면으로 (예전엔 여기서 오류가 나 화면이 반쯤 남았음)
  LASTF=cur;
  document.body.classList.remove('ing');closeDrw();
  const A2=document.getElementById('a2');if(A2)document.getElementById('a2home').appendChild(A2);   // 홈화면 추가 띠: 홈에만 (본문을 다시 그리기 전에 빼 둠)
  drawSide();document.getElementById('main').classList.remove('inl');
  const m=pg(cur);clearInterval(HERO.t);
  document.getElementById('main').innerHTML=chipsHtml()+m.f()+`<div class="foot">업데이트 ${D.updated} · 누구나 볼 수 있어요 · 관리는 방장만</div>`;
  if(cur==='home'){const sl=document.getElementById('a2slot');if(sl&&A2)sl.appendChild(A2);heroBind();}
  const ch=document.getElementById('chips'),cb=ch&&ch.querySelector('.on');if(cb)ch.scrollLeft=cb.offsetLeft-ch.clientWidth/2+cb.clientWidth/2;
  document.querySelectorAll('#main img[data-pic]').forEach(im=>picLoad(im,im.dataset.pic,thumbDead));
  ABAR_FOR=cur;   // 📣 홈 화면: 하단 띠 또는 PC 좌우 세로 배너 · 게임 등 안쪽 화면을 열면(openIn) 하단 띠는 안쪽 화면이 띄우고 세로 배너는 홈이 계속 띄움
  const q=document.getElementById('q'); if(q){q.oninput=()=>{Q=q.value.trim().toLowerCase();const p=q.selectionStart;draw();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};}
}
// 캘린더·올인차트·리뷰쓰기·포스터 등은 페이지를 떠나지 않고 이 안에서 전체화면으로 열기
const ov=document.getElementById('ov');let ovf=null;
function openOv(url,title,push){abarHide('ov',1);if(ovf)ovf.remove();ovf=document.createElement('iframe');ovf.title='내용';ovf.setAttribute('allow','clipboard-write');ovf.src=url;ov.appendChild(ovf);document.getElementById('ovt').textContent=title||'';document.getElementById('ovn').href=url;
  ov.classList.add('on');document.body.classList.add('lock');if(push!==false)history.pushState({ov:1},'');}
// 화면 전환 없이 오른쪽(본문) 자리에 바로 열기 · 왼쪽 메뉴는 그대로
let inlOn=false;
function openIn(url,title,key,push){closeDrw();clearInterval(HERO.t);if(key)cur=key;drawSide();document.body.classList.add('ing');const m=document.getElementById('main');m.classList.add('inl');const own=url.includes('/hub/games.html')||url.includes('/hub/study.html')||/\/(aof|qr)\//.test(url);
  m.innerHTML=(own?'':`<div class="ifh">${/\/c\/(?:index\.html)?(?:[?#]|$)/.test(url)?'':'<button type="button" onclick="inBack()">← 뒤로</button>'}<b>${esc(title||'')}</b><a href="${url}" target="_blank" rel="noopener">새 창 ↗</a></div>`)+`<iframe class="inf${own?' own':''}" src="${url}" allow="clipboard-write" title="${esc(title||'')}"></iframe>`;
  inlOn=true;if(push!==false){if(history.state&&history.state.inl)history.replaceState({inl:1},'');else history.pushState({inl:1},'');}window.scrollTo({top:0});}
function inBack(){if(history.state&&history.state.inl)history.back();else{inlOn=false;draw();}}
addEventListener('message',e=>{if(e.data&&e.data.t==='ttuk-back')inBack();
  else if(e.data&&e.data.t==='ttuk-go'&&pg(e.data.k)){if(e.data.ft==='game'||e.data.ft==='study'){FT=e.data.ft;lsSet('ft',FT);}if(history.state&&history.state.inl)history.replaceState(null,'');go(e.data.k);}});
function closeOv(){abarHide('ov',0);try{if(ovf&&ovf.contentWindow&&ovf.contentWindow.__qrFlush)ovf.contentWindow.__qrFlush();}catch(e){}ov.classList.remove('on');document.body.classList.remove('lock');if(ovf){ovf.remove();ovf=null;}}
document.getElementById('ovx').onclick=()=>{closeOv();if(history.state&&history.state.ov)history.back();};
addEventListener('popstate',()=>{if(pv.classList.contains('on')){closePv();return;}if(ov.classList.contains('on')){try{if(ovf&&ovf.contentWindow&&ovf.contentWindow.__qrBack&&ovf.contentWindow.__qrBack()){history.pushState({ov:1},'');return;}}catch(e){}closeOv();return;}if(inlOn&&!(history.state&&history.state.inl)){try{const f=document.querySelector('#main iframe.inf'),w=f&&f.contentWindow;if(w&&w.__qrBack&&w.__qrBack()){history.pushState({inl:1},'');return;}}catch(e){}inlOn=false;draw();}});
// 포스터 슬라이드 뷰어: 누른 이미지부터 시작
const PV_NAME={sched:'대회일정',contest:'제작 포스터',ofapl:'공식 APL',ofwpl:'공식 WPL',ofhg:'공식 한게임',ofpm:'공식 피망',aplshop:'APL 제휴업체'};
const pv=document.getElementById('pv'),pvs=document.getElementById('pvs');let pvType='',pvIdx=0,pvN=0,pvList=[],pvCu=null;   // pvCu: 포스터 메뉴 카드를 슬라이드로 볼 때의 목록 [{u:이미지,l:링크}]
function pvLoad(i){const im=pvs.children[i]&&pvs.children[i].firstChild;if(!im||im.src)return;if(pvCu){im.src=pvCu[i].u;return;}picLoad(im,pvList[i]);}
function pvShow(i){pvIdx=i;for(let k=i-1;k<=i+1;k++)pvLoad(k);const pa=document.getElementById('pvo');if(pvCu){document.getElementById('pvt').textContent=pvCu.t+' '+(i+1)+' / '+pvN;pa.href=pvCu[i].l||pvCu[i].u;pa.textContent=pvCu[i].l?'링크 ↗':'원본 ↗';return;}pa.textContent='원본 ↗';document.getElementById('pvt').textContent=`${PV_NAME[pvType]||('공식 '+pvType.slice(2))} ${i+1} / ${pvN}`;document.getElementById('pvo').href=`${B}/${pvList[i]}.jpg`;}
function openPv(type,i,push){pvCu=null;abarHide('pv',1);pvType=type;pvList=PL(type);pvN=pvList.length;pvs.innerHTML=pvList.map(()=>'<div><img alt=""></div>').join('');
  pv.classList.add('on');document.body.classList.add('lock');pvs.style.scrollSnapType='none';pvs.scrollLeft=i*pvs.clientWidth;pvShow(i);
  requestAnimationFrame(()=>{pvs.scrollLeft=i*pvs.clientWidth;pvs.style.scrollSnapType='';});if(push!==false)history.pushState({pv:1},'');}
function closePv(){pvCu=null;abarHide('pv',0);pv.classList.remove('on');pvs.innerHTML='';if(!ov.classList.contains('on'))document.body.classList.remove('lock');}
function pvGo(d){const i=Math.max(0,Math.min(pvN-1,pvIdx+d));pvs.scrollTo({left:i*pvs.clientWidth,behavior:'smooth'});}
pvs.addEventListener('scroll',()=>{const i=Math.round(pvs.scrollLeft/(pvs.clientWidth||1));if(i!==pvIdx&&i>=0&&i<pvN)pvShow(i);},{passive:true});
document.getElementById('pvx').onclick=()=>{closePv();if(history.state&&history.state.pv)history.back();};
document.getElementById('pvl').onclick=()=>pvGo(-1);document.getElementById('pvr').onclick=()=>pvGo(1);
addEventListener('keydown',e=>{if(!pv.classList.contains('on'))return;if(e.key==='ArrowLeft')pvGo(-1);else if(e.key==='ArrowRight')pvGo(1);else if(e.key==='Escape')document.getElementById('pvx').click();});
document.getElementById('main').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.mr;if(!k)return;MR[k]=e.target.value;const o=document.getElementById('mr-out');if(o)o.innerHTML=mrOut();});
document.getElementById('main').addEventListener('click',e=>{const qb=e.target.closest('[data-qi]');if(qb){const q=QITEMS[+qb.dataset.qi];if(q)q.go();return;}const kb=e.target.closest('[data-k]');if(kb&&!kb.closest('#hs')){e.preventDefault();go(kb.dataset.k);return;}const hb=e.target.closest('[data-href]');if(hb){openIn(hb.dataset.href,'',cur);return;}const g=e.target.closest('a[data-go]');if(g&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openIn(g.href,'',cur);return;}const t=e.target.closest('.thumbs a[data-pt], .plist button[data-pt]');if(t){e.preventDefault();openPv(t.dataset.pt,+t.dataset.pi);return;}
  const a=e.target.closest('a[href]');if(!a||a.dataset.nav||!a.href.startsWith(B+'/'))return;
  e.preventDefault();const c=a.closest('.card');openIn(a.href,a.dataset.t||(c&&c.querySelector('.t')?c.querySelector('.t').textContent:'')||document.querySelector('.h h2')?.textContent||'');});
function gtPos(){}
document.getElementById('side').onclick=e=>{const b=e.target.closest('button[data-k]');if(b)go(b.dataset.k);};
document.getElementById('btab').onclick=e=>{const b=e.target.closest('button[data-t]');if(!b)return;if(pv.classList.contains('on'))closePv();if(ov.classList.contains('on'))closeOv();tabGo(b.dataset.t);};   // 사진·포스터를 보는 중에 탭을 누르면 닫고 이동
// ⌨️ 휴대폰 글자판이 올라오면 아래 탭을 잠시 숨김 (입력칸·게임 화면을 가리지 않게) · 내려가면 다시 보임
(function(){let H=innerHeight,W=innerWidth;const vv=window.visualViewport;
  const f=()=>{if(innerWidth!==W){W=innerWidth;H=innerHeight;}else if(innerHeight>H)H=innerHeight;const h=vv?vv.height:innerHeight;document.body.classList.toggle('kb',h<H*0.75);};
  addEventListener('resize',f);if(vv)vv.addEventListener('resize',f);})();
document.getElementById('tnav').onclick=e=>{const b=e.target.closest('button[data-t]');if(b)tabGo(b.dataset.t);};
document.getElementById('drwB').onclick=openDrw;
document.getElementById('logo').onclick=e=>{e.preventDefault();const app=window.a2Standalone&&a2Standalone();if(innerWidth<760&&!app&&window.a2Go){a2Go();return;}go('home');};   // 휴대폰: 로고를 누르면 📲 홈화면 추가 (이미 홈화면 앱이면 홈)
(function(){const p=document.getElementById('a2pill');if(p&&!(window.a2Standalone&&a2Standalone())&&window.top===window.self)p.hidden=false;})();
document.getElementById('drw').onclick=e=>{if(e.target.id==='drw'||e.target.closest('[data-x]')){closeDrw();return;}
  const m=e.target.closest('[data-m]');if(m){closeDrw();memOpen(m.dataset.m);return;}
  if(e.target.closest('[data-a2]')){closeDrw();if(window.a2Go)a2Go();return;}
  const b=e.target.closest('button[data-k]');if(b)go(b.dataset.k);};
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrw();});
addEventListener('pageshow',()=>document.body.classList.remove('leaving'));
addEventListener('hashchange',()=>{const k=location.hash.slice(1),it=pg(k);if(!it)return;if(it.u){openIn(B+it.u,it.t,it.k,false);return;}inlOn=false;cur=k;draw();});
mq.addEventListener('change',()=>{document.querySelectorAll('#main img[data-pic]').forEach(im=>picLoad(im,im.dataset.pic,thumbDead));
  if(pv.classList.contains('on'))[...pvs.children].forEach((d,i)=>{if(d.firstChild.src)picLoad(d.firstChild,pvList[i]);});});
// 👀 방문자: IP 기준 하루 1번 (자정 기준) · 어떤 화면을 많이 쓰는지도 같이 기록
// 🟢 실시간 접속 (관리자 페이지에서 지금 누가 어떤 화면을 보는지) · 15초마다 신호 · 화면을 끄거나 나가면 바로 OFF
const PSID=(()=>{try{let v=localStorage.getItem('psid');if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem('psid',v);}return v;}catch(e){return Math.random().toString(36).slice(2,10);}})();
let PPAGE='';
function pres(off){if(!API)return;let n='';try{n=localStorage.getItem('nick')||'';}catch(e){}
 const b=JSON.stringify({s:PSID,p:PPAGE,n,f:window.top!==window.self?1:0,off:off?1:0});
 try{if(off&&navigator.sendBeacon&&navigator.sendBeacon(API+'/api/presence',new Blob([b],{type:'text/plain'})))return;
  fetch(API+'/api/presence',{method:'POST',headers:{'Content-Type':'text/plain'},body:b,keepalive:true}).catch(()=>{});}catch(e){}}
function presPage(p){PPAGE=String(p||'').slice(0,40);pres();}
setInterval(()=>{if(!document.hidden&&PPAGE)pres();},15000);
document.addEventListener('visibilitychange',()=>{if(PPAGE)pres(document.hidden);});
window.addEventListener('pagehide',()=>{if(PPAGE)pres(1);});
function visit(p){ presPage(p); if(!API) return; let n=''; try{ n=localStorage.getItem('nick')||''; }catch(e){}
  fetch(API+'/api/visit',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({p:p||'',n})})
   .then(r=>r.json()).then(r=>{ if(r&&r.ok) VIS_TXT=`👀 TODAY ${r.today.toLocaleString()} · TOTAL ${r.total.toLocaleString()}`;document.getElementById('vis').textContent=VIS_TXT;const v2=document.getElementById('vis2');if(v2)v2.textContent=VIS_TXT; }).catch(()=>{}); }
const menuName=k=>{const m=pg(k);return m?m.n:k;};
draw();
visit(_openU?_openU.n:menuName(cur));
if(_openU)openIn(B+_openU.u,_openU.t,_openU.k,false);   // 봇이 보낸 #game 같은 링크는 그 화면을 바로 열기
</script>
