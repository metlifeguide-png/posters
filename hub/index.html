<style>
:root{
  --paper:#f3efe4; --paper2:#fbf9f3; --line:#e2dccb; --ink:#26303d; --sub:#6b6f76;
  --blue:#1f5fae; --blue2:#e4edf8; --green:#3a9d3f; --green2:#e6f3e2; --brown:#9a5a2a; --brown2:#f3e7da; --gold:#c98a10;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{background-image:radial-gradient(rgba(120,100,70,.05) 1px,transparent 1px);background-size:6px 6px}
a{color:inherit}
.banner{position:relative;max-width:1100px;margin:0 auto}
.banner img{display:block;width:100%;height:auto;max-height:130px;object-fit:cover;object-position:center 38%}
.banner .vis{position:absolute;right:8px;bottom:6px;font-size:11px;font-weight:800;color:#3a5a8a;background:rgba(255,255,255,.75);border-radius:999px;padding:2px 9px;letter-spacing:.2px}.banner .vis:empty{display:none}
.banner .cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--sub)}
.wrap{--gw:70px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:var(--gw) 20px minmax(0,1fr);transition:grid-template-columns .25s ease;gap:0;min-height:calc(100vh - 160px)}
.wrap.fold{--gw:0px}.wrap.fold .side{padding:0;border:0;overflow:hidden}
#gnbT{width:20px;height:60px;border:0;border-radius:0 12px 12px 0;background:var(--blue);color:#fff;font-size:17px;font-weight:900;padding:0;box-shadow:2px 2px 8px rgba(0,0,0,.18);cursor:pointer}
.rail{position:sticky;top:0;height:100vh;display:flex;align-items:center;align-self:start;cursor:pointer}
.wrap.fold .side>*{display:none}
@media(min-width:760px){.wrap,.wrap.fold{--gw:170px;grid-template-columns:var(--gw) minmax(0,1fr)}.rail{display:none}.wrap.fold .side>*{display:block}.wrap.fold .side{padding:6px 3px 20px;border-right:2px dashed var(--line);overflow-y:auto}}
/* 왼쪽 메뉴 */
.side{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:6px 3px 20px;border-right:2px dashed var(--line)}
.side button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:8px 5px;margin-bottom:2px;cursor:pointer;color:var(--ink)}
.side .nm{display:block;font-size:13px;font-weight:700;line-height:1.25;white-space:nowrap;letter-spacing:-.4px}
.side .ds{display:block;font-size:11px;color:var(--sub);line-height:1.25;margin-top:1px}
.side button.on{background:var(--blue);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.side .ar{font-size:11px;color:var(--brown)}
.side button.on .ds{color:#dbe7f7}
.side .grp{font-size:10px;color:var(--brown);font-weight:700;margin:9px 5px 3px;letter-spacing:0;white-space:nowrap}
@media(min-width:760px){.banner img{max-height:230px}.side .nm{font-size:15px}.side .ds{font-size:12px}}
/* 오른쪽 본문 */
.main{padding:10px 8px 40px;min-width:0}
.h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin:2px 2px 10px}
.h h2{white-space:nowrap;font-size:18px;color:var(--blue);line-height:1.2}
.h .m{font-size:11.5px;color:var(--sub);text-align:right}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.t{font-weight:700;font-size:14.5px;line-height:1.35}
.m{color:var(--sub);font-size:12.5px}
.note{font-size:14.5px;line-height:1.65;color:var(--ink);background:rgba(120,140,255,.09);border-left:3px solid var(--blue);border-radius:8px;padding:9px 11px;font-weight:500}
.lcat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;text-align:center;font-size:13.5px;font-weight:700}.lcat>div{background:rgba(127,127,127,.08);border-radius:8px;padding:7px 2px}.lcat .st{font-size:13px}
.ppl{margin-top:4px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:8px;background:var(--brown2);color:var(--brown);margin-left:4px;vertical-align:1px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border:none}
.sec{font-size:14px;font-weight:800;color:var(--brown);margin:14px 2px 6px}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14px;margin-bottom:9px}
.e{color:var(--sub);text-align:center;padding:26px 6px;font-size:13.5px}
a.card{display:block;text-decoration:none}
.lc{white-space:pre-wrap;font-size:13.5px;margin-top:3px}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;border:0;cursor:pointer}
.btn.g{background:var(--green)}.btn.b{background:var(--brown)}
.cmd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmd code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--blue);font-weight:700;background:var(--blue2);border-radius:7px;padding:2px 7px;word-break:keep-all}
.jc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.jc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--blue);font-weight:700;background:var(--blue2);border-radius:7px;padding:2px 7px;cursor:pointer}
.stat{display:flex;align-items:center;gap:6px;margin:5px 0 2px}
.stat .dd{font-size:12px;font-weight:800;color:#fff;background:var(--brown);border-radius:7px;padding:1px 7px}
.stat .dd.now{background:#d9534f}
.stat .cnt{font-size:12.5px;font-weight:700;color:var(--blue)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.big>div{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.big .bn{font-size:28px;font-weight:900;color:var(--blue);line-height:1.1}
.big .bn small{font-size:15px;margin-left:2px}
.big .bl{font-size:12px;color:var(--sub);margin-top:3px}
.ly{display:flex;gap:6px}.ly .q{margin:0;flex:1}
.luck{background:var(--paper2);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.lh{display:flex;align-items:center;gap:10px}.le{font-size:40px}
.st{color:#e0a100;font-size:18px;letter-spacing:1px}.st span{color:#d9d3c4}
.lt{margin-top:10px;font-size:15px;line-height:1.55}
.pcs{display:flex;align-items:center;gap:8px}
.pc{width:52px;height:72px;border-radius:9px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b}
.pc b{font-size:22px;line-height:1}.pc i{font-style:normal;font-size:22px;line-height:1.1}.pc.red{color:#c62828}
.pm{font-size:12.5px;color:var(--sub);margin-left:4px}.pm b{color:var(--ink);font-size:14px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:14px;margin-top:12px}.lb{font-size:22px;font-weight:900;color:var(--blue)}
.balls{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ball{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.ball.b0{background:#e5a50a}.ball.b1{background:#2f80ed}.ball.b2{background:#e04f4f}.ball.b3{background:#8a8a8a}.ball.b4{background:#3aa24a}
.gvb{flex:1;overflow-y:auto;padding:12px 14px 30px;max-width:560px;width:100%;margin:0 auto}
.gm{display:flex;align-items:center;gap:12px;cursor:pointer}.gm .ge{font-size:30px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:10px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gc{text-align:center;font-size:26px;letter-spacing:2px;margin-bottom:12px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.g2b .btn{width:100%;font-size:17px;padding:12px}
.btn.b2{background:var(--brown)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs span{font-weight:900;color:var(--brown)}.vs b{display:block;margin-top:4px}
.om{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));aspect-ratio:1;background:#dcb35c;border-radius:6px;padding:3px;gap:0}
.om i{position:relative;min-width:0;aspect-ratio:1;border:.5px solid rgba(0,0,0,.25)}
.om i.k::after,.om i.w::after{content:"";position:absolute;inset:8%;border-radius:50%}
.om i.k::after{background:#111}.om i.w::after{background:#fafafa;box-shadow:inset 0 0 0 1px #999}.om i.l{outline:2px solid #e33;outline-offset:-2px}
.ot{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;background:#2e8b57;border-radius:8px;padding:3px;gap:2px}
.ot i{background:#3a9d64;display:flex;align-items:center;justify-content:center}
.ot b{width:82%;height:82%;border-radius:50%}.ot b.k{background:#111}.ot b.w{background:#f5f5f5}.ot s{width:22%;height:22%;border-radius:50%;background:rgba(0,0,0,.25)}
.sd{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));border:2px solid #333;background:#fff}
.sd i{min-width:0;overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:min(5vw,20px);border:.5px solid #ccc;color:var(--blue);font-weight:700}
.sd i.f{color:#222}.sd i.h{background:#eef3fa}.sd i.same{background:#d9e6f7}.sd i.s{background:#bcd3f2}.sd i.x{color:#d33}
.sd i.br{border-right:2px solid #333}.sd i.bb{border-bottom:2px solid #333}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ph{background:var(--paper2);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}.ph .pt{padding:6px 8px;font-size:12.5px;line-height:1.4}.rp{color:#b55;font-size:11px;cursor:pointer;float:right}
.exs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.exs code{font-size:11.5px;font-weight:600;padding:1px 6px;cursor:pointer}
.cmd code{cursor:pointer}
.card.cmd{padding:9px 11px;margin-bottom:6px}
.exs .m{font-size:11.5px;align-self:center}
.cp{border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:12px;padding:4px 9px;cursor:pointer;flex:none}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:760px){.thumbs{grid-template-columns:repeat(3,1fr)}}
.thumbs a{display:block;background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:3/4}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;align-items:end;margin-bottom:9px}
.pd{background:var(--paper2);border:1.5px solid var(--line);border-radius:12px;text-align:center;padding:8px 4px}
.pd .md{font-size:22px}.pd .nk{font-weight:800;font-size:13.5px;word-break:break-all}.pd .pt{font-size:11.5px;color:var(--sub)}
.pd.p1{border-color:var(--gold);padding-top:14px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:.95}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}@media(min-width:760px){.ggrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}}
@keyframes cfblink{50%{opacity:.35}}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 9px;min-width:0;border-radius:14px;background:var(--paper2);border:1.5px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .12s}
.gtile:active{transform:scale(.97)}.gtile .ge{font-size:26px;line-height:1.1}.gtile .gn{font-weight:800;font-size:14.5px}.gtile .gd{font-size:11px;color:var(--sub);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.gtile .gn{word-break:keep-all}
.gtile .gb{font-size:10.5px;color:var(--blue);font-weight:700;margin-top:2px}.grank .gn{white-space:nowrap}.grank{flex-direction:row;align-items:center;gap:10px;margin-bottom:6px;background:var(--blue2)}
body.leaving .main{opacity:0;transform:translateX(-24px);transition:opacity .18s,transform .18s}
.main.inl{padding:0}.ifh{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--blue);color:#fff;font-size:14px}.ifh button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:5px 9px;font-weight:700}.ifh b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ifh a{color:#fff;font-size:12px}
iframe.inf{display:block;width:100%;border:0;height:calc(100vh - 40px);background:var(--paper)}iframe.inf.own{height:100vh}
.ov{position:fixed;inset:0;z-index:50;background:var(--paper);display:none;flex-direction:column}
.ov.on{display:flex}
.ovb{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--blue);color:#fff}
.ovb button,.ovb a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.ovb .tt{flex:1;text-align:center;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov iframe{flex:1;width:100%;border:0;background:#fff}
body.lock{overflow:hidden}
.pv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:none;flex-direction:column}
.pv.on{display:flex}
.pvb{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;color:#fff;font-weight:700;font-size:14px}
.pvb .tt{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvb button,.pvb a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.pvw{position:relative;flex:1;min-height:0}
.pvs{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pvs::-webkit-scrollbar{display:none}
.pvs>div{flex:none;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:0 2px 8px}
.pvs img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pva{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:42px;height:64px;border:0;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-size:26px;cursor:pointer}
.pva.l{left:6px}.pva.r{right:6px}
@media(max-width:759px){.pva{display:none}}
.foot{font-size:11.5px;color:var(--sub);text-align:center;margin-top:18px}
.mr label{display:block;font-size:12.5px;color:var(--sub);margin:0 0 3px 2px}
.mr .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mr input.q{margin-bottom:9px}
.mr .out{border-radius:14px;padding:14px 12px;text-align:center;margin-top:4px}
.mr .out .v{font-size:26px;font-weight:800;line-height:1.2}
.mr .out .z{font-size:14px;font-weight:700;margin-top:4px}
.mr .out .s{font-size:12px;margin-top:6px;opacity:.85}
.mr .zones{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;align-items:center}
.mr .zones i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* 대회일정 (인라인 일정표) */
.sch-hint{font-size:11.5px;color:#0284c7;background:#e0f2fe;text-align:center;padding:5px 6px;border-radius:8px;margin-bottom:8px;font-weight:700}
@media(min-width:760px){.sch-hint{display:none}}
.sch-box{--lw:92px;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:760px){.sch-box{--lw:128px}}
.sch-in{min-width:700px;position:relative;padding-bottom:6px}
.sch-r{display:grid;grid-template-columns:var(--lw) 1fr;height:36px;border-bottom:1px solid #eef0f3}
.sch-l{position:sticky;left:0;z-index:5;background:#f8fafc;border-right:1px solid #cbd5e1;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-t{position:relative;height:100%}
.sch-t .bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);pointer-events:none}
.sch-t .bg div{border-right:1px dashed #e5e7eb}
.sch-r.hd{height:32px;background:#334155;border-bottom:0}
.sch-r.hd .sch-l{background:#334155;color:#fff;justify-content:center}
.sch-r.hd .sch-t{display:grid;grid-template-columns:repeat(6,1fr);align-items:center;text-align:center;color:#fff;font-size:11.5px;font-weight:800}
.sch-r.hd .sch-t div{border-right:1px solid #64748b}
.sch-sec{position:sticky;left:0;width:max-content;font-size:12px;font-weight:800;padding:3px 9px;border-radius:5px;margin:10px 6px 6px;background:#eff6ff;color:#1e40af}
.sch-sec.main{background:#fefce8;color:#854d0e}
.sch-b{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:800;white-space:nowrap;padding:0 4px;overflow:hidden;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sch-today{position:absolute;top:32px;bottom:0;width:0;border-left:2px solid #f43f5e;z-index:3;pointer-events:none}
.sch-today i{position:absolute;top:-2px;left:-14px;font-style:normal;font-size:9.5px;font-weight:800;color:#fff;background:#f43f5e;border-radius:4px;padding:0 4px;white-space:nowrap}
.sch-c{border-left:5px solid var(--cc);padding:9px 12px}
.sch-c .t{display:flex;justify-content:space-between;gap:8px;color:var(--cc)}
.sch-c .t span{font-size:11px;background:#fff;border-radius:6px;padding:0 6px;border:1px solid var(--line)}
.sch-c ul{list-style:none;margin-top:4px;font-size:12.5px;line-height:1.5}
.sch-c li{padding-left:9px;position:relative}
.sch-c li:before{content:"•";position:absolute;left:0;color:var(--sub)}

function parseBirth(v){let a=String(v||'').trim(),y,m=null;const r=a.match(/(\d{2,4})\s*[년.\-/ ]\s*(\d{1,2})/);
  if(r){y=r[1];m=+r[2];}else{const d=a.replace(/\D/g,'');if(!d)return '';
    if(d.length===6||d.length===8){y=d.slice(0,4);m=+d.slice(4,6);}else if(d.length===4&&!/^(19|20)/.test(d)){y=d.slice(0,2);m=+d.slice(2);}else if(d.length===2||d.length===4)y=d;else return a;}
  y=+y;if(y<100)y=y<=new Date().getFullYear()%100?2000+y:1900+y;if(!(m>=1&&m<=12))m=null;return m?`${y}-${String(m).padStart(2,'0')}`:String(y);}

// 🎵 배경음악: 이 페이지와 같은 폴더(hub/)에 bgm.mp3 를 올리면 자동으로 켜져요 (파일이 없으면 버튼도 안 보여요)
// 홈에 들어오면 항상 음악이 시작돼요. 브라우저가 소리 자동재생을 막으면 화면을 처음 터치하는 순간 시작해요.
// 🔊 버튼: 한 번 누르면 볼륨 막대가 열리고, 막대가 열려 있을 때 한 번 더 누르면 음소거/해제예요 (PC는 마우스를 올리면 막대가 열려요).
// 볼륨은 1~100 (1씩 조절) · 고른 볼륨은 기억해요 · 아이폰은 코드로 볼륨을 못 바꿔서 막대 없이 기기 볼륨 버튼으로 조절해요.
(function(){
  const SRC='bgm.mp3', DEF_VOL=5, MIN_VOL=0, LOOP=true, FADE_MS=2500;   // 기본 볼륨(1~100) · 최소 볼륨 · 반복 여부 · 시작할 때 서서히 커지는 시간(0이면 바로)
  const H=196, PADB=14, PADT=36, SPAN=H-PADB-PADT;           // 볼륨 막대 높이·여백 (CSS .bgv 와 같아야 해요)
  const wrap=document.getElementById('bgmw'), btn=document.getElementById('bgm'), bgv=document.getElementById('bgv'),
        bgf=document.getElementById('bgf'), bgk=document.getElementById('bgk'), bgn=document.getElementById('bgn');
  if(!wrap||!btn) return;
  const a=new Audio(SRC); a.loop=LOOP; a.preload='auto';
  a.volume=0.5; const canVol=Math.abs(a.volume-0.5)<0.01;   // 아이폰은 코드로 볼륨을 못 바꿔서 막대를 숨겨요
  const clampV=n=>Math.max(MIN_VOL,Math.min(100,Math.round(n)));
  let vol=DEF_VOL;
  try{ let s=parseInt(localStorage.getItem('bgmv2'),10);
       if(isNaN(s)){ const o=parseFloat(localStorage.getItem('bgmv')); if(o>0&&o<=1) s=Math.round(o*100); }   // 예전에 저장한 볼륨(0~1)도 이어받아요
       if(!isNaN(s)) vol=clampV(s); }catch(e){}
  let muted=false, armed=false, drag=false, fadeT=null, hideT=null;
  a.volume=vol/100;
  const saveVol=()=>{try{localStorage.setItem('bgmv2',String(vol));}catch(e){}};
  function sync(){ const on=!a.paused&&!muted;
    btn.textContent=on?'🔊':'🔇'; btn.title=on?'배경음악 음소거':'배경음악 소리 켜기'; btn.setAttribute('aria-pressed',on?'true':'false');
    wrap.classList.toggle('mute',muted); bgn.textContent=muted?'음소거':String(vol); }
  function drawVol(){ const f=(vol-MIN_VOL)/(100-MIN_VOL);
    bgf.style.height=(f*SPAN)+'px'; bgk.style.bottom=(PADB+f*SPAN-9)+'px'; bgv.setAttribute('aria-valuenow',String(vol)); sync(); }
  function openPanel(){ if(!canVol) return; wrap.classList.add('open'); clearTimeout(hideT); hideT=setTimeout(()=>{ if(!drag) wrap.classList.remove('open'); },4000); }
  function fadeIn(){ clearInterval(fadeT); if(!canVol||FADE_MS<=0){a.volume=vol/100;return;} a.volume=0; const t0=Date.now();
    fadeT=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/FADE_MS); a.volume=vol/100*k; if(k>=1) clearInterval(fadeT);},100); }
  const play=fade=>a.play().then(()=>{ if(fade!==false) fadeIn(); sync(); },()=>{arm();sync();});
  const EV=['pointerup','touchend','keydown','click'];
  function arm(){ if(armed) return; armed=true;
    const go=e=>{ if(e&&e.target&&wrap.contains(e.target)) return;
      EV.forEach(t=>removeEventListener(t,go,true)); armed=false;
      if(a.paused) play(); };
    EV.forEach(t=>addEventListener(t,go,true)); }
  function setMuted(m){ muted=m; a.muted=m; if(!m){ clearInterval(fadeT); a.volume=vol/100; } sync(); }
  function setVol(v){ vol=clampV(v); clearInterval(fadeT); a.volume=vol/100; if(muted){muted=false;a.muted=false;} drawVol(); if(a.paused) play(false); }
  a.addEventListener('canplay',()=>{wrap.classList.add('on'); drawVol(); if(a.paused) play();},{once:true});
  a.addEventListener('error',()=>wrap.classList.remove('on'));
  a.addEventListener('play',sync); a.addEventListener('pause',sync);
  // 🔊 버튼: 소리가 아직 안 나면 시작 → 막대가 닫혀 있으면 열기 → 막대가 열려 있으면 음소거/해제
  btn.onclick=()=>{
    if(a.paused){ muted=false; a.muted=false; a.volume=vol/100; play(); openPanel(); return; }
    if(!canVol){ setMuted(!muted); return; }
    if(!wrap.classList.contains('open')){ openPanel(); return; }
    setMuted(!muted); openPanel(); };
  // 볼륨 막대: 누르거나 위아래로 끌면 3~100 사이에서 바로 적용 (음소거 중이면 자동으로 해제)
  function setFromY(y){ const r=bgv.getBoundingClientRect(); const f=Math.max(0,Math.min(1,(r.bottom-PADB-y)/SPAN));
    setVol(MIN_VOL+f*(100-MIN_VOL)); openPanel(); }
  bgv.addEventListener('pointerdown',e=>{ drag=true; try{bgv.setPointerCapture(e.pointerId);}catch(x){} setFromY(e.clientY); e.preventDefault(); });
  bgv.addEventListener('pointermove',e=>{ if(drag) setFromY(e.clientY); });
  const up=()=>{ if(!drag) return; drag=false; saveVol(); openPanel(); };
  bgv.addEventListener('pointerup',up); bgv.addEventListener('pointercancel',up);
  bgv.addEventListener('wheel',e=>{ e.preventDefault(); setVol(vol+(e.deltaY<0?2:-2)); saveVol(); openPanel(); },{passive:false});
  bgv.addEventListener('keydown',e=>{ const k=e.key;
    const d=(k==='ArrowUp'||k==='ArrowRight')?1:(k==='ArrowDown'||k==='ArrowLeft')?-1:k==='PageUp'?10:k==='PageDown'?-10:0;
    if(k==='Home'){ e.preventDefault(); setVol(MIN_VOL); saveVol(); openPanel(); return; }
    if(k==='End'){ e.preventDefault(); setVol(100); saveVol(); openPanel(); return; }
    if(!d) return; e.preventDefault(); setVol(vol+d); saveVol(); openPanel(); });
  wrap.addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') openPanel(); });
  document.addEventListener('pointerdown',e=>{ if(!wrap.contains(e.target)) wrap.classList.remove('open'); },true);
  if(!canVol) bgv.style.display='none';
  drawVol();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ if(!a.paused) a.pause(); }
    else if(wrap.classList.contains('on')&&a.paused&&!a.ended) play(); });
})();
// 👀 방문자: IP 기준 하루 1번 (자정 기준) · 어떤 화면을 많이 쓰는지도 같이 기록
// 🟢 실시간 접속 (관리자 페이지에서 지금 누가 어떤 화면을 보는지) · 15초마다 신호 · 화면을 끄거나 나가면 바로 OFF

let PPAGE='';

 const b=JSON.stringify({s:PSID,p:PPAGE,n,f:window.top!==window.self?1:0,off:off?1:0});
 try{if(off&&navigator.sendBeacon&&navigator.sendBeacon(API+'/api/presence',new Blob([b],{type:'text/plain'})))return;

   .then(r=>r.json()).then(r=>{ if(r&&r.ok) document.getElementById('vis').textContent=`👀 TODAY ${r.today.toLocaleString()} · TOTAL ${r.total.toLocaleString()}`; }).catch(()=>{}); }
const menuName=k=>{const m=MENU.find(x=>x.k===k);return m?m.n:k;};
draw();
visit(_openU?_openU.n:menuName(cur));
if(_openU)openIn(B+_openU.u,_openU.t,_openU.k,false);   // 봇이 보낸 #game 같은 링크는 그 화면을 바로 열기
</script>
