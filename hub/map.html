.h h2{white-space:nowrap;font-size:19px;color:var(--navy);line-height:1.2;letter-spacing:-.4px}
.h .m{font-size:11.5px;color:var(--sub)}
.bar{display:flex;gap:6px;margin-bottom:8px}
.bar input{flex:1;min-width:0;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;background:#fff}
.bar button{font:inherit;font-weight:800;font-size:13px;border:0;border-radius:12px;padding:0 12px;background:var(--navy);color:#fff;white-space:nowrap;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 8px;margin-top:-10px}   /* 10/31 지도는 위에 고정, 매장 목록만 아래에서 스크롤 */
#map{height:32vh;min-height:200px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh);z-index:0}
.sec{font-size:12.5px;font-weight:800;color:#1e40af;background:#eef4ff;border-radius:8px;padding:3px 10px;margin:14px 0 6px;width:max-content}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--sh);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card.on{border-color:var(--pin);box-shadow:0 0 0 2px rgba(225,29,72,.18)}
.card .t{font-weight:800}
.card .a{font-size:12.5px;color:var(--sub);word-break:keep-all}
.card .d{font-size:12px;font-weight:800;color:var(--pin);white-space:nowrap}
.e{color:var(--sub);text-align:center;padding:26px 6px;font-size:13.5px}
.pop b{font-size:14px}.pop div{font-size:12.5px;color:#475569;margin:2px 0 6px}
.pop a{font-weight:800;font-size:12.5px;color:#1d4ed8;text-decoration:none}
.pbtn{display:block;width:100%;text-align:left;margin:0 0 6px;border:1px solid #fecdd3;background:#fff1f2;color:#be123c;border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.tg{font-size:11px;font-weight:800;color:#be123c;background:#fff1f2;border-radius:6px;padding:1px 6px;margin-left:4px}
.plb{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
.plb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.plb span{position:absolute;top:10px;right:16px;color:#fff;font-size:28px;line-height:1}
.note{font-size:11.5px;color:var(--sub);margin-top:12px;text-align:center}
/* 11/02 빨간 점 위 매장 이름 · 지도만 보기(전체 화면) */
.leaflet-tooltip.lb{background:rgba(255,255,255,.92);border:1px solid #fecdd3;border-radius:6px;padding:0 5px;font:800 11px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#9f1239;box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:nowrap}
.leaflet-tooltip.lb::before{display:none}
.nolb .leaflet-tooltip.lb{display:none}
body.full #map{position:fixed!important;inset:0;height:100%;min-height:0;border-radius:0;border:0;z-index:1000}
body.full{overflow:hidden}
#fx{display:none;position:fixed;top:12px;right:12px;z-index:1001;font:inherit;font-weight:800;font-size:13.5px;border:0;border-radius:12px;padding:9px 14px;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
body.full #fx{display:block}
/* 11/06 디자인 통일 dsunify (DESIGN.md): 홈과 같은 색 — 남색 바탕 · 흰 카드 · 고른 것 금색 · Pretendard. 이 블록만 지우면 예전 모양 */
:root{--paper:#0b1426;--paper2:#ffffff;--line:#e3e7ee;--ink:#141b2b;--sub:#667085;--navy:#1a2945;--chalk:#eef2f8;--mist:#9aa8c2;--hair:rgba(255,255,255,.08);--brass:#e6bc68;--blue:#2457c5;--sh:none}
html,body{font-family:"Pretendard Variable",Pretendard,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.012em}
body{color:var(--chalk);background:radial-gradient(90% 520px at 50% -80px,rgba(80,125,210,.30),rgba(80,125,210,.07) 55%,transparent 75%) no-repeat,var(--paper)}
.h h2{color:var(--chalk);font-size:22px;font-weight:800}
.h .m,.e,.note,.foot{color:var(--mist)}
.card{color:var(--ink);border-radius:16px}
.card .e{color:var(--sub)}
.top{background:var(--paper)}
.sec{color:var(--mist);background:var(--hair)}
.bar input{border:1px solid var(--line);border-radius:11px;color:var(--ink)}
.bar button,#fx{background:var(--brass);color:#241a05;border-radius:11px}
.card.on{border-color:var(--brass);box-shadow:0 0 0 2px rgba(230,188,104,.35)}
.card .d{color:var(--chip,#e5484d)}
.pop a{color:var(--blue)}
</style>

  const o=document.createElement('div');o.className='plb';o.innerHTML=`<span>×</span><img alt="포스터" src="${esc(b.dataset.img)}">`;
  o.onclick=()=>o.remove();document.body.appendChild(o);},true);
function card(i){const x=V[i];return `<div class="card${i===SEL?' on':''}" data-i="${i}"><div><div class="t">${esc(x.n)}${x.p&&x.p.length?'<span class="tg">오늘 경기</span>':''}</div><div class="a">${esc(x.a||'주소 없음')}</div></div>${ME?`<span class="d">${km(ME,x).toFixed(1)}km</span>`:''}</div>`;}
let qt;document.getElementById('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>draw(true),200);});
document.getElementById('me').onclick=()=>{const b=document.getElementById('me');
  if(!navigator.geolocation){alert('이 기기에서는 위치를 쓸 수 없어요');return;}
  b.textContent='찾는 중…';
  navigator.geolocation.getCurrentPosition(p=>{ME={lat:p.coords.latitude,lng:p.coords.longitude};b.textContent='📍 내 근처';
    L.circleMarker([ME.lat,ME.lng],{radius:7,color:'#fff',weight:2.5,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('내 위치');
    map.setView([ME.lat,ME.lng],13);draw(false);},
    ()=>{b.textContent='📍 내 근처';alert('위치 권한을 허용해야 근처 매장을 볼 수 있어요');},{enableHighAccuracy:false,timeout:8000});};
draw(true);
</script>
</body>
