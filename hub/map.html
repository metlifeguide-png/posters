<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:site_name" content="뚝섬유원지">
<meta property="og:title" content="🗺️ 홀덤지도 · 뚝섬유원지">
<meta property="og:description" content="어디에 어떤 홀덤펍이 있는지 지도로 한눈에">
<meta property="og:image" content="https://metlifeguide-png.github.io/posters/hub/banner.jpg">
<!--
  🗺️ 홀덤지도 독립 페이지 (templates/map.html → 깃허브 hub/map.html)
  · 서버가 {"v": [{"n": "일산 키키", "k": "키키", "a": "경기 고양시 일산동구 정발산로196번길 16-18", "lat": 37.662294, "lng": 126.786196, "u": "http://place.map.kakao.com/852250277"}, {"n": "일산 플립", "k": "플립디자인", "a": "경기 고양시 일산서구 원일로 51-1", "lat": 37.687364, "lng": 126.767888, "u": "http://place.map.kakao.com/1695108463"}, {"n": "다산 로티아레나", "k": "로티아레나", "a": "경기 남양주시 다산중앙로123번길 7-26", "lat": 37.623182, "lng": 127.152117, "u": "http://place.map.kakao.com/1153583950"}, {"n": "다산 프라임", "k": "삼성프라임산부인과의원", "a": "경기 남양주시 다산중앙로146번길 12-12", "lat": 37.625198, "lng": 127.15439, "u": "http://place.map.kakao.com/2017570766"}, {"n": "성남모란 KMGM", "k": "KMGM홀덤펍", "a": "경기 성남시 중원구 둔촌대로101번길 27", "lat": 37.432122, "lng": 127.129786, "u": "http://place.map.kakao.com/862257132"}, {"n": "양산 DM", "k": "한국디엠", "a": "경남 양산시 산막공단북11길 72", "lat": 35.371891, "lng": 129.068491, "u": "http://place.map.kakao.com/24420600"}, {"n": "창원상남 아리아스타디움", "k": "아리아홀덤스타디움", "a": "경남 창원시 성산구 마디미로 23", "lat": 35.222199, "lng": 128.684659, "u": "http://place.map.kakao.com/1402993035"}, {"n": "대구월성 골드문", "k": "골드문홀덤펍 월성점", "a": "대구 달서구 월암로4길 8", "lat": 35.821209, "lng": 128.52035, "u": "http://place.map.kakao.com/1485721062"}, {"n": "강남 클럽도파", "k": "클럽도파", "a": "서울 강남구 강남대로84길 15", "lat": 37.497004, "lng": 127.029835, "u": "http://place.map.kakao.com/426913442"}, {"n": "강남 뉴스톤", "k": "뉴스톤아레나", "a": "서울 강남구 도곡로1길 14", "lat": 37.490966, "lng": 127.032448, "u": "http://place.map.kakao.com/1413866640"}, {"n": "강남 아띠", "k": "아띠홀덤", "a": "서울 강남구 봉은사로26길 14", "lat": 37.505968, "lng": 127.033137, "u": "http://place.map.kakao.com/2116219997"}, {"n": "신촌 MAX", "k": "맥스홀덤 라운지", "a": "서울 서대문구 연세로5가길 8-6", "lat": 37.557505, "lng": 126.936438, "u": "http://place.map.kakao.com/284308819"}, {"n": "먹골 티티", "k": "티티서비스", "a": "서울 성북구 한천로76길 14", "lat": 37.61107, "lng": 127.063617, "u": "http://place.map.kakao.com/290433109"}, {"n": "잠실 아띠", "k": "아띠에스티", "a": "서울 송파구 올림픽로 203", "lat": 37.512464, "lng": 127.093387, "u": "http://place.map.kakao.com/21125064"}, {"n": "구리 키키", "k": "키키네일", "a": "서울 중랑구 봉우재로 200", "lat": 37.594403, "lng": 127.095174, "u": "http://place.map.kakao.com/772762335"}, {"n": "인천용현 크라운", "k": "크라운모텔", "a": "인천 미추홀구 토금남로3번길 10", "lat": 37.453335, "lng": 126.633662, "u": "http://place.map.kakao.com/10823663"}]} 자리에 매장 목록을 넣어요 (publish.py build_map_html ← geo.py venue_places)
      D.v = [{n:매장명, k:카카오 장소명, a:주소, lat, lng, u:카카오맵 링크}]
  · 지도 = Leaflet + 오픈스트리트맵 (키 필요 없음)
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#eef1f6; --paper2:#ffffff; --line:#e2e7ef; --ink:#1b2433; --sub:#66728a; --navy:#0d203b; --pin:#e11d48;
  --sh:0 1px 2px rgba(16,32,60,.05),0 6px 18px rgba(16,32,60,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:14px 16px 28px}
.h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin:2px 2px 10px}
.h h2{white-space:nowrap;font-size:19px;color:var(--navy);line-height:1.2;letter-spacing:-.4px}
.h .m{font-size:11.5px;color:var(--sub)}
.bar{display:flex;gap:6px;margin-bottom:8px}
.bar input{flex:1;min-width:0;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;background:#fff}
.bar button{font:inherit;font-weight:800;font-size:13px;border:0;border-radius:12px;padding:0 12px;background:var(--navy);color:#fff;white-space:nowrap;cursor:pointer}
#map{height:56vh;min-height:300px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh);z-index:0}
.sec{font-size:12.5px;font-weight:800;color:#1e40af;background:#eef4ff;border-radius:8px;padding:3px 10px;margin:14px 0 6px;width:max-content}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--sh);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card.on{border-color:var(--pin);box-shadow:0 0 0 2px rgba(225,29,72,.18)}
.card .t{font-weight:800}
.card .a{font-size:12.5px;color:var(--sub);word-break:keep-all}
.card .d{font-size:12px;font-weight:800;color:var(--pin);white-space:nowrap}
.e{color:var(--sub);text-align:center;padding:26px 6px;font-size:13.5px}
.pop b{font-size:14px}.pop div{font-size:12.5px;color:#475569;margin:2px 0 6px}
.pop a{font-weight:800;font-size:12.5px;color:#1d4ed8;text-decoration:none}
.note{font-size:11.5px;color:var(--sub);margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="h"><h2>🗺️ 홀덤지도</h2><span class="m" id="cnt"></span></div>
  <div class="bar"><input id="q" type="search" placeholder="매장 · 지역으로 찾기 (예: 강남, 뉴스톤)" autocomplete="off"><button type="button" id="me">📍 내 근처</button></div>
  <div id="map"></div>
  <div id="list"></div>
  <div class="note">대회 포스터가 올라온 매장을 카카오 장소검색으로 찾아 표시해요 · 위치가 틀리면 건의·문의로 알려주세요</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const D={"v": [{"n": "일산 키키", "k": "키키", "a": "경기 고양시 일산동구 정발산로196번길 16-18", "lat": 37.662294, "lng": 126.786196, "u": "http://place.map.kakao.com/852250277"}, {"n": "일산 플립", "k": "플립디자인", "a": "경기 고양시 일산서구 원일로 51-1", "lat": 37.687364, "lng": 126.767888, "u": "http://place.map.kakao.com/1695108463"}, {"n": "다산 로티아레나", "k": "로티아레나", "a": "경기 남양주시 다산중앙로123번길 7-26", "lat": 37.623182, "lng": 127.152117, "u": "http://place.map.kakao.com/1153583950"}, {"n": "다산 프라임", "k": "삼성프라임산부인과의원", "a": "경기 남양주시 다산중앙로146번길 12-12", "lat": 37.625198, "lng": 127.15439, "u": "http://place.map.kakao.com/2017570766"}, {"n": "성남모란 KMGM", "k": "KMGM홀덤펍", "a": "경기 성남시 중원구 둔촌대로101번길 27", "lat": 37.432122, "lng": 127.129786, "u": "http://place.map.kakao.com/862257132"}, {"n": "양산 DM", "k": "한국디엠", "a": "경남 양산시 산막공단북11길 72", "lat": 35.371891, "lng": 129.068491, "u": "http://place.map.kakao.com/24420600"}, {"n": "창원상남 아리아스타디움", "k": "아리아홀덤스타디움", "a": "경남 창원시 성산구 마디미로 23", "lat": 35.222199, "lng": 128.684659, "u": "http://place.map.kakao.com/1402993035"}, {"n": "대구월성 골드문", "k": "골드문홀덤펍 월성점", "a": "대구 달서구 월암로4길 8", "lat": 35.821209, "lng": 128.52035, "u": "http://place.map.kakao.com/1485721062"}, {"n": "강남 클럽도파", "k": "클럽도파", "a": "서울 강남구 강남대로84길 15", "lat": 37.497004, "lng": 127.029835, "u": "http://place.map.kakao.com/426913442"}, {"n": "강남 뉴스톤", "k": "뉴스톤아레나", "a": "서울 강남구 도곡로1길 14", "lat": 37.490966, "lng": 127.032448, "u": "http://place.map.kakao.com/1413866640"}, {"n": "강남 아띠", "k": "아띠홀덤", "a": "서울 강남구 봉은사로26길 14", "lat": 37.505968, "lng": 127.033137, "u": "http://place.map.kakao.com/2116219997"}, {"n": "신촌 MAX", "k": "맥스홀덤 라운지", "a": "서울 서대문구 연세로5가길 8-6", "lat": 37.557505, "lng": 126.936438, "u": "http://place.map.kakao.com/284308819"}, {"n": "먹골 티티", "k": "티티서비스", "a": "서울 성북구 한천로76길 14", "lat": 37.61107, "lng": 127.063617, "u": "http://place.map.kakao.com/290433109"}, {"n": "잠실 아띠", "k": "아띠에스티", "a": "서울 송파구 올림픽로 203", "lat": 37.512464, "lng": 127.093387, "u": "http://place.map.kakao.com/21125064"}, {"n": "구리 키키", "k": "키키네일", "a": "서울 중랑구 봉우재로 200", "lat": 37.594403, "lng": 127.095174, "u": "http://place.map.kakao.com/772762335"}, {"n": "인천용현 크라운", "k": "크라운모텔", "a": "인천 미추홀구 토금남로3번길 10", "lat": 37.453335, "lng": 126.633662, "u": "http://place.map.kakao.com/10823663"}]};
const V=(D.v||[]).filter(x=>x&&isFinite(x.lat)&&isFinite(x.lng));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const area=a=>{const p=String(a||'').split(' ');return p.slice(0,2).join(' ')||'기타';};
let ME=null,SEL=-1;
const km=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const map=L.map('map',{zoomControl:true}).setView([37.5326,127.0246],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const icon=L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#e11d48;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-8]});
const MK=V.map((x,i)=>L.marker([x.lat,x.lng],{icon,title:x.n}).bindPopup(
  `<div class="pop"><b>${esc(x.n)}</b>${x.k&&x.k!==x.n?` <span style="font-size:11.5px;color:#64748b">(${esc(x.k)})</span>`:''}<div>${esc(x.a||'주소 없음')}</div>${x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener">카카오맵에서 보기 ↗</a>`:''}</div>`)
  .on('click',()=>pick(i,false)));
let SHOW=[];
function pick(i,fly){SEL=i;if(fly){map.setView([V[i].lat,V[i].lng],16);MK[i].openPopup();}
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.i===i));
  if(!fly){const c=document.querySelector(`.card[data-i="${i}"]`);if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function draw(fit){
  const q=document.getElementById('q').value.trim().toLowerCase().replace(/\s+/g,'');
  SHOW=V.map((x,i)=>i).filter(i=>!q||(V[i].n+V[i].k+V[i].a).toLowerCase().replace(/\s+/g,'').includes(q));
  MK.forEach((m,i)=>{const on=SHOW.includes(i);if(on&&!map.hasLayer(m))m.addTo(map);if(!on&&map.hasLayer(m))map.removeLayer(m);});
  document.getElementById('cnt').textContent=`매장 ${SHOW.length}곳`;
  let h='';
  if(!SHOW.length)h='<div class="e">'+(V.length?'찾는 매장이 없어요':'아직 지도에 올릴 매장이 없어요')+'</div>';
  else if(ME){const s=SHOW.slice().sort((a,b)=>km(ME,V[a])-km(ME,V[b]));h='<div class="sec">📍 내 근처 순</div>'+s.map(card).join('');}
  else{const g={};SHOW.forEach(i=>{(g[area(V[i].a)]=g[area(V[i].a)]||[]).push(i);});
    Object.keys(g).sort().forEach(k=>{h+=`<div class="sec">${esc(k)} · ${g[k].length}</div>`+g[k].map(card).join('');});}
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{pick(+c.dataset.i,true);document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});});
  if(fit&&SHOW.length){if(SHOW.length===1)map.setView([V[SHOW[0]].lat,V[SHOW[0]].lng],15);else map.fitBounds(L.latLngBounds(SHOW.map(i=>[V[i].lat,V[i].lng])),{padding:[24,24],maxZoom:15});}
}
function card(i){const x=V[i];return `<div class="card${i===SEL?' on':''}" data-i="${i}"><div><div class="t">${esc(x.n)}</div><div class="a">${esc(x.a||'주소 없음')}</div></div>${ME?`<span class="d">${km(ME,x).toFixed(1)}km</span>`:''}</div>`;}
let qt;document.getElementById('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>draw(true),200);});
document.getElementById('me').onclick=()=>{const b=document.getElementById('me');
  if(!navigator.geolocation){alert('이 기기에서는 위치를 쓸 수 없어요');return;}
  b.textContent='찾는 중…';
  navigator.geolocation.getCurrentPosition(p=>{ME={lat:p.coords.latitude,lng:p.coords.longitude};b.textContent='📍 내 근처';
    L.circleMarker([ME.lat,ME.lng],{radius:7,color:'#fff',weight:2.5,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('내 위치');
    map.setView([ME.lat,ME.lng],13);draw(false);},
    ()=>{b.textContent='📍 내 근처';alert('위치 권한을 허용해야 근처 매장을 볼 수 있어요');},{enableHighAccuracy:false,timeout:8000});};
draw(true);
</script>
</body>
</html>
