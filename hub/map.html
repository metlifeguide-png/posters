const V=(D.v||[]).filter(x=>x&&isFinite(x.lat)&&isFinite(x.lng));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const area=a=>{const p=String(a||'').split(' ');return p.slice(0,2).join(' ')||'기타';};
let ME=null,SEL=-1;
const km=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const map=L.map('map',{zoomControl:true}).setView([37.5326,127.0246],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const icon=L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#e11d48;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-8]});
const MK=V.map((x,i)=>L.marker([x.lat,x.lng],{icon,title:x.n}).bindPopup(
  `<div class="pop"><b>${esc(x.n)}</b>${x.k&&x.k!==x.n?` <span style="font-size:11.5px;color:#64748b">(${esc(x.k)})</span>`:''}<div>${esc(x.a||'주소 없음')}</div>${(x.p||[]).map(p=>`<button type="button" class="pbtn" data-img="${esc(p.img)}">🖼️ 오늘 ${esc(p.t)} ${esc(p.n)}</button>`).join('')}${x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener">카카오맵에서 보기 ↗</a>`:''}</div>`)
  .on('click',()=>pick(i,false)));
let SHOW=[];
function pick(i,fly){SEL=i;if(fly){map.setView([V[i].lat,V[i].lng],16);MK[i].openPopup();}
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.i===i));
  if(!fly){const c=document.querySelector(`.card[data-i="${i}"]`);if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function draw(fit){
  const q=document.getElementById('q').value.trim().toLowerCase().replace(/\s+/g,'');
  SHOW=V.map((x,i)=>i).filter(i=>!q||(V[i].n+V[i].k+V[i].a).toLowerCase().replace(/\s+/g,'').includes(q));
  MK.forEach((m,i)=>{const on=SHOW.includes(i);if(on&&!map.hasLayer(m))m.addTo(map);if(!on&&map.hasLayer(m))map.removeLayer(m);});
  document.getElementById('cnt').textContent=`매장 ${SHOW.length}곳`;
  let h='';
  if(!SHOW.length)h='<div class="e">'+(V.length?'찾는 매장이 없어요':'아직 지도에 올릴 매장이 없어요')+'</div>';
  else if(ME){const s=SHOW.slice().sort((a,b)=>km(ME,V[a])-km(ME,V[b]));h='<div class="sec">📍 내 근처 순</div>'+s.map(card).join('');}
  else{const g={};SHOW.forEach(i=>{(g[area(V[i].a)]=g[area(V[i].a)]||[]).push(i);});
    Object.keys(g).sort().forEach(k=>{h+=`<div class="sec">${esc(k)} · ${g[k].length}</div>`+g[k].map(card).join('');});}
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{pick(+c.dataset.i,true);document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});});
  if(fit&&SHOW.length){if(SHOW.length===1)map.setView([V[SHOW[0]].lat,V[SHOW[0]].lng],15);else map.fitBounds(L.latLngBounds(SHOW.map(i=>[V[i].lat,V[i].lng])),{padding:[24,24],maxZoom:15});}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('.pbtn');if(!b)return;ev.stopPropagation();
  const o=document.createElement('div');o.className='plb';o.innerHTML=`<span>×</span><img alt="포스터" src="${esc(b.dataset.img)}">`;
  o.onclick=()=>o.remove();document.body.appendChild(o);},true);
function card(i){const x=V[i];return `<div class="card${i===SEL?' on':''}" data-i="${i}"><div><div class="t">${esc(x.n)}${x.p&&x.p.length?'<span class="tg">오늘 경기</span>':''}</div><div class="a">${esc(x.a||'주소 없음')}</div></div>${ME?`<span class="d">${km(ME,x).toFixed(1)}km</span>`:''}</div>`;}
let qt;document.getElementById('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>draw(true),200);});
document.getElementById('me').onclick=()=>{const b=document.getElementById('me');
  if(!navigator.geolocation){alert('이 기기에서는 위치를 쓸 수 없어요');return;}
  b.textContent='찾는 중…';
  navigator.geolocation.getCurrentPosition(p=>{ME={lat:p.coords.latitude,lng:p.coords.longitude};b.textContent='📍 내 근처';
    L.circleMarker([ME.lat,ME.lng],{radius:7,color:'#fff',weight:2.5,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('내 위치');
    map.setView([ME.lat,ME.lng],13);draw(false);},
    ()=>{b.textContent='📍 내 근처';alert('위치 권한을 허용해야 근처 매장을 볼 수 있어요');},{enableHighAccuracy:false,timeout:8000});};
draw(true);
