<!doctype html>
<html lang="ko">
<head>
<!--split-v1-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
/* 🖥 [10/16] PC(마우스) 게임 화면 확대: 게임 칸 1.35배 · 윗줄 1.2배 (모바일·터치 기기는 그대로 · 되돌리려면 이 두 줄만 지우기) */
@media(min-width:820px) and (pointer:fine){.wrap{zoom:1.35}.top{zoom:1.2}}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
@keyframes cfblink{50%{opacity:.35}}@keyframes pgin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}#app{animation:pgin .22s ease-out}
.lvb{display:inline-block;letter-spacing:-2px;margin-right:5px;vertical-align:-1px;white-space:nowrap}
.lvb.t3{filter:drop-shadow(0 0 3px #ffd54a)}
.lvb.t4{filter:drop-shadow(0 0 4px #4fc3f7) drop-shadow(0 0 2px #ffd54a)}
.lvb.t5{filter:drop-shadow(0 0 5px #ffb300) drop-shadow(0 0 3px #ff7043);animation:lvbs 2.4s ease-in-out infinite}
.lvb.t6{filter:drop-shadow(0 0 6px #ff4081) drop-shadow(0 0 4px #ffd54a);animation:lvbs 1.4s ease-in-out infinite}
.lvb.t7{filter:drop-shadow(0 0 7px #7c4dff) drop-shadow(0 0 4px #ff4081);animation:lvbs 1.1s ease-in-out infinite}
.lvb.t8{filter:drop-shadow(0 0 9px #00e5ff) drop-shadow(0 0 5px #7c4dff) drop-shadow(0 0 3px #ffd54a);animation:lvbs .9s ease-in-out infinite}
#icontip{position:absolute;z-index:9999;display:none;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:600}
.crn{display:inline-block;letter-spacing:-1px;margin-right:4px;white-space:nowrap}
@keyframes lvbs{50%{transform:scale(1.14);filter:brightness(1.35) drop-shadow(0 0 8px #ffd54a)}}
.lvnm5{font-weight:900;background:linear-gradient(90deg,#c98a10,#f6c344,#c98a10);-webkit-background-clip:text;background-clip:text;color:transparent}

</style>
</head>

 {id:"p2",c:"pot",q:"A가 100 올인, B가 300 올인, 스택이 큰 C가 300 콜. 메인팟 / 사이드팟은 각각 얼마일까요?",o:["300 / 400","300 / 300","400 / 300","600 / 100"],a:0,w:"메인팟은 모두가 낸 100씩, 100 × 3 = 300이에요.\n사이드팟은 B와 C가 100을 넘어 더 낸 200씩, 200 × 2 = 400이에요."},
 {id:"p3",c:"pot",q:"위 상황(A 100 올인, B 300 올인, C 300 콜)에서 핸드 순위는 A가 1등, B가 2등, C가 3등입니다. 사이드팟 400은 누가 받을까요?",o:["A","B","C","A와 B가 반반"],a:1,w:"A는 100만 걸어서 메인팟(300)만 받을 자격이 있어요. 사이드팟은 B와 C 둘만의 팟이라 더 강한 B가 받아요."},
 {id:"p4",c:"pot",q:"팟 301(가장 작은 칩 단위 1)을 두 명이 스플릿해요. 남는 1칩은 누구에게?",o:["칩이 많은 사람","버튼에서 왼쪽으로 가장 가까운 승자","딜러가 가져감","팟에 그대로 남김"],a:1,w:"홀나머지 칩은 먼저 현재 쓰는 가장 작은 단위 칩으로 나눠 두고, 보드 게임에서 승자가 둘 이상이면 버튼에서 왼쪽으로 가장 가까운 승자부터 줘요(규칙 21-A).\n사이드팟이 여러 개이면 합치지 않고 팟마다 따로 이 규칙을 적용해요(규칙 23, 각주 14)."},
 // ── 딜러·진행 ──
 {id:"d1",c:"btn",q:"1:1(헤즈업)에서 프리플랍에 먼저 행동하는 사람은?",o:["BB","버튼(SB)","칩이 많은 사람","딜러가 정함"],a:1,w:"헤헤즈업에서는 버튼이 스몰블라인드를 겸하고, 프리플랍은 버튼(SB)이 먼저 행동해요. 플랍부터는 마지막에 행동해요(규칙 36-C)."},
 {id:"d2",c:"btn",q:"1:1(헤즈업)에서 플랍부터 먼저 행동하는 사람은?",o:["버튼(SB)","BB","칩이 많은 사람","프리플랍 마지막 레이저"],a:1,w:"플플랍부터는 BB가 먼저 행동해요(버튼이 포지션). 프리플랍과 순서가 반대예요(규칙 36-C)."},
 {id:"d3",c:"btn",q:"9인 테이블에서 프리플랍에 가장 먼저 행동하는 사람은?",o:["SB","BB","UTG (BB 왼쪽 첫 번째)","버튼"],a:2,w:"프리플랍은 BB 왼쪽 사람(UTG)부터 시작해서 시계 방향으로 돌고, BB가 마지막에 행동해요."},
 {id:"d4",c:"btn",q:"카드를 돌릴 때 첫 장을 받는 사람은?",o:["딜러 버튼","SB (버튼 왼쪽 첫 번째)","BB","UTG"],a:1,w:"버9인 같은 일반 테이블에서는 버튼 왼쪽(SB)부터 시계 방향으로 한 장씩 두 바퀴 돌려요. 그래서 버튼이 마지막에 받아요.\n헤즈업에서도 버튼(SB)이 마지막 카드를 받아요(규칙 36-C)."},
 {id:"d5",c:"btn",q:"한 핸드에서 보드를 깔기 전에 버리는 번 카드는 모두 몇 장일까요?",o:["1장","2장","3장","4장"],a:2,w:"플플랍 전, 턴 전, 리버 전에 각각 한 장씩 버려서 총 3장이에요. 번 카드는 한 스트릿에 항상 1장이에요.\n번 카드는 남은 덱(스텁)을 보호하기 위한 장치예요(규칙 40)."},
 // ── 대회 운영 ──
 {id:"f1",c:"flow",q:"대회 중 자리를 비운 사람(싯 아웃)은 어떻게 처리될까요?",o:["핸드와 블라인드 모두 건너뜀","블라인드·앤티는 계속 빠지고 핸드는 자동 폴드","핸드는 자동 콜","대회에서 자동 탈락"],a:1,w:"자자리를 비워도 칩이 있으면 대회에 참가 중인 것으로 봐요(규칙 7). 블라인드와 앤티는 계속 팟으로 빠져나가요.\n최초 딜 때 자리에 없으면 카드는 바로 먹 처리돼서 그 핸드는 폴드나 마찬가지예요(규칙 32). 자리를 비운 채 블라인드·앤티로 칩이 바닥나면 탈락할 수도 있어요(규칙 74-A)."},
 {id:"f2",c:"flow",q:"같은 핸드에서 A(핸드 시작 칩 8,000)와 B(3,000)가 모두 탈락했어요. 더 높은 순위는?",o:["A","B","동순위","카드 높은 사람"],a:0,w:"같같은 핸드에서 여러 명이 탈락하면, 핸드 시작 때 칩이 더 많았던 사람이 더 높은 순위예요.\n앤티를 쓰는 BBA 방식에서는 앤티를 낸 뒤의 스택이 기준이에요(규칙 22). 핸드 포 핸드 중 머니 인이 걸린 핸드에서는 탈락자들이 그 상금을 나눠 가져요(RP-8-A)."},
 {id:"f3",c:"flow",q:"버블 근처에서 '핸드 포 핸드'를 하는 이유는?",o:["딜러를 쉬게 하려고","한 테이블이 느리게 해서 버블을 미루는 걸 막으려고","블라인드를 올리려고","칩을 정리하려고"],a:1,w:"모든 테이블이 같은 핸드를 끝낸 뒤 다음 핸드로 넘어가요. 버블이 가까울 때 일부러 느리게 쳐서 시간을 끄는 걸 막기 위한 방식이에요.",v:1},
 {id:"f4",c:"flow",q:"블라인드 레벨이 끝나는 순간 아직 진행 중인 핸드의 블라인드는?",o:["새 레벨로 바뀜","그 핸드는 이전 레벨로 끝까지, 다음 핸드부터 새 레벨","핸드를 중단하고 다시 시작","플레이어 투표"],a:1,w:"진진행 중인 핸드는 시작할 때의 블라인드로 끝내고, 새 블라인드는 다음 핸드부터 적용돼요(규칙 25-A).\n핸드는 첫 리플을 하거나, 셔플러 버튼을 누르거나, 딜러가 교대되는 시점에 시작해요(규칙 25-B)."},
 {id:"f5",c:"flow",q:"컬러업 때 작은 칩이 남으면(큰 칩으로 교환 불가) 보통 어떻게 처리할까요?",o:["그냥 버림","카드를 한 장씩 뽑아 높은 사람이 남은 칩을 받는 방식","가장 작은 칩 사람이 가져감","딜러가 가져감"],a:1,w:"남컬러업(칩 레이스)은 1번 자리부터 시작하고, 한 사람이 받는 칩은 최대 1개예요. 칩 레이스로 탈락하는 선수는 없고, 마지막 남은 칩을 모두 잃는 선수는 현재 쓰는 가장 작은 단위 칩을 1개 받아요(규칙 26-A).\n보통 남는 칩이 있는 선수들에게 카드를 한 장씩 돌려 높은 카드가 칩을 받는 식으로 진행해요. 빠지는 단위의 칩은 같은 가치의 현재 단위 칩으로만 바꿔 주고, 최소 단위에 못 미치는 금액은 보상 없이 사라져요(규칙 26-C)."},
 {id:"f6",c:"flow",q:"상대가 오래 고민해서 '타임'을 요청했고 정해진 시간이 지났는데 액션이 없어요. 보통의 처리는?",o:["자동 콜","체크 가능하면 체크, 아니면 폴드","플로어가 대신 결정","무한 대기"],a:1,w:"타타임이 선언되면 25초에 5초 카운트다운이 주어져요(규칙 31). 시간이 끝났을 때 벳을 마주하고 있으면 폴드, 마주하지 않았으면 체크로 처리돼요. 시간 종료와 액션이 동시에 일어나면 액션을 인정해요.\n주어지는 시간은 TD가 조정할 수 있고, 타임 뱅크 등 대회마다 달라요(RP-28).",v:1},
 {id:"f7",c:"flow",q:"내 칩 중 가장 큰 단위 칩을 손으로 가리거나 숨겨도 될까요?",o:["괜찮다","안 된다 (큰 칩은 보이게 둬야 함)","상대가 물어볼 때만 보여 주면 된다","플로어에게만 보여 주면 된다"],a:1,w:"큰큰 단위 칩은 항상 잘 보이고 식별 가능해야 하고, 칩은 같은 단위끼리 20개씩 깔끔하게 수직으로 쌓아 두어야 해요(규칙 27-A, 73).\n칩을 가리거나 작은 칩 뒤에 숨기는 건 반칙이에요."},
 // ── 에티켓·반칙 ──
 {id:"e1",c:"etq",q:"핸드가 진행 중인데 옆에서 구경하던 친구에게 '이거 콜해도 돼?'라고 물었어요. 규칙상은?",o:["문제없다","반칙 (한 핸드에는 한 명의 플레이어만)","상대 동의 시 허용","폴드할 때만 허용"],a:1,w:"'한 핸드에는 한 명의 플레이어만(one player to a hand) 원칙이 있어요(규칙 69). 진행 중인 핸드에 대해 다른 사람에게 조언을 구하거나 받으면 안 돼요."},
 {id:"e2",c:"etq",q:"내가 폴드한 카드를 핸드가 진행 중인 동안 옆 사람에게 보여 줬어요. 규칙상은?",o:["문제없다","반칙 (핸드가 끝나기 전에는 보여 주면 안 됨)","본인만 허용","폴드한 카드는 항상 공개 가능"],a:1,w:"진진행 중인 핸드에서는 핸드(라이브 핸드든 먹된 핸드든) 내용을 이야기하거나 다른 사람에게 보여 주면 안 돼요(규칙 2, 69). 정보가 다른 선수의 결정에 영향을 줄 수 있어서예요."},
 {id:"e3",c:"etq",q:"내 차례인데 일부러 칩을 만지작거리며 애매하게 행동해서 상대의 반응을 본 뒤 결정을 바꾸려는 행동은?",o:["심리전이라 허용","앵글 슈팅이라 반칙","허용되지만 비매너","상대가 속았을 때만 반칙"],a:1,w:"규규칙의 허점이나 모호한 동작을 이용해 상대를 속이는 행동을 앵글 슈팅이라고 해요. 룰북에 그 이름이 따로 있진 않지만, 모호한 동작의 위험은 선수 본인이 지고(규칙 3-C, 59), 다른 선수의 결정에 영향을 주려는 거짓 행동은 게임 조작으로 페널티 대상이에요(규칙 73).\n심하면 실격까지 갈 수 있어요(규칙 74)."},
 {id:"e4",c:"etq",q:"베팅 칩을 팟 한가운데 던져 넣었어요(스플래시). 올바른 방법은?",o:["던져 넣는 게 정석","내 앞 라인에 놓고 딜러가 모으게 함","상대에게 건네줌","딜러 손에 올려놓음"],a:1,w:"칩칩을 팟 위에 흩뿌리거나 딜러 손이 닿지 않는 곳에 벳을 하면 안 돼요(규칙 73). 칩을 던지면 금액을 확인하기 어려워요. 베팅 칩은 내 앞에 놓고 딜러가 확인한 뒤 모으게 해요."},
 {id:"e5",c:"etq",q:"친구와 같은 테이블에서 일부러 한 쪽으로 칩을 넘겨주는 행동(칩 덤핑)은?",o:["친구 사이라 허용","부정행위라 페널티·실격 가능","양쪽이 동의하면 허용","프리플랍에서만 허용"],a:1,w:"칩칩 덤핑과 다른 형태의 담합(collusion)은 실격 대상이에요(규칙 71). 소프트 플레이도 페널티 대상이고 칩 몰수나 실격까지 갈 수 있어요(규칙 74-B). 대회의 공정함을 해치기 때문이에요."},
 {id:"e6",c:"etq",q:"모든 상대가 폴드해서 나 혼자 남았어요. 내 카드를 보여 줘야 할까요?",o:["반드시 두 장 모두","한 장만","보여 줄 의무 없음","딜러에게만"],a:2,w:"상쇼다운 없이 상대가 모두 폴드해서 끝나면, 마지막 남은 선수는 카드를 보여 줄 의무가 없어요(규칙 18-B). 보여 주고 싶으면 보여 줄 수 있지만, 그 정보가 다른 사람에게 영향을 줄 수 있어요."},
 // ── 베팅·레이즈 (상황 응용) ──
 {id:"b8",c:"bet",q:"블라인드 200/400. UTG가 1,000으로 오픈(레이즈 투)했어요. 다음 사람의 최소 3벳(레이즈 투)은?",o:["1,400","1,600","1,800","2,000"],a:1,w:"UTG의 레이즈 증가분은 1,000 − 400(BB) = 600이에요.\n다음 레이즈는 그 증가분 이상을 더 올려야 해서 1,000 + 600 = 1,600이에요. 오픈 금액만큼(1,000) 더 올리는 게 아니라 '직전 증가분'만큼이에요."},
 {id:"b9",c:"bet",q:"플랍에서 A가 500 베팅, B가 1,500으로 레이즈했어요. C의 최소 재레이즈(레이즈 투)는?",o:["2,000","2,500","3,000","3,500"],a:1,w:"B의 레이즈 증가분은 1,500 − 500 = 1,000이에요. 가장 큰 증가분이 1,000이라서 C는 1,500 + 1,000 = 2,500 이상으로 올려야 해요."},
 {id:"b10",c:"bet",q:"블라인드 100/200. UTG가 칩이 150뿐이라 150 올인했어요(BB 미만). 다음 사람이 콜하려면 얼마를 내야 할까요?",o:["150","200","300","400"],a:1,w:"BB보다 작은 올인은 현재 베팅 금액을 바꾸지 않아요. 콜 금액은 여전히 BB인 200이에요.\n레이즈를 하고 싶다면 최소 400(200 + 200)이에요."},
 {id:"b11",c:"bet",q:"블라인드 100/200. A가 600으로 오픈, B가 1,000 올인했어요. 돌아온 A가 할 수 있는 것은?",o:["콜 또는 폴드만","콜·폴드, 또는 1,400 이상으로 레이즈","콜·폴드, 또는 1,200 이상으로 레이즈","폴드만"],a:1,w:"AA의 오픈 증가분은 600 − 200 = 400이에요. B의 올인(600 → 1,000)도 증가분 400으로 풀 레이즈라서 A에게 레이즈 권리가 다시 열려요(규칙 49-A).\n그때 최소 레이즈는 1,000 + 400 = 1,400이에요."},
 {id:"b12",c:"bet",q:"플랍에서 A가 1,000 베팅, B가 1,400 올인했어요(풀 레이즈 미달). 아직 액션하지 않은 C의 최소 레이즈(레이즈 투)는?",o:["1,800","2,400","2,800","3,400"],a:1,w:"BB의 올인은 증가분이 400뿐이라 새 레이즈로 치지 않아요. 마지막 풀 베팅 증가분은 A의 1,000이에요(규칙 49-A, 부록 규칙 49 예시 2).\n그래서 C는 현재 금액 1,400에서 1,000을 더 올린 2,400 이상으로 레이즈해야 해요."},
 {id:"b13",c:"bet",q:"내 차례에 콜 금액이 600이에요. 아무 말 없이 5,000짜리 칩 한 개를 앞으로 던져 넣었어요. 판정은?",o:["5,000으로 레이즈","콜로 처리하고 남는 칩은 돌려받음","올인 선언으로 처리","금액을 다시 말하기 전까지 무효"],a:1,w:"말벳을 마주한 상태에서 오버칩(콜 금액보다 큰 칩) 1개를 말 없이 내면 콜이에요(규칙 46). 남는 금액은 거스름으로 돌려받아요. 레이즈하려면 칩이 테이블에 닿기 전에 레이즈를 먼저 선언해야 해요.\n참고: 마주한 벳이 없을 때 말 없이 오버칩을 내면, 그 칩으로 가능한 최대 금액의 벳이 돼요."},
 {id:"b14",c:"bet",q:"상대 베팅 600에 내가 '2,000으로 레이즈'라고 말했는데 칩은 1,500만 내밀었어요. 판정은?",o:["1,500으로 레이즈","2,000으로 레이즈 (말한 금액이 우선)","콜로 처리","무효 처리 후 폴드"],a:1,w:"말말과 칩이 다르면 먼저 나온 쪽이 기준이고, 동시에 나왔을 땐 분명하고 적절한 말이 우선이에요(규칙 42-A). 레이즈는 칩을 밀기 전에 전체 금액을 말로 선언하면 돼요(규칙 44-B).\n그래서 모자란 500을 채워 2,000으로 레이즈해야 해요. 말과 칩이 분명하지 않게 모순되면 TD가 판단해요."},
 {id:"b15",c:"bet",q:"블라인드 200/400, 플랍에서 아무도 베팅하지 않았어요. 내가 300칩을 놓고 '베팅'이라고 했어요(올인 아님). 판정은?",o:["300 베팅으로 인정","최소 베팅인 400으로 맞춰짐","체크로 처리","무효이고 폴드"],a:1,w:"올올인이 아닌데 최소 금액보다 작게 베팅하거나 레이즈한 경우, 그 스트릿 안에서는(리버는 쇼다운 전까지) 최소 금액으로 고쳐요(규칙 54-A). 여기서는 400으로 맞춰져요.\n체크나 폴드로 처리되는 게 아니라, 최소 금액으로 올려서 베팅이 인정돼요."},
 {id:"b16",c:"bet",q:"블라인드 200/400, 플랍에서 A 체크, B가 1,200 베팅, A가 3,000으로 레이즈했어요. B의 최소 재레이즈(레이즈 투)는?",o:["4,200","4,800","5,400","6,000"],a:1,w:"A의 레이즈 증가분은 3,000 − 1,200 = 1,800이에요. B는 3,000 + 1,800 = 4,800 이상으로 올려야 해요."},
 {id:"b17",c:"bet",q:"블라인드 100/200. A가 700 레이즈, B가 1,100 올인(풀 레이즈 미달)했어요. 아직 액션하지 않은 C의 최소 레이즈(레이즈 투)는?",o:["1,500","1,600","1,800","2,200"],a:1,w:"AA의 레이즈 증가분은 700 − 200 = 500이에요. B의 올인은 증가분 400이라 풀 레이즈 미달이에요.\nC의 최소 레이즈는 마지막 풀 레이즈 증가분 500을 현재 금액 1,100에 더한 1,600이에요(규칙 49-A)."},
 // ── 쇼다운·족보 (헷갈리는 판정) ──
 {id:"s10",c:"sd",q:"보드 A♠ A♦ K♣ K♦ 7♠. 나는 Q♥ J♥, 상대는 2♣ 3♣예요. 승자는?",o:["나 (키커 Q)","상대 (키커 7)","스플릿","나 (Q·J 투페어가 더 높음)"],a:0,w:"보드에 이미 A-A-K-K 투페어가 있어요. 남은 한 장(키커)을 비교하면 나는 Q, 상대는 보드의 7이라서 내가 이겨요."},
 {id:"s11",c:"sd",q:"보드 9♠ 9♦ 9♣ 5♥ 5♠(풀하우스). 나는 A♥ K♥, 상대는 5♦ 2♣예요. 승자는?",o:["나 (A 키커)","상대 (5가 하나 더 있음)","스플릿","상대 (5가 세 장이라 풀하우스가 더 높음)"],a:2,w:"둘 다 보드의 9-9-9-5-5 풀하우스가 최고예요. 상대의 5♦는 더 높은 족보를 만들지 못하고, 풀하우스에는 키커가 없어서 스플릿이에요."},
 {id:"s12",c:"sd",q:"보드 A♣ K♦ Q♠ J♥ 9♣. 나는 3♠ 2♦, 상대는 4♣ 4♦예요. 승자는?",o:["나 (A 하이 스트레이트)","상대 (4 페어)","스플릿","나 (A 하이카드)"],a:1,w:"A-K-Q-J-9는 스트레이트가 아니에요(10이 없어요). 나는 A 하이카드, 상대는 4 페어라서 상대가 이겨요."},
 {id:"s13",c:"sd",q:"보드 Q♦ K♠ A♣ 2♥ 3♦. 나는 4♠ 7♣, 상대는 9♣ 8♦예요. 승자는?",o:["나 (A-2-3-4 스트레이트)","상대 (A-K-Q-9-8 하이카드)","스플릿 (Q-K-A-2-3 스트레이트)","나 (A-K-Q-7-4 하이카드)"],a:1,w:"스트레이트는 K-A-2처럼 A를 넘어 이어질 수 없어요. 그리고 A-2-3-4는 네 장뿐이라서 5가 있어야 휠이 돼요.\n둘 다 하이카드이고 A-K-Q 다음 카드가 9(상대)가 7(나)보다 높아서 상대가 이겨요."},
 {id:"s14",c:"sd",q:"3명이 남은 플랍에서 A가 올인, B와 C가 콜했어요. B와 C는 칩이 남아 있어서 베팅을 더 할 수 있어요. 홀카드는?",o:["A만 공개","세 명 모두 공개","B·C가 베팅을 계속할 수 있어 아직 공개하지 않음","딜러만 확인"],a:2,w:"올올인이 있어도 다른 선수에게 베팅할 칩이 남아 추가 베팅이 가능하면 카드를 공개하지 않아요. 모든 베팅 액션이 끝나는 시점에 바로 공개해요(규칙 17, 부록 규칙 17 예시 2).\n이 상황에서는 B와 C의 칩이 남아 있어 턴·리버에서 더 베팅할 수 있으니 아직 비공개예요. 더 이상 베팅이 불가능해지는 순간(예: B가 올인하고 C가 콜) A·B·C 모두 공개해요.\n쇼다운까지 기다리지도, 사이드팟이 나뉘길 기다리지도 않아요."},
 {id:"s15",c:"sd",q:"쇼다운에서 내 핸드는 A-A-3-3-5(투페어), 상대는 K-K-Q-Q-J(투페어)예요. 승자는?",o:["나 (가장 높은 페어가 A)","상대 (페어 두 개가 모두 높음)","스플릿","상대 (키커 J가 5보다 높음)"],a:0,w:"투페어는 높은 페어부터 비교해요. A 페어가 K 페어보다 높아서, 나머지 페어나 키커는 볼 필요 없이 내가 이겨요."},
 {id:"s16",c:"sd",q:"풀하우스 대결이에요. 나는 7-7-7-K-K, 상대는 9-9-9-2-2예요. 승자는?",o:["나 (K 페어가 더 높음)","상대 (트리플이 더 높음)","스플릿","둘 다 풀하우스라 칩이 많은 쪽"],a:1,w:"풀하우스는 트리플(세 장)부터 비교해요. 9 트리플이 7 트리플보다 높아서 페어가 달라도 상대가 이겨요."},
 {id:"s17",c:"sd",q:"보드 10♠ 8♦ 5♣ 4♥ 2♠. 나는 A♣ 10♣, 상대는 10♦ K♦예요. 승자는?",o:["나 (10 페어, 키커 A)","상대 (10 페어, 키커 K)","스플릿 (같은 10 페어)","판정 불가"],a:0,w:"둘 다 10 원페어라서 남은 3장(키커)을 높은 순서로 비교해요. 나는 A-8-5, 상대는 K-8-5라서 첫 키커가 높은 내가 이겨요."},
 {id:"s18",c:"sd",q:"보드 5♣ 6♦ 7♠ 8♥ 9♣(스트레이트). 나는 A♠ A♦, 상대는 K♠ K♦예요. 승자는?",o:["나 (A 페어 소유)","상대 (K 페어 소유)","스플릿","나 (A 하이)"],a:2,w:"둘둘 다 보드의 5-6-7-8-9 스트레이트가 최고예요. 내 A 페어, 상대의 K 페어는 스트레이트보다 낮아서 쓰이지 않아요. 같은 족보·같은 숫자라서 스플릿이에요.\n이때도 두 사람 모두 홀카드를 오픈해야 몫을 받아요(규칙 20)."},
 {id:"s19",c:"sd",q:"홀덤에서 최종 5장을 만드는 규칙으로 맞는 것은?",o:["반드시 홀카드 2장을 사용","홀카드를 0장~2장 자유롭게 사용 (보드 5장만 써도 됨)","홀카드를 최소 1장은 사용","홀카드 정확히 2장 + 보드 3장"],a:1,w:"홀덤은 홀카드 2장 + 보드 5장 중에서 가장 좋은 5장을 고르면 돼요. 홀카드를 하나도 안 써도 되고(보드 플레이), 2장 모두 써도 돼요.\n홀카드 2장을 반드시 써야 하는 것은 오마하 규칙이에요."},
 // ── 올인·사이드팟 (계산) ──
 {id:"p5",c:"pot",q:"A가 2,000, B가 5,000, C가 8,000을 모두 올인했어요. 핸드 순위는 B가 1등, A가 2등, C가 3등입니다. A가 받는 금액은?",o:["0","2,000","3,000","6,000"],a:0,w:"메인팟(2,000 × 3 = 6,000)은 세 명 모두 자격이 있어서 가장 강한 B가 받아요. A는 2등이어도 B에게 졌기 때문에 받는 게 없어요.\n사이드팟(3,000 × 2 = 6,000)도 B와 C 중 B가 받고, C가 더 낸 3,000은 돌려받아요."},
 {id:"p6",c:"pot",q:"A가 1,000 올인, B와 C는 각각 3,000을 냈어요. 핸드 순위는 A와 B가 동점 1등이고 C가 3등입니다. B가 받는 총 금액은?",o:["4,000","5,500","6,000","7,000"],a:1,w:"메인팟 3,000(1,000 × 3)은 A와 B가 반반이라 각각 1,500이에요.\n사이드팟 4,000(2,000 × 2)은 B와 C의 팟이라 이긴 B가 받아요. B의 합계는 1,500 + 4,000 = 5,500이에요."},
 {id:"p7",c:"pot",q:"A가 1,000을 베팅하고 B가 600 올인, C가 1,000으로 콜했어요. 메인팟 / 사이드팟은 각각 얼마일까요?",o:["2,600 / 0","1,800 / 800","1,200 / 1,400","600 / 2,000"],a:1,w:"메인팟은 모두가 낸 600씩, 600 × 3 = 1,800이에요.\nA와 C가 600을 넘겨 더 낸 400씩이 사이드팟이라 400 × 2 = 800이에요. B는 메인팟에만 참여해요."},
 {id:"p8",c:"pot",q:"A가 3,000을 올인했고 B는 스택 1,200으로 전부 콜했어요. A가 돌려받는 금액은?",o:["0","1,200","1,800","3,000"],a:2,w:"B가 1,200밖에 없어서 맞붙는 금액은 1,200이에요. A가 더 낸 1,800은 아무도 콜하지 않아서 돌려받아요."},
 // ── 딜러·진행 (자리·블라인드) ──
 {id:"d6",c:"btn",q:"3인 테이블(버튼·SB·BB)에서 프리플랍에 가장 먼저 행동하는 사람은?",o:["SB","BB","버튼","칩이 가장 적은 사람"],a:2,w:"3인에서는 BB 왼쪽 사람이 버튼이에요. 그래서 프리플랍은 버튼이 먼저 행동하고, SB, BB 순서로 이어져요."},
 {id:"d7",c:"btn",q:"3인 테이블(버튼·SB·BB)에서 플랍부터 가장 먼저 행동하는 사람은?",o:["버튼","SB","BB","프리플랍 마지막 레이저"],a:1,w:"포스트플랍은 버튼 왼쪽부터 시작해서 SB가 먼저 행동하고 버튼이 마지막이에요. 헤즈업(2인)에서만 BB가 먼저예요."},
 {id:"d8",c:"btn",q:"6인 테이블에서 지난 핸드는 A가 버튼, B가 SB, C가 BB였고, B가 그 핸드에서 탈락해 빈자리가 됐어요. 다음 핸드는?",o:["A가 한 번 더 버튼","B의 빈자리에 버튼(데드 버튼), C가 SB, D가 BB","C가 버튼, D가 SB, E가 BB","버튼 없이 진행"],a:1,w:"BBB는 매 핸드 한 칸씩 움직이므로 D가 BB, C가 SB가 돼요. 버튼은 B의 빈자리로 이동하는 데드 버튼이에요(규칙 34, 각주 17).\n토너먼트에서는 데드 버튼을 쓰지만, 빈자리가 여러 개일 때 새 선수를 받으려고 버튼을 빈자리 너머로 옮길 수도 있어요. 단, 연속 BB가 생기면 안 돼요(규칙 36-B).\n세부 방식은 대회마다 달라요.",v:1},
 {id:"d9",c:"btn",q:"지난 핸드는 A가 버튼, B가 SB, C가 BB였고 C가 탈락했어요. 다음 핸드의 스몰블라인드는?",o:["B가 SB를 겸함","C의 빈자리라서 아무도 안 냄 (데드 SB), D가 BB","D가 SB, E가 BB","BB만 두 배로 냄"],a:1,w:"블블라인드 순서는 한 칸씩 움직여서 B가 버튼, SB 자리는 C의 빈자리, D가 BB예요(규칙 34, 각주 17).\nSB 자리가 비어 있는 데드 스몰블라인드라서 그 핸드는 스몰블라인드를 내는 사람이 없어요.",v:1},
 {id:"d10",c:"btn",q:"BB 앤티(빅블라인드 앤티) 방식에서 앤티는 누가 내나요?",o:["모든 플레이어가 각자","BB 자리 선수가 전체 앤티를 한꺼번에","버튼 자리 선수가 전체 앤티를","팟을 이긴 사람"],a:1,w:"BBB 앤티는 BB 자리 선수가 테이블 전체 앤티를 한 번에 내는 방식이에요. 진행이 빨라져서 TDA도 앤티를 한 명이 내는 포맷에서는 BBA를 권장해요(RP-11). 앤티는 이벤트 중(파이널 테이블 포함)에 전보다 줄일 수 없어요.\nBBA에서 같은 핸드에 여럿이 탈락하면 앤티를 낸 뒤 스택이 많았던 쪽이 더 높은 순위예요(규칙 22). 앤티 금액·시작 레벨은 대회마다 달라요.",v:1},
 // ── 대회 운영 ──

 if(RTAB==='week'){const B=GD.boards||{};let any=false;h+='<div class="sec">이번 주 랭킹 (최근 7일)</div><div class="m" style="font-size:12px;margin:-4px 0 8px">난이도가 있는 게임은 어려움 이상(슬라이딩 퍼즐은 6×6 이상) 기록만 순위에 반영돼요</div>';
  for(const g of RANKED){const c=GCFG[g.k];const keys=c[3]?(c[4]||['쉬움','보통','어려움']).slice().reverse().map(l=>[g.k+'_'+l,l]).filter(([k])=>B[k]):(B[g.k]?[[g.k,'']]:[]);
   for(const [key,lv] of keys){any=true;h+=`<div class="card"><div class="t">${g.e} ${g.nm}${lv?' · '+lv:''}</div>${B[key].map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvIco(x[0])}${esc(x[0])}${lvTag(x[0])}</span><span class="m">${fmtScore(g.k,x[1])}</span></div>`).join('')}</div>`;}}
  if(!any)h+='<div class="card m">아직 이번 주 기록이 없어요. 첫 1위의 주인공이 되어보세요!</div>';}
 if(RTAB==='today'){const T=GD.tbest||{};const ks=Object.keys(T);h+=`<div class="sec">오늘의 최고 기록 (${GD.d||''})</div>`;
  h+=ks.length?`<div class="card">${ks.map(k=>`<div class="row"><span>${gName(k)}${T[k][2]?' · '+esc(T[k][2]):''}</span><span>${lvIco(T[k][0])}<b>${esc(T[k][0])}</b>${lvTag(T[k][0])} <span class="m">${fmtScore(k,T[k][1])}</span></span></div>`).join('')}</div>`:'<div class="card m">오늘은 아직 기록이 없어요</div>';}
 if(RTAB==='level'){const X=GD.xtop||[];h+=NICK?`<div class="card"><div class="t">내 레벨</div>${meBar()}</div>`:'';h+='<div class="sec">레벨 랭킹</div>';
  h+=X.length?`<div class="card">${X.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvBadge(x[1])}<b>${esc(x[0])}</b> <span class="m">Lv.${x[1]} ${x[2]}</span></span><span class="m">🏅${x[4]} · ${x[3].toLocaleString()}xp</span></div>`).join('')}</div>`:'<div class="card m">아직 레벨 기록이 없어요</div>';
  h+=`<div class="card" style="font-size:13.5px;line-height:2"><div class="t" style="margin-bottom:2px">🎖️ 레벨 배지 · 올릴수록 화려해져요</div>${[[1,'새싹'],[5,'루키'],[10,'단골'],[15,'고수'],[20,'달인'],[30,'전설'],[50,'신'],[70,'초월자'],[100,'불멸']].map(([l,t])=>`<div class="row"><span>${lvBadge(l)} <b>${t}</b></span><span class="m">Lv.${l}~</span></div>`).join('')}<div class="m" style="font-size:12px;margin-top:4px">게임 기록 +10xp(하루 30번까지) · 개인 최고 +25xp · 1등 +20~100xp · 오늘의 문제 +50xp · 업적 +30xp~(어려운 업적은 더 많이)</div></div>`;}
 if(RTAB==='ach'){if(!NICK)h+='<div class="card m">닉네임을 저장하면 업적이 쌓여요</div>';else if(!ME)h+='<div class="gq">불러오는 중…</div>';
  else{h+=`<div class="card"><div class="t">${esc(NICK)}</div>${meBar()}<div class="m" style="margin-top:6px">기록 남긴 게임 ${ME.played.length}/${ME.total_games}</div></div>`;
   const got=ME.ach.filter(a=>a[4]),no=ME.ach.filter(a=>!a[4]);
   h+=`<div class="sec">달성 ${got.length}/${ME.ach.length}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${[...got,...no].map(a=>`<div class="card" style="margin:0;padding:8px;${a[4]?'border-color:#e0a800;background:#fff8e1':'opacity:.5;filter:grayscale(1)'}"><div style="font-size:22px">${a[1]}</div><b style="font-size:13.5px">${a[2]}</b><div class="m" style="font-size:11.5px">${a[3]}</div>${a[4]?`<div class="m" style="font-size:10.5px">${a[4].slice(0,10)}</div>`:''}</div>`).join('')}</div>`;}}
 if(RTAB==='crown')h+=crownView();
 return h;}
// 🟢 실시간 접속 (관리자 페이지에서 지금 누가 어떤 화면을 보는지) · 15초마다 신호 · 화면을 끄거나 나가면 바로 OFF
const PSID=(()=>{try{let v=localStorage.getItem('psid');if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem('psid',v);}return v;}catch(e){return Math.random().toString(36).slice(2,10);}})();
let PPAGE='';
function pres(off){if(!API)return;let n='';try{n=localStorage.getItem('nick')||'';}catch(e){}
 const b=JSON.stringify({s:PSID,p:PPAGE,n,f:window.top!==window.self?1:0,off:off?1:0});
 try{if(off&&navigator.sendBeacon&&navigator.sendBeacon(API+'/api/presence',new Blob([b],{type:'text/plain'})))return;
  fetch(API+'/api/presence',{method:'POST',headers:{'Content-Type':'text/plain'},body:b,keepalive:true}).catch(()=>{});}catch(e){}}
function presPage(p){PPAGE=String(p||'').slice(0,40);pres();}
// 💤 30분 동안 손 안 대면 접속 신호를 멈추고 OFF (방치된 화면이 계속 ON 으로 남지 않게) · 다시 손대면 바로 ON
let PACT=Date.now(),PIDLE=false;const PIDLE_MS=30*60*1000;
['pointerdown','keydown','touchstart','wheel','scroll','mousemove'].forEach(ev=>addEventListener(ev,()=>{PACT=Date.now();if(PIDLE){PIDLE=false;if(PPAGE&&!document.hidden)pres();}},{passive:true,capture:true}));
setInterval(()=>{if(document.hidden||!PPAGE)return;if(Date.now()-PACT>PIDLE_MS){if(!PIDLE){PIDLE=true;pres(1);}return;}pres();},15000);
document.addEventListener('visibilitychange',()=>{if(PPAGE)pres(document.hidden);});
window.addEventListener('pagehide',()=>{if(PPAGE)pres(1);});
function gvisit(p){presPage(p);if(!API)return;try{fetch(API+'/api/visit',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({p,n:NICK||''})}).catch(()=>{});}catch(e){}}
function render0(){const n=G.filter(g=>!g.study).length,st=n>0&&G.every(g=>g.cat==='홀덤');setTitle((st?'🎓 홀덤학습':'🎮 뚝섬 게임')+' · '+n+'종');if(st)document.title='홀덤학습';show(listView());}
// 🔄 새 게임: 같은 난이도·옵션으로 바로 다시 시작
const NO_NEW=['live','pet','blackjack','hustudy','huview','ladder','roulette'];
function newBtnSync(){const b=$('newBtn');if(!b)return;const g=CUR;b.style.display=g&&!g.study&&!NO_NEW.includes(g.k)&&!(window.DAILY&&DAILY.k===g.k)?'':'none';}
function newGame(){const g=CUR;if(!g)return;if(g.stop)g.stop();SWH=null;clearInterval(clock.iv);
 if(g.k==='logic'&&g.mode)g.go(g.mode,g.lv);
 else if(g.k==='pushfold'&&g.mode)g.go(g.mode);
 else if((g.k==='onecard'||g.k==='hula')&&g.S)g.go();
 else if(g.pickTh&&g.th)g.pickTh(g.th);
 else if(g.go&&g.lv&&g.go.length>=1)g.go(g.lv);
 else g.start();
 scrollTo(0,0);toast('🔄 새 게임');}
function render(){const hsh=location.hash.slice(1);if(CUR&&CUR.stop)CUR.stop();SWH=null;clearInterval(clock.iv);
 const back=$('backBtn');
 if(hsh.startsWith('g=')){const key=hsh.slice(2).split('&')[0];const g=G.find(x=>x.k===key);if(g&&g.stub){location.replace(g.stub+location.search+location.hash);return;}
  if(window.DAILY&&DAILY.k!==key)dailyEnd();
  if(g&&MEM_ONLY.includes(key)&&!MEM.tok){CUR=null;setTitle(g.e+' '+g.nm);back.style.display=key==='pet'?'none':'';newBtnSync();show(memLockView(g));memNeed(g.nm);scrollTo(0,0);return;}   // 회원 전용: 주소(#g=)는 그대로 두고 잠금 화면 → 로그인하면 바로 그 게임 (예전엔 목록으로 갔다가 다시 넘어왔음)
  else if(g){gvisit((g.study?'':'게임·')+g.nm+(window.DAILY&&DAILY.k===key?' (오늘의 문제)':''));CUR=g;const dly=window.DAILY&&DAILY.k===key;setTitle((dly?'📅 오늘의 문제 · ':'')+g.e+' '+g.nm);back.style.display=(g.study||key==='pet')?'none':'';g.start();   /* 10/16: 뚝섬펫은 '목록' 버튼 숨김 (펫 화면 안에 자체 메뉴가 있음) */newBtnSync();
   if(dly){if(key==='logic')g.go('오늘');else if(DAILY.lv&&g.go)g.go(DAILY.lv);}scrollTo(0,0);return;}}
 if(window.DAILY)dailyEnd();
 CUR=null;back.style.display='none';newBtnSync();
 if(hsh==='rank'){gvisit('게임·랭킹');setTitle('🏆 랭킹·업적');back.style.display='';show(rankView());loadRank(()=>{if(location.hash==='#rank')show(rankView());});if(RTAB==='ach'||RTAB==='level')loadMe(()=>{if(location.hash==='#rank')show(rankView());});return;}
 if(hsh==='daily'){gvisit('게임·오늘의 문제');setTitle('📅 오늘의 문제');back.style.display='';show(dailyView());loadDaily();return;}
 if(hsh==='event'){gvisit('게임·커피이벤트');setTitle('☕ 커피이벤트');back.style.display='';MIS_AT=0;show(eventView());return;}
 render0();if(window.top===window.self)gvisit('게임 목록');else{presPage('게임 목록');back.style.display='';}/* 홈 안에서는 목록 화면에도 '목록'(홈으로) 버튼: 휴대폰은 홈의 위·아래 줄이 숨어 있음 */if(NICK&&!ME)loadMe(()=>{if(!CUR&&!location.hash.slice(1))render0();});}
addEventListener('hashchange',render);addEventListener('hashchange',abarSync);
if(window.top!==window.self){$('homeBtn').style.display='none';}   // 홈 안에서 열렸으면 홈 버튼 숨김 (위의 ← 뒤로로 닫기)
render();abarSync();</script>
