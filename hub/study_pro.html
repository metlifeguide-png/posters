<!doctype html>
<html lang="ko">
<head>
<!--split-v1-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
/*mbhfix*/@media(min-width:760px){:root{--mbh:calc(100lvh - 150px)}}
/*tabtop*/@media(min-width:760px) and (max-height:900px){.top{position:static;background:transparent;padding:2px 8px;justify-content:flex-end}.top .tt,.top #homeBtn{display:none}.top #backBtn{background:var(--blue)}.wrap{padding:4px 12px 12px}.top{position:fixed;right:14px;top:10px;left:auto;width:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:0;margin:0;z-index:3}.mgst{position:fixed;right:14px;top:100px;margin:0;flex-direction:column;align-items:flex-end;gap:6px;z-index:2}html{scrollbar-gutter:stable}[data-h="mhint"]{display:none}/*tab2*/}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
/* 🖥 [10/16] PC(마우스) 게임 화면 확대: 게임 칸 1.35배 · 윗줄 1.2배 (모바일·터치 기기는 그대로 · 되돌리려면 이 두 줄만 지우기) */
@media(min-width:820px) and (pointer:fine){.wrap{zoom:1.35}.top{zoom:1.2}}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
@keyframes cfblink{50%{opacity:.35}}@keyframes pgin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}#app{animation:pgin .22s ease-out}
.lvb{display:inline-block;letter-spacing:-2px;margin-right:5px;vertical-align:-1px;white-space:nowrap}
.lvb.t3{filter:drop-shadow(0 0 3px #ffd54a)}
.lvb.t4{filter:drop-shadow(0 0 4px #4fc3f7) drop-shadow(0 0 2px #ffd54a)}
.lvb.t5{filter:drop-shadow(0 0 5px #ffb300) drop-shadow(0 0 3px #ff7043);animation:lvbs 2.4s ease-in-out infinite}
.lvb.t6{filter:drop-shadow(0 0 6px #ff4081) drop-shadow(0 0 4px #ffd54a);animation:lvbs 1.4s ease-in-out infinite}
.lvb.t7{filter:drop-shadow(0 0 7px #7c4dff) drop-shadow(0 0 4px #ff4081);animation:lvbs 1.1s ease-in-out infinite}
.lvb.t8{filter:drop-shadow(0 0 9px #00e5ff) drop-shadow(0 0 5px #7c4dff) drop-shadow(0 0 3px #ffd54a);animation:lvbs .9s ease-in-out infinite}
#icontip{position:absolute;z-index:9999;display:none;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:600}
.crn{display:inline-block;letter-spacing:-1px;margin-right:4px;white-space:nowrap}
@keyframes lvbs{50%{transform:scale(1.14);filter:brightness(1.35) drop-shadow(0 0 8px #ffd54a)}}
.lvnm5{font-weight:900;background:linear-gradient(90deg,#c98a10,#f6c344,#c98a10);-webkit-background-clip:text;background-clip:text;color:transparent}

</style>
</head>

mann<\/td><td>8♠ 8♣<\/td><td>BTN<\/td><\/tr><tr><td>liano96<\/td><td>?<\/td><td>CO<\/td><\/tr><tr><td>폴드<\/td><td>LaughingStorm ? (UTG) · Andrii Novak ? (SB) · JinWanDalaoHu36 ? (BB)<\/td><td><\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> LaughingStorm이 UTG에서 폴드했고, liano96이 CO에서 5,000,000(2BB)으로 오픈했습니다. Beckmann은 BTN에서 3벳 없이 콜했고, SB·BB는 폴드했습니다. 팟은 15,250,000입니다.<\/li><li><b>플랍 5♠ 4♥ 7♦:<\/b> liano96이 10,675,000(팟의 70%)을 베팅했고 Beckmann이 콜했습니다. Beckmann은 오버페어에 6이 오면 스트레이트가 되는 거트샷입니다. 팟은 36,600,000입니다.<\/li><li><b>턴 8♦:<\/b> Beckmann이 <b>8 셋<\/b>이 됐습니다. 하지만 보드 4-5-7-8에서는 6 한 장만 있어도 스트레이트이고, 다이아몬드 플러시 드로우도 생겼습니다. <b>liano96이 21,870,000을 베팅했습니다(팟의 60%, 8.7BB).<\/b><\/li><\/ul>\n<p>Beckmann의 남은 스택은 75,725,902(30.3BB)이고, liano96이 Beckmann을 커버합니다. 선택지는 콜(21,870,000)과 올인(75,725,902)입니다. 해설진 의견도 \"the safe move is to just move in, right?\"와 \"I would just call ... you see what he does on the river\"로 갈렸습니다.<\/p>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Beckmann은 콜했습니다.<\/b> 해설진은 \"I don't think he can do anything but call. I guess there's a world to shove\"라고 했습니다.<\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Simon Beckmann<\/td><td>8♠ 8♣<\/td><td>BTN<\/td><\/tr><tr><td>liano96<\/td><td>K♦ 9♥<\/td><td>CO<\/td><\/tr><tr><td>LaughingStorm<\/td><td>K♥ 9♠<\/td><td>UTG<\/td><\/tr><tr><td>Andrii Novak<\/td><td>7♠ K♠<\/td><td>SB<\/td><\/tr><tr><td>JinWanDalaoHu36<\/td><td>10♣ 2♠<\/td><td>BB<\/td><\/tr><\/table><\/div>\n<p>liano96은 K 하이에 6을 기다리는 거트샷이었습니다. 턴 시점 Beckmann의 승률은 약 91%(남은 44장 중 6 네 장만 짐)였습니다.<\/p>\n<h4>우리라면: 콜이 맞다<\/h4>\n<ul><li><b>솔버:<\/b> 턴에서 Beckmann의 추천은 콜 100%였습니다.<\/li><li><b>올인하면 누가 콜하나:<\/b> 75,725,902를 58,470,000 팟에 밀면, liano96의 원페어·K 하이·드로우는 대부분 폴드합니다. 콜하는 손은 6이 든 스트레이트와 일부 강한 드로우 정도입니다. 이기고 있는 손은 쫓아내고 지고 있는 손에만 맞는 베팅입니다.<\/li><li><b>콜하면 무엇이 남나:<\/b> liano96의 플랍·턴 연속 베팅에는 이번처럼 K 하이에 거트샷을 단 세미블러프가 섞입니다. 콜하면 이 손들이 리버에 한 번 더 베팅하거나, 체크해도 Beckmann이 밸류를 받을 기회가 남습니다.<\/li><li><b>지고 있을 때:<\/b> 6x 스트레이트에 지고 있어도 셋은 보드가 페어가 되는 10장(5·4·7 각 3장, 8 1장)으로 풀하우스 이상이 됩니다(약 23%).<\/li><li><b>SPR:<\/b> 콜하면 리버 팟 80,340,000에 Beckmann의 남은 스택은 53,855,902(SPR 0.67)입니다. 리버에 올인하기 쉬운 크기라 턴에 서둘러 밀 이유가 적습니다. Beckmann은 포지션도 있어 리버에 6이나 다이아몬드가 오면 체크로 멈출 수 있습니다.<\/li><li><b>ICM:<\/b> 5명 남았고 셋이 18~24BB 숏스택입니다. liano96이 커버하므로 올인했다가 스트레이트에 콜당하면 Beckmann이 5위로 탈락합니다. 큰 팟에서 위험은 리버까지 미루는 쪽이 낫습니다.<\/li><\/ul>\n<p>결론적으로 올인은 이기는 손을 쫓아내고 지는 손에만 걸립니다. 콜로도 리버에 스택을 다 넣을 수 있습니다. <b>콜이 맞습니다.<\/b><\/p>\n<h4>결과<\/h4>\n<ul><li><b>리버 8♥:<\/b> Beckmann이 <b>8 포카드<\/b>를 완성했습니다. liano96 체크, Beckmann 17,500,000 베팅(팟의 22%), liano96 폴드.<\/li><li>리버 추천은 올인 88%, 작은 베팅 12%였고 Beckmann은 작은 베팅을 골랐습니다. 해설진은 \"He did find a small bet on the river\"라고 했습니다.<\/li><li>Beckmann이 팟 80,340,000을 가져가 134,195,902(53.7BB)로 칩리더가 됐습니다. liano96은 68,647,368(27.5BB)로 2위가 됐습니다.<\/li><\/ul>\n<hr>\n<h3>출처<\/h3>\n<ul><li>영상: <a href=\"https://youtu.be/pDBsFQP90B8\" target=\"_blank\" rel=\"noopener\">WSOP Online 2026 MAIN EVENT FINAL TABLE | $28,538,000 Prize Pool with Phil Hellmuth (YouTube)<\/a><ul><li><a href=\"https://youtu.be/pDBsFQP90B8?t=10875\" target=\"_blank\" rel=\"noopener\">시작 03:01:15<\/a> · <a href=\"https://youtu.be/pDBsFQP90B8?t=10961\" target=\"_blank\" rel=\"noopener\">턴 베팅 03:02:41<\/a> · <a href=\"https://youtu.be/pDBsFQP90B8?t=10994\" target=\"_blank\" rel=\"noopener\">콜 03:03:14<\/a> · <a href=\"https://youtu.be/pDBsFQP90B8?t=11084\" target=\"_blank\" rel=\"noopener\">리버 폴드 03:04:44<\/a><\/li><\/ul><\/li><li>해설 인용: 유튜브 자동 생성 영어 자막<\/li><li>홀카드, 액션, 금액: 영상 화면 판독 (<code>hands_selected_passed.json<\/code>, 핸드 id 8)<\/li><li>솔버 수치: 방송 GTO 추천 박스 (턴 Call 100%, 리버 All-in 88% / Bet Small 12%)<\/li><\/ul>","a":"콜","o":["폴드","콜","레이즈"],"p":"콜"},{"id":"ZhTgKidhzgc/post_57_59.md","v":"ZhTgKidhzgc","t":"같은 사람, 같은 리버 베팅, 같은 폴드: 블러프였을 때와 밸류였을 때","s":"2026 WSOP Super Circuit Online 메인 이벤트 파이널 테이블, 5명 남음","html":"<blockquote>2026 WSOP Super Circuit Online 메인 이벤트 파이널 테이블, 5명 남음<br>레벨 19, 블라인드 300,000 / 600,000, 앤티 75,000<br>영상: <a href=\"https://youtu.be/ZhTgKidhzgc?t=6623\" target=\"_blank\" rel=\"noopener\">핸드 A 01:50:23<\/a> · <a href=\"https://youtu.be/ZhTgKidhzgc?t=6738\" target=\"_blank\" rel=\"noopener\">핸드 B 01:52:18<\/a><\/blockquote>\n<p>2분 사이에 littlepapi가 리버에서 팟의 68%, 81% 크기 베팅을 두 번 했습니다. 두 번 모두 상대는 블러프만 이기는 핸드를 들고 폴드했습니다. 한쪽은 10 원페어, 다른 쪽은 보드의 투페어에 A 키커뿐인 A 하이였습니다. 한 번은 K 하이 블러프였고, 한 번은 풀하우스였습니다. 결과만 보면 1패 1승이지만, 결정의 질은 결과와 반대일 수 있습니다.<\/p>\n<p><b>테이블 스택 (핸드 A 시작 시, 블라인드·앤티를 낸 뒤 / BB = 600,000)<\/b><\/p>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>스택<\/th><th>BB<\/th><\/tr><tr><td>Matheus Machado<\/td><td>39,985,639<\/td><td>66.6<\/td><\/tr><tr><td>K Shcherbakov<\/td><td>36,438,702<\/td><td>60.7<\/td><\/tr><tr><td>littlepapi<\/td><td>24,800,952<\/td><td>41.3<\/td><\/tr><tr><td>kikilala88<\/td><td>18,262,580<\/td><td>30.4<\/td><\/tr><tr><td>Checo Pacheco<\/td><td>8,655,431<\/td><td>14.4<\/td><\/tr><\/table><\/div>\n<hr>\n<h3>핸드 A: Shcherbakov의 10-10, 리버 A에 폴드<\/h3>\n<h4>상황<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>littlepapi<\/td><td>K♦ 10♦<\/td><td>CO<\/td><\/tr><tr><td>K Shcherbakov<\/td><td>10♣ 10♥<\/td><td>SB<\/td><\/tr><tr><td>폴드<\/td><td>Machado 6♥ K♣ (UTG) · Checo 2♦ 3♠ (BTN) · kikilala88 6♠ J♥ (BB)<\/td><td><\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> littlepapi가 CO에서 1,200,000(2BB)으로 오픈했습니다. Shcherbakov는 SB에서 3벳 없이 콜했고, BB는 폴드했습니다. 팟은 3,375,000입니다.<\/li><li><b>플랍 5♥ J♦ 2♣:<\/b> Shcherbakov 체크, littlepapi 720,000 베팅(팟의 21%), Shcherbakov 콜. 팟은 4,815,000입니다.<\/li><li><b>턴 7♦:<\/b> 둘 다 체크했습니다. littlepapi는 플러시 드로우(K♦10♦ + J♦7♦)를 얻었지만 세미블러프 대신 무료 카드를 받았습니다.<\/li><li><b>리버 A♠:<\/b> Shcherbakov 체크. <b>littlepapi가 3,900,000을 베팅했습니다(팟의 81%, 6.5BB).<\/b> 플러시가 실패한 K 하이였습니다.<\/li><\/ul>\n<h4>프로의 선택<\/h4>\n<p><b>Shcherbakov는 폴드했습니다.<\/b> 해설진도 \"I don't blame him for folding there\"라며 받아들였습니다.<\/p>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 3,900,000을 콜해서 12,615,000을 먹는 구조라, 필요한 승률은 <b>30.9%<\/b>입니다. littlepapi의 베팅 레인지 중 블러프가 약 31% 이상이어야 콜이 이익입니다.<\/li><li><b>레인지:<\/b><ul><li>\"플랍 소액 c-bet → 턴 체크백 → 리버 A에서 큰 베팅\"은 Ax에 아주 잘 맞는 라인입니다. CO 오픈 레인지에는 A2s~AKs, AJo+ 같은 Ax가 많습니다. 턴에 체크백했다가 리버 A로 탑페어 이상이 된 손이 많습니다.<\/li><li>해설진의 정리대로, 8·6·4 같은 쇼다운 가치가 있는 손은 리버에 베팅하지 않습니다. 남는 블러프는 KQ, KT, K9s 같은 K 하이와 실패한 다이아몬드·스트레이트 드로우입니다.<\/li><li>10-10은 A가 깔린 지금 블러프만 이깁니다.<\/li><\/ul><\/li><li><b>블로커:<\/b> 결정적인 근거입니다. 10을 두 장 들고 있으면 상대의 KT, QT, T9, T8 같은 블러프 후보가 줄어듭니다. 반대로 Ax 밸류는 하나도 막지 못합니다. 콜하기 가장 나쁜 블러프캐처의 모양입니다. 하필 상대의 실제 핸드가 남은 10 두 장 중 하나를 쓴 K♦10♦였을 뿐입니다.<\/li><li><b>ICM:<\/b> Shcherbakov는 2위 스택입니다(핸드 시작 60.7BB, 리버 결정 시점 58.0BB). 14.4BB짜리 숏스택 Pacheco도 남아 있습니다. 6.5BB 콜에 크게 돈이 걸리지는 않지만, 애매하면 접는 쪽으로 기울게 하는 요인입니다.<\/li><\/ul>\n<p>결론적으로 콜하려면 littlepapi가 이 라인에서 블러프를 평균보다 훨씬 많이 해야 합니다. 그것만 믿기에는 10-10이라는 블로커가 너무 나쁩니다. <b>폴드가 표준입니다.<\/b><\/p>\n<h4>결과<\/h4>\n<p>littlepapi가 K 하이로 팟 4,815,000을 가져갔습니다. Shcherbakov는 이 핸드에서 1,920,000(프리플랍 1,200,000 + 플랍 720,000, 앤티 제외)을 잃었습니다. 결과는 나빴지만 결정은 옳았습니다.<\/p>\n<hr>\n<h3>핸드 B: Machado의 A 하이, 더블 페어 보드에서 폴드<\/h3>\n<h4>상황<\/h4>\n<p>바로 다음다음 핸드입니다. 핸드 시작 스택(블라인드·앤티를 낸 뒤)은 Machado 40,210,639(67.0BB), littlepapi 26,945,952(44.9BB)이고, Pacheco는 여전히 14.2BB 숏스택입니다.<\/p>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Matheus Machado<\/td><td>A♦ 5♦<\/td><td>SB<\/td><\/tr><tr><td>littlepapi<\/td><td>J♣ 9♣<\/td><td>BB<\/td><\/tr><tr><td>폴드<\/td><td>Checo K♥ 3♦ (UTG) · Shcherbakov 6♣ 7♦ (CO) · kikilala88 6♦ 3♥ (BTN)<\/td><td><\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> 모두 폴드한 뒤 Machado가 SB에서 2,100,000(3.5BB)으로 레이즈했고, littlepapi가 BB에서 콜했습니다. 팟은 4,575,000입니다.<\/li><li><b>플랍 8♠ 8♣ J♠:<\/b> 둘 다 체크했습니다. littlepapi는 J 투페어(J+8)를 들고 체크백으로 덫을 놓았습니다.<\/li><li><b>턴 Q♠:<\/b> 둘 다 체크했습니다.<\/li><li><b>리버 J♦:<\/b> littlepapi가 <b>잭 풀하우스(JJJ88)<\/b>를 완성했습니다. Machado 체크, <b>littlepapi 3,120,000 베팅(팟의 68%, 5.2BB).<\/b><\/li><\/ul>\n<p>해설진은 베팅 전부터 \"Machado는 check-call 모드로 갈 것이다. 사이즈는 300만 정도\"라고 예상했습니다. 실제 베팅은 3,120,000으로 거의 그대로였습니다.<\/p>\n<h4>프로의 선택<\/h4>\n<p><b>Machado는 폴드했습니다.<\
