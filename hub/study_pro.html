<!doctype html>
<html lang="ko">
<head>
<!--split-v1-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>뚝섬 게임</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;overscroll-behavior:none}
.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}
.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
/*mbhfix*/@media(min-width:760px){:root{--mbh:calc(100lvh - 150px)}}
/*tabtop*/@media(min-width:760px) and (max-height:900px){.top{position:static;background:transparent;padding:2px 8px;justify-content:flex-end}.top .tt,.top #homeBtn{display:none}.top #backBtn{background:var(--blue)}.wrap{padding:4px 12px 12px}.top{position:fixed;right:14px;top:10px;left:auto;width:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:0;margin:0;z-index:3}.mgst{position:fixed;right:14px;top:100px;margin:0;flex-direction:column;align-items:flex-end;gap:6px;z-index:2}html{scrollbar-gutter:stable}[data-h="mhint"]{display:none}/*tab2*/}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.row:last-child{border-bottom:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}
.btn:active{transform:scale(.97)}
input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}
/* 🖥 [10/16] PC(마우스) 게임 화면 확대: 게임 칸 1.35배 · 윗줄 1.2배 (모바일·터치 기기는 그대로 · 되돌리려면 이 두 줄만 지우기) */
@media(min-width:820px) and (pointer:fine){.wrap{zoom:1.35}.top{zoom:1.2}}
.ctl{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:10px}
.ctl button{font-size:22px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
@keyframes cfblink{50%{opacity:.35}}@keyframes pgin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}#app{animation:pgin .22s ease-out}
.lvb{display:inline-block;letter-spacing:-2px;margin-right:5px;vertical-align:-1px;white-space:nowrap}
.lvb.t3{filter:drop-shadow(0 0 3px #ffd54a)}
.lvb.t4{filter:drop-shadow(0 0 4px #4fc3f7) drop-shadow(0 0 2px #ffd54a)}
.lvb.t5{filter:drop-shadow(0 0 5px #ffb300) drop-shadow(0 0 3px #ff7043);animation:lvbs 2.4s ease-in-out infinite}
.lvb.t6{filter:drop-shadow(0 0 6px #ff4081) drop-shadow(0 0 4px #ffd54a);animation:lvbs 1.4s ease-in-out infinite}
.lvb.t7{filter:drop-shadow(0 0 7px #7c4dff) drop-shadow(0 0 4px #ff4081);animation:lvbs 1.1s ease-in-out infinite}
.lvb.t8{filter:drop-shadow(0 0 9px #00e5ff) drop-shadow(0 0 5px #7c4dff) drop-shadow(0 0 3px #ffd54a);animation:lvbs .9s ease-in-out infinite}
#icontip{position:absolute;z-index:9999;display:none;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:600}
.crn{display:inline-block;letter-spacing:-1px;margin-right:4px;white-space:nowrap}
@keyframes lvbs{50%{transform:scale(1.14);filter:brightness(1.35) drop-shadow(0 0 8px #ffd54a)}}
.lvnm5{font-weight:900;background:linear-gradient(90deg,#c98a10,#f6c344,#c98a10);-webkit-background-clip:text;background-clip:text;color:transparent}

</style>
</head>

function ev5(cs){const rs=cs.map(c=>c.r).sort((a,b)=>b-a);const fl=cs.every(c=>c.s===cs[0].s);const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);

.<\/li><li><b>리버 J♠:<\/b> 세 번째 스페이드로 플러시가 가능해졌습니다. <b>Larin이 664,738 올인(팟의 104%, 13.3BB).<\/b> Borovkov에게 남은 스택은 3,967,844(79.4BB)입니다.<\/li><\/ul>\n<p>해설진은 \"턴에 두 번째 카드가 페어가 될 때 작게 리드하는 건 아주 표준\"이라며, \"블러프할 때도 이 사이즈를 쓸 것\"이라고 했습니다.<\/p>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Borovkov는 폴드했습니다.<\/b> 해설진은 \"오래 고민하지 않았다\"고 했습니다.<\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Osmirko Artem<\/td><td>K♥ 9♣<\/td><td>UTG<\/td><\/tr><tr><td>Aleks Borovkov<\/td><td>Q♦ 10♦<\/td><td>UTG+1<\/td><\/tr><tr><td>A Sapitavicius<\/td><td>2♥ 2♣<\/td><td>UTG+2<\/td><\/tr><tr><td>D Velasevic<\/td><td>2♠ 5♥<\/td><td>LJ<\/td><\/tr><tr><td>Duco Haven<\/td><td>5♠ 5♦<\/td><td>HJ<\/td><\/tr><tr><td>Clarity<\/td><td>A♣ 8♦<\/td><td>CO<\/td><\/tr><tr><td>Tsintao<\/td><td>3♦ 5♣<\/td><td>BTN<\/td><\/tr><tr><td>Arsenii Malinov<\/td><td>A♦ 10♠<\/td><td>SB<\/td><\/tr><tr><td>V Larin<\/td><td>A♥ 7♦<\/td><td>BB<\/td><\/tr><\/table><\/div>\n<p>Larin은 턴에 7 트립스(7 7 7 A Q)를 만들었습니다.<\/p>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 664,738을 콜해서 1,303,738을 먹는 구조라, 필요한 승률은 <b>33.8%<\/b>입니다. 올인을 맞을 때 세 번에 한 번 이상 이겨야 합니다.<\/li><li><b>라인:<\/b> BB 체크콜 → 턴 페어 카드에 작은 리드 → 리버 오버벳 올인. 턴 리드는 7을 가진 손이 가장 자연스럽습니다. BB 디펜스 레인지에는 76s, 87s, 97s, A7 같은 7x가 많습니다.<\/li><li><b>리버 J♠:<\/b> Borovkov에게 나쁜 카드입니다. 스페이드 플러시가 완성되고, QJ·J7·JJ도 Q-10을 이깁니다. Q-10은 이제 블러프만 이기는 패입니다.<\/li><li><b>블러프 후보:<\/b> 해설진 분석대로 큰 스페이드 콤보 드로우는 숏스택이라 플랍에서 올인했을 손입니다. 남는 블러프는 턴에 하트 플러시 드로우가 된 손과 놓친 스트레이트 드로우 정도입니다.<\/li><li><b>블로커:<\/b> Q♦는 QJ·Q7 밸류를 조금 줄입니다. 하지만 10♦는 아무것도 막지 못하고, 하트 블러프도 하나도 지우지 않습니다.<\/li><li><b>ICM:<\/b> Borovkov는 85BB 칩리더이고 Larin은 17.9BB 최단 스택입니다. 콜하고 져도 66BB로 칩리더라 ICM 부담은 적습니다. 콜 쪽으로 기울게 하는 유일한 요인입니다.<\/li><\/ul>\n<p>결론적으로 가격은 나쁘지 않지만, 턴 리드와 리버 오버벳이 밸류 쪽으로 너무 무겁고 10 키커는 아무것도 막지 못합니다. <b>폴드가 표준입니다.<\/b><\/p>\n<h4>결과<\/h4>\n<p>Larin이 7 트립스로 팟 639,000을 가져가며 26.1BB로 회복했습니다. Borovkov는 280,000(5.6BB)을 잃었지만 13.3BB를 더 지켜 79.4BB 칩리더를 유지했습니다. 결정도 결과도 좋았습니다.<\/p>\n<hr>\n<h3>출처<\/h3>\n<ul><li >bzvz<\/td><td>2,626,512<\/td><td>32.8<\/td><\/tr><tr><td>Now or Never167<\/td><td>1,851,996<\/td><td>23.1<\/td><\/tr><\/table><\/div>\n<hr>\n<h4>상황<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>A Zlotnikov<\/td><td>Q♠ J♥<\/td><td>BB<\/td><\/tr><tr><td>Simon Beckmann<\/td><td>?<\/td><td>HJ<\/td><\/tr><tr><td>폴드<\/td><td>Klodnicki ? (UTG) · bzvz ? (CO) · Now or Never167 ? (BTN) · Kerber ? (SB)<\/td><td><\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> Klodnicki가 폴드한 뒤 Beckmann이 HJ에서 160,000(2BB)으로 오픈했습니다. 나머지가 폴드했고, Zlotnikov가 BB에서 콜했습니다. 팟은 420,000입니다.<\/li><li><b>플랍 6♦ 10♦ A♣:<\/b> Zlotnikov 체크, Beckmann 120,000 베팅(팟의 29%), Zlotnikov 콜. Q-J는 K가 오면 브로드웨이 스트레이트가 되는 거트샷입니다. 해설진은 \"Would expect Zlotnikov to continue every time here with a hand like queen jack\"이라고 했습니다. 팟은 660,000입니다.<\/li><li><b>턴 7♠:<\/b> Zlotnikov 체크. Beckmann이 한참 생각하자 해설진은 \"He's basically giving up\"이라고 했지만, <b>Beckmann이 680,000을 베팅했습니다(팟의 103%, 8.5BB).<\/b> 해설진은 \"He might get it through\"라고 반응했습니다.<\/li><\/ul>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Zlotnikov는 폴드했습니다.<\/b><\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>A Zlotnikov<\/td><td>Q♠ J♥<\/td><td>BB<\/td><\/tr><tr><td>Simon Beckmann<\/td><td>K♥ 9♠<\/td><td>HJ<\/td><\/tr><tr><td>Chris Klodnicki<\/td><td>2♠ 7♦<\/td><td>UTG, 폴드<\/td><\/tr><tr><td>bzvz<\/td><td>4♣ 3♣<\/td><td>CO, 폴드<\/td><\/tr><tr><td>Now or Never167<\/td><td>3♦ J♣<\/td><td>BTN, 폴드<\/td><\/tr><tr><td>Kelvin Kerber<\/td><td>6♥ 3♠<\/td><td>SB, 폴드<\/td><\/tr><\/table><\/div>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 680,000을 콜해서 2,020,000을 먹는 구조라, 필요한 승률은 <b>33.7%<\/b>입니다.<\/li><li><b>에퀴티:<\/b> Q-J는 A·10·7·6 보드에서 페어가 없습니다. 확실한 아웃은 K 4장뿐이라 리버 한 장으로 스트레이트가 될 확률은 약 9%입니다. Q나 J가 와서 페어가 돼도 Ax·10x에는 여전히 집니다.<\/li><li><b>레인지:<\/b><ul><li>HJ 오픈 → A 하이 플랍 작은 c-bet → 턴 팟 사이즈 베팅은 Ax 이상의 강한 밸류와 다이아몬드 드로우·스트레이트 드로우 세미블러프로 이뤄진 양극화된 라인입니다.<\/li><li>블러프가 섞여 있어도 Q 하이로는 블러프조차 다 이기지 못합니다. 8- 베팅(팟의 21%), Shcherbakov 콜. 팟은 4,815,000입니다.<\/li><li><b>턴 7♦:<\/b> 둘 다 체크했습니다. littlepapi는 플러시 드로우(K♦10♦ + J♦7♦)를 얻었지만 세미블러프 대신 무료 카드를 받았습니다.<\/li><li><b>리버 A♠:<\/b> Shcherbakov 체크. <b>littlepapi가 3,900,000을 베팅했습니다(팟의 81%, 6.5BB).<\/b> 플러시가 실패한 K 하이였습니다.<\/li><\/ul>\n<h4>프로의 선택<\/h4>\n<p><b>Shcherbakov는 폴드했습니다.<\/b> 해설진도 \"I don't blame him for folding there\"라며 받아들였습니다.<\/p>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 3,900,000을 콜해서 12,615,000을 먹는 구조라, 필요한 승률은 <b>30.9%<\/b>입니다. littlepapi의 베팅 레인지 중 블러프가 약 31% 이상이어야 콜이 이익입니다.<\/li><li><b>레인지:<\/b><ul><li>\"플랍 소액 c-bet → 턴 체크백 → 리버 A에서 큰 베팅\"은 Ax에 아주 잘 맞는 라인입니다. CO 오픈 레인지에는 A2s~AKs, AJo+ 같은 Ax가 많습니다. 턴에 체크백했다가 리버 A로 탑페어 이상이 된 손이 많습니다.<\/li><li>해설진의 정리대로, 8·6·4 같은 쇼다운 가치가 있는 손은 리버에 베팅하지 않습니다. 남는 블러프는 KQ, KT, K9s 같은 K 하이와 실패한 다이아몬드·스트레이트 드로우입니다.<\/li><li>10-10은 A가 깔린 지금 블러프만 이깁니다.<\/li><\/ul><\/li><li><b>블로커:<\/b> 결정적인 근거입니다. 10을 두 장 들고 있으면 상대의 KT, QT, T9, T8 같은 블러프 후보가 줄어듭니다. 반대로 Ax 밸류는 하나도 막지 못합니다. 콜하기 가장 나쁜 블러프캐처의 모양입니다. 하필 상대의 실제 핸드가 남은 10 두 장 중 하나를 쓴 K♦10♦였을 뿐입니다.<\/li><li><b>ICM:<\/b> Shcherbakov는 2위 스택입니다(핸드 시작 60.7BB, 리버 결정 시점 58.0BB). 14.4BB짜리 숏스택 Pacheco도 남아 있습니다. 6.5BB 콜에 크게 돈이 걸리지는 않지만, 애매하면 접는 쪽으로 기울게 하는 요인입니다.<\/li><\/ul>\n<p>결론적으로 콜하려면 littlepapi가 이 라인에서 블러프를 평균보다 훨씬 많이 해야 합니다. 그것만 믿기에는 10-10이라는 블로커가 너무 나쁩니다. <b>폴드가 표준입니다.<\/b><\/p>\n<h4>결과<\/h4>\n<p>littlepapi가 K 하이로 팟 4,815,000을 가져갔습니다. Shcherbakov는 이 핸드에서 1,920,000(프리플랍 1,200,000 + 플랍 720,000, 앤티 제외)을 잃었습니다. 결과는 나빴지만 결정은 옳았습니다.<\/p>\n<hr>\n<h3>핸드 B: Machado의 A 하이, 더블 페어 보드에서 폴드<\/h3>\n<h4>상황<\/h4>\n<p>바로 다음다음 핸드입니다. 핸드 시작 스택(블라인드·앤티를 낸 뒤)은 Machado 40,210,639(67.0BB), littlepapi 26,945,952(44.9BB)이고, Pacheco는 여전히 14.2BB 숏스택입니다.<\/p>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Matheus Machado<\/td><td>A♦ 5♦<\/td><td>SB<\/td><\/tr><tr><td>littlepapi<\/td><td>J♣ 9♣<\/td><td>BB<\/td><\/tr><tr><td>폴드<\/td><td>Checo K♥ 3♦ (UTG) · Shcherbakov 6♣ 7♦ (CO) · kikilala88 6♦ 3♥ (BTN)<\/td><td><\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> 모두 폴드한 뒤 Machado가 SB에서 2,100,000(3.5BB)으로 레이즈했고, littlepapi가 BB에서 콜했습니다. 팟은 4,575,000입니다.<\/li><li><b>플랍 8♠ 8♣ J♠:<\/b> 둘 다 체크했습니다. littlepapi는 J 투페어(J+8)를 들고 체크백으로 덫을 놓았습니다.<\/li><li><b>턴 Q♠:<\/b> 둘 다 체크했습니다.<\/li><li><b>리버 J♦:<\/b> littlepapi가 <b>잭 풀하우스(JJJ88)<\/b>를 완성했습니다. Machado 체크, <b>littlepapi 3,120,000 베팅(팟의 68%, 5.2BB).<\/b><\/li><\/ul>\n<p>해설진은 베팅 전부터 \"Machado는 check-call 모드로 갈 것이다. 사이즈는 300만 정도\"라고 예상했습니다. 실제 베팅은 3,120,000으로 거의 그대로였습니다.<\/p>\n<h4>프로의 선택<\/h4>\n<p><b>Machado는 폴드했습니다.<\/b> 해설진은 \"This really should get called\"라고 했다가, 폴드를 보고 \"a really tough fold from Machado with ace high\"라고 평가했습니다.<\/p>\n<h4>우리라면: 콜이 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 3,120,000을 콜해서 10,815,000을 먹는 구조라, 필요한 승률은 <b>28.8%<\/b>로 핸드 A보다 낮습니다.<\/li><li><b>보드 읽기:<\/b><ul><li>8-8-J-Q-J 보드에서 Machado의 실제 핸드는 JJ88 + A 키커입니다.<\/li><li>이기는 상대: K 하이, T 하이, 7 이하의 모든 노페어. littlepapi도 A 키커면 스플릿입니다.<\/li><li>지는 상대: Q, J, 8을 가진 손, 99~KK, T9 스트레이트, 스페이드 두 장 플러시.<\/li><\/ul><\/li><li><b>레인지:<\/b><ul><li>BB 디펜스 레인지에는 Qx, Jx, 8x와 수딧 커넥터가 많습니다.<\/li><li>하지만 그중 상당수는 플랍이나 턴에 베팅하거나 체크레이즈했을 손입니다. 턴에 스페이드 플러시나 T9 스트레이트를 완성한 손은 대부분 턴에서 밸류를 받으러 나옵니다.<\/li><li>두 스트리트 연속 체크한 뒤 리버에 베팅하는 레인지에는 슬로플레이한 J·8과 함께 K 하이·T 하이 같은 포기한 손의 블러프가 섞입니다. littlepapi가 바로 두 핸드 전에 K 하이로 블러프했다는 정보도 있습니다.<\/li><\/ul><\/li><li><b>블로커:<\/b> A♦는 상대의 AJ, AQ, A8 같은 밸류 조합을 줄입니다. 5♦는 상대의 어떤 밸류도 막지 않습니다. 밸류를 막고 블러프는 막지 않는, 블러프캐처로서 이상적인 모양입니다. 핸드 A의 10-10과 정반대입니다.<\/li><li><b>ICM:<\/b> Machado는 칩리더이고(핸드 시작 67.0BB, 리버 결정 시점 64.0BB) littlepapi(리버 시점 42.4BB)를 커버합니다. 5.2BB 콜로 순위가 바뀌지 않아 ICM 부담이 가장 적은 자리입니다.<\/li><\/ul>\n<p>결론적으로 필요 승률이 29%도 안 되고, 블로커가 좋고, ICM 부담도 적습니다. <b>콜이 맞습니다.<\/b> 해설진의 첫 반응이 옳았습니다.<\/p>\n<h4>결과<\/h4>\n<p>littlepapi가 풀하우스로 팟 4,575,000을 가져갔습니다. Machado는 콜했다면 3,120,000을 더 잃었을 것입니다. 결과는 좋았지만, 같은 상황이 반복된다면 손해가 되는 폴드입니다.<\/p>\n<hr>\n<h3>두 핸드 비교<\/h3>\n<div class=\"pcx-tw\"><table><tr><th><\/th><th>핸드 A (Shcherbakov)<\/th><th>핸드 B (Machado)<\/th><\/tr><tr><td>리버 베팅<\/td><td>팟의 81%<\/td><td>팟의 68%<\/td><\ const SUI={s:'♠',h:'♥',d:'♦',c:'♣'};
const card=(c,k)=>{if(!c)return '';const r=c[0]==='T'?'10':c[0],s=c[1];return `<span class="xc${k?' '+k:''}${s==='h'||s==='d'?' r':''}">${r}<i>${SUI[s]||'?'}</i></span>`;};
const cards=(a,k)=>(a||[]).map(c=>card(c,k)).join('');
const bkc='<span class="xc bk"></span><span class="xc bk"></span>';
const n1=x=>{const v=Math.round(x*10)/10;return (v%1===0?v.toFixed(0):v.toFixed(1));};
const BB=(v,h)=>n1(v/h.bb)+'BB';
const man=v=>{const m=v/10000;return m>=1?(Math.round(m*100)/100).toLocaleString()+'만':v.toLocaleString();};
const ga=w=>{const c=String(w).slice(-1).charCodeAt(0);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?'이':'가';};
const pctTx=x=>Math.round(x*100)+'%';
const S=(h,n)=>(h.seats||[]).find(s=>s.n===n)||{n:n,p:''};
const nm=(h,n)=>esc(S(h,n).sn||n);
const STN={pre:'프리플랍',flop:'플랍',turn:'턴',river:'리버'};
const sbb=(h,s)=>s.s!=null?BB(s.s,h):(s.sb!=null?n1(s.sb)+'BB':'');
const yt=(h,t)=>`https://youtu.be/${encodeURIComponent(h.vid)}?t=${t|0}`;
const bub=(c,ic)=>{if(!c)return '';const L=Array.isArray(c)?c:[c];return L.map(x=>`<div class="xcm"><span class="ic">${ic||'🎙️'}</span><div class="bb"><span class="w">${esc(x.w||'해설')}</span>${esc(x.k)}</div></div>`).join('');};
function boardAt(h,upto){let b=[];h.st.forEach((s,i)=>{if(i<=upto&&s.b)b=b.concat(s.b);});return b;}
function lastBet(h){const s=h.st[h.st.length-1];for(let i=s.a.length-1;i>=0;i--){if(s.a[i][2]&&s.a[i][0]!==h.hero)return {who:s.a[i][0],amt:s.a[i][2],pot:(s.pot||0)+s.a.slice(0,i).reduce((t,x)=>t+(x[2]||0),0),st:s.s};}return null;}

// ---------- 테이블 그림 ----------
function table(h){const n=h.seats.length,hi=Math.max(0,h.seats.findIndex(s=>s.n===h.hero)),inv=new Set([h.hero].concat(h.vil||[]));
 let o=`<div class="xtb n${n<=6?5:9}"><div class="fe"></div><div class="ce"><div class="mm">${h.left}명 남음 · 레벨 ${h.lv}</div><div class="b">BB ${man(h.bb)}</div><div class="mm">SB ${man(h.sbl)}${h.ante?' · 앤티 '+man(h.ante):''}</div></div>`;
 h.seats.forEach((s,i)=>{const th=(90+(i-hi)*360/n)*Math.PI/180,x=50+37*Math.cos(th),y=50+41*Math.sin(th),me=s.n===h.hero,v=!me&&inv.has(s.n);
  const bk=v?`<div class="bks" style="${y<50?'top:100%;margin-top:3px':'bottom:100%;margin-bottom:3px'}">${bkc}</div>`:'';
  o+=`<div class="xs${me?' h':v?' v':' out'}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%">${s.p==='BTN'?'<span class="dl">D</span>':''}<div class="nm">${s.p?`<span class="ps">${esc(s.p)}</span>`:''}${me?'나 · ':''}${esc(s.sn||s.n)}</div><div class="sk">${sbb(h,s)||'&nbsp;'}</div>${bk}</div>`;});
 o+=`<div class="xhc">${cards(h.hc,'L')}</div></div>`;return o;}

// ---------- 스트리트 ----------
function street(h,s,i,last){const b=boardAt(h,i);let run=s.pot||0;
 const acts=s.a.map((a,k)=>{const w=a[0],me=w===h.hero,amt=a[2];let tx=esc(a[1]);
  if(amt){const pr=s.s!=='pre'&&run>0?` <small>팟 ${pctTx(amt/run)}</small>`:'';tx=`${BB(amt,h)} ${esc(a[1])}${pr}`;run+=amt;}
  const key=last&&k===s.a.length-1;
  return `<div class="xa${me?' me':''}${a[1]==='폴드'?' f':''}${key?' key':''}"><span class="ps">${me?'나':esc(S(h,w).p||'')}</span><span class="nm">${nm(h,w)}</span><span class="ac">${tx}</span></div>`;}).join('');
 const bd=s.b?`<span>${cards(b,'s')}</span>`:'';
 return `<div class="xst"><div class="hd"><span class="sn">${STN[s.s]||esc(s.s)}</span>${bd}${s.pot?`<span class="pt">팟 ${BB(s.pot,h)}</span>`:''}</div>
  <div style="margin-top:5px">${acts}</div>${s.my?`<div class="xmy">내 패 · <b>${esc(s.my)}</b></div>`:''}${bub(s.cm)}</div>`;}

function question(h,my,k){const lb=lastBet(h),q=h.q,st=h.st[h.st.length-1];
 const stk=q.stk||{},sk=Object.keys(stk).map(n=>`${n===h.hero?'나':nm(h,n)} <b>${BB(stk[n],h)}</b>`).join(' · ');
 let line='';if(lb){const tot=lb.pot+lb.amt;line=`${nm(h,lb.who)} <b>${BB(lb.amt,h)}</b> 베팅 (팟 ${pctTx(lb.amt/lb.pot)}) → 지금 팟 <b>${BB(tot,h)}</b>`;}
 const opts=my?'':`<div class="xopt" style="grid-template-columns:repeat(${q.o.length},1fr)">${q.o.map((o,j)=>`<button class="btn b2" onclick="CUR.pick(${k},${j})">${esc(o)}</button>`).join('')}</div>`;
 return `<div class="xq"><div class="t">🤔 ${STN[st.s]||''}, 내 차례예요</div><div class="sm">${line}${sk?`<br>남은 스택 · ${sk}`:''}<br>내 패 ${cards(h.hc,'s')} ${esc(st.my||'')}</div>${opts}</div>`;}

function reveal(h,my,k){const q=h.q,ok=my===q.a;
 let o=`<div id="pxv" class="xv ${ok?'ok':'no'}"><div class="big">${ok?'✅ 정답과 같아요':'❌ 정답과 달라요'}</div><div class="row"><span class="pl">내 선택 <b>${esc(my)}</b></span><span class="pl">정답 <b>${esc(q.a)}</b></span>${q.p?`<span class="pl">프로 <b>${esc(q.p)}</b></span>`:''}</div></div>`;
 o+=`<div class="xsec">🎬 프로의 선택</div><div class="card" style="font-size:15px;line-height:1.6"><b>${esc((h.pro&&h.pro.t)||'')}</b>${bub(h.pro&&h.pro.cm)}</div>`;
 if(h.show&&h.show.length)o+=`<div class="xsec">🃏 공개된 카드</div><div class="card">${h.show.map(x=>`<div class="xsh"><span class="nm">${nm(h,x[0])}</span>${cards(x[1],'s')}<span style="color:var(--sub);font-size:13.5px">${esc(x[2]||'')}</span></div>`).join('')}</div>`;
 if(h.why&&h.why.length){const rows=h.why.map(w=>`<div class="xw"><span class="tg ${w.v===q.a?'y':'n'}">${esc(w.v)} 쪽</span><div style="min-width:0"><div class="h">${esc(w.h)}</div><div class="x">${esc(w.t)}</div>${bub(w.cm)}</div></div>`).join('');
  o+=`<div class="xsec">⚖️ 왜 ${esc(q.a)}일까</div><div class="card">${rows}${h.end?`<div class="xend">${esc(h.end)}<br>→ <b>${esc(q.a)}${ga(q.a)} 맞아요.</b></div>`:''}</div>`;}
 if(h.res)o+=`<div class="xsec">📌 결과</div><div class="card" style="font-size:15px;line-height:1.65">${esc(h.res)}${bub(h.rescm)}</div>`;
 if(h.src&&h.src.length)o+=`<div class="xsrc">▶ 영상 ${h.src.map(x=>`<a href="${yt(h,x[1])}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join('')}<br>해설은 영어 방송을 한글로 옮겼어요</div>`;
 o+=`<button class="btn full b2" style="margin-top:10px" onclick="CUR.redo(${k})">다시 골라 보기</button>`;
 return o;}

function handView(p,k){const H=HS(p),h=H[k],A=ANS(),my=A[KEY(p,k)];
 let o='';
 if(H.length>1)o+=`<div class="xtab">${H.map((x,j)=>`<button class="${j===k?'on':''}" onclick="CUR.hand(${j})">${'핸드 '+String.fromCharCode(65+j)}${A[KEY(p,j)]?(A[KEY(p,j)]===x.q.a?' ✅':' ❌'):''}</button>`).join('')}</div>`;
 o+=`<div class="t" style="font-size:17px;line-height:1.45;margin:0 2px 4px;font-weight:900">${esc(h.ttl||p.t)}</div>
  <div class="m" style="margin:0 2px 8px;font-size:13px">${esc(h.ev)} · ${h.left}명 남음${h.ts?` · <a href="${yt(h,h.ts)}" target="_blank" rel="noopener" style="color:var(--blue)">▶ 영상</a>`:''}</div>`;
 o+=table(h);
 o+=h.st.map((s,i)=>street(h,s,i,i===h.st.length-1)).join('');
 o+=question(h,my,k);
 if(my){o+=reveal(h,my,k);
  if(k<H.length-1)o+=`<button class="btn full" style="margin-top:8px" onclick="CUR.hand(${k+1})">핸드 ${String.fromCharCode(66+k)}로 →</button>`;
  else if(H.length>1&&H.every((x,j)=>A[KEY(p,j)])&&p.h.cmp)o+=`<div class="xsec">🔍 두 핸드 비교</div><div class="card"><table class="xcmp">${p.h.cmp.map((r,ri)=>`<tr>${r.map(c=>ri?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table>${p.h.lesson?`<div class="xend">💡 ${p.h.lesson}</div>`:''}</div>`;}
 return o;}

  else{const h=HS(p)[a];if(!h||!h.q.o[b])return;A[KEY(p,a)]=h.q.o[b];}
  lsSet('pc_st_ans',A);pcsPush();rr();setTimeout(()=>{const e=document.getElementById('pxv');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});},40);},
 redo(a){const A=ANS();if(a===undefined)delete A[this.cur];else{const p=byId(this.cur);if(p)delete A[KEY(p,a)];}lsSet('pc_st_ans',A);pcsPush();rr();scrollTo(0,0);},
 menu(){const L=all(),A=ANS();let nq=0,nd=0,nok=0;
  const st=p=>{const H=HS(p);if(H.length){return H.map((h,j)=>{nq++;const m=A[KEY(p,j)];if(m){nd++;if(m===h.q.a)nok++;}return (H.length>1?String.fromCharCode(65+j)+' ':'')+(m?(m===h.q.a?'✅':'❌')+' 내 선택 '+esc(m):'❓ 아직');}).join(' · ');}
   if(!p.a)return '📖 글';nq++;const m=A[p.id];if(m){nd++;if(m===p.a)nok++;}return m?(m===p.a?'✅':'❌')+' 내 선택 '+esc(m):'❓ 아직';};

  const items=L.map(p=>{const s=st(p);return `<div class="card" style="cursor:pointer" onclick="CUR.open('${String(p.id).replace(/[^\w./-]/g,'')}')"><div class="t" style="font-size:15.5px;line-height:1.5">${esc(p.t)}</div>${p.s?`<div class="m" style="margin-top:3px">${esc(p.s)}</div>`:''}${mini(p)}<div style="margin-top:6px;font-size:13.5px" class="m">${s}</div></div>`;}).join('');
  return CSS+`<div class="card"><div class="t">🎬 프로의 선택</div><div class="m" style="margin-top:4px;line-height:1.6">GG 온라인 파이널 테이블에서 해설이 몰린 어려운 결정을 골랐어요. <b>테이블과 액션을 보고 내 선택을 먼저</b> 한 뒤, 프로의 선택과 정답 근거를 비교해요.</div>
   ${nq?`<div class="m" style="margin-top:6px">퀴즈 ${nq}개 중 ${nd}개 풀이 · 정답 ${nok}개</div>`:''}</div>`
  +(L.length?items:'<div class="card m" style="text-align:center">준비 중이에요. 새 글이 곧 올라와요</div>');},
 view(){if(!this.cur||!byId(this.cur))return this.menu();const p=byId(this.cur),A=ANS(),my=A[p.id];
  const hd=`<div class="gst"><span>🎬 프로의 선택</span><span><a onclick="CUR.start()" style="color:var(--blue);cursor:pointer">목록으로</a></span></div>`;
  const H=HS(p);
  if(H.length){const k=Math.min(Math.max(0,this.hi|0),H.length-1);return CSS+hd+handView(p,k)+`<button class="btn full gr" style="margin-top:8px" onclick="CUR.start()">목록으로</button>`;}
  // ---- 예전 글 보기 (구조 데이터 없는 글) ----
  const top=`<div class="t" style="font-size:17px;line-height:1.5">${esc(p.t)}</div>`;
  if(!p.a)return CSS+hd+`<div class="card pcx">${top}${p.html}</div><button class="btn full gr" onclick="CUR.start()">목록으로</button>`;
  if(!my)return CSS+hd+`<div class="card pcx">${top}${p.sit}</div>
   <div class="card"><div class="t" style="font-size:16px">🤔 내가 이 자리라면?</div><div class="m" style="margin-top:2px">고르면 프로의 선택과 우리 답이 열려요</div>

  const same=my===p.a;
  return CSS+hd+`<div class="card pcx">${top}${p.sit}</div>
   <div class="card" style="border-color:${same?'#3a9d3f':'#d33b3b'};font-size:15px;line-height:1.8">${same?'✅ 우리 답과 같아요':'❌ 우리 답과 달라요'}<br>내 선택 <b>${esc(my)}</b> · 우리 답 <b>${esc(p.a)}</b>${p.p?` · 프로 <b>${esc(p.p)}</b>`:''}</div>

   for(const [key,lv] of keys){any=true;h+=`<div class="card"><div class="t">${g.e} ${g.nm}${lv?' · '+lv:''}</div>${B[key].map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvIco(x[0])}${esc(x[0])}${lvTag(x[0])}</span><span class="m">${fmtScore(g.k,x[1])}</span></div>`).join('')}</div>`;}}
  if(!any)h+='<div class="card m">아직 이번 주 기록이 없어요. 첫 1위의 주인공이 되어보세요!</div>';}
 if(RTAB==='today'){const T=GD.tbest||{};const ks=Object.keys(T);h+=`<div class="sec">오늘의 최고 기록 (${GD.d||''})</div>`;
  h+=ks.length?`<div class="card">${ks.map(k=>`<div class="row"><span>${gName(k)}${T[k][2]?' · '+esc(T[k][2]):''}</span><span>${lvIco(T[k][0])}<b>${esc(T[k][0])}</b>${lvTag(T[k][0])} <span class="m">${fmtScore(k,T[k][1])}</span></span></div>`).join('')}</div>`:'<div class="card m">오늘은 아직 기록이 없어요</div>';}
 if(RTAB==='level'){const X=GD.xtop||[];h+=NICK?`<div class="card"><div class="t">내 레벨</div>${meBar()}</div>`:'';h+='<div class="sec">레벨 랭킹</div>';
  h+=X.length?`<div class="card">${X.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${lvBadge(x[1])}<b>${esc(x[0])}</b> <span class="m">Lv.${x[1]} ${x[2]}</span></span><span class="m">🏅${x[4]} · ${x[3].toLocaleString()}xp</span></div>`).join('')}</div>`:'<div class="card m">아직 레벨 기록이 없어요</div>';
  h+=`<div class="card" style="font-size:13.5px;line-height:2"><div class="t" style="margin-bottom:2px">🎖️ 레벨 배지 · 올릴수록 화려해져요</div>${[[1,'새싹'],[5,'루키'],[10,'단골'],[15,'고수'],[20,'달인'],[30,'전설'],[50,'신'],[70,'초월자'],[100,'불멸']].map(([l,t])=>`<div class="row"><span>${lvBadge(l)} <b>${t}</b></span><span class="m">Lv.${l}~</span></div>`).join('')}<div class="m" style="font-size:12px;margin-top:4px">게임 기록 +10xp(하루 30번까지) · 개인 최고 +25xp · 1등 +20~100xp · 오늘의 문제 +50xp · 업적 +30xp~(어려운 업적은 더 많이)</div></div>`;}
 if(RTAB==='ach'){if(!NICK)h+='<div class="card m">닉네임을 저장하면 업적이 쌓여요</div>';else if(!ME)h+='<div class="gq">불러오는 중…</div>';
  else{h+=`<div class="card"><div class="t">${esc(NICK)}</div>${meBar()}<div class="m" style="margin-top:6px">기록 남긴 게임 ${ME.played.length}/${ME.total_games}</div></div>`;
   const got=ME.ach.filter(a=>a[4]),no=ME.ach.filter(a=>!a[4]);
   h+=`<div class="sec">달성 ${got.length}/${ME.ach.length}</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">${[...got,...no].map(a=>`<div class="card" style="margin:0;padding:8px;${a[4]?'border-color:#e0a800;background:#fff8e1':'opacity:.5;filter:grayscale(1)'}"><div style="font-size:22px">${a[1]}</div><b style="font-size:13.5px">${a[2]}</b><div class="m" style="font-size:11.5px">${a[3]}</div>${a[4]?`<div class="m" style="font-size:10.5px">${a[4].slice(0,10)}</div>`:''}</div>`).join('')}</div>`;}}
 if(RTAB==='crown')h+=crownView();
 return h;}
// 🟢 실시간 접속 (관리자 페이지에서 지금 누가 어떤 화면을 보는지) · 15초마다 신호 · 화면을 끄거나 나가면 바로 OFF
const PSID=(()=>{try{let v=localStorage.getItem('psid');if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem('psid',v);}return v;}catch(e){return Math.random().toString(36).slice(2,10);}})();
let PPAGE='';
function pres(off){if(!API)return;let n='';try{n=localStorage.getItem('nick')||'';}catch(e){}
 const b=JSON.stringify({s:PSID,p:PPAGE,n,f:window.top!==window.self?1:0,off:off?1:0});
 try{if(off&&navigator.sendBeacon&&navigator.sendBeacon(API+'/api/presence',new Blob([b],{type:'text/plain'})))return;
  fetch(API+'/api/presence',{method:'POST',headers:{'Content-Type':'text/plain'},body:b,keepalive:true}).catch(()=>{});}catch(e){}}
function presPage(p){PPAGE=String(p||'').slice(0,40);pres();}
// 💤 30분 동안 손 안 대면 접속 신호를 멈추고 OFF (방치된 화면이 계속 ON 으로 남지 않게) · 다시 손대면 바로 ON
let PACT=Date.now(),PIDLE=false;const PIDLE_MS=30*60*1000;
['pointerdown','keydown','touchstart','wheel','scroll','mousemove'].forEach(ev=>addEventListener(ev,()=>{PACT=Date.now();if(PIDLE){PIDLE=false;if(PPAGE&&!document.hidden)pres();}},{passive:true,capture:true}));
setInterval(()=>{if(document.hidden||!PPAGE)return;if(Date.now()-PACT>PIDLE_MS){if(!PIDLE){PIDLE=true;pres(1);}return;}pres();},15000);
document.addEventListener('visibilitychange',()=>{if(PPAGE)pres(document.hidden);});
window.addEventListener('pagehide',()=>{if(PPAGE)pres(1);});
function gvisit(p){presPage(p);if(!API)return;try{fetch(API+'/api/visit',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({p,n:NICK||''})}).catch(()=>{});}catch(e){}}
// ===== 🚩 학습 문제 신고 (룰 퀴즈·리버 트레이너·멀티웨이 플랍, 10/17) /*qrep*/ — 관리자가 '제외'한 문제는 출제에서 빠짐 =====
let QBLK={};try{const c=JSON.parse(localStorage.getItem('qblk')||'{}');if(c&&typeof c==='object')QBLK=c;}catch(e){}
function qblkHas(g,id){const a=QBLK[g];return !!(a&&a.indexOf(id)>=0);}
function qblkLoad(){try{if(typeof API==='undefined'||!API)return;fetch(API+'/api/quiz/blocked',{headers:{'ngrok-skip-browser-warning':'1'}}).then(r=>r.json()).then(r=>{if(r&&r.ok&&r.items&&typeof r.items==='object'){QBLK=r.items;try{localStorage.setItem('qblk',JSON.stringify(r.items));}catch(e){}}}).catch(()=>{});}catch(e){}}
setTimeout(qblkLoad,300);
const QREP=[],QREPD=new Set(),QREPR=['정답이 틀림','해설이 틀림','문제가 이상함','기타'];
function qrepBtn(g,id,sum){const w='<div style="margin-top:4px;text-align:right;font-weight:400">';if(QREPD.has(g+'/'+id))return w+'<small style="opacity:.5">🚩 신고함</small></div>';const i=QREP.push([g,id,sum||''])-1;return w+`<button class="btn gr" style="padding:2px 8px;font-size:12px;width:auto" onclick="event.stopPropagation();qrepOpen(this,${i})">🚩 문제 신고</button></div>`;}
function qrepOpen(el,i){const d=document.createElement('span');d.style.cssText='display:inline-flex;flex-wrap:wrap;gap:3px;justify-content:flex-end';d.innerHTML=QREPR.map((r,k)=>`<button class="btn b2" style="padding:2px 6px;font-size:12px;width:auto" onclick="event.stopPropagation();qrepSend(this,${i},${k})">${r}</button>`).join('');el.replaceWith(d);}
function qrepSend(el,i,k){const [g,id,sum]=QREP[i];let cid='';try{cid=localStorage.getItem('wcid')||'';if(!cid){cid=Math.random().toString(36).slice(2,12);localStorage.setItem('wcid',cid);}}catch(e){}
 const box=el.parentNode,done=m=>{box.innerHTML=`<small style="opacity:.6">🚩 ${m}</small>`;};box.innerHTML='<small>보내는 중…</small>';
 try{fetch(API+'/api/quiz/report',{method:'POST',headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},body:JSON.stringify({game:g,qid:id,summary:sum,reason:QREPR[k],mtok:(typeof MEM!=='undefined'&&MEM&&MEM.tok)||'',cid})}).then(r=>r.json()).then(x=>{if(x&&x.ok)QREPD.add(g+'/'+id);done((x&&x.msg)||'신고했어요');}).catch(()=>done('보내지 못했어요. 잠시 뒤 다시 눌러 주세요'));}catch(e){done('보내지 못했어요');}}
// 📒 오답노트 모아 보기 (학습 첫 화면) - 게임별 오답(wn_<게임키>, 이 기기 저장)을 한 칸에. 누르면 그 게임 오답노트 바로 시작
const WN_GAMES=['potodds','geom','rulequiz','aofprac','riverq','calcquiz'];var WN_AUTO=null;
function wnBox(){const R=WN_GAMES.map(k=>{const g=G.find(x=>x.k===k),n=lsGet('wn_'+k,[]).length;return g&&n?{g,n}:null;}).filter(Boolean);
 if(!R.length)return '';const tot=R.reduce((a,r)=>a+r.n,0);
 return `<div class="card" style="margin-bottom:10px"><div class="t">📒 내 오답노트 · ${tot}개</div><div class="m" style="margin-top:4px">틀린 문제를 게임별로 모았어요 · 맞히면 목록에서 빠져요 (이 기기 저장)</div><div style="display:grid;gap:6px;margin-top:8px">${R.map(r=>`<button class="btn full g" style="text-align:left" onclick="wnGo('${r.g.k}')">${r.g.e} ${r.g.nm||r.g.n} · ${r.n}개 풀기</button>`).join('')}</div></div>`;}
function wnGo(k){WN_AUTO=k;location.hash='g='+k;}
function render0(){const n=G.filter(g=>!g.study).length,st=n>0&&G.every(g=>g.cat==='홀덤');setTitle((st?'🎓 홀덤학습':'🎮 뚝섬 게임')+' · '+n+'종');if(st)document.title='홀덤학습';show((st?wnBox():'')+listView());}
// 🔄 새 게임: 같은 난이도·옵션으로 바로 다시 시작
const NO_NEW=['live','pet','blackjack','hustudy','huview','ladder','roulette'];
function newBtnSync(){const b=$('newBtn');if(!b)return;const g=CUR;b.style.display=g&&!g.study&&!NO_NEW.includes(g.k)&&!(window.DAILY&&DAILY.k===g.k)?'':'none';}
function newGame(){const g=CUR;if(!g)return;if(g.stop)g.stop();SWH=null;clearInterval(clock.iv);
 if(g.k==='logic'&&g.mode)g.go(g.mode,g.lv);
 else if(g.k==='pushfold'&&g.mode)g.go(g.mode);
 else if((g.k==='onecard'||g.k==='hula')&&g.S)g.go();
 else if(g.pickTh&&g.th)g.pickTh(g.th);
 else if(g.go&&g.lv&&g.go.length>=1)g.go(g.lv);
 else g.start();
 scrollTo(0,0);toast('🔄 새 게임');}
function render(){const hsh=location.hash.slice(1);if(CUR&&CUR.stop)CUR.stop();SWH=null;clearInterval(clock.iv);
 const back=$('backBtn');
 if(hsh.startsWith('g=')){const key=hsh.slice(2).split('&')[0];const g=G.find(x=>x.k===key);if(g&&g.stub){location.replace(g.stub+location.search+location.hash);return;}
  if(window.DAILY&&DAILY.k!==key)dailyEnd();
  if(g&&MEM_ONLY.includes(key)&&!MEM.tok){CUR=null;setTitle(g.e+' '+g.nm);back.style.display=key==='pet'?'none':'';newBtnSync();show(memLockView(g));memNeed(g.nm);scrollTo(0,0);return;}   // 회원 전용: 주소(#g=)는 그대로 두고 잠금 화면 → 로그인하면 바로 그 게임 (예전엔 목록으로 갔다가 다시 넘어왔음)
  else if(g){gvisit((g.study?'':'게임·')+g.nm+(window.DAILY&&DAILY.k===key?' (오늘의 문제)':''));CUR=g;const dly=window.DAILY&&DAILY.k===key;setTitle((dly?'📅 오늘의 문제 · ':'')+g.e+' '+g.nm);back.style.display=(g.study||(key==='pet'&&typeof MEM!=='undefined'&&MEM.tok))?'none':'';g.start();if(WN_AUTO===key||/&w=1/.test(hsh)){WN_AUTO=null;if(g.go)g.go('W');}   /* 10/16: 뚝섬펫은 '목록' 버튼 숨김 (펫 화면 안에 자체 메뉴가 있음) */newBtnSync();
   if(dly){if(key==='logic')g.go('오늘');else if(DAILY.lv&&g.go)g.go(DAILY.lv);}scrollTo(0,0);return;}}
 if(window.DAILY)dailyEnd();
 CUR=null;back.style.display='none';newBtnSync();
 if(hsh==='rank'){gvisit('게임·랭킹');setTitle('🏆 랭킹·업적');back.style.display='';show(rankView());loadRank(()=>{if(location.hash==='#rank')show(rankView());});if(RTAB==='ach'||RTAB==='level')loadMe(()=>{if(location.hash==='#rank')show(rankView());});return;}
 if(hsh==='daily'){gvisit('게임·오늘의 문제');setTitle('📅 오늘의 문제');back.style.display='';show(dailyView());loadDaily();return;}
 if(hsh==='event'){gvisit('게임·커피이벤트');setTitle('☕ 커피이벤트');back.style.display='';MIS_AT=0;show(eventView());return;}
 render0();if(window.top===window.self)gvisit('게임 목록');else{presPage('게임 목록');back.style.display='';}/* 홈 안에서는 목록 화면에도 '목록'(홈으로) 버튼: 휴대폰은 홈의 위·아래 줄이 숨어 있음 */if(NICK&&!ME)loadMe(()=>{if(!CUR&&!location.hash.slice(1))render0();});}
addEventListener('hashchange',render);addEventListener('hashchange',abarSync);
if(window.top!==window.self){$('homeBtn').style.display='none';}   // 홈 안에서 열렸으면 홈 버튼 숨김 (위의 ← 뒤로로 닫기)
render();abarSync();</script>
