body{min-height:100vh;overscroll-behavior:none}

.top button,.top a{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}

.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}
.m{color:var(--sub);font-size:12.5px}.t{font-weight:800}

.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer}
.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}

input.q{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:96px}
.tile .e{font-size:28px}.tile .n{font-weight:800;font-size:13px;margin-top:4px;line-height:1.25}.tile .b{font-size:11px;color:var(--blue);margin-top:3px}
.tile:active{transform:scale(.96)}
.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px;font-size:14px}
.gst{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:10px;gap:8px}.gst b{color:var(--blue)}
.gq{text-align:center;font-size:15px;line-height:1.6;margin:8px 0 12px}
.gbig{text-align:center;font-size:44px;font-weight:900;color:var(--blue);margin:14px 0 6px}
.gok{background:var(--blue2);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;text-align:center}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.g4b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.g2b .btn,.g3b .btn,.g4b .btn{width:100%;font-size:16px;padding:12px 6px}
.full{width:100%}
.pcs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pc{width:46px;height:64px;border-radius:8px;background:#fff;border:1.5px solid #cfc8b6;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;color:#1b1b1b;flex:none}
.pc b{font-size:20px;line-height:1}.pc i{font-style:normal;font-size:19px;line-height:1.1}.pc.red{color:#c62828}
.pc.sm{width:36px;height:50px}.pc.sm b{font-size:16px}.pc.sm i{font-size:15px}
.pc.back{background:repeating-linear-gradient(45deg,#1f5fae 0 6px,#2b6fc2 6px 12px);border-color:#1f5fae}
.pc.hold{outline:3px solid var(--green);outline-offset:1px}
.pc.dim{filter:brightness(.82)}
.lbl{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}.vs>span{font-weight:900;color:var(--brown)}
.board{display:grid;gap:3px;margin:0 auto;touch-action:none;user-select:none}
.cv{display:block;width:100%;max-width:420px;margin:0 auto;background:#14324f;border-radius:12px;touch-action:none}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.np button{font-size:20px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#26303d;color:#fff;padding:9px 14px;border-radius:11px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.on{opacity:.96}

"rest":"<h4>프로의 선택<\/h4>\n<p><b>P Aerts는 폴드했습니다.<\/b> 타임뱅크를 길게 쓰지 않고 A-10을 내려놓았습니다. 해설진은 \"높은 수준이네요. 여긴 블러프가 많지 않아요\"라고 평가했습니다.<\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>P Aerts<\/td><td>10♦ A♣<\/td><td>SB<\/td><\/tr><tr><td>lamBusinessman<\/td><td>3♠ 5♥<\/td><td>BB<\/td><\/tr><\/table><\/div>\n<p>lamBusinessman은 플랍 5 페어, 턴에 5 페어 + 거트샷(4가 필요)이었고, 리버 4로 휠(A-2-3-4-5 스트레이트)을 완성했습니다.<\/p>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 2,727,276(19.5BB)을 콜해서 7,729,552(55.2BB)를 가져오는 구조라, 필요한 승률은 <b>35.3%<\/b>입니다. 리버 올인 레인지 중 블러프가 35% 넘게 있어야 콜이 이익입니다.<\/li><li><b>레인지:<\/b><ul><li>리버 4로 3을 가진 손이 전부 스트레이트가 됐습니다. A3, 53, 43, 63 같은 손은 턴 오버벳에 거트샷이나 페어+드로우로 콜할 이유가 충분합니다.<\/li><li>그 밖의 밸류도 많습니다. K5, A5, A2, A4 같은 투페어와 55, 22, 44 같은 셋입니다.<\/li><li>해설진의 정리대로, 턴을 거트샷으로 콜한 손이 리버에서 먼저 올인으로 뛰어나오면 블러프를 찾기가 정말 어렵습니다.<\/li><\/ul><\/li><li><b>블로커:<\/b><ul><li>A♣는 상대의 A 투페어(AK, A5, A2, A4)와 A3를 줄여 줍니다. 콜 쪽 근거입니다.<\/li><li>하지만 상대가 가질 만한 블러프는 턴의 다이아몬드 드로우가 실패한 손 정도입니다. 10♦가 J♦10♦, 10♦9♦ 같은 조합을 지웁니다. 해설진도 \"5·6 다이아몬드 정도인데, 피터가 10♦로 그걸 막고 있죠\"라고 짚었습니다.<\/li><\/ul><\/li><li><b>ICM:<\/b> 헤즈업은 칩과 상금이 비례하므로 ICM 부담은 없습니다. 순수하게 승률 35%를 넘느냐만 따지면 됩니다. 그런데 블러프가 거의 없는 레인지라 그 기준을 넘기 어렵습니다.<\/li><\/ul>\n<p>결론적으로 가격은 나쁘지 않지만, 리버 4가 상대의 밸류를 크게 늘렸고 남은 블러프는 내 10♦가 일부 지웁니다. <b>폴드가 맞습니다.<\/b> 접어도 19.5BB가 남아 다시 싸울 수 있습니다.<\/p>\n<h4>결과<\/h4>\n<p>lamBusinessman이 리버에 휠을 완성한 상태였습니다. P Aerts는 폴드로 2,727,276(19.5BB)을 지켰지만, 스택은 19.5BB 대 80.4BB로 크게 벌어졌습니다. 결정도 결과도 좋았습니다.<\/p>\n<hr>\n<h3>출처<\/h3>\n<ul><li>영상: <a href=\"https://youtu.be/XGdluezZFvQ\" target=\"_blank\" rel=\"noopener\">Super High Roller Poker FINAL TABLE Stoyan Obreshkov (YouTube)<\/a><ul><li><a href=\"https://youtu.be/XGdluezZFvQ?t=14525\" target=\"_blank\" rel=\"noopener\">시작 04:02:05<\/a> · <a href=\"https://youtu.be/XGdluezZFvQ?t=14578\" target=\"_blank\" rel=\"noopener\">턴 베팅 04:02:58<\/a> · <a href=\"https://youtu.be/XGdluezZFvQ?t=14611\" target=\"_blank\" rel=\"noopener\">리버 올인 04:03:31 r><tr><td>Osmirko Artem<\/td><td>?<\/td><td>BB<\/td><\/tr><tr><td>폴드<\/td><td>Leonard Maue · Ottomar Ladva · spaise411 · L Cao (BTN) · Eric Yanovsky (SB)<\/td><td><\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> 앞의 세 명이 폴드한 뒤 Peeks가 CO에서 100,000(2BB)으로 오픈했습니다. BTN·SB가 폴드하고, Osmirko가 BB에서 225,000(4.5BB)으로 3벳, Peeks가 콜했습니다. 팟은 517,000(10.3BB)입니다.<\/li><li><b>플랍 8♥ 9♥ 7♠:<\/b> Osmirko 체크, Peeks 130,000 베팅(팟의 25%), <b>Osmirko 375,000으로 체크레이즈<\/b>, Peeks 콜. Peeks는 K 하이에 T가 나오면 스트레이트인 거트샷과 백도어 하트를 들고 있습니다. 팟은 1,267,000(25.3BB)입니다.<\/li><li><b>턴 4♥:<\/b> Osmirko 375,000 베팅(팟의 30%), Peeks 콜. Peeks는 K♥로 플러시 드로우가 생겼습니다. 팟은 2,017,000(40.3BB)입니다.<\/li><li><b>리버 5♠:<\/b> 플러시도 T도 오지 않아 Peeks는 K 하이입니다. <b>Osmirko가 1,275,000을 베팅했습니다(팟의 63%, 25.5BB).<\/b> Peeks에게는 2,055,598(41.1BB)이 남아 있습니다.<\/li><\/ul>\n<p>해설진은 베팅 전 \"올인일까, 블러프 베팅일까, 체크일까\"를 물었고, 결국 큰 베팅이 나왔습니다.<\/p>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Peeks는 폴드했습니다.<\/b><\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Leonard Maue<\/td><td>2♦ Q♦<\/td><td><\/td><\/tr><tr><td>Ottomar Ladva<\/td><td>10♠ 6♦<\/td><td><\/td><\/tr><tr><td>spaise411<\/td><td>4♦ 2♠<\/td><td><\/td><\/tr><tr><td>Roeland Peeks<\/td><td>K♥ J♦<\/td><td>CO<\/td><\/tr><tr><td>L Cao<\/td><td>2♥ 9♦<\/td><td>BTN<\/td><\/tr><tr><td>Eric Yanovsky<\/td><td>7♣ 5♣<\/td><td>SB<\/td><\/tr><tr><td>Osmirko Artem<\/td><td>8♣ Q♥<\/td><td>BB<\/td><\/tr><\/table><\/div>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 1,275,000을 콜해서 4,567,000을 먹는 구조라, 필요한 승률은 <b>27.9%<\/b>입니다.<\/li><li><b>K 하이가 이기는 패:<\/b> Q 하이·J 하이 같은 순수 블러프뿐입니다. 9-8-7-4-5 보드에서 상대의 블러프 후보 중 A 하이, 작은 페어는 모두 K 하이를 이깁니다. 블러프가 28%를 넘어도 그중 K 하이보다 약한 패는 일부입니다.<\/li><li><b>레인지:<\/b> 3벳 → 체크레이즈 → 턴 베팅 → 리버 베팅은 셋, 투페어, 6x 스트레이트, 하트 플러시가 많은 라인입니다. 그런 패는 하나도 이기지 못합니다.<\/li><li><b>올인 블러프:<\/b> 해설 Chufarin은 \"플랍 레이즈 뒤 턴 베팅은 논리가 조금 이상하다\"며 올인을 좋은 아이디어로 봤습니다. 하지만 Peeks가 올인해도 상대는 780,598(15.6BB)만 더 내면 약 6,128,000 팟을 먹습니다. 필요 승률이 12.7%뿐이라 거의 모든 패가 콜합니다. 블러프로 접게 만들 수 있는 패 프리플랍:<\/b> SB까지 모두 폴드한 뒤 Velasevic가 140,000(3.5BB)으로 레이즈했고, Orman이 BB에서 콜했습니다. 팟은 325,000(8.1BB)입니다. 해설진은 \"블라인드 대 블라인드에서 빅스택의 레이즈, Orman은 이 손이면 당연히 계속한다\"고 했습니다.<\/li><li><b>플랍 A♥ 5♥ K♦:<\/b> Velasevic 187,250 베팅(팟의 58%), Orman 콜. 팟은 699,500(17.5BB)입니다. Orman은 K 미들 페어에 Q 키커이고, K♥를 들고 있습니다. 해설진은 \"이 플랍이면 접기 어렵다\"고 했습니다.<\/li><li><b>턴 3♦:<\/b> <b>Velasevic 496,000 베팅(팟의 71%, 12.4BB).<\/b> Orman의 남은 스택은 1,227,650(30.7BB)입니다. 해설진은 \"이 솔버 결과가 ICM을 반영한 건지 칩 기준인지 모르겠다, ICM을 넣으면 꽤 달라진다\"고 했습니다.<\/li><\/ul>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Orman은 폴드했습니다.<\/b> 해설진은 칩 기준 솔버가 올인을 권하는 것을 보고 \"이건 ICM 반영이 아닐 것\"이라고 했습니다.<\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Aliaksei Boika<\/td><td>10♣ 4♦<\/td><td>UTG<\/td><\/tr><tr><td>Deputadim<\/td><td>Q♣ 9♦<\/td><td>UTG+1<\/td><\/tr><tr><td>Oliver Weis<\/td><td>5♣ 2♥<\/td><td>UTG+2<\/td><\/tr><tr><td>Sven Andersson<\/td><td>J♣ 4♣<\/td><td>LJ<\/td><\/tr><tr><td>Simon Beckmann<\/td><td>8♣ 4♥<\/td><td>HJ<\/td><\/tr><tr><td>Simon Mattsson<\/td><td>6♦ A♣<\/td><td>CO<\/td><\/tr><tr><td>Vlada2108<\/td><td>9♠ 3♥<\/td><td>BTN<\/td><\/tr><tr><td>D Velasevic<\/td><td>Q♥ 6♥<\/td><td>SB<\/td><\/tr><tr><td>Leonid Orman<\/td><td>Q♠ K♥<\/td><td>BB<\/td><\/tr><\/table><\/div>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 496,000을 콜해서 1,195,500을 먹는 구조라, 필요한 승률은 <b>29.3%<\/b>입니다.<\/li><li><b>솔버:<\/b> 방송 추천 박스는 이 턴에서 Orman에게 올인 100%였습니다. 플랍에서 Velasevic에게는 체크 100%였습니다. 해설진은 두 결과 모두 ICM이 빠진 칩 기준 계산으로 봤습니다.<\/li><li><b>레인지:<\/b><ul><li>SB 칩리더의 3.5BB 레이즈 → 플랍 58% → 턴 71% 라인에는 Ax 밸류가 많습니다. K 미들 페어는 Ax, 투페어, 셋에 모두 집니다.<\/li><li>턴 3♦로 24 스트레이트가 완성됐고, 다이아몬드 드로우도 생겼습니다. 하트 드로우까지 더해 세미블러프도 많지만, 이 손들은 올인을 받으면 에퀴티가 상당히 남습니다.<\/li><\/ul><\/li><li><b>블로커:<\/b> K♥는 상대의 K 하이 하트 드로우를 지워 블러프 후보를 줄입니다. Ax 밸류는 하나도 막지 못합니다.<\/li><li><b>콜의 문제:<\/b> 콜하면 18.3BB가 남은 채 리버를 맞습니다. 하트·다이아몬드·스트레이트 카드가 많은 보드라 리버 올인에 다시 어려운 결정을 해야 합니다.<\/li><li><b>ICM:<\/b> Orman은 9명 중 5위이고 Velasevic가 커버합니다. 11.6BB 숏스택 Mattsson과 26BB대 스택 둘이 >턴 5♥:<\/b> 하트 플러시 드로우가 생겼습니다. <b>Duco가 717,269(팟의 67%, 12.0BB)를 베팅했습니다.<\/b> Gusscamposs의 남은 스택은 2,138,971(35.6BB)입니다.<\/li><\/ul>\n<p>해설진은 \"아주 좋은 드로우지만, 짧은 스택 두 명만 버텨도 상금이 5만 달러 더 오른다\"며 쉽지 않은 결정이라고 했습니다.<\/p>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Gusscamposs는 올인했습니다.<\/b> 해설진은 \"다른 방법은 그냥 올인이죠\"라고 말하는 순간 올인이 나오자 \"Bravo\"라고 했습니다.<\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>GREAGYPoker<\/td><td>4♥ K♦<\/td><td>UTG (폴드)<\/td><\/tr><tr><td>Boris Angelov<\/td><td>3♣ K♣<\/td><td>CO (폴드)<\/td><\/tr><tr><td>Jeremie Zouari<\/td><td>5♠ 6♠<\/td><td>BTN (폴드)<\/td><\/tr><tr><td>Duco Haven<\/td><td>10♦ J♥<\/td><td>SB<\/td><\/tr><tr><td>Gusscamposs<\/td><td>Q♥ 10♥<\/td><td>BB<\/td><\/tr><\/table><\/div>\n<h4>우리라면: 올인이 맞다<\/h4>\n<ul><li><b>팟오즈와 아웃:<\/b> 콜하려면 12.0BB를 내고 41.8BB 팟을 노리는 구조라 필요한 승률은 <b>28.6%<\/b>입니다. 아웃은 하트 9장 + 하트가 아닌 J 3장, 모두 12장으로 리버 한 장에 약 <b>26%<\/b>입니다. 콜만으로는 살짝 모자랍니다.<\/li><li><b>폴드 에퀴티:<\/b> 올인하면 Duco는 23.7BB를 더 내야 합니다. 콜하고 지면 13BB로 숏스택 무리에 떨어지니, 9 같은 원페어도 쉽게 콜할 수 없습니다. 해설진도 \"상대가 콜하기 정말 어렵다. 9를 들고 있어도 쉽지 않다\"고 했습니다.<\/li><li><b>콜의 문제:<\/b> 콜하면 리버에 드로우가 실패했을 때 그냥 지고, 완성됐을 때는 상대가 더 베팅하지 않을 수 있습니다. 올인은 지금 바로 팟을 가져갈 기회를 더합니다.<\/li><li><b>ICM:<\/b> 폴드 쪽 근거입니다. Duco가 Gusscamposs를 커버하고 있어 콜당하고 지면 6.5BB·13BB 숏스택보다 먼저 5위로 탈락합니다. 해설진도 \"ICM 시뮬레이션이 있었으면 좋겠다. 뭘 원할지 모르겠다\"고 할 만큼 아슬아슬한 자리입니다.<\/li><\/ul>\n<p>결론적으로 12아웃 드로우에 폴드 에퀴티가 더해지고, 상대도 ICM 압박을 똑같이 받습니다. 탈락 위험을 감수하더라도 <b>올인이 맞습니다.<\/b><\/p>\n<h4>결과<\/h4>\n<p>Duco는 J 하이 양방 스트레이트 드로우로 폴드했습니다. 사실 Gusscamposs의 Q 하이가 앞서 있었습니다. Gusscamposs가 팟 1,787,819(29.8BB)를 가져가 칩리더가 됐고, Duco는 37.0BB로 3위가 됐습니다.<\/p>\n<hr>\n<h3>출처<\/h3>\n<ul><li>영상: <a href=\"https://youtu.be/7hNIgAFeWhs\" target=\"_blank\" rel=\"noopener\">Super High Roller Poker FINAL TABLE with Bryan Paris (YouTube)<\/a><ul><li><a href=\"https://youtu.be/7hNIgAFeWhs?t=7594\" target=\"_blank\" rel=\"noopener\">시작 02:06:34<\/a> · <a href=\"https://youtu.be/7hNIgAFeWhs?t=7656\" target=\"_blank\" rel=\"noopener\ td><td>J♠ 9♠<\/td><td>BB<\/td><\/tr><tr><td>Mark Radoja<\/td><td>?<\/td><td>UTG+2<\/td><\/tr><tr><td>폴드<\/td><td>Lastchanc (UTG) · Malinov (UTG+1) · Bauer (LJ) · Kleinman (HJ) · Martirosian (CO) · Theologis (BTN) · CallMeCEO (SB)<\/td><td>?<\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> Radoja가 UTG+2에서 80,000(2BB)으로 오픈했고, 나머지가 폴드한 뒤 Duco가 BB에서 콜했습니다. 팟은 225,000(5.6BB)입니다.<\/li><li><b>플랍 10♠ 5♣ 3♠:<\/b> 둘 다 체크했습니다. Duco는 스페이드 플러시 드로우입니다.<\/li><li><b>턴 8♦:<\/b> Duco 150,750 베팅(팟의 67%), Radoja 콜. Duco는 플러시 드로우에 양방 스트레이트 드로우(J-10-9-8)가 됐습니다. 팟은 526,500(13.2BB)입니다.<\/li><li><b>리버 5♠:<\/b> Duco가 J 하이 플러시를 완성했고, 보드는 5 페어가 됐습니다. Duco 131,625 베팅(팟의 25%), <b>Radoja 692,023 올인(17.3BB).<\/b><\/li><\/ul>\n<p>해설진은 리버 베팅 전 \"풀하우스에는 지지만 이 보드, 이 진행에선 많지 않다. 더 높은 플러시에도 지지만 여전히 밸류 핸드\"라고 했습니다. Duco의 남은 스택은 1,174,785(29.4BB)로, 콜하려면 560,398(14.0BB)이 듭니다.<\/p>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Duco는 콜했습니다.<\/b> 해설진은 \"결국 콜합니다. 이 리버에서 플러시를 접는 건 너무 과할 수 있죠\"라고 했습니다.<\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Lastchanc<\/td><td>9♦ A♥<\/td><td>UTG<\/td><\/tr><tr><td>Arsenii Malinov<\/td><td>4♣ 7♠<\/td><td>UTG+1<\/td><\/tr><tr><td>Mark Radoja<\/td><td>10♦ 10♥<\/td><td>UTG+2<\/td><\/tr><tr><td>Erik Bauer<\/td><td>5♥ 9♥<\/td><td>LJ<\/td><\/tr><tr><td>E Kleinman<\/td><td>J♣ 3♣<\/td><td>HJ<\/td><\/tr><tr><td>A Martirosian<\/td><td>Q♣ 6♦<\/td><td>CO<\/td><\/tr><tr><td>Alex Theologis<\/td><td>7♦ Q♠<\/td><td>BTN<\/td><\/tr><tr><td>CallMeCEO<\/td><td>K♣ 4♦<\/td><td>SB<\/td><\/tr><tr><td>Duco Haven<\/td><td>J♠ 9♠<\/td><td>BB<\/td><\/tr><\/table><\/div>\n<h4>우리라면: 콜이 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 560,398을 콜해서 1,910,546(47.8BB)을 먹는 구조라, 필요한 승률은 <b>29.3%<\/b>입니다.<\/li><li><b>레인지:<\/b><ul><li>지는 손: Q♠x·K♠x·A♠x 같은 더 높은 플러시, 10-10·8-8·3-3과 5x 풀하우스.<\/li><li>이기는 손: 해설진이 꼽은 AJ·AQ·AK·KQ·QJ 같은 스페이드 한 장 블러프, 더 낮은 플러시.<\/li><li>드로우가 많은 보드에서 높은 플러시 드로우와 셋은 보통 플랍에 베팅합니다. 해설진도 \"플랍 체크체크가 꽤 이상하다. K♠Q♠, A♠4♠를 체크백한다는 거냐\"고 짚었습니다. 체크백한 레인지에는 강한 손이 줄어듭 youtu.be/SyAkz66kF2k?t=3144\" target=\"_blank\" rel=\"noopener\">00:52:24<\/a><\/blockquote>\n<p>9명 중 가장 짧은 15.2BB의 Dalton Hobold가 오픈했고, 100BB를 가진 칩리더 Piekazewicz가 BB에서 디펜스했습니다. 플랍은 Dalton의 패와 거리가 먼 모양이고, 칩리더가 먼저 체크를 넘겼습니다.<\/p>\n<p><b>테이블 스택 (핸드 시작, 화면 판독 / BB = 50,000)<\/b><\/p>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>스택<\/th><th>BB<\/th><\/tr><tr><td>A Piekazewicz<\/td><td>4,960,320<\/td><td>99.2<\/td><\/tr><tr><td>Bernardo Soares<\/td><td>3,366,887<\/td><td>67.3<\/td><\/tr><tr><td>B Botteon<\/td><td>2,535,343<\/td><td>50.7<\/td><\/tr><tr><td>Carlos Ribeiro<\/td><td>2,235,871<\/td><td>44.7<\/td><\/tr><tr><td>Ding Biao<\/td><td>2,150,553<\/td><td>43.0<\/td><\/tr><tr><td>Max Buschmann<\/td><td>1,761,269<\/td><td>35.2<\/td><\/tr><tr><td>Fabio W<\/td><td>1,539,856<\/td><td>30.8<\/td><\/tr><tr><td>Alex Theologis<\/td><td>1,284,004<\/td><td>25.7<\/td><\/tr><tr><td>Dalton Hobold<\/td><td>760,897<\/td><td>15.2<\/td><\/tr><\/table><\/div>\n<hr>\n<h4>상황<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Dalton Hobold<\/td><td>A♥ 9♥<\/td><td>LJ<\/td><\/tr><tr><td>A Piekazewicz<\/td><td>?<\/td><td>BB<\/td><\/tr><tr><td>폴드<\/td><td>Botteon · Ding · Max · Fabio · Alex · Carlos · Bernardo (SB), 모두 ?<\/td><td><\/td><\/tr><\/table><\/div>\n<ul><li><b>프리플랍:<\/b> 앞의 세 명이 폴드한 뒤 Dalton이 LJ에서 100,000(2BB)으로 오픈했습니다. 나머지는 폴드하고 Piekazewicz가 BB에서 콜했습니다. 해설진은 \"standard open, standard defend\"라고 했습니다. 팟은 279,000(5.6BB)입니다.<\/li><li><b>플랍 10♦ 6♠ 4♠:<\/b> Piekazewicz 체크. <b>Dalton 차례입니다.<\/b> A 하이에 백도어 스트레이트뿐이고, 남은 스택은 약 13.2BB입니다.<\/li><\/ul>\n<p>해설진은 이렇게 고민을 정리했습니다. \"280k를 포기하기 아깝지만 지금 스택에선 모든 칩이 소중하다. 20%쯤 작게 칠지, 체크할지, 크게 칠지. 상대가 칩리더라 잘못하면 갈려 나갈 수 있다.\"<\/p>","rest":"<h4>프로의 선택<\/h4>\n<p><b>Dalton은 체크했습니다.<\/b> 한참 고민한 끝이었습니다.<\/p>\n<h4>공개된 카드<\/h4>\n<div class=\"pcx-tw\"><table><tr><th>선수<\/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>Dalton Hobold<\/td><td>A♥ 9♥<\/td><td>LJ<\/td><\/tr><tr><td>A Piekazewicz<\/td><td>10♠ Q♣<\/td><td>BB<\/td \/th><th>홀카드<\/th><th>포지션<\/th><\/tr><tr><td>A Zlotnikov<\/td><td>Q♠ J♥<\/td><td>BB<\/td><\/tr><tr><td>Simon Beckmann<\/td><td>K♥ 9♠<\/td><td>HJ<\/td><\/tr><tr><td>Chris Klodnicki<\/td><td>2♠ 7♦<\/td><td>UTG, 폴드<\/td><\/tr><tr><td>bzvz<\/td><td>4♣ 3♣<\/td><td>CO, 폴드<\/td><\/tr><tr><td>Now or Never167<\/td><td>3♦ J♣<\/td><td>BTN, 폴드<\/td><\/tr><tr><td>Kelvin Kerber<\/td><td>6♥ 3♠<\/td><td>SB, 폴드<\/td><\/tr><\/table><\/div>\n<h4>우리라면: 폴드가 맞다<\/h4>\n<ul><li><b>팟오즈:<\/b> 680,000을 콜해서 2,020,000을 먹는 구조라, 필요한 승률은 <b>33.7%<\/b>입니다.<\/li><li><b>에퀴티:<\/b> Q-J는 A·10·7·6 보드에서 페어가 없습니다. 확실한 아웃은 K 4장뿐이라 리버 한 장으로 스트레이트가 될 확률은 약 9%입니다. Q나 J가 와서 페어가 돼도 Ax·10x에는 여전히 집니다.<\/li><li><b>레인지:<\/b><ul><li>HJ 오픈 → A 하이 플랍 작은 c-bet → 턴 팟 사이즈 베팅은 Ax 이상의 강한 밸류와 다이아몬드 드로우·스트레이트 드로우 세미블러프로 이뤄진 양극화된 라인입니다.<\/li><li>블러프가 섞여 있어도 Q 하이로는 블러프조차 다 이기지 못합니다. 8-9, 다이아몬드 드로우 같은 세미블러프는 Q 하이보다 에퀴티가 높고, K 하이 블러프에게도 집니다.<\/li><li>콜하더라도 리버에서 또 베팅이 나오면 대부분 버텨야 할 손이 아닙니다. 지금 콜은 리버까지 끌려가는 첫 단계일 뿐입니다.<\/li><\/ul><\/li><li><b>블로커:<\/b> Q·J는 Beckmann의 KQ·KJ·QJ 같은 브로드웨이 블러프를 줄여, 오히려 상대 레인지에서 블러프 비율을 낮춥니다. 반대로 Beckmann의 실제 카드 K♥는 Zlotnikov가 턴에 접을 KT·KQ 같은 손을 막는 카드라, 해설진은 \"might not be an ideal combo to bet with\"라고 했습니다.<\/li><li><b>ICM:<\/b> Beckmann(76.1BB)은 Zlotnikov(45.8BB)를 커버하는 칩리더입니다. 23BB의 Now or Never167이 남아 있어, 페어도 없는 손으로 칩리더와 큰 팟을 키울 이유가 없습니다. 해설진도 \"when you're the chip leader, you get to do stuff that other players wouldn't be able to do\"라고 정리했습니다.<\/li><\/ul>\n<p>결론적으로 필요 승률 34%에 비해 Q-J의 승률은 10% 남짓이고, 블로커도 콜을 돕지 않으며, 칩리더에게 커버당합니다. <b>폴드가 맞습니다.<\/b><\/p>\n<h4>결과<\/h4>\n<p>Beckmann이 K 하이(8이 오면 스트레이트가 되는 거트샷)로 팟 1,340,000을 가져갔습니다. Zlotnikov는 이 핸드에서 280,000(프리플랍 160,000 + 플랍 120,000, 앤티 제외)을 잃었습니다. 해설진은 \"Nice pot. Nice sizing. Nice execution\"이라며 Beckmann의 플레이를 칭찬했습니다. 상대가 세미블러프였어도 Q 하이는 K 하이에 뒤져 있었으니, 폴드는 결과로 봐도 옳았습니다.<\/p>\n<hr>\n<h3>출처<\/h3>\n<ul><li>영상: <a href=\"https://youtu.be/SpPaw3mOzlc\" target=\"_blank\" rel=\"noopener\">Super High Roller Poker FINAL TABLE with Matt Hunt (YouTube)<\/a><ul><li>< .xa .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xa .ac{font-weight:900;white-space:nowrap}.xa .ac small{font-weight:600;color:var(--sub);font-size:12.5px}
.xa.me .ps{background:#9a5a2a;color:#fff}.xa.me .nm{font-weight:800}.xa.f .ac{color:#999}.xa.key{background:#fff4c2;border-radius:8px;padding:6px 6px;border-top:0}
.xmy{margin-top:6px;font-size:13.5px;padding:4px 9px;border-radius:9px;background:var(--blue2);color:#1f3f6e}.xmy b{color:#1f5fae}
.xcm{display:flex;gap:7px;align-items:flex-start;margin-top:7px}.xcm .ic{flex:none;font-size:16px;line-height:1.5}.xcm .bb{background:#fff;border:1.5px solid var(--line);border-radius:4px 12px 12px 12px;padding:5px 10px;font-size:14px;line-height:1.55}.xcm .w{display:block;font-size:11.5px;color:var(--sub);font-weight:700}
.xq{background:#fffbe8;border:2px solid #f0c94a;border-radius:14px;padding:11px 12px;margin-bottom:10px}.xq .t{font-size:16px;font-weight:900}.xq .sm{font-size:13.5px;color:#5a5140;margin-top:3px;line-height:1.6}
.xv{border-radius:14px;padding:11px 12px;margin-bottom:10px;color:#fff;font-size:15px;line-height:1.7}.xv.ok{background:#2f8a4a}.xv.no{background:#c0453a}.xv .big{font-size:18px;font-weight:900}

.xw .tg{flex:none;font-size:12px;font-weight:900;padding:2px 8px;border-radius:9px;margin-top:2px;white-space:nowrap}.xw .tg.y{background:#dff1e2;color:#22703a}.xw .tg.n{background:#eee;color:#777}

@media(min-width:760px){.xtb{height:320px}.xtb.n5{height:260px}.xs{max-width:110px}}</style>`;

// ---------- 작은 도구 ----------
const SUI={s:'♠',h:'♥',d:'♦',c:'♣'};
const card=(c,k)=>{if(!c)return '';const r=c[0]==='T'?'10':c[0],s=c[1];return `<span class="xc${k?' '+k:''}${s==='h'||s==='d'?' r':''}">${r}<i>${SUI[s]||'?'}</i></span>`;};
const cards=(a,k)=>(a||[]).map(c=>card(c,k)).join('');
const bkc='<span class="xc bk"></span><span class="xc bk"></span>';
const n1=x=>{const v=Math.round(x*10)/10;return (v%1===0?v.toFixed(0):v.toFixed(1));};
const BB=(v,h)=>n1(v/h.bb)+'BB';
const man=v=>{const m=v/10000;return m>=1?(Math.round(m*100)/100).toLocaleString()+'만':v.toLocaleString();};
const ga=w=>{const c=String(w).slice(-1).charCodeAt(0);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28?'이':'가';};
const pctTx=x=>Math.round(x*100)+'%';
const S=(h,n)=>(h.seats||[]).find(s=>s.n===n)||{n:n,p:''};
const nm=(h,n)=>esc(S(h,n).sn||n);
const STN={pre:'프리플랍',flop:'플랍',turn:'턴',river:'리버'};
const sbb=(h,s)=>s.s!=null?BB(s.s,h):(s.sb!=null?n1(s.sb)+'BB':'');
const yt=(h,t)=>`https://youtu.be/${encodeURIComponent(h.vid)}?t=${t|0}`;
const bub=(c,ic)=>{if(!c)return '';const L=Array.isArray(c)?c:[c];return L.map(x=>`<div class="xcm"><span class="ic">${ic||'🎙️'}</span><div class="bb"><span class="w">${esc(x.w||'해설')}</span>${esc(x.k)}</div></div>`).join('');};
function boardAt(h,upto){let b=[];h.st.forEach((s,i)=>{if(i<=upto&&s.b)b=b.concat(s.b);});return b;}
function lastBet(h){const s=h.st[h.st.length-1];for(let i=s.a.length-1;i>=0;i--){if(s.a[i][2]&&s.a[i][0]!==h.hero)return {who:s.a[i][0],amt:s.a[i][2],pot:(s.pot||0)+s.a.slice(0,i).reduce((t,x)=>t+(x[2]||0),0),st:s.s};}return null;}

// ---------- 테이블 그림 ----------
function table(h){const n=h.seats.length,hi=Math.max(0,h.seats.findIndex(s=>s.n===h.hero)),inv=new Set([h.hero].concat(h.vil||[]));
 let o=`<div class="xtb n${n<=6?5:9}"><div class="fe"></div><div class="ce"><div class="mm">${h.left}명 남음 · 레벨 ${h.lv}</div><div class="b">BB ${man(h.bb)}</div><div class="mm">SB ${man(h.sbl)}${h.ante?' · 앤티 '+man(h.ante):''}</div></div>`;
 h.seats.forEach((s,i)=>{const th=(90+(i-hi)*360/n)*Math.PI/180,x=50+37*Math.cos(th),y=50+41*Math.sin(th),me=s.n===h.hero,v=!me&&inv.has(s.n);
  const bk=v?`<div class="bks" style="${y<50?'top:100%;margin-top:3px':'bottom:100%;margin-bottom:3px'}">${bkc}</div>`:'';
  o+=`<div class="xs${me?' h':v?' v':' out'}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%">${s.p==='BTN'?'<span class="dl">D</span>':''}<div class="nm">${s.p?`<span class="ps">${esc(s.p)}</span>`:''}${me?'나 · ':''}${esc(s.sn||s.n)}</div><div class="sk">${sbb(h,s)||'&nbsp;'}</div>${bk}</div>`;});
 o+=`<div class="xhc">${cards(h.hc,'L')}</div></div>`;return o;}

// ---------- 스트리트 ----------
function street(h,s,i,last){const b=boardAt(h,i);let run=s.pot||0;
 const acts=s.a.map((a,k)=>{const w=a[0],me=w===h.hero,amt=a[2];let tx=esc(a[1]);
  if(amt){const pr=s.s!=='pre'&&run>0?` <small>팟 ${pctTx(amt/run)}</small>`:'';tx=`${BB(amt,h)} ${esc(a[1])}${pr}`;run+=amt;}
  const key=last&&k===s.a.length-1;
  return `<div class="xa${me?' me':''}${a[1]==='폴드'?' f':''}${key?' key':''}"><span class="ps">${me?'나':esc(S(h,w).p||'')}</span><span class="nm">${nm(h,w)}</span><span class="ac">${tx}</span></div>`;}).join('');
 const bd=s.b?`<span>${cards(b,'s')}</span>`:'';
 return `<div class="xst"><div class="hd"><span class="sn">${STN[s.s]||esc(s.s)}</span>${bd}${s.pot?`<span class="pt">팟 ${BB(s.pot,h)}</span>`:''}</div>
  <div style="margin-top:5px">${acts}</div>${s.my?`<div class="xmy">내 패 · <b>${esc(s.my)}</b></div>`:''}${bub(s.cm)}</div>`;}

function question(h,my,k){const lb=lastBet(h),q=h.q,st=h.st[h.st.length-1];
 const stk=q.stk||{},sk=Object.keys(stk).map(n=>`${n===h.hero?'나':nm(h,n)} <b>${BB(stk[n],h)}</b>`).join(' · ');
 let line='';if(lb){const tot=lb.pot+lb.amt;line=`${nm(h,lb.who)} <b>${BB(lb.amt,h)}</b> 베팅 (팟 ${pctTx(lb.amt/lb.pot)}) → 지금 팟 <b>${BB(tot,h)}</b>`;}
 const opts=my?'':`<div class="xopt" style="grid-template-columns:repeat(${q.o.length},1fr)">${q.o.map((o,j)=>`<button class="btn b2" onclick="CUR.pick(${k},${j})">${esc(o)}</button>`).join('')}</div>`;
 return `<div class="xq"><div class="t">🤔 ${STN[st.s]||''}, 내 차례예요</div><div class="sm">${line}${sk?`<br>남은 스택 · ${sk}`:''}<br>내 패 ${cards(h.hc,'s')} ${esc(st.my||'')}</div>${opts}</div>`;}

function reveal(h,my,k){const q=h.q,ok=my===q.a;
 let o=`<div id="pxv" class="xv ${ok?'ok':'no'}"><div class="big">${ok?'✅ 정답과 같아요':'❌ 정답과 달라요'}</div><div class="row"><span class="pl">내 선택 <b>${esc(my)}</b></span><span class="pl">정답 <b>${esc(q.a)}</b></span>${q.p?`<span class="pl">프로 <b>${esc(q.p)}</b></span>`:''}</div></div>`;
 o+=`<div class="xsec">🎬 프로의 선택</div><div class="card" style="font-size:15px;line-height:1.6"><b>${esc((h.pro&&h.pro.t)||'')}</b>${bub(h.pro&&h.pro.cm)}</div>`;
 if(h.show&&h.show.length)o+=`<div class="xsec">🃏 공개된 카드</div><div class="card">${h.show.map(x=>`<div class="xsh"><span class="nm">${nm(h,x[0])}</span>${cards(x[1],'s')}<span style="color:var(--sub);font-size:13.5px">${esc(x[2]||'')}</span></div>`).join('')}</div>`;
 if(h.why&&h.why.length){const rows=h.why.map(w=>`<div class="xw"><span class="tg ${w.v===q.a?'y':'n'}">${esc(w.v)} 쪽</span><div style="min-width:0"><div class="h">${esc(w.h)}</div><div class="x">${esc(w.t)}</div>${bub(w.cm)}</div></div>`).join('');
  o+=`<div class="xsec">⚖️ 왜 ${esc(q.a)}일까</div><div class="card">${rows}${h.end?`<div class="xend">${esc(h.end)}<br>→ <b>${esc(q.a)}${ga(q.a)} 맞아요.</b></div>`:''}</div>`;}
 if(h.res)o+=`<div class="xsec">📌 결과</div><div class="card" style="font-size:15px;line-height:1.65">${esc(h.res)}${bub(h.rescm)}</div>`;
 if(h.src&&h.src.length)o+=`<div class="xsrc">▶ 영상 ${h.src.map(x=>`<a href="${yt(h,x[1])}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join('')}<br>해설은 영어 방송을 한글로 옮겼어요</div>`;
 o+=`<button class="btn full b2" style="margin-top:10px" onclick="CUR.redo(${k})">다시 골라 보기</button>`;
 return o;}

function handView(p,k){const H=HS(p),h=H[k],A=ANS(),my=A[KEY(p,k)];
 let o='';
 if(H.length>1)o+=`<div class="xtab">${H.map((x,j)=>`<button class="${j===k?'on':''}" onclick="CUR.hand(${j})">${'핸드 '+String.fromCharCode(65+j)}${A[KEY(p,j)]?(A[KEY(p,j)]===x.q.a?' ✅':' ❌'):''}</button>`).join('')}</div>`;
 o+=`<div class="t" style="font-size:17px;line-height:1.45;margin:0 2px 4px;font-weight:900">${esc(h.ttl||p.t)}</div>
  <div class="m" style="margin:0 2px 8px;font-size:13px">${esc(h.ev)} · ${h.left}명 남음${h.ts?` · <a href="${yt(h,h.ts)}" target="_blank" rel="noopener" style="color:var(--blue)">▶ 영상</a>`:''}</div>`;
 o+=table(h);
 o+=h.st.map((s,i)=>street(h,s,i,i===h.st.length-1)).join('');
 o+=question(h,my,k);
 if(my){o+=reveal(h,my,k);
  if(k<H.length-1)o+=`<button class="btn full" style="margin-top:8px" onclick="CUR.hand(${k+1})">핸드 ${String.fromCharCode(66+k)}로 →</button>`;
  else if(H.length>1&&H.every((x,j)=>A[KEY(p,j)])&&p.h.cmp)o+=`<div class="xsec">🔍 두 핸드 비교</div><div class="card"><table class="xcmp">${p.h.cmp.map((r,ri)=>`<tr>${r.map(c=>ri?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table>${p.h.lesson?`<div class="xend">💡 ${p.h.lesson}</div>`:''}</div>`;}
 return o;}

G.push({k:'prochoice',cat:'홀덤',e:'🎬',n:'프로의 선택',d:'파이널 테이블 실전 결정 · 1번부터 차례로 풀고 프로와 비교 · 📒 복습 노트',
 // mode: play(안 푼 첫 번호부터 차례로) · note(📒 복습 노트 = 예전 목록 화면) · rev(복습 노트에서 연 문제)
 start(){this.mode='play';this.cur=null;this.hi=0;this.picked=null;rr();pcsPull();},
 stop(){},
 note(w){this.mode='note';this.cur=null;this.wf=w?1:0;rr();scrollTo(0,0);pcsPull();},
 next(){this.mode='play';this.cur=null;this.hi=0;this.picked=null;rr();scrollTo(0,0);},
 open(id){if(!byId(id)){toast('글을 찾지 못했어요');return;}this.mode='rev';this.cur=id;this.hi=0;rr();scrollTo(0,0);pcsPull();},
 hand(j){this.hi=j;rr();scrollTo(0,0);},
 pick(a,b){const p=byId(this.cur);if(!p)return;const A=ANS();
  if(b===undefined){if(!p.o||!p.o[a])return;A[p.id]=p.o[a];}   // 예전 글
  else{const h=HS(p)[a];if(!h||!h.q.o[b])return;A[KEY(p,a)]=h.q.o[b];}
  this.picked=p.id;lsSet('pc2_ans',A);pcsPush();rr();setTimeout(()=>{const e=document.getElementById('pxv');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});},40);},
 redo(a){const A=ANS();if(a===undefined)delete A[this.cur];else{const p=byId(this.cur);if(p)delete A[KEY(p,a)];}lsSet('pc2_ans',A);pcsPush();rr();scrollTo(0,0);},
 menu(){const L=SEQ().map(s=>s.p),A=ANS();let nq=0,nd=0,nok=0;   // 📒 복습 노트 (푼 문제만 · 오답만 보기)
  L.forEach(p=>{const H=HS(p);if(H.length)H.forEach((h,j)=>{nq++;const m=A[KEY(p,j)];if(m){nd++;if(m===h.q.a)nok++;}});else if(p.a){nq++;const m=A[p.id];if(m){nd++;if(m===p.a)nok++;}}});
  const st=p=>{const H=HS(p);if(H.length){return H.map((h,j)=>{const m=A[KEY(p,j)];return (H.length>1?String.fromCharCode(65+j)+' ':'')+(m?(m===h.q.a?'✅':'❌')+' 내 선택 '+esc(m):'❓ 아직');}).join(' · ');}
   if(!p.a)return '📖 글';const m=A[p.id];return m?(m===p.a?'✅':'❌')+' 내 선택 '+esc(m):'❓ 아직';};
  const mini=p=>{const h=HS(p)[0];if(!h)return '';return `<div style="margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:12px;color:var(--sub)">내 패</span>${cards(h.hc,'s')}<span style="font-size:12px;color:var(--sub);margin-left:4px">보드</span>${cards(boardAt(h,h.st.length-1),'s')}</div>`;};
  const solved=L.filter(p=>DONE(p,A)),wrong=solved.filter(p=>WRONG(p,A)),show=this.wf?wrong:solved,nx=NEXT(A);
  const items=show.map(p=>`<div class="card" style="cursor:pointer" onclick="CUR.open('${pid(p)}')"><div class="t" style="font-size:15.5px;line-height:1.5"><span style="color:var(--blue)">문제 ${NO(p)}</span> · ${esc(p.t)}</div>${p.s?`<div class="m" style="margin-top:3px">${esc(p.s)}</div>`:''}${mini(p)}<div style="margin-top:6px;font-size:13.5px" class="m">${st(p)}</div></div>`).join('');
  return CSS+`<div class="gst"><span>📒 복습 노트</span><span><a onclick="CUR.next()" style="color:var(--blue);cursor:pointer">이어서 풀기</a></span></div>
   <div class="card"><div class="t">🎬 프로의 선택 · 📒 복습 노트</div><div class="m" style="margin-top:4px;line-height:1.6">푼 문제를 다시 보고, 틀린 문제만 모아 복습해요. 문제를 누르면 테이블·해설·정답 근거가 다시 열려요.</div>
   <div class="m" style="margin-top:6px">문제 ${L.length}개 중 ${solved.length}개 풀이${nq?` · 퀴즈 ${nd}/${nq} · 정답 ${nok}개`:''}</div>
   <button class="btn full g" style="margin-top:10px" onclick="CUR.next()">${nx?`▶ 이어서 풀기 (문제 ${NO(nx)})`:'🎉 지금 있는 문제는 다 풀었어요'}</button></div>
   <div class="xtab"><button class="${this.wf?'':'on'}" onclick="CUR.note(0)">푼 문제 ${solved.length}</button><button class="${this.wf?'on':''}" onclick="CUR.note(1)">❌ 오답만 ${wrong.length}</button></div>`
  +(items||`<div class="card m" style="text-align:center">${this.wf?'틀린 문제가 없어요 👍':'아직 푼 문제가 없어요. 1번부터 풀어 보세요'}</div>`);},
 foot(p){const A=ANS(),rev=this.mode==='rev';let o='';   // 문제 아래 버튼: 다 풀었으면 다음 번호로
  if(DONE(p,A)){const nx=NEXT(A);
   o+=nx?`<button class="btn full g" style="margin-top:10px;font-size:17px;padding:13px" onclick="CUR.next()">${rev?'▶ 이어서 풀기':'다음 문제'} (문제 ${NO(nx)}) →</button>`
    :`<div class="card m" style="text-align:center;margin-top:10px;line-height:1.6">🎉 지금 있는 문제를 다 풀었어요<br>새 문제가 올라오면 다음 번호로 이어서 풀 수 있어요</div>`;}
  return o+`<button class="btn full gr" style="margin-top:8px" onclick="CUR.note(0)">📒 복습 노트</button>`;},
 view(){const A0=ANS();
  if(this.mode==='note')return this.menu();
  if(this.mode!=='rev'){const c=this.cur&&byId(this.cur);   // play: 안 푼 첫 번호 (방금 고른 문제는 해설을 보도록 그대로)
   if(!c||(DONE(c,A0)&&this.picked!==c.id)){const nx=NEXT(A0);this.cur=nx?nx.id:null;this.hi=0;
    if(nx){const H=HS(nx);const k=H.findIndex((h,j)=>!A0[KEY(nx,j)]);if(k>0)this.hi=k;}}
