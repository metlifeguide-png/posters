<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뚝섬 · 헤즈업 학습</title>
<style>
:root{--paper:#f3efe4;--paper2:#fbf9f3;--line:#e2dccb;--ink:#26303d;--sub:#6b6f76;--blue:#1f5fae;--blue2:#e4edf8;--green:#3a9d3f;--brown:#9a5a2a;--red:#d33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}body{min-height:100vh}.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px}.top a{background:rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;text-decoration:none}.tt{flex:1;text-align:center;font-weight:800;font-size:15px;white-space:nowrap}.wrap{max-width:620px;margin:0 auto;padding:12px 12px 50px}.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.t{font-weight:900}.m{color:var(--sub);font-size:12.5px;line-height:1.6}.sec{font-weight:900;color:var(--brown);margin:14px 2px 8px}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}.btn{background:var(--blue);color:#fff;border:0;border-radius:11px;padding:11px 14px;font-size:15px;font-weight:800;cursor:pointer}.btn.b2{background:var(--brown)}.btn.g{background:var(--green)}.btn.gr{background:#8a8f98}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%}.spot{font-size:18px;font-weight:900;text-align:center;padding:16px 4px}.street{display:inline-block;padding:4px 8px;border-radius:8px;background:var(--blue2);color:var(--blue);font-size:12px;font-weight:900}.action{font-size:17px;font-weight:900;line-height:1.5}.good{border-color:var(--green)}.bad{border-color:var(--red)}.hero{font-size:30px;font-weight:900;color:var(--blue);text-align:center;margin:14px 0}.note{background:#fff7d6;border:1px solid #e5d79a;border-radius:10px;padding:9px;font-size:12px;line-height:1.6}
</style></head><body>
<div class="top"><a href="./">← 홈</a><div class="tt">🧠 헤즈업 학습</div><a href="games.html">🎮 게임</a></div>
<div class="wrap" id="app"></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SCENES=[
 {stack:'25BB+',line:'HU · SB(BTN) open → BB call',street:'PREFLOP',q:'SB가 25BB+ 헤즈업에서 오픈하는 구조에서 가장 먼저 익혀야 할 것은?',opts:['SB가 항상 림프만 한다','SB 오픈/림프와 BB 대응 레인지의 기본 구조','무조건 올인','보드가 나올 때까지 아무것도 없다'],a:1,why:'현재 보유한 Tournament Masterclass 자료에는 HU를 <25bb / 25bb+ 및 SB/OOP로 나누어 제공하는 구조가 있습니다. 따라서 학습에서는 스택 깊이에 따라 프리플랍 전략이 달라지는 것을 먼저 익히도록 구성했습니다.',source:'보유한 Tournament Masterclass HU 메뉴 구조'},
 {stack:'100BB',line:'SRP · UTG open vs BB call',street:'FLOP',board:'3♥ 4♥ 6♣',q:'이 보드에서 레인지의 넛 영역이 더 두꺼운 쪽은?',opts:['UTG','BB','완전히 동일','보드만으로는 절대 판단 불가'],a:1,why:'낮고 연결된 보드는 BB의 방어 레인지가 셋·투페어·스트레이트 조합을 더 폭넓게 만들 수 있는 구조입니다. 따라서 UTG가 모든 핸드로 높은 빈도의 공격을 하기보다 체크를 충분히 섞는 이유를 공부하기 좋은 스팟입니다.',source:'교육용 보드 텍스처 분석 · 정확한 빈도는 솔버 설정에 따라 확인'},
 {stack:'100BB',line:'HU SRP · SB open → BB call',street:'FLOP',board:'A♠ 7♦ 2♣',q:'A-high 건조 보드에서 일반적으로 더 강한 레인지 구조를 가진 쪽은?',opts:['SB 오프너','BB 디펜더','항상 BB','항상 동일'],a:0,why:'A-high 건조 보드는 프리플랍 공격자의 강한 Ax와 오버페어가 자연스럽게 남아 레인지 전체의 상단이 강하게 표현되기 쉽습니다. 여기서 중요한 건 "항상 베팅"이 아니라 어떤 핸드군이 작은 사이즈로 자주 베팅할 수 있는지를 보는 것입니다.',source:'교육용 레인지 구조 설명'},
 {stack:'100BB',line:'HU SRP · SB open → BB call',street:'TURN',board:'A♠ 7♦ 2♣ 8♥',q:'턴에서 체크/베팅을 선택할 때 가장 먼저 봐야 할 것은?',opts:['내 핸드 이름만','턴 카드가 양쪽 레인지와 드로우에 미치는 변화','상대가 직전에 졌는지','무조건 같은 사이즈'],a:1,why:'턴에서는 플랍 이후 레인지가 좁아졌기 때문에 새 카드가 넛/밸류/드로우 분포를 어떻게 바꾸는지가 핵심입니다. 좋은 학습 방식은 플랍에서 남긴 레인지가 턴 카드로 어떻게 바뀌었는지부터 확인하는 것입니다.',source:'스트리트별 의사결정 원칙'},
 {stack:'100BB',line:'HU SRP · SB open → BB call',street:'RIVER',board:'K♣ 9♦ 5♠ 4♥ 3♣',q:'리버에서 블러프 후보를 고를 때 가장 먼저 볼 것은?',opts:['가장 약한 핸드 아무거나','상대의 콜 레인지와 블로커·밸류 조합','내가 오래 기다렸는지','무조건 큰 사이즈'],a:1,why:'리버는 남은 레인지가 가장 좁으므로 상대의 콜 가능한 조합과 내 블로커가 중요합니다. 단순히 "약한 패니까 블러프"가 아니라 어떤 더 강한 핸드를 폴드시키는지 연결해서 봐야 합니다.',source:'리버 레인지/블로커 학습 원칙'},
 {stack:'100BB',line:'3-BET POT · BTN 3B → BB call',street:'FLOP',board:'A♦ 7♣ 2♠',q:'3-bet 팟의 A-high 건조 보드에서 더 많은 넛/상단 레인지 우위를 갖기 쉬운 쪽은?',opts:['3-bettor','BB 콜러','항상 BB','항상 동일'],a:0,why:'3-bet 레인지에는 강한 Ax와 오버페어가 더 많이 남는 구조가 흔합니다. 그래서 이런 건조 A-high 보드에서는 공격자가 작은 사이즈로 넓은 범위를 압박하는 전략을 학습하기 좋습니다.',source:'교육용 3-bet 팟 레인지 구조'},
 {stack:'100BB',line:'4-BET POT · CO 4B → BTN call',street:'FLOP',board:'A♠ K♦ 5♣',q:'4-bet 팟에서 이 보드가 주는 핵심 학습 포인트는?',opts:['4-bettor의 강한 Ax/Kx와 오버페어가 매우 압축된 레인지','BB의 낮은 연결 핸드가 가장 많다','모든 핸드가 같은 가치다','무조건 올인'],a:0,why:'4-bet 팟은 프리플랍부터 강한 조합이 많이 남습니다. A/K-high 보드에서는 특히 AA·KK·AK 같은 상단 조합이 의사결정 구조를 크게 좌우하므로, 단순히 "플랍이 높다"보다 프리플랍 액션으로 만들어진 레인지부터 보는 연습이 중요합니다.',source:'교육용 4-bet 팟 레인지 구조'}
];
let state={mode:'street',idx:0,score:0,last:null};
function render(){const s=SCENES[state.idx%SCENES.length];document.getElementById('app').innerHTML=`<div class="card"><div class="t">헤즈업은 승패 게임이 아니라 <b>의사결정 훈련</b></div><div class="m">프리플랍 → 플랍 → 턴 → 리버에서 액션을 고르고, 바로 이유를 확인합니다. 스택별·팟 유형별로 반복해서 보는 방식입니다.</div></div><div class="tabs"><button class="${state.mode==='street'?'on':''}" onclick="state.mode='street';render()">스트리트 판단</button><button class="${state.mode==='range'?'on':''}" onclick="state.mode='range';render()">레인지 우위</button><button class="${state.mode==='note'?'on':''}" onclick="state.mode='note';render()">학습 메모</button></div>${state.mode==='note'?notePage():state.mode==='range'?rangePage():streetPage(s)}`;}
function streetPage(s){return `<div class="card"><div class="tabs"><span class="street">${s.stack}</span><span class="street">${s.street}</span></div><div class="m">${esc(s.line)}</div>${s.board?`<div class="spot">${esc(s.board)}</div>`:''}<div class="sec">문제</div><div class="action">${esc(s.q)}</div></div><div style="display:grid;gap:8px">${s.opts.map((x,i)=>`<button class="btn ${state.last&&state.last.i===i?(state.last.ok?'g':'b2'):''}" onclick="answer(${i})">${esc(x)}</button>`).join('')}</div>${state.last?`<div class="card ${state.last.ok?'good':'bad'}" style="margin-top:10px"><div class="t">${state.last.ok?'✅ 좋은 선택':'❌ 다른 선택'}</div><div class="m" style="margin-top:5px">${esc(s.why)}</div><div class="note" style="margin-top:8px">자료: ${esc(s.source)}</div></div><button class="btn full" style="margin-top:8px" onclick="next()">다음 스팟</button>`:''}<div class="gst" style="margin-top:10px"><span>현재 ${state.idx+1} / ${SCENES.length}</span><span>학습 점수 <b>${state.score}</b></span></div>`;}
function answer(i){const s=SCENES[state.idx%SCENES.length];state.last={i,ok:i===s.a};if(i===s.a)state.score++;render();}
function next(){state.idx++;state.last=null;render();scrollTo(0,0)}
function rangePage(){return `<div class="card"><div class="t">🎯 레인지 우위부터 생각하기</div><div class="m">예: UTG open vs BB call → 3♥ 4♥ 6♣. 먼저 "누가 더 강한 조합을 가질 수 있나"를 판단하고, 그 다음 체크/베팅 빈도를 생각합니다.</div></div><div class="card"><div class="hero">SRP / 3B / 4B</div><div class="m">보유한 자료에는 프리플랍 포지션과 스택 구간이 분리되어 있습니다. HU 자료도 <b>&lt;25BB / 25BB+</b>, <b>SB / OOP</b> 구간으로 제공됩니다. 이 페이지는 그 분류를 스트리트 학습 문제로 연결하는 용도입니다.</div></div><button class="btn full" onclick="state.mode='street';state.idx=1;state.last=null;render()">보드 문제 바로 풀기</button>`}
function notePage(){return `<div class="card"><div class="t">📘 공부 순서</div><div class="m">1. 프리플랍 레인지 → 2. 플랍 넛/레인지 우위 → 3. 턴에서 레인지 변화 → 4. 리버 밸류/블러프 조합 → 5. 실제 솔버의 빈도·사이징 확인</div></div><div class="card"><div class="t">현재 자료 기준</div><div class="m">보유한 Tournament Masterclass 자료에는 HU를 스택별·포지션별 메뉴로 나눈 레인지 자료가 있습니다. 이 페이지는 그 자료를 학습 동선으로 연결하고, 플랍/턴/리버 문제는 별도의 교육용 스팟으로 제공합니다.</div></div><div class="note">정확한 솔버 빈도는 스택, 레이크, 오픈 사이즈, 3-bet/4-bet 사이즈, 레인지 설정이 달라지면 바뀔 수 있으므로 동일한 설정의 솔버 결과를 기준으로 최종 확인하세요.</div>`}
render();
</script></body></html>
