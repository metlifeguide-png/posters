<style>

</style></head><body><main>

<div id="hands"></div>
</section></main><div id="kw" hidden><div id="kh"><span id="kg">⠿</span><span id="kl"></span><button class="btn" id="kx">▼ 접기</button></div><div id="kp"></div></div><button class="btn pri" id="kt" hidden>⌨ 키패드</button><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),f=x=>String(+(+x).toFixed(2)),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const P9=['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB'],PK=['UTG','U+1','U+2','LJ','HJ','CO','BTN','SB','BB'];
const AL={U:'UTG',UTG:'UTG',U1:'UTG+1','U+1':'UTG+1','UTG+1':'UTG+1',U2:'UTG+2','U+2':'UTG+2','UTG+2':'UTG+2',LJ:'LJ',HJ:'HJ',CO:'CO',BTN:'BTN',BN:'BTN',SB:'SB',BB:'BB'};
const SY={'♠':'s','♥':'h','♦':'d','♣':'c'},SR={s:'♠',h:'♥',d:'♦',c:'♣'};
const pos=t=>AL[String(t).toUpperCase()];
const cards=s=>{const r=[];String(s).replace(/([2-9TJQKA])([♠♥♦♣shdc])/gi,(m,a,b)=>{r.push(a.toUpperCase()+(SY[b]||b.toLowerCase()))});return r};
const dc=c=>c[0]+SR[c[1]],cH=a=>a.map(c=>{const x=dc(c);return /[♥♦]/.test(x)?`<span class="red">${x}</span>`:x}).join('');
const FD=[
 {k:'stack',lb:'stack',ph:'포지션 스택 예) BTN 40000, BB 25000',hint:'포지션 + 스택(칩 그대로), 쉼표로 구분. 예) BTN 40000, BB 25000'},
 {k:'card',lb:'card',ph:'포지션 카드 예) BTN AsKd',hint:'내 포지션 + 내 카드. 예) BTN AsKd'},
 {k:'pre',lb:'pre action',ph:'액션 예) CO 2500, BTN c, BB c',hint:'프리플랍 액션: 포지션 + 칩 금액/f/c/x/jam. 예) CO 2500, BTN c, BB c'},
 {k:'flopb',lb:'flop board',ph:'보드 3장 예) Ks7d2c',hint:'플랍 보드 3장. 예) Ks7d2c'},
 {k:'flop',lb:'flop action',ph:'액션 예) BB x, CO 3000, BB c',hint:'플랍 액션. 예) BB x, CO 3000, BB c'},
 {k:'turnb',lb:'turn board',ph:'보드 1장 예) Qh',hint:'턴 카드 1장. 예) Qh'},
 {k:'turn',lb:'turn action',ph:'액션 예) BB x, CO 8000, BB c',hint:'턴 액션. 예) BB x, CO 8000, BB c'},
 {k:'riverb',lb:'river board',ph:'보드 1장 예) 2s',hint:'리버 카드 1장. 예) 2s'},
 {k:'river',lb:'river action',ph:'액션 예) BB x, CO 20000, BB c',hint:'리버 액션. 예) BB x, CO 20000, BB c'},
 {k:'show',lb:'show',ph:'쇼다운 카드 예) BB AhKh (멀티=쉼표)',hint:'쇼다운된 상대 카드. 멀티면 쉼표로. 예) BB AhKh, SB QdQc'},
 {k:'memo',lb:'memo',ph:'메모 (일반 키보드)',hint:'자유 메모 · 일반 키보드로 입력'}
],K=FD.map(d=>d.k),BK=['flopb','turnb','riverb'],NM=['프리','플랍','턴','리버'];
/* 예전 저장 형식(hero, 'Ks7d2c: BTN x' 한 줄)을 새 형식으로 변환 */
function norm(L){L={...L};if(L.card===undefined&&L.hero!==undefined)L.card=L.hero;
 ['flop','turn','river'].forEach(s=>{if(L[s+'b']===undefined){const raw=(L[s]||'').trim();let l='',r=raw;
  if(raw){const ci=raw.indexOf(':');if(ci>=0){l=raw.slice(0,ci);r=raw.slice(ci+1)}else if(cards(raw.split(/[\s,]/)[0]).length){l=raw;r=''}}
  L[s+'b']=l.trim();L[s]=r.trim()}});return L}
const _unused=[[100,200],[150,300],[200,400],[300,600],[400,800],[500,1000],[600,1200],[800,1600],[1000,2000],[1500,3000],[2000,4000],[2500,5000],[3000,6000],[4000,8000],[5000,10000]];
let D={tours:[]},T=null,ed=null,aK='stack',R=null,U=null,pend=null;
const MTOK=(()=>{try{return localStorage.getItem("mtok")||""}catch(e){return ""}})();   // 👤 뚝섬 회원 token (홈 로그인)
const API="https://211-233-211-164.sslip.io",H={"Content-Type":"application/json","ngrok-skip-browser-warning":"true"};
try{U=JSON.parse(localStorage.getItem('qr_sess')||'null')}catch(e){}
const ck=()=>'hr1_'+U.login.toLowerCase();
const dk=()=>'hrd_'+U.login.toLowerCase();
function sv(){if(!U)return;try{localStorage.setItem(ck(),JSON.stringify(D));localStorage.setItem(dk(),'1')}catch(e){}clearTimeout(pend);pend=setTimeout(()=>{pend=null;push()},800);$('#sst').textContent='저장 중…'}
function flush(){if(pend){clearTimeout(pend);pend=null;push(true)}}
window.__qrFlush=flush;addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
async function push(ka){if(!U)return;try{const body=JSON.stringify({data:D}),go=k=>fetch(API+'/api/qr/data',{method:'PUT',headers:{...H,'X-QR-Token':U.token},body,keepalive:k});let r;try{r=await go(!!ka&&body.length<60000)}catch(e){if(!ka)throw e;r=await go(false)}
 if(r.status===401){logout(true);return}if(!r.ok)throw 0;try{localStorage.removeItem(dk())}catch(e){}$('#sst').textContent='자동 저장'}catch(e){$('#sst').textContent='오프라인 · 기기에 저장됨'}}
async function authGo(kind){const login=$('#lg').value.trim(),pw=$('#pw').value;$('#am').textContent='';
 try{const r=await fetch(API+'/api/qr/'+kind,{method:'POST',headers:H,body:JSON.stringify({login,pw,mtok:MTOK})}),j=await r.json().catch(()=>({}));
  if(!r.ok){$('#am').textContent=j.detail||'실패했어요';return}
  U={login:j.login,token:j.token};try{localStorage.setItem('qr_sess',JSON.stringify(U))}catch(e){}$('#pw').value='';await boot()}
 catch(e){$('#am').textContent='서버에 연결할 수 없어요'}}
async function boot(){let loc=null;try{loc=JSON.parse(localStorage.getItem(ck())||'null')||JSON.parse(localStorage.getItem('hr1')||'null')}catch(e){}
 try{const r=await fetch(API+'/api/qr/data',{headers:{...H,'X-QR-Token':U.token}});if(r.status===401){logout(true);return}
  const j=await r.json();D=j.data&&j.data.tours?j.data:{tours:[]};
  let dirty=false;try{dirty=localStorage.getItem(dk())==='1'}catch(e){}
  if((dirty||!D.tours.length)&&loc&&loc.tours&&loc.tours.length){D=loc;push()}}
 catch(e){D=loc&&loc.tours?loc:{tours:[]}}
 $('#auth').hidden=true;$('#who').textContent=U.login;home()}
function logout(exp){if(exp&&MTOK&&!window._qrRetry){window._qrRetry=1;qrMember();return}U=null;D={tours:[]};T=null;try{localStorage.removeItem('qr_sess')}catch(e){}$('#app').hidden=true;$('#home').hidden=true;$('#auth').hidden=false;sync();$('#am').textContent=exp?'다시 로그인해 주세요':''}
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}

/* ---------- 게임 엔진 ---------- */
function sim(L,S){
 L=norm(L);const W=[],rows=[],ev=[],done={},dim={},q=[],unc={};
 const u=S.bb>0?S.bb:1,pu=S.v===2?u:1,order=P9.slice(9-S.max),bbv=1,sbv=S.bb?S.sb/S.bb:.5,at=S.bb?S.at/S.bb:(S.ante==='none'?0:1),st={};
 (L.stack||'').split(',').forEach(t=>{t=t.trim();if(!t)return;const m=t.match(/^(\S+)\s+([\d.]+)/),p=m&&pos(m[1]);if(!p||!order.includes(p))W.push('stack 해석 불가: '+t);else st[p]=+m[2]/pu});
 if(S.v===2&&!(S.bb>0)&&['stack','pre','flop','turn','river'].some(k=>/\s\d/.test(L[k]||'')))W.push('blind 줄에 SB BB 앤티를 먼저 적어 주세요 (칩 → BB 환산에 필요)');
 let hp=null,hc=[];const hm=(L.card||'').trim().match(/^(\S+)\s*(.*)$/);
 if(hm){hp=pos(hm[1]);if(!hp)W.push('card 포지션 해석 불가');hc=cards(hm[2])}
 const rem={...st},alive=new Set(Object.keys(st)),allin=new Set(),used=[...hc];
 const ante=S.ante==='bb'?at:S.ante==='all'?at*S.max:0;
 let settled=ante+(st.SB===undefined?sbv:0)+(st.BB===undefined?bbv:0),board=[],ended=null;
 if(S.ante==='bb'&&st.BB!==undefined)rem.BB-=at;
 if(S.ante==='all')for(const p in rem)rem[p]-=at;
 if(st.SB!==undefined)rem.SB-=sbv;if(st.BB!==undefined)rem.BB-=bbv;
 const keys=['pre','flop','turn','river'];
 for(let i=0;i<4;i++){
  const k=keys[i],raw=(L[k]||'').trim();
  const bl=i>0?(L[k+'b']||'').trim():'',need=i===1?3:1,rb=()=>{const nb=cards(bl);if(bl&&nb.length!==need)W.push(`${NM[i]} 보드는 ${need}장이어야 합니다`);board.push(...nb);used.push(...nb)};
  if(ended){dim[k]=true;if(raw)W.push(NM[i]+' 액션: 핸드가 이미 끝났습니다');
   if(i>0){if(ended==='allin'){rb();if(bl)rows.push({s:NM[i],board:board.slice(i===1?0:i+1).map(dc).join(' '),t:'(올인 런아웃)',pot:settled,rq:''})}else{dim[k+'b']=true;if(bl)W.push(NM[i]+' 보드: 핸드가 이미 끝났습니다')}}
   continue}
  const right=raw;if(i>0)rb();
  const bt={},sum=()=>Object.values(bt).reduce((a,b)=>a+b,0),acted=new Set();let cur=0,r=0,rq='',acts=[];
  if(i===0){if(st.SB!==undefined)bt.SB=sbv;if(st.BB!==undefined)bt.BB=bbv;cur=bbv}
  right.split(',').forEach(tok=>{
   tok=tok.trim();if(!tok)return;const dq=tok.includes('?');tok=tok.replace(/\?/g,'').trim();
   const pp=tok.split(/\s+/),p=pos(pp[0]),a=(pp[1]||'').toLowerCase();
   if(!p||!alive.has(p)){W.push(`${NM[i]}: "${tok}" 해석 불가 또는 이미 폴드한 자리`);return}
   if(allin.has(p)){W.push(`${p}는 이미 올인`);return}
   const to=bt[p]||0;let add=0,t='';
   if(a==='f'){alive.delete(p);t='폴드';ev.push({st:i,p,k:'f'})}
   else if(a==='x'){if(cur-to>1e-9)W.push(`${p} 체크 불가 (콜 필요)`);t='체크';ev.push({st:i,p,k:'x'})}
   else if(a==='c'){add=Math.min(cur-to,rem[p]);if(add<=1e-9)W.push(`${p} 콜할 금액이 없습니다`);
