<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 228" role="img" aria-label="리버 콜의 손익 구성"><style>text{font-family:-apple-system,BlinkMacSystemFont,Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#1d2321}.s{fill:#5d6763;font-size:13px}.t{font-weight:700;font-size:16px}.v{font-weight:700}.ax{stroke:#c9d0cc}.tr{fill:#eef1ef}.bg{fill:#ffffff}@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.s{fill:#9aa5a0}.ax{stroke:#3a443f}.tr{fill:#262e2a}.bg{fill:#1b211e}}</style><rect class="bg" width="100%" height="100%" rx="12"/><text class="t" x="14" y="28">리버 콜의 손익 구성</text><text x="14" y="55">빗나갈 때 잃는 콜 (37장)</text><rect class="tr" x="14" y="62" width="342.0" height="20" rx="4"/><rect x="14.0" y="62" width="146.6" height="20" rx="4" fill="#e2724f"/><text class="v" x="364" y="77">7.5BB</text><text x="14" y="107">맞을 때 지금 팟이 주는 몫 (9장)</text><rect class="tr" x="14" y="114" width="342.0" height="20" rx="4"/><rect x="14.0" y="114" width="342.0" height="20" rx="4" fill="#13784f"/><text class="v" x="364" y="129">17.5BB</text><text x="14" y="159">맞을 때 더 받아야 할 돈</text><rect class="tr" x="14" y="166" width="342.0" height="20" rx="4"/><rect x="14.0" y="166" width="260.6" height="20" rx="4" fill="#d9822b"/><text class="v" x="364" y="181">13.33BB</text><text class="s" x="14" y="208">빗나가는 37장은 콜만큼 잃고, 맞는 9장에서 더 받아내야 본전</text></svg>
