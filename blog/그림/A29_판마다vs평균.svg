<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 228" role="img" aria-label="한 판의 손익과 평균"><style>text{font-family:-apple-system,BlinkMacSystemFont,Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#1d2321}.s{fill:#5d6763;font-size:13px}.t{font-weight:700;font-size:16px}.v{font-weight:700}.ax{stroke:#c9d0cc}.tr{fill:#eef1ef}.bg{fill:#ffffff}@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.s{fill:#9aa5a0}.ax{stroke:#3a443f}.tr{fill:#262e2a}.bg{fill:#1b211e}}</style><rect class="bg" width="100%" height="100%" rx="12"/><text class="t" x="14" y="28">한 판의 손익과 평균</text><text x="14" y="55">이긴 판에서 얻는 돈</text><rect class="tr" x="14" y="62" width="342.0" height="20" rx="4"/><rect x="14.0" y="62" width="342.0" height="20" rx="4" fill="#13784f"/><text class="v" x="364" y="77">45.75BB</text><text x="14" y="107">진 판에서 잃는 돈</text><rect class="tr" x="14" y="114" width="342.0" height="20" rx="4"/><rect x="14.0" y="114" width="259.8" height="20" rx="4" fill="#e2724f"/><text class="v" x="364" y="129">34.75BB</text><text x="14" y="159">한 판 평균 이득</text><rect class="tr" x="14" y="166" width="342.0" height="20" rx="4"/><rect x="14.0" y="166" width="38.2" height="20" rx="4" fill="#2f6fd0"/><text class="v" x="364" y="181">5.11BB</text><text class="s" x="14" y="208">판마다는 크게 튀지만 평균은 작게 꾸준히 쌓임</text></svg>
