<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뚝섬 홀덤 대회 캘린더</title>
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#efece5; --text:#1c1b19; --muted:#6f6a60; --line:#e3ded3;
  --accent:#0f7a4f; --accent-soft:#e2f2ea; --gold:#b7791f; --gold-soft:#fbf1dd; --main:#8a2be2; --main-soft:#f1e8fb;
  --online:#1d6fd6; --online-soft:#e5effc; --chip:#ece8df;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101412; --surface:#181d1a; --surface2:#1f2521; --text:#ecefe9; --muted:#9aa39c; --line:#2a322d;
    --accent:#3ccf8e; --accent-soft:#16372a; --gold:#f0b54a; --gold-soft:#3a2d14; --main:#c08bff; --main-soft:#2e2140;
    --online:#6aa8ff; --online-soft:#17294a; --chip:#242b26;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{padding:20px 0 8px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.daybar{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0 4px;display:flex;align-items:center;gap:6px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scroll-behavior:smooth;flex:1;min-width:0;
  scrollbar-width:thin;scrollbar-color:var(--accent) var(--surface2)}
.days::-webkit-scrollbar{height:6px}
.days::-webkit-scrollbar-track{background:var(--surface2);border-radius:3px}
.days::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
.arrow{flex:0 0 auto;width:34px;height:64px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.arrow:disabled{opacity:.3;cursor:default}
.day{flex:0 0 auto;width:58px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;text-align:center;cursor:pointer;color:var(--text)}
.day .dw{font-size:11px;color:var(--muted)} .day .dd{font-size:18px;font-weight:700;margin:2px 0}
.day .dc{font-size:10px;color:var(--muted)}
.day.sat .dw{color:var(--online)} .day.sun .dw{color:#d64545}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.day.on .dw,.day.on .dc{color:rgba(255,255,255,.85)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;min-width:0}
.chip.allt{flex:none;white-space:nowrap;padding:10px 12px;border-radius:12px;font-weight:600}
.dh.go{cursor:pointer} .dh.go span:last-child{color:var(--accent)}
.allhint{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;font-weight:600}
.allhint button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.sort{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px;font-size:13px}
h2{font-size:14px;color:var(--muted);margin:18px 2px 8px;font-weight:600;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.card.main{background:var(--main-soft);border-color:transparent}
.top{display:flex;gap:12px;align-items:flex-start}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;min-width:48px}
.body{flex:1;min-width:0}
.name{font-weight:650;font-size:15px;line-height:1.35;word-break:keep-all}
.venue{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--text)}
.tag.gtd{background:var(--gold-soft);color:var(--gold);font-weight:700}
.tag.tk{background:var(--online-soft);color:var(--online);font-weight:600}
.tag.org{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.mainb{background:var(--main);color:#fff}
.more{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px;line-height:1.7}
.card.open .more{display:block}
.more b{color:var(--muted);font-weight:500;display:inline-block;min-width:74px}
.cmd{margin-top:6px;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:6px 8px}
.online{background:var(--online-soft);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.online .ot{font-weight:650;font-size:14px;color:var(--online)}
.online .tm{font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums;word-break:keep-all}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;font-size:12px;font-weight:700;margin-right:6px}
.pbtn{margin-top:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.plb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
.plb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.plb span{position:absolute;top:10px;right:16px;color:#fff;font-size:28px;line-height:1}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>♠ 뚝섬 홀덤 대회 캘린더</h1>
    <div class="sub" id="sub"></div>
  </header>
  <div class="daybar">
    <button class="arrow" id="prevDay" aria-label="이전 날짜">‹</button>
    <div class="days" id="days"></div>
    <button class="arrow" id="nextDay" aria-label="다음 날짜">›</button>
  </div>
  <div class="filters" id="types"></div>
  <div class="filters" id="orgs"></div>
  <div class="row">
    <span class="chip allt" id="allT" role="button" aria-pressed="false" title="켜면 날짜와 상관없이 모든 날짜의 일정에서 검색해요">📅 전체 날짜</span>
    <input class="search" id="q" placeholder="매장·지역 검색 (예: 강남, 뉴스톤, 성남모란)">
    <select class="sort" id="sort"><option value="time">시간순</option><option value="gtd">상금·티켓가치순</option></select>
  </div>
  <div id="list"></div>
  <footer>카드를 누르면 바인·레지 마감·주소를 볼 수 있어요.<br>티켓 가치는 방장 기준값으로 계산한 참고용이에요.<br>카톡에서 <b>!@참가</b>로 같이 갈 사람을 모아보세요.</footer>
</div>

const EXTRA_EVENTS = [["2026-10-01","18:00"],["2026-10-02","18:00"],["2026-10-03","18:00"],["2026-10-04","18:00"],["2026-10-05","15:00"]].map(([d,t],i)=>({
  d, t, type:"main", name:`WPL NLH 딥스택 #${i+1}`, venue:"야자수 서울센터", region:"서울 광진구",
  addr:"서울 광진구 능동로 19길 35", org:["WPL"], gtd:"4,000만", v:40000000,
  buyin:"NLH 딥스택 초대권 1장", prize:"NLH 딥스택 #1~5 페이아웃",
  note:"8th THE HOLDEM MASTERS · 각 플라이트 GTD 4,000만 · 총 엔트리 2,000 · 이벤트별 최대 500 엔트리"
}));
(function mergeExtra(){
  if(!DATA.events) DATA.events=[];
  EXTRA_EVENTS.forEach(x=>{
    // 이름에 '딥스택'이 있는 같은 날·같은 시각 일정만 같은 일정으로 본다 ('야자수'만 들어간 다른 매장 GTD 와 섞이지 않게)
    const hit=DATA.events.find(e=>e.d===x.d && e.t===x.t && /딥스택/.test(e.name||""));
    if(!hit){ DATA.events.push(x); return; }
    ["type","venue","region","addr","org"].forEach(k=>{ hit[k]=x[k]; });   // 장소는 확정값(야자수 서울센터)으로 고정
    Object.keys(x).forEach(k=>{ const cur=hit[k]; if(!cur || (Array.isArray(cur)&&!cur.length)) hit[k]=x[k]; });
  });
})();
// 같은 매장·같은 날·같은 시각 '매장 대회'가 포스터 여러 장으로 중복되면 하나로 합침(정보 많은 쪽을 남기고 빈 칸은 채움)
(function dedupeVenue(){
  const F=["name","buyin","gtd","ticket","prize","note","reg","stack","blind","addr","park","adv"];
  const sc=e=>F.reduce((n,k)=>n+(e[k]?1:0),0)+String(e.name||"").length/100;
  const m=new Map(), out=[];
  (DATA.events||[]).forEach(e=>{
    if(e.type!=="venue"||!e.t||!e.venue){ out.push(e); return; }
    const k=e.d+"|"+e.t+"|"+String(e.venue).replace(/\s/g,"").toLowerCase();
    const h=m.get(k);
    if(!h){ m.set(k,e); out.push(e); return; }
    const keep=sc(e)>sc(h)?e:h, drop=keep===e?h:e;
    Object.keys(drop).forEach(f=>{ const c=keep[f]; if(!c||(Array.isArray(c)&&!c.length)) keep[f]=drop[f]; });
    if(keep!==h){ out[out.indexOf(h)]=keep; m.set(k,keep); }
  });
  DATA.events=out;
})();
const WD = ["일","월","화","수","목","금","토"];
const S = {day: DATA.today, type: "all", org: "all", q: "", sort: "time", all: false};   // all=true: 날짜 상관없이 전체 일정에서 검색
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function won(g){ // "1억 2,000만", "600만", "8,000만" -> 숫자(원)
  if(!g) return 0; let n=0; const e=g.match(/([\d.]+)\s*억/); const m=g.match(/([\d,.]+)\s*만/);
  if(e) n+=parseFloat(e[1])*1e8; if(m) n+=parseFloat(m[1].replace(/,/g,""))*1e4;
  if(!e&&!m){const d=g.replace(/,/g,"").match(/\d{5,}/); if(d) n=+d[0];}
  return n;
}
function dayList(){
  const out=[]; const base=new Date(DATA.today+"T00:00:00");
  for(let i=0;i<14;i++){const d=new Date(base); d.setDate(base.getDate()+i); out.push(d);}
  return out;
}
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function satsOn(dateStr){
  const md=dateStr.slice(5);
  const pyWd=(new Date(dateStr+"T00:00:00").getDay()+6)%7;   // 월=0 … 일=6 (서버 요일 번호와 같음)
  const list=DATA.sats.filter(s => (s.start<=s.end ? (s.start<=md && md<=s.end) : (md>=s.start||md<=s.end))
                                   && (!s.wd || !s.wd.length || s.wd.includes(pyWd))   // 요일 지정 알림은 해당 요일에만
                                   && (!s.dates || !s.dates.length || s.dates.includes(md)));   // 특정 날짜만 알림은 그 날짜에만
  // 같은 대회(제목·주최사)의 매일/주말 알림은 한 카드로 합치고 시각을 시간순으로 (자정 00:00 은 24:00 으로 맨 뒤)
  const m=new Map();
  list.forEach(s=>{
    const k=s.title+"|"+(s.org||[]).join(",")+"|"+(s.free?1:0);
    if(!m.has(k)) m.set(k,{...s,times:[...s.times]});
    else m.get(k).times.push(...s.times);
  });
  const key=t=>t==="00:00"?"24:00":t;
  return [...m.values()].map(s=>({...s,times:[...new Set(s.times)].map(key).sort()}));
}
function matches(e){
  if(S.type!=="all" && e.type!==S.type) return false;
  if(S.org!=="all" && !(e.org||[]).includes(S.org) && !(S.org==="PMANG" && (e.org||[]).includes("PFGT"))) return false;
  if(S.q){const q=S.q.replace(/\s/g,"").toLowerCase(); const hay=(e.venue+e.region+e.name+e.addr).replace(/\s/g,"").toLowerCase(); if(!hay.includes(q)) return false;}
  return true;
}
function renderDays(){
  $("days").innerHTML = dayList().map(d=>{
    const k=iso(d); const n=DATA.events.filter(e=>e.d===k && matches(e)).length;
    const cls=["day", d.getDay()===6?"sat":"", d.getDay()===0?"sun":"", (k===S.day&&!S.all)?"on":""].join(" ");
    const label = k===DATA.today ? "오늘" : WD[d.getDay()];
    return `<div class="${cls}" data-k="${k}"><div class="dw">${label}</div><div class="dd">${d.getDate()}</div><div class="dc">${n}개</div></div>`;
  }).join("");
  document.querySelectorAll(".day").forEach(el=>el.onclick=()=>{S.day=el.dataset.k; render();});
  // 선택한 날짜가 보이도록 가로 스크롤 위치 맞추기
  const on=document.querySelector(".day.on");
  if(on){const box=$("days"); const left=on.offsetLeft-box.offsetLeft-box.clientWidth/2+on.clientWidth/2; box.scrollTo({left:Math.max(0,left)});}
  const keys=dayList().map(iso), i=keys.indexOf(S.day);
  $("prevDay").disabled = i<=0; $("nextDay").disabled = i>=keys.length-1;
}
function moveDay(step){
  const keys=dayList().map(iso); const i=keys.indexOf(S.day);
  const j=Math.min(keys.length-1, Math.max(0, i+step));
  if(j!==i){S.day=keys[j]; render();}
}
$("prevDay").onclick=()=>moveDay(-1);
$("nextDay").onclick=()=>moveDay(1);
// PC에서 마우스 휠로도 날짜 줄을 좌우로 넘길 수 있게
$("days").addEventListener("wheel",e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ $("days").scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
function chips(id, items, key){
  $(id).innerHTML = items.map(([v,l])=>`<span class="chip ${S[key]===v?"on":""}" data-v="${v}">${l}</span>`).join("");
  $(id).querySelectorAll(".chip").forEach(el=>el.onclick=()=>{S[key]=el.dataset.v; render();});
}
function card(e, rank){
  const tags=[];
  if(e.type==="main") tags.push(`<span class="tag mainb">메인 일정</span>`);
  (e.org||[]).forEach(o=>tags.push(`<span class="tag org">${esc(o)}</span>`));
  if(e.gtd) tags.push(`<span class="tag gtd">GTD ${esc(e.gtd)}</span>`);
  if(e.ticket) tags.push(`<span class="tag tk">🎟 ${esc(e.ticket)}</span>`);
  if(e.adv) tags.push(`<span class="tag">${esc(e.adv)}</span>`);
  if(e.buyin) tags.push(`<span class="tag">바인 ${esc(e.buyin)}</span>`);
  const more=[["바인",e.buyin],["GTD",e.gtd],["티켓 시상",e.ticket],["순위별 시상",e.prize],["진행 내용",e.note],["연계 GTD",e.linked?`${e.linked} (연계 대회 상금, 이 게임 상금 아님)`:""],
    ["레지 마감",e.reg?`예상 ${e.reg}`:""],["스타팅 스택",e.stack],["블라인드",e.blind],["주소",e.addr],["주차",e.park]]
    .filter(x=>x[1]).map(([k,v])=>`<div><b>${k}</b>${esc(v)}</div>`).join("") || `<div>세부 정보가 없는 대회예요.</div>`;
  const cmd = e.type==="venue" ? `!@${esc((e.venue||"").replace(/\s/g,""))} ${+e.d.slice(5,7)}/${+e.d.slice(8)} 정보` : "";
  return `<div class="card ${e.type==="main"?"main":""}">
    <div class="top"><div class="time">${rank?`<span class="rank">${rank}</span>`:""}${esc(e.t||(e.type==="venue"?"시간 미정":"종일"))}</div>
      <div class="body"><div class="name">${esc(e.name)}</div>${e.venue?`<div class="venue">🏠 ${esc(e.venue)}</div>`:""}
      <div class="tags">${tags.join("")}</div></div></div>
    <div class="more">${more}${cmd?`<div class="cmd">카톡 봇: ${cmd}</div>`:""}${e.img?`<button type="button" class="pbtn" data-img="${esc(e.img)}">🖼️ 포스터 보기</button>`:""}</div></div>`;
}
// 🖼️ 포스터는 카드를 펼친 뒤 버튼을 눌러야 크게 보임 (누르면 닫힘)
document.addEventListener("click",ev=>{const b=ev.target.closest(".pbtn"); if(!b) return; ev.stopPropagation();
  const o=document.createElement("div"); o.className="plb"; o.innerHTML=`<span>×</span><img alt="포스터" src="${esc(b.dataset.img)}">`;
  o.onclick=()=>o.remove(); document.body.appendChild(o);},true);
function dlabel(k){const d=new Date(k+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})`;}
function renderAll(){   // 🔎 전체 날짜 검색: 날짜 선택과 상관없이 모든 일정에서 찾아 날짜별로 묶어 보여줌
  if(!S.q && S.type==="all" && S.org==="all"){
    $("sub").textContent=`전체 날짜 검색 · ${DATA.updated} 업데이트`;
    $("list").innerHTML=`<div class="empty">검색어를 입력하면 모든 날짜의 일정에서 찾아요.<br>(예: 강남, 뉴스톤, WPL)</div>`; return;
  }
  const keys=dayList().map(iso), ev=DATA.events.filter(e=>e.d>=DATA.today && matches(e)), by={};   // 지난 일정은 제외
  ev.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  const byT=(a,b)=>(a.t||"99").localeCompare(b.t||"99");
  let html="";
  Object.keys(by).sort().forEach(k=>{
    const mains=by[k].filter(e=>e.type==="main").sort(byT);
    const venues=by[k].filter(e=>e.type==="venue");
    if(S.sort==="gtd") venues.sort((a,b)=>(b.v||0)-(a.v||0)||byT(a,b)); else venues.sort(byT);
    const go=keys.includes(k);
    html+=`<h2 class="dh ${go?"go":""}" ${go?`data-k="${k}"`:""}><span>📅 ${dlabel(k)}${k===DATA.today?" · 오늘":""}</span><span>${by[k].length}건${go?" · 이 날 보기 ›":""}</span></h2>`
        + mains.map(e=>card(e)).join("") + venues.map(e=>card(e)).join("");
  });
  $("sub").textContent=`전체 날짜 검색 · ${ev.length}건 · ${DATA.updated} 업데이트`;
  $("list").innerHTML = html || `<div class="empty">모든 날짜에서 찾아봤는데 조건에 맞는 일정이 없어요.</div>`;
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>el.classList.toggle("open"));
  document.querySelectorAll(".dh.go").forEach(el=>el.onclick=()=>{S.day=el.dataset.k; S.all=false; render();});   // 날짜 제목을 누르면 그 날짜 보기로
}
function renderList(){
  if(S.all) return renderAll();
  const d=new Date(S.day+"T00:00:00");
  $("sub").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]}) · ${DATA.updated} 업데이트`;
  let ev=DATA.events.filter(e=>e.d===S.day && matches(e));
  const mains=ev.filter(e=>e.type==="main").sort((a,b)=>(a.t||"99").localeCompare(b.t||"99"));
  let venues=ev.filter(e=>e.type==="venue");
  if(S.sort==="gtd") venues.sort((a,b)=>(b.v||0)-(a.v||0) || (a.t||"").localeCompare(b.t||""));
  else venues.sort((a,b)=>(a.t||"99").localeCompare(b.t||"99"));
  let html="";
  if(mains.length) html+=`<h2><span>🏆 메인 일정</span><span>${mains.length}</span></h2>`+mains.map(e=>card(e)).join("");
  const showSats = S.type==="all"||S.type==="online";
  const sats = showSats ? satsOn(S.day).filter(s=>S.org==="all"||s.org.includes(S.org)||(S.org==="PMANG"&&s.org.includes("PFGT"))) : [];
  if(sats.length) html+=`<h2><span>📱 온라인 새틀·프리롤</span><span>${sats.length}</span></h2>`+
     sats.map(s=>`<div class="online"><div class="ot">${s.free?"🎁":"📢"} ${esc(s.title)}</div><div class="tm">${s.times.map(esc).join(" · ")}</div></div>`).join("");
  if(S.type!=="main" && S.type!=="online"){
    html+=`<h2><span>🏠 매장 대회 ${S.sort==="gtd"?"(상금순)":""}</span><span>${venues.length}</span></h2>`;
    html+= venues.length ? venues.map((e,i)=>card(e, S.sort==="gtd"&&i<5&&e.v?i+1:0)).join("") : `<div class="empty">조건에 맞는 매장 대회가 없어요.</div>`;
  }
  if(!html) html=`<div class="empty">이 날은 조건에 맞는 일정이 없어요.</div>`;
  if(S.q){const tot=DATA.events.filter(matches).length;   // 검색 중인데 다른 날짜에도 결과가 있으면 알려줌
    if(tot>ev.length) html=`<div class="allhint"><span>이 날 ${ev.length}건 · 전체 날짜에는 ${tot}건 있어요</span><button type="button" id="goAll">전체 날짜에서 보기</button></div>`+html;}
  $("list").innerHTML=html;
  const ga=$("goAll"); if(ga) ga.onclick=()=>{S.all=true; render();};
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>el.classList.toggle("open"));
}
function render(){
  chips("types",[["all","전체"],["venue","매장 대회"],["main","메인 일정"],["online","온라인 새틀"]],"type");
  chips("orgs",[["all","모든 주최사"],["WPL","WPL"],["PMANG","피망"],["HPT","HPT"],["APL","APL"],["SUPERCUP","슈퍼컵"],["K-STAR","K-STAR"]],"org");
  $("allT").classList.toggle("on",S.all); $("allT").setAttribute("aria-pressed",S.all?"true":"false");
  $("q").placeholder = S.all ? "전체 날짜에서 검색 (예: 강남, 뉴스톤, WPL)" : "매장·지역 검색 (예: 강남, 뉴스톤, 성남모란)";
  renderDays(); renderList();
}
$("allT").onclick=()=>{S.all=!S.all; render();};
$("q").oninput=e=>{S.q=e.target.value.trim(); renderDays(); renderList();};
$("sort").onchange=e=>{S.sort=e.target.value; renderList();};
render();
</script>
